- id: loan-rate-interpolation
  number: 5
  title: Ставка по кредиту на любой срок
  task: 'Банк опубликовал ставки (условные) для сроков 1, 5, 10 и 30 лет: 18%, 17%, 16% и 14%. Для других сроков
    ставка считается <b>линейной интерполяцией</b> между соседними сроками. Например, на 15 лет: 16% + (15 − 10)
    / (30 − 10) × (14% − 16%) = 15,5%. Напишите формулу ставки для любого срока от 1 до 30 лет.'
  explain: В таблицу уже добавлены «следующий срок» и «следующая ставка» — так одним поиском берутся обе точки.
    Дайте <code>A3:D6</code> имя <code>ставки</code>. Приблизительный поиск находит строку с ближайшим меньшим сроком:<br><code>=ВПР(F3;ставки;2)+(F3-ВПР(F3;ставки;1))/(ВПР(F3;ставки;3)-ВПР(F3;ставки;1))*(ВПР(F3;ставки;4)-ВПР(F3;ставки;2))</code>.
  mistake: 'Оставить у последней строки «следующий срок» пустым: для 30 лет получится деление на ноль. Поэтому там
    стоит 31 с той же ставкой.'
