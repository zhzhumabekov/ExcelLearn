- id: city-distance-table
  number: 6
  title: Расстояние между любыми городами Казахстана
  task: В таблице — широта и долгота десяти городов Казахстана. Сделайте так, чтобы, вписав в <code>F3</code> и
    <code>F4</code> названия любых двух городов из списка, в <code>F6</code> получать расстояние между ними по поверхности
    Земли.
  explain: 'Формула расстояния — та же, что в задании 3 главы 2: <code>6371 × ACOS(SIN(ш1)·SIN(ш2) + COS(ш1)·COS(ш2)·COS(д2
    − д1))</code>, углы — в радианах (функция <code>РАДИАНЫ</code>). Только широту и долготу теперь берёт {fn:VLOOKUP}
    по названию: дайте <code>A3:C12</code> имя <code>города</code>, широта — <code>ВПР(F3;города;2;ЛОЖЬ)</code>,
    долгота — <code>ВПР(F3;города;3;ЛОЖЬ)</code>. Алматы — Актау ≈ 2 070 км.'
  mistake: Опечатка в названии города (лишний пробел, «Усть-Каменогорск» через другой дефис) — {fn:VLOOKUP} с <code>ЛОЖЬ</code>
    вернёт <code>#Н/Д</code>. Копируйте названия из списка.
