        v: 1200000
        fmt: kzt
      A4: 6
      B4:
        v: 6000000
        fmt: kzt
      C4:
        v: 1100000
        fmt: kzt
      A5: 11
      B5:
        v: 11500000
        fmt: kzt
      C5:
        v: 1000000
        fmt: kzt
      A6: 21
      B6:
        v: 21500000
        fmt: kzt
      C6:
        v: 900000
        fmt: kzt
      E2:
        v: Заказ, роликов
        style: head
      F2:
        v: Стоимость, ₸
        style: head
      E3: 3
      F3:
        fmt: kzt
      E4: 8
      F4:
        fmt: kzt
      E5: 14
      F5:
        fmt: kzt
      E6: 25
      F6:
