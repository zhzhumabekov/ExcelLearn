- id: assignment-fit
  number: 2
  title: Насколько сотрудник подходит своему отделу
  task: Восемь новых сотрудников распределили по четырём отделам. Для каждого известно, насколько он подходит каждому
    отделу (от 0 до 10), и номер отдела, куда его назначили. Напишите формулу, которая показывает <b>пригодность
    для назначенного отдела</b>.
  explain: Номер столбца в {fn:VLOOKUP} не обязан быть числом в формуле — его можно взять из ячейки. Отдел № 1 —
    это второй столбец таблицы, № 2 — третий и так далее, поэтому номер столбца = отдел + 1:<br><code>=ВПР(A3;$A$3:$E$10;F3+1;ЛОЖЬ)</code>.
