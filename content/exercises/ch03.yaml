        style: head
      B1:
        v: Стоит всё до, ₸
        style: head
      C1:
        v: Цена ролика, ₸
        style: head
      A2: 1
      B2:
        v: 0
        fmt: kzt
      C2:
        v: 1200000
        fmt: kzt
      A3: 6
      B3:
        v: 6000000
        fmt: kzt
      C3:
        v: 1100000
        fmt: kzt
      A4: 11
      B4:
        v: 11500000
        fmt: kzt
      C4:
        v: 1000000
        fmt: kzt
      A5: 21
      B5:
        v: 21500000
        fmt: kzt
      C5:
        v: 900000
        fmt: kzt
      E1:
        v: Заказ, роликов
        style: head
      F1:
        v: Стоимость, ₸
        style: head
      E2: 3
      F2:
        fmt: kzt
      E3: 8
      F3:
        fmt: kzt
      E4: 14
      F4:
        fmt: kzt
      E5: 25
      F5:
        fmt: kzt
  solution:
    names:
