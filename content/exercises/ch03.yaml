- id: ad-volume-discount
  number: 3
  title: 'Реклама на телеканале: скидка за объём'
  task: 'Телеканал продаёт рекламные ролики со скидкой за объём: от 1 до 5 роликов — 1 200 000 ₸ за ролик, от 6
    до 10 — 1 100 000 ₸, от 11 до 20 — 1 000 000 ₸, от 21 — 900 000 ₸. <b>Цена одна на весь заказ</b>: 8 роликов
    — по 1 100 000 ₸. Напишите формулу общей стоимости для любого заказа.'
  explain: 'Это шкала, как премии в уроке 3.1: первый столбец таблицы — нижняя граница, приблизительный поиск. Дайте
    таблице <code>A3:B6</code> имя <code>тарифы</code>. Стоимость = количество × цена ролика:<br><code>=D3*ВПР(D3;тарифы;2;ИСТИНА)</code>.
    Протяните до <code>E6</code>.'
  mistake: 'Записать в первый столбец верхние границы (5, 10, 20): приблизительный поиск ищет «не больше», поэтому
    в таблице нужны <b>нижние</b> границы — 1, 6, 11, 21.'
  sheet:
    file: Реклама_скидка.xlsx
    name: Тарифы
    columns:
      A: 100
      B: 140
      C: 20
      D: 120
      E: 140
    cells:
      A2:
        v: Роликов от
        style: head
      B2:
        v: Цена ролика, ₸
        style: head
      A3: 1
      B3:
        v: 1200000
        fmt: kzt
      A4: 6
      B4:
        v: 1100000
        fmt: kzt
      A5: 11
      B5:
        v: 1000000
        fmt: kzt
      A6: 21
      B6:
        v: 900000
        fmt: kzt
      D2:
        v: Заказ, роликов
        style: head
      E2:
        v: Стоимость, ₸
        style: head
      D3: 3
      E3:
        fmt: kzt
      D4: 8
      E4:
        fmt: kzt
      D5: 14
      E5:
        fmt: kzt
      D6: 25
      E6:
        fmt: kzt
  solution:
    names:
    - name: тарифы
      ref: A3:B6
    cells:
      E3:
        f: =D3*VLOOKUP(D3,тарифы,2,TRUE)
    fill:
    - source: E3
      to: E3:E6
  expect:
    E3: 3600000
    E4: 8800000
    E5: 14000000
    E6: 22500000
- id: ad-tiered-price
  number: 4
  title: 'Реклама в музыкальной передаче: цена по ступеням'
  task: 'Другой телеканал считает иначе: первые 5 роликов — по 1 200 000 ₸, следующие 5 — по 1 100 000 ₸, следующие
    10 — по 1 000 000 ₸, остальные — по 900 000 ₸. Например, 14 роликов = 5 × 1 200 000 + 5 × 1 100 000 + 4 × 1
    000 000. Напишите формулу общей стоимости для любого заказа.'
  explain: 'Подсказка книги: в таблице три столбца и в формуле несколько поисков. Столбец B уже посчитан: сколько
    стоят <b>все ролики до начала ступени</b> (до 6-го — 6 000 000 ₸). Дайте <code>A3:C6</code> имя <code>ступени</code>.
    Стоимость = «всё до ступени» + (роликов на этой ступени) × цена ступени:<br><code>=ВПР(E3;ступени;2)+(E3-ВПР(E3;ступени;1)+1)*ВПР(E3;ступени;3)</code>.'
  mistake: Умножить весь заказ на цену последней ступени — так считает задание 3, а здесь каждая ступень оплачивается
    по своей цене.
