  title: 'Тендер: кто победил'
  task: 'Акимат проводит тендер на ремонт школы: побеждает участник с наименьшей ценой. Напишите в <code>C2:C5</code> «победитель»
    у лучшей цены и «—» у остальных.'
  explain: <code>{f:=IF(B2=MIN($B$2:$B$5),"победитель","—")}</code> — сравниваем цену участника с минимальной по всем. $
    закрепляет диапазон при протягивании.
  mistake: 'Забыть $ в <code>$B$2:$B$5</code>: при протягивании диапазон съедет, и минимум будет считаться не по всем.'
