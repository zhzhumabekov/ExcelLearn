        style: label
      B3:
        v: 90000
        fmt: kzt
      A4:
        v: Продано билетов
        style: label
      B4: 160
      A6:
        v: Пришли на рейс
        style: head
      B6:
        v: Сняты с рейса
        style: head
      C6:
        v: Выручка
        style: head
      A7: 138
      B7: {}
      C7:
        fmt: kzt
      A8: 150
      B8: {}
      C8:
        fmt: kzt
      A9: 153
      B9: {}
      C9:
        fmt: kzt
      A10: 160
      B10: {}
      C10:
        fmt: kzt
      A11: 147
      B11: {}
      C11:
        fmt: kzt
  solution:
    cells:
