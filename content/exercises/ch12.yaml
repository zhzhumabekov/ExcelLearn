- id: weekday-name
  number: 14
  title: День недели словом
  task: В журнале доставок рядом с датой нужно писать день недели словом (<code>B2:B5</code>).
  explain: '{fn:WEEKDAY}(дата; 2) — номер дня с понедельника. {fn:SWITCH} заменяет номер названием: <code>{f:=SWITCH(WEEKDAY(A2,2),1,"понедельник",2,"вторник",…)}</code>.
    Можно и {fn:CHOOSE}.'
  mistake: 'Забыть второй аргумент {fn:WEEKDAY}: тогда 1 — воскресенье, и все названия сдвинутся на день.'
  sheet:
    file: Дни_недели.xlsx
    name: Доставки
    columns:
      A: 130
      B: 160
    rows: 6
    cells:
      A1:
        v: Дата
        style: head
      B1:
        v: День недели
        style: head
      A2:
        v: '2026-10-12'
        fmt: date
      A3:
        v: '2026-10-14'
        fmt: date
      A4:
        v: '2026-10-17'
        fmt: date
      A5:
        v: '2026-10-18'
        fmt: date
  solution:
    cells:
      B2:
        f: =SWITCH(WEEKDAY(A2,2),1,"понедельник",2,"вторник",3,"среда",4,"четверг",5,"пятница",6,"суббота",7,"воскресенье")
    fill:
    - source: B2
      to: B2:B5
  expect:
    B2: понедельник
    B3: среда
    B4: суббота
    B5: воскресенье
