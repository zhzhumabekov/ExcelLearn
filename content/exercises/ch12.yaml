- id: growth
  number: 4
  title: Рост, спад или без изменений
  task: По продажам сети аптек за 2019–2025 годы напишите для каждого года, начиная с 2020-го, «рост», «спад» или «без изменений»
    по сравнению с прошлым годом (<code>C3:C8</code>).
  explain: <code>{f:=IF(B3>B2,"рост",IF(B3<B2,"спад","без изменений"))}</code> — сначала проверяем рост, в «иначе» — вторую
    {fn:IF} со спадом, остаток — «без изменений». Текст в формуле — в кавычках.
  mistake: 'Две проверки «больше» и «иначе спад»: в 2021 году продажи не изменились, а формула напишет «спад».'
  sheet:
    file: Динамика.xlsx
    name: Продажи
    columns:
      A: 80
      B: 150
      C: 150
    rows: 9
    cells:
      A1:
        v: Год
        style: head
      B1:
        v: Продажи, млн ₸
        style: head
      C1:
        v: Динамика
        style: head
      A2: 2019
      B2: 812
      A3: 2020
      B3: 845
      A4: 2021
      B4: 845
      A5: 2022
      B5: 790
      A6: 2023
      B6: 902
      A7: 2024
      B7: 960
      A8: 2025
      B8: 948
  solution:
    cells:
      C3:
        f: =IF(B3>B2,"рост",IF(B3<B2,"спад","без изменений"))
    fill:
    - source: C3
      to: C3:C8
  expect:
    C3: рост
    C4: без изменений
    C5: спад
    C6: рост
    C7: рост
    C8: спад
- id: tender
