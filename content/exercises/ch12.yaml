- id: code-format
  number: 11
  title: Проверка формата кода
  task: 'Коды товаров на складе пишутся так: три буквы города, дефис и 4 цифры — «ALM-1024». Отметьте коды, записанные не
    по правилу (<code>B2:B6</code>).'
  explain: '{fn:LEN} — длина текста, {fn:MID}(текст; 4; 1) — четвёртый символ. <code>{f:=IF(AND(LEN(A2)=8,MID(A2,4,1)="-"),"верно","ошибка")}</code>
    — оба условия сразу, поэтому {fn:AND}.'
  mistake: 'Проверить только длину: «AST10245» тоже 8 символов, но без дефиса.'
  sheet:
    file: Коды.xlsx
    name: Склад
    columns:
      A: 140
      B: 120
    rows: 7
    cells:
      A1:
        v: Код товара
        style: head
      B1:
        v: Проверка
        style: head
      A2: ALM-1024
      A3: AST1024
      A4: SHM-0007
      A5: KRG-12
      A6: AKT-5531
  solution:
    cells:
      B2:
        f: =IF(AND(LEN(A2)=8,MID(A2,4,1)="-"),"верно","ошибка")
    fill:
    - source: B2
      to: B2:B6
  expect:
    B2: верно
    B3: ошибка
    B4: верно
    B5: ошибка
    B6: верно
- id: group-number
  number: 12
  title: Нумерация внутри филиала
  task: Список сотрудников отсортирован по филиалам. Пронумеруйте сотрудников заново в каждом филиале (<code>B3:B10</code>),
    в <code>B2</code> уже стоит 1.
  explain: <code>{f:=IF(A3=A2,B2+1,1)}</code> — если филиал тот же, что строкой выше, номер на 1 больше, иначе начинаем
    с 1.
  mistake: 'Начать формулу с <code>B2</code>: там ссылка на строку 1 с заголовком, и первая строка получит 1 случайно.'
