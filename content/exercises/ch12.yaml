- id: teachers-day
  number: 8
  title: Когда День учителя
  task: В Казахстане День учителя — первое воскресенье октября. Найдите для каждого года дату 1 октября (<code>B2:B6</code>)
    и дату праздника (<code>C2:C6</code>).
  explain: <code>{f:=DATE(A2,10,1)}</code>; {fn:WEEKDAY}(дата; 2) даёт 1 для понедельника … 7 для воскресенья. <code>{f:=IF(WEEKDAY(B2,2)=7,B2,B2+7-WEEKDAY(B2,2))}</code>
    — если 1 октября уже воскресенье, это и есть праздник, иначе добавляем дни до воскресенья.
  mistake: '{fn:WEEKDAY} без второго аргумента считает воскресенье первым днём (1), и формула сдвинется на неделю.'
  sheet:
    file: День_учителя.xlsx
    name: Даты
    columns:
      A: 80
      B: 130
      C: 150
    rows: 7
    cells:
      A1:
        v: Год
        style: head
      B1:
        v: 1 октября
        style: head
      C1:
        v: День учителя
        style: head
      A2: 2025
      B2:
        fmt: date
      C2:
        fmt: date
      A3: 2026
      B3:
        fmt: date
      C3:
        fmt: date
      A4: 2027
      B4:
        fmt: date
      C4:
        fmt: date
      A5: 2028
      B5:
        fmt: date
      C5:
        fmt: date
      A6: 2029
      B6:
        fmt: date
      C6:
        fmt: date
  solution:
    cells:
      B2:
        f: =DATE(A2,10,1)
        fmt: date
      C2:
        f: =IF(WEEKDAY(B2,2)=7,B2,B2+7-WEEKDAY(B2,2))
