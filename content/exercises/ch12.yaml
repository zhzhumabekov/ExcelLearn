# Глава 12 (ЕСЛИ и логические функции). Собрано генератором; ответы expect посчитаны независимо.
chapter: ch12
exercises:
- id: price-by-date
  number: 1
  title: Цена по дате заказа
  task: 'Поставщик кирпича в Караганде меняет цену: до 1 апреля 2026 г. — <b>1 500 ₸</b>, с 1 апреля до 1 октября — <b>1
    650 ₸</b>, с 1 октября — <b>1 800 ₸</b>. Найдите цену для каждого заказа (<code>B2:B6</code>).'
  explain: 'Даты сравниваются как числа: раньше — значит меньше. <code>{f:=IF(A2<DATE(2026,4,1),1500,IF(A2<DATE(2026,10,1),1650,1800))}</code>
    — дату в формуле задаёт {fn:DATE}(год; месяц; день).'
  mistake: 'Написать дату в формуле текстом «01.04.2026» без {fn:DATE}: Excel сравнит дату с текстом, а не с датой.'
  sheet:
    file: Цена_по_дате.xlsx
    name: Заказы
    columns:
      A: 140
      B: 120
    rows: 7
    cells:
      A1:
        v: Дата заказа
        style: head
      B1:
        v: Цена, ₸
        style: head
      A2:
        v: '2026-01-20'
        fmt: date
      B2:
        fmt: kzt
      A3:
        v: '2026-03-31'
        fmt: date
      B3:
        fmt: kzt
      A4:
        v: '2026-04-01'
        fmt: date
      B4:
        fmt: kzt
      A5:
        v: '2026-08-15'
        fmt: date
      B5:
        fmt: kzt
      A6:
        v: '2026-11-02'
        fmt: date
      B6:
        fmt: kzt
  solution:
    cells:
      B2:
        f: =IF(A2<DATE(2026,4,1),1500,IF(A2<DATE(2026,10,1),1650,1800))
        fmt: kzt
    fill:
    - source: B2
      to: B2:B6
  expect:
    B2: 1500
    B3: 1500
    B4: 1650
    B5: 1650
    B6: 1800
- id: overbooking
  number: 2
  title: 'Овербукинг: больше билетов, чем мест'
  task: 'Авиакомпания продала <b>160</b> билетов Алматы — Астана на самолёт со <b>150</b> местами: часть пассажиров обычно
    не приходит. Если пришло больше 150, лишних снимают с рейса и платят компенсацию 90 000 ₸. Найдите, сколько человек
    снимут (<code>B7:B11</code>), и выручку с учётом компенсаций (<code>C7:C11</code>).'
  explain: '<code>{f:=IF(A7>$B$1,A7-$B$1,0)}</code> — снимают только тех, кому не хватило мест. Выручка: <code>{f:=$B$4*$B$2-B7*$B$3}</code>.'
  mistake: 'Писать <code>{f:=A7-$B$1}</code> без {fn:IF}: при 138 пришедших получится −12 «снятых» и лишняя выручка.'
