- id: code-format
  number: 11
  title: Проверка формата кода
  task: 'Коды товаров на складе пишутся так: три буквы города, дефис и 4 цифры — «ALM-1024». Отметьте коды, записанные не
    по правилу (<code>B2:B6</code>).'
  explain: '{fn:LEN} — длина текста, {fn:MID}(текст; 4; 1) — четвёртый символ. <code>{f:=IF(AND(LEN(A2)=8,MID(A2,4,1)="-"),"верно","ошибка")}</code>
    — оба условия сразу, поэтому {fn:AND}.'
  mistake: 'Проверить только длину: «AST10245» тоже 8 символов, но без дефиса.'
  sheet:
    file: Коды.xlsx
    name: Склад
    columns:
      A: 140
      B: 120
    rows: 7
    cells:
      A1:
        v: Код товара
        style: head
      B1:
        v: Проверка
        style: head
      A2: ALM-1024
      A3: AST1024
      A4: SHM-0007
      A5: KRG-12
      A6: AKT-5531
  solution:
    cells:
      B2:
        f: =IF(AND(LEN(A2)=8,MID(A2,4,1)="-"),"верно","ошибка")
    fill:
    - source: B2
      to: B2:B6
  expect:
    B2: верно
    B3: ошибка
    B4: верно
    B5: ошибка
    B6: верно
- id: group-number
  number: 12
  title: Нумерация внутри филиала
  task: Список сотрудников отсортирован по филиалам. Пронумеруйте сотрудников заново в каждом филиале (<code>B3:B10</code>),
    в <code>B2</code> уже стоит 1.
  explain: <code>{f:=IF(A3=A2,B2+1,1)}</code> — если филиал тот же, что строкой выше, номер на 1 больше, иначе начинаем
    с 1.
  mistake: 'Начать формулу с <code>B2</code>: там ссылка на строку 1 с заголовком, и первая строка получит 1 случайно.'
  sheet:
    file: Нумерация.xlsx
    name: Список
    columns:
      A: 140
      B: 140
    rows: 11
    cells:
      A1:
        v: Филиал
        style: head
      B1:
        v: № в филиале
        style: head
      B2: 1
      A2: Алматы
      A3: Алматы
      A4: Алматы
      A5: Астана
      A6: Астана
      A7: Шымкент
      A8: Шымкент
      A9: Шымкент
      A10: Шымкент
  solution:
    cells:
      B3:
        f: =IF(A3=A2,B2+1,1)
    fill:
    - source: B3
      to: B3:B10
  expect:
    B2: 1
    B3: 2
    B4: 3
    B5: 1
    B6: 2
    B7: 1
    B8: 2
    B9: 3
    B10: 4
- id: no-sales
  number: 13
  title: Средняя цена, когда продаж нет
  task: Посчитайте среднюю цену каждого товара (<code>D2:D6</code>) — выручку разделить на количество. Если товар не продавался,
    напишите «Нет продаж». Затем найдите среднюю цену по товарам (<code>D8</code>).
  explain: <code>{f:=IFERROR(B2/C2,"Нет продаж")}</code> — вместо <code>#ДЕЛ/0!</code> текст. <code>{f:=AVERAGE(D2:D6)}</code>
    пропускает текст и считает среднее трёх цен.
  mistake: 'Писать 0 вместо «Нет продаж»: {fn:AVERAGE} учтёт нули, и средняя цена окажется заниженной.'
  sheet:
    file: Средняя_цена.xlsx
    name: Товары
    columns:
      A: 190
      B: 130
      C: 120
      D: 140
    rows: 9
    cells:
      A1:
        v: Товар
        style: head
      B1:
        v: Выручка
        style: head
      C1:
        v: Продано, шт.
        style: head
      D1:
        v: Средняя цена
        style: head
      A8:
        v: Средняя по товарам
        style: label
      D8:
        fmt: kzt
      A2: Чай
      B2:
        v: 1250000
        fmt: kzt
      C2: 500
      D2:
        fmt: kzt
      A3: Кофе
      B3:
        v: 0
        fmt: kzt
      C3: 0
      D3:
        fmt: kzt
      A4: Сахар
      B4:
        v: 840000
        fmt: kzt
      C4: 1200
      D4:
        fmt: kzt
      A5: Мука
      B5:
        v: 0
        fmt: kzt
      C5: 0
      D5:
        fmt: kzt
      A6: Рис
      B6:
        v: 990000
        fmt: kzt
      C6: 900
      D6:
        fmt: kzt
  solution:
    cells:
      D2:
        f: =IFERROR(B2/C2,"Нет продаж")
        fmt: kzt
      D8:
        f: =AVERAGE(D2:D6)
        fmt: kzt
    fill:
    - source: D2
      to: D2:D6
  expect:
    D2: 2500.0
    D3: Нет продаж
    D4: 700.0
    D5: Нет продаж
    D6: 1100.0
    D8: 1433.3333
- id: weekday-name
  number: 14
  title: День недели словом
  task: В журнале доставок рядом с датой нужно писать день недели словом (<code>B2:B5</code>).
  explain: '{fn:WEEKDAY}(дата; 2) — номер дня с понедельника. {fn:SWITCH} заменяет номер названием: <code>{f:=SWITCH(WEEKDAY(A2,2),1,"понедельник",2,"вторник",…)}</code>.
    Можно и {fn:CHOOSE}.'
  mistake: 'Забыть второй аргумент {fn:WEEKDAY}: тогда 1 — воскресенье, и все названия сдвинутся на день.'
  sheet:
    file: Дни_недели.xlsx
    name: Доставки
    columns:
      A: 130
      B: 160
    rows: 6
    cells:
      A1:
        v: Дата
        style: head
      B1:
        v: День недели
        style: head
      A2:
        v: '2026-10-12'
        fmt: date
      A3:
        v: '2026-10-14'
        fmt: date
      A4:
        v: '2026-10-17'
        fmt: date
      A5:
        v: '2026-10-18'
        fmt: date
  solution:
    cells:
      B2:
        f: =SWITCH(WEEKDAY(A2,2),1,"понедельник",2,"вторник",3,"среда",4,"четверг",5,"пятница",6,"суббота",7,"воскресенье")
    fill:
    - source: B2
      to: B2:B5
  expect:
    B2: понедельник
    B3: среда
    B4: суббота
    B5: воскресенье
