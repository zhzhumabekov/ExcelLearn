        style: head
      B2:
        v: Товар
        style: head
      C2:
        v: Цена, ₸
        style: head
      A3: Z-210
      B3: Ламинат, м²
      C3:
        v: 5200
        fmt: kzt
      A4: A-105
      B4: Плинтус, м
      C4:
        v: 3500
        fmt: kzt
      A5: K-020
      B5: Клей, кг
      C5:
        v: 2900
        fmt: kzt
      A6: M-777
      B6: Обои, рулон
      C6:
        v: 7400
        fmt: kzt
      A7: B-300
      B7: Грунтовка, л
      C7:
        v: 4100
        fmt: kzt
      E2:
        v: Артикул
        style: label
      F2: M-777
      E3:
        v: С ВПР
        style: label
      E4:
        v: С ИНДЕКС+ПОИСКПОЗ
        style: label
      E6:
        v: Артикул по названию
        style: label
      F6: Клей, кг
      E7:
        v: Найден артикул
