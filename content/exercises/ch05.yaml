- id: bus-wait
  number: 4
  title: Сколько ждать автобус
  task: 'На остановке в Алматы автобусы ходят с интервалами из столбца B (минуты, отсчёт — от этого момента: первый
    придёт через 5 минут, второй — ещё через 16). Пассажир приходит через t минут (столбец E). Сколько ему ждать?
    Например, пришёл через 12,4 мин, автобусы — через 5 и 21 мин: ждать 8,6 мин.'
  explain: 'Сначала время прихода каждого автобуса — нарастающий итог интервалов в столбце C. Он растёт, поэтому
    <code>ПОИСКПОЗ(E2;$C$2:$C$11;1)</code> даёт последний автобус, который уже ушёл; следующий — на позиции +1:
    <code>=ИНДЕКС($C$2:$C$11;ПОИСКПОЗ(E2;$C$2:$C$11;1)+1)-E2</code>.'
  mistake: Если пассажир пришёл раньше первого автобуса (меньше 5 минут), {fn:MATCH} вернёт <code>#Н/Д</code> —
    в задаче приходы позже.
  sheet:
    file: Ожидание_автобуса.xlsx
    name: Остановка
