        v: Артикул
        style: head
      B1:
        v: Товар
        style: head
      C1:
        v: Цена, ₸
        style: head
      A2: Z-210
      B2: Ламинат, м²
      C2:
        v: 5200
        fmt: kzt
      A3: A-105
      B3: Плинтус, м
      C3:
        v: 3500
        fmt: kzt
      A4: K-020
      B4: Клей, кг
      C4:
        v: 2900
        fmt: kzt
      A5: M-777
      B5: Обои, рулон
      C5:
        v: 7400
        fmt: kzt
      A6: B-300
      B6: Грунтовка, л
      C6:
        v: 4100
        fmt: kzt
      E1:
        v: Артикул
        style: label
      F1: M-777
      E2:
        v: С ВПР
        style: label
      E3:
        v: С ИНДЕКС+ПОИСКПОЗ
        style: label
      E5:
        v: Артикул по названию
        style: label
      F5: Клей, кг
      E6:
        v: Найден артикул
