      B10: 8
      A11: 9
      B11: 15
      A12: 10
      B12: 11
      E2:
        v: Пришли через, мин
        style: head
      F2:
        v: Ждать, мин
        style: head
      E3: 12.4
      E4: 33.0
      E5: 61.5
  solution:
    cells:
      C3:
        f: =B3
      C4:
        f: =C3+B4
      F3:
        f: =INDEX($C$3:$C$12,MATCH(E3,$C$3:$C$12,1)+1)-E3
