- id: deals-threshold
  number: 2
  title: Когда продажи перевалили за 10 млн ₸
  task: Менеджер закрыл за квартал 30 сделок (суммы в тыс. ₸, по порядку). После какой сделки общий объём продаж
    <b>превысил 10 000 тыс. ₸</b>?
  explain: 'Посчитайте нарастающий итог: <code>C2</code> = <code>=B2</code>, <code>C3</code> = <code>=C2+B3</code>,
    протяните вниз. Он растёт, поэтому подходит {fn:MATCH} с типом 1: <code>ПОИСКПОЗ(F1;C2:C31;1)</code> — последняя
    сделка, после которой итог ещё не больше порога. Следующая — ответ: <code>=ПОИСКПОЗ(F1;C2:C31;1)+1</code>.'
  mistake: 'Забыть «+1»: {fn:MATCH} с типом 1 даёт последнюю позицию, где итог ещё <b>не больше</b> порога.'
