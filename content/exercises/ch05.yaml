- id: vlookup-replacement
  number: 6
  title: Если бы ВПР не было
  task: Представьте, что из Excel убрали {fn:VLOOKUP}. Найдите цену по артикулу из <code>F1</code> функциями {fn:INDEX}
    и {fn:MATCH} (<code>F3</code>) и сравните с {fn:VLOOKUP} (<code>F2</code>). Затем найдите <b>артикул по названию</b>
    товара из <code>F5</code> — это {fn:VLOOKUP} уже не умеет.
  explain: '{fn:VLOOKUP}(что; таблица; n; ЛОЖЬ) = {fn:INDEX}(n-й столбец; {fn:MATCH}(что; первый столбец; 0)). Цена:
    <code>=ИНДЕКС(C2:C6;ПОИСКПОЗ(F1;A2:A6;0))</code>. Артикул слева от названия: <code>=ИНДЕКС(A2:A6;ПОИСКПОЗ(F5;B2:B6;0))</code>
    — {fn:VLOOKUP} ищет только в первом столбце и берёт ответ правее, а связка {fn:INDEX}+{fn:MATCH} — в любом столбце
    и в любую сторону.'
  mistake: Разной длины диапазоны в {fn:INDEX} и {fn:MATCH} (например, <code>C2:C6</code> и <code>A1:A6</code>)
    — позиции съедут на одну строку.
  sheet:
    file: Замена_ВПР.xlsx
    name: Прайс
    columns:
      A: 90
      B: 140
      C: 100
      D: 16
      E: 190
      F: 110
    cells:
