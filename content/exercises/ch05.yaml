      A6: 5
      B6: 7
      A7: 6
      B7: 14
      A8: 7
      B8: 10
      A9: 8
      B9: 8
      A10: 9
      B10: 15
      A11: 10
      B11: 11
      E1:
        v: Пришли через, мин
        style: head
      F1:
        v: Ждать, мин
        style: head
      E2: 12.4
      E3: 33.0
      E4: 61.5
  solution:
    cells:
      C2:
        f: =B2
      C3:
        f: =C2+B3
      F2:
        f: =INDEX($C$2:$C$11,MATCH(E2,$C$2:$C$11,1)+1)-E2
        fmt: number
