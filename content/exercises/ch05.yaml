- id: vlookup-replacement
  number: 6
  title: Если бы ВПР не было
  task: Представьте, что из Excel убрали {fn:VLOOKUP}. Найдите цену по артикулу из <code>F2</code> функциями {fn:INDEX}
    и {fn:MATCH} (<code>F4</code>) и сравните с {fn:VLOOKUP} (<code>F3</code>). Затем найдите <b>артикул по названию</b>
    товара из <code>F6</code> — это {fn:VLOOKUP} уже не умеет.
  explain: '{fn:VLOOKUP}(что; таблица; n; ЛОЖЬ) = {fn:INDEX}(n-й столбец; {fn:MATCH}(что; первый столбец; 0)). Цена:
    <code>=ИНДЕКС(C3:C7;ПОИСКПОЗ(F2;A3:A7;0))</code>. Артикул слева от названия: <code>=ИНДЕКС(A3:A7;ПОИСКПОЗ(F6;B3:B7;0))</code>
    — {fn:VLOOKUP} ищет только в первом столбце и берёт ответ правее, а связка {fn:INDEX}+{fn:MATCH} — в любом столбце
    и в любую сторону.'
  mistake: Разной длины диапазоны в {fn:INDEX} и {fn:MATCH} (например, <code>C3:C7</code> и <code>A2:A7</code>)
    — позиции съедут на одну строку.
  sheet:
    file: Замена_ВПР.xlsx
    name: Прайс
    columns:
      A: 90
      B: 140
      C: 100
      D: 16
      E: 190
      F: 110
    cells:
