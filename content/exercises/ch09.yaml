- id: pension
  number: 6
  title: 'Пенсионные накопления: доходность за 40 лет'
  task: 'Айгерим 25 лет. В начале каждого года она кладёт на пенсионный счёт <b>1 000 000 ₸</b>, 40 лет подряд. Первые 30
    лет счёт приносит 15% в год, последние 10 — 5% (доходность — в столбце B). В <code>C5:C44</code> посчитайте сумму на
    счёте в конце каждого года. В <code>D5:D45</code> соберите потоки: взносы со знаком минус (сегодня и в начале каждого
    года) и итоговую сумму в конце 40-го года. В <code>F1</code> найдите ВСД.'
  explain: 'Счёт в конце года: (прошлый остаток + взнос) × (1 + доходность): <code>{f:=(C4+$B$1)*(1+B5)}</code>, вниз до
    <code>C44</code>. Поток: <code>{f:=-$B$1}</code> в <code>D5:D44</code> (взнос в начале года k — это период k − 1), в
    <code>D45</code> — <code>{f:=C44}</code>. ВСД — <code>{f:=IRR(D5:D45)}</code>: знак меняется один раз, ВСД одна — средняя
    доходность всех взносов.'
  mistake: 'Сложить взносы и итог без учёта времени: так видно, во сколько раз выросли деньги, но не годовую доходность.'
