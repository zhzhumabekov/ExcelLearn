  number: 7
  title: Почему ВСД кофейни — ровно 50%
  task: 'Кофейня из урока 9.3: <b>−10 млн ₸</b> сегодня и <b>+15 млн ₸</b> через год. Проверьте, что ВСД — 50%: в <code>B4</code>
    посчитайте ЧПС при ставке 50%, в <code>B5</code> — ВСД.'
  explain: 'При ставке 50% 15 млн через год стоят сегодня 15 ÷ 1,5 = 10 млн — ровно вложение, ЧПС = 0: <code>{f:=B2+C2/(1+50%)}</code>.
    ВСД — <code>{f:=IRR(B2:C2)}</code>. Вложили 10, вернули 15 — это и есть +50% за год.'
  mistake: 'Посчитать (15 − 10) / 15 = 33%: доходность считают от вложенного, а не от полученного.'
  sheet:
    file: Кофейня.xlsx
    name: Кофейня
    columns:
      A: 190
      B: 100
      C: 100
    rows: 6
    cells:
      A1:
        v: Год
        style: head
      B1:
        v: 0
        style: head
      C1:
        v: 1
        style: head
      A2: Поток, млн ₸
      B2: -10
      C2: 15
      A4: ЧПС при 50%
      A5: ВСД
  solution:
    cells:
      B4:
        f: =B2+C2/(1+50%)
        fmt: number
      B5:
        f: =IRR(B2:C2)
        fmt: percent
  expect:
    B4: 0
    B5: 0.5
- id: negative-irr
  number: 8
  title: Отрицательная ВСД
  task: 'Проект: <b>−70 млн ₸</b> сегодня, <b>12</b> и <b>15 млн ₸</b> в следующие два года. Найдите ВСД в <code>B4</code>
    и долю вложенного, которая вернётся, в <code>B5</code>. Как понимать отрицательную ВСД?'
  explain: <code>{f:=IRR(B2:D2)}</code> — около −44%. Вернётся <code>{f:=(C2+D2)/-B2}</code> — меньше 40% вложенного. Отрицательная
    ВСД значит, что проект не возвращает даже вложенные деньги. Знак меняется один раз — ВСД одна.
  mistake: 'Решить, что отрицательная ВСД — ошибка Excel: это правильный ответ для убыточного проекта.'
  sheet:
    file: Убыточный.xlsx
    name: Проект
    columns:
      A: 210
      B: 100
      C: 80
      D: 80
    rows: 6
    cells:
      A1:
        v: Год
        style: head
      A2: Поток, млн ₸
      A4: ВСД
      A5: Вернули из вложенного
      B1:
        v: 0
        style: head
      B2: -70
      C1:
        v: 1
        style: head
      C2: 12
      D1:
        v: 2
        style: head
      D2: 15
  solution:
    cells:
      B4:
        f: =IRR(B2:D2)
        fmt: percent
      B5:
        f: =(C2+D2)/-B2
        fmt: percent
  expect:
    B4: -0.4435
    B5: 0.3857
