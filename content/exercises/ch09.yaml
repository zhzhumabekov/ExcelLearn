- id: take-project
  number: 2
  title: Браться ли за проект
  task: Потоки — в строке 4, стоимость капитала — 20%. В <code>B6</code> найдите ВСД, в <code>B7</code> формулой {fn:IF}
    напишите «берём» или «отказываемся».
  explain: '<code>{f:=IRR(B4:D4)}</code>; проект выгоден, если ВСД выше стоимости капитала: <code>{f:=IF(B6>B1,"берём","отказываемся")}</code>.
    Знак меняется один раз — ВСД одна.'
  mistake: 'Сравнить ВСД с нулём: проект с ВСД 5% при капитале под 20% уменьшает стоимость компании.'
  sheet:
    file: Проект.xlsx
    name: Проект
    columns:
      A: 170
      B: 100
      C: 100
      D: 100
    rows: 8
    cells:
      A1:
        v: Стоимость капитала
        style: label
      B1:
        v: 0.2
        fmt: percent
      A3:
        v: Год
        style: head
      A4: Поток, млн ₸
      A6: ВСД
      A7: Решение
      B3:
        v: 0
        style: head
      B4: -4
      C3:
        v: 1
        style: head
      C4: 2
      D3:
        v: 2
        style: head
      D4: 4
  solution:
    cells:
      B6:
        f: =IRR(B4:D4)
        fmt: percent
      B7:
        f: =IF(B6>B1,"берём","отказываемся")
  expect:
    B6: 0.2808
    B7: берём
