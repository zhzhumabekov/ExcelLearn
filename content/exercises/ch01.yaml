# Задания к главе 1 — по мотивам заданий 1–6 книги, сюжеты и данные свои (Казахстан).
# Ответы expect посчитаны независимо; сверка: manage.py exercises_dump | pnpm --dir player exercises:verify
chapter: ch01

exercises:
  - id: final-grade
    number: 1
    title: Итоговая оценка слушателя курса
    task: >-
      Учебный центр в Астане ведёт курс Excel для бухгалтеров. За курс слушатели сдают <b>5 домашних
      заданий по 25 баллов</b> и <b>3 теста по 100 баллов</b>. Итоговая оценка: тесты — 75%, домашние задания — 25%.
      Посчитайте итоговую оценку каждого слушателя так, чтобы <b>вес тестов можно было поменять</b> в одной
      ячейке, и вся таблица пересчиталась бы сама.
    explain: >-
      Вес тестов — в <code>B1</code>. Вес домашних заданий не вписывайте отдельно, а считайте:
      <code>=1-B1</code>. Тогда сумма весов всегда 100%.<br>
      Доля набранных баллов по домашним заданиям: <code>=СУММ(B6:F6)/СУММ(B$5:F$5)</code>. Максимумы в строке 5
      закреплены знаком <code>$</code> (клавиша <kbd>F4</kbd>), чтобы формулу можно было протянуть вниз. Так же
      считается доля по тестам. Итог: <code>=$B$1*K6+$B$2*J6</code> — веса закреплены полностью.<br>
      Проверьте модель: поставьте в <code>B1</code> 60% — итог Айгерим станет 93,08%.
    mistake: >-
      Вписать веса прямо в формулу: <code>=0,75*K6+0,25*J6</code>. Считается верно, но чтобы поменять вес,
      придётся исправлять каждую формулу. Исходные данные — всегда в отдельных ячейках.
