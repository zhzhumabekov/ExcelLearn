        B1: 12230
        A2: {v: Коэффициент рождения, style: label}
        B2: 1.2
        A3: {v: Коэффициент гибели, style: label}
        B3: 0.7
        A4: {v: Вылов в год, style: label}
        B4: 6115
        A6: {v: Год, style: head}
        B6: {v: На начало, style: head}
        C6: {v: Родилось, style: head}
        D6: {v: Погибло, style: head}
        E6: {v: Выловлено, style: head}
        F6: {v: На конец, style: head}
        A7: 1
        A8: 2
        A9: 3
        A10: 4
        A11: 5
        A12: 6
        A13: 7
        A14: 8
        A15: 9
        A16: 10
    solution:
      cells:
        B7: {f: "=B1"}
