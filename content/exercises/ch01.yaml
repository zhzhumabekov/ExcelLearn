  - id: butterfly-effect
    number: 4
    title: Эффект бабочки
    task: >-
      Говорят, взмах крыльев бабочки в Алматы может вызвать буран в Астане. Пусть «погода» в момент t — число
      от 0 до 1, и завтрашняя погода считается так: x(t+1) = 4 × x(t) × (1 − x(t)). Посчитайте x(1)…x(50)
      для двух стартов: <b>0,3</b> и <b>0,3000001</b>. Как расчёт показывает эффект бабочки?
    explain: >-
      Стартовые значения — в <code>B1</code> и <code>B2</code>. В строке t = 0 сошлитесь на них:
      <code>B5</code> = <code>=B1</code>, <code>C5</code> = <code>=B2</code>. В <code>B6</code> введите
      <code>=4*B5*(1-B5)</code>, в <code>C6</code> — <code>=4*C5*(1-C5)</code> и протяните обе до строки 55.
      В столбце D — разница <code>=ABS(B5-C5)</code> (модуль, в русском Excel — тоже <code>ABS</code>).<br>
      Вывод: старты отличаются на одну десятимиллионную, к t = 10 разница ещё крошечная, а к t = 20–25 ряды
      уже совсем разные. Ничтожная ошибка в исходных данных делает долгий прогноз бессмысленным — поэтому
      прогноз погоды надёжен лишь на несколько дней.
    mistake: >-
      Сослаться в формуле на стартовую ячейку: <code>=4*$B$1*(1-$B$1)</code>. Тогда каждый день считается от
      старта, и все значения одинаковые. Формула должна брать <b>вчерашнее</b> значение — строку выше.
    sheet:
      file: Эффект_бабочки.xlsx
