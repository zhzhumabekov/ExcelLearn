  - id: fibonacci
    number: 3
    title: Числа Фибоначчи и золотое сечение
    task: >-
      Трейдеры на бирже KASE строят на графиках «уровни Фибоначчи». Откуда они берутся? Последовательность
      Фибоначчи: F(0) = 0, F(1) = 1, а каждое следующее число — сумма двух предыдущих:
      F(n) = F(n−1) + F(n−2). Посчитайте последовательность до n = 30 и покажите, что отношение соседних чисел
      F(n) / F(n−1) стремится к <b>золотому сечению ≈ 1,618</b>.
    explain: >-
      Первые два числа уже стоят в <code>B4</code> и <code>B5</code>. В <code>B6</code> введите
      <code>=B5+B4</code> и протяните до <code>B34</code>: ссылки относительные, каждая строка складывает две
      строки над собой.<br>
      Отношение в <code>C6</code>: <code>=B6/B5</code>, тоже протяните вниз. Для сравнения в <code>E4</code>
      посчитайте само золотое сечение: <code>=(1+КОРЕНЬ(5))/2</code> (в английском Excel — <code>SQRT</code>).
      Уже к n = 15 отношение совпадает с ним до четырёх знаков.
    mistake: >-
      Начать отношение со строки 5: <code>=B5/B4</code> делит на ноль и даёт <code>#ДЕЛ/0!</code>.
      Отношение имеет смысл с n = 2.
    sheet:
      file: Фибоначчи.xlsx
      name: Фибоначчи
      columns: {A: 60, B: 100, C: 140, D: 30, E: 150}
      cells:
        A3: {v: n, style: head}
        B3: {v: F(n), style: head}
        C3: {v: F(n) / F(n−1), style: head}
        E3: {v: Золотое сечение, style: head}
        A4: 0
        A5: 1
        A6: 2
        A7: 3
        A8: 4
        A9: 5
        A10: 6
        A11: 7
        A12: 8
        A13: 9
        A14: 10
        A15: 11
        A16: 12
        A17: 13
        A18: 14
        A19: 15
        A20: 16
        A21: 17
        A22: 18
        A23: 19
        A24: 20
        A25: 21
        A26: 22
        A27: 23
        A28: 24
        A29: 25
        A30: 26
        A31: 27
        A32: 28
        A33: 29
        A34: 30
        B4: 0
        B5: 1
    solution:
      cells:
        B6: {f: "=B5+B4"}
        C6: {f: "=B6/B5"}
