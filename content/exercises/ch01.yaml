  - id: gini-coefficient
    number: 6
    title: Коэффициент Джини
    task: >-
      Коэффициент Джини показывает неравенство доходов: 0 — у всех доход одинаковый, ближе к 1 — почти всё
      у одного. Его публикует и Бюро национальной статистики РК. Если доходы n человек отсортированы по
      возрастанию (x₁ — наименьший, xₙ — наибольший), то<br>
      <b>G = Σ (2i − n − 1) · xᵢ / (n · Σ xᵢ)</b>.<br>
      Посчитайте коэффициент Джини для пяти сотрудников небольшой компании в Караганде.
    explain: >-
      Число людей n посчитайте функцией: <code>B2</code> = <code>=СЧЁТ(B5:B9)</code> (<code>COUNT</code>) —
      добавите человека, и n изменится сам.<br>
      Множитель в <code>C5</code>: <code>=2*A5-$B$2-1</code> — номер i относительный, n закреплён. Взвешенный
      доход в <code>D5</code>: <code>=C5*B5</code>. Протяните обе формулы до строки 9.<br>
      Итог в <code>B11</code>: <code>=СУММ(D5:D9)/($B$2*СУММ(B5:B9))</code>. Скобки в знаменателе обязательны:
      делим на произведение n и суммы. Получится около 0,31. Проверьте модель: поставьте всем одинаковый
      доход — должен выйти 0.
    mistake: >-
      Не отсортировать доходы по возрастанию. Формула верна только для упорядоченного списка: перепутаете
      порядок — получите другое (и неверное) число.
    sheet:
      file: Коэффициент_Джини.xlsx
      name: Доходы
      columns: {A: 170, B: 150, C: 110, D: 190}
      cells:
        A2: {v: Число людей n, style: label}
        A4: {v: i, style: head}
        B4: {v: "Доход в месяц, ₸", style: head}
        C4: {v: 2i − n − 1, style: head}
        D4: {v: (2i − n − 1) × доход, style: head}
        A5: 1
        A6: 2
        A7: 3
        A8: 4
        A9: 5
        B5: {v: 180000, fmt: kzt}
        B6: {v: 250000, fmt: kzt}
        B7: {v: 320000, fmt: kzt}
        B8: {v: 450000, fmt: kzt}
        B9: {v: 900000, fmt: kzt}
        A11: {v: Коэффициент Джини, style: total}
        B11: {style: total}
    solution:
      cells:
        B2: {f: "=COUNT(B5:B9)"}
        C5: {f: "=2*A5-$B$2-1"}
        D5: {f: "=C5*B5", fmt: kzt}
        B11: {f: "=SUM(D5:D9)/($B$2*SUM(B5:B9))", fmt: number}
      fill:
        - {source: C5, to: C5:C9}
        - {source: D5, to: D5:D9}
    expect:
      B2: 5
      C5: -4
      C9: 4
      D5: -720000
      D9: 3600000
      B11: 0.312381
