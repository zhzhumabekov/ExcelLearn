  - id: fish-quota
    number: 5
    title: Квота вылова на озере Алаколь
    task: >-
      Рыбное хозяйство на озере Алаколь оценивает запас рыбы в <b>12 230</b> особей. За год рождается
      1,2 рыбы на каждую рыбу, живущую на начало года, а погибает 0,7 от этого числа (коэффициенты рождения
      и гибели). Покажите, что при <b>вылове 6 115 рыб в год</b> запас в озере остаётся постоянным.
    explain: >-
      Это та же модель, что в уроке про фитнес-клуб: начало года → приход → уход → конец года, а конец года
      становится началом следующего.<br>
      Год 1: <code>B8</code> = <code>=B2</code>. Родилось <code>=$B$3*B8</code>, погибло <code>=$B$4*B8</code>,
      выловлено <code>=$B$5</code> — параметры закреплены полностью. На конец: <code>=B8+C8-D8-E8</code>.
      Начало следующего года: <code>B9</code> = <code>=F8</code>. Протяните всё до 10-го года.<br>
      Запас не меняется, потому что чистый прирост 12 230 × (1,2 − 0,7) = 6 115 — ровно квота. Попробуйте
      вылов 7 000 — запас начнёт сокращаться.
    mistake: >-
      Протянуть <code>=B3*B8</code> без знаков <code>$</code>: в следующей строке ссылка уедет на
      <code>B4</code>, и рождаемость станет коэффициентом гибели.
