        C7: {v: Родилось, style: head}
        D7: {v: Погибло, style: head}
        E7: {v: Выловлено, style: head}
        F7: {v: На конец, style: head}
        A8: 1
        A9: 2
        A10: 3
        A11: 4
        A12: 5
        A13: 6
        A14: 7
        A15: 8
        A16: 9
        A17: 10
    solution:
