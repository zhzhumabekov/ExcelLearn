  - id: gini-coefficient
    number: 6
    title: Коэффициент Джини
    task: >-
      Коэффициент Джини показывает неравенство доходов: 0 — у всех доход одинаковый, ближе к 1 — почти всё
      у одного. Его публикует и Бюро национальной статистики РК. Если доходы n человек отсортированы по
      возрастанию (x₁ — наименьший, xₙ — наибольший), то<br>
      <b>G = Σ (2i − n − 1) · xᵢ / (n · Σ xᵢ)</b>.<br>
      Посчитайте коэффициент Джини для пяти сотрудников небольшой компании в Караганде.
    explain: >-
      Число людей n посчитайте функцией: <code>B1</code> = <code>=СЧЁТ(B4:B8)</code> (<code>COUNT</code>) —
      добавите человека, и n изменится сам.<br>
      Множитель в <code>C4</code>: <code>=2*A4-$B$1-1</code> — номер i относительный, n закреплён. Взвешенный
      доход в <code>D4</code>: <code>=C4*B4</code>. Протяните обе формулы до строки 8.<br>
      Итог в <code>B10</code>: <code>=СУММ(D4:D8)/($B$1*СУММ(B4:B8))</code>. Скобки в знаменателе обязательны:
      делим на произведение n и суммы. Получится около 0,31. Проверьте модель: поставьте всем одинаковый
      доход — должен выйти 0.
    mistake: >-
      Не отсортировать доходы по возрастанию. Формула верна только для упорядоченного списка: перепутаете
      порядок — получите другое (и неверное) число.
    sheet:
      file: Коэффициент_Джини.xlsx
      name: Доходы
      columns: { A: 170, B: 150, C: 110, D: 190 }
      cells:
        A1: {v: Число людей n, style: label}
        A3: {v: i, style: head}
        B3: {v: "Доход в месяц, ₸", style: head}
        C3: {v: 2i − n − 1, style: head}
        D3: {v: (2i − n − 1) × доход, style: head}
        A4: 1
        A5: 2
        A6: 3
        A7: 4
        A8: 5
        B4: {v: 180000, fmt: kzt}
        B5: {v: 250000, fmt: kzt}
        B6: {v: 320000, fmt: kzt}
        B7: {v: 450000, fmt: kzt}
        B8: {v: 900000, fmt: kzt}
        A10: {v: Коэффициент Джини, style: total}
        B10: {style: total}
    solution:
      cells:
        B1: {f: "=COUNT(B4:B8)"}
        C4: {f: "=2*A4-$B$1-1"}
        D4: {f: "=C4*B4", fmt: kzt}
        B10: {f: "=SUM(D4:D8)/($B$1*SUM(B4:B8))", fmt: number}
      fill:
        - {source: C4, to: C4:C8}
        - {source: D4, to: D4:D8}
    expect:
      B1: 5
      C4: -4
      C8: 4
      D4: -720000
      D8: 3600000
      B10: 0.312381
