  - id: body-mass-index
    number: 2
    title: Индекс массы тела сотрудников
    task: >-
      Компания запускает программу «Здоровый офис» и просит посчитать <b>индекс массы тела (ИМТ)</b>
      участников. ИМТ = вес в килограммах / (рост в метрах)². Рост в таблице — в сантиметрах.
    explain: >-
      В книге формула <code>703 × вес / рост²</code> — для фунтов и дюймов. В Казахстане килограммы и сантиметры,
      поэтому множитель не нужен, а рост переводим в метры делением на 100.<br>
      Формула для <code>D2</code>: <code>=C2/(B2/100)^2</code>. Протяните её до <code>D6</code>.
      Справа — шкала ВОЗ, по ней видно, у кого ИМТ в норме.
    mistake: >-
      Забыть скобки: <code>=C2/B2/100^2</code>. Степень выполняется первой, получится вес / рост / 10 000 —
      число в сотни раз меньше. Деление на 100 и возведение в квадрат должны быть в скобках вместе с ростом.
    sheet:
      file: ИМТ_сотрудников.xlsx
      name: ИМТ
      columns: { A: 160, B: 84, C: 84, D: 84, E: 30, F: 230 }
      cells:
        A1: {v: Сотрудник, style: head}
        B1: {v: "Рост, см", style: head}
        C1: {v: "Вес, кг", style: head}
        D1: {v: ИМТ, style: head}
        A2: Асхат Бекетов
        B2: 172
        C2: 68
        A3: Гульмира Нурпеисова
        B3: 165
        C3: 59
        A4: Сергей Волков
        B4: 180
        C4: 92
        A5: Камила Рахимова
        B5: 158
        C5: 71
        A6: Нурлан Жаксылыков
        B6: 190
        C6: 80
        F1: {v: Шкала ВОЗ, style: head}
        F2: до 18,5 — недостаток веса
        F3: 18,5–24,9 — норма
        F4: 25–29,9 — избыточный вес
        F5: 30 и выше — ожирение
    solution:
      cells:
        D2: {f: "=C2/(B2/100)^2", fmt: number}
      fill:
        - {source: D2, to: D2:D6}
    expect:
      D2: 22.9854
      D3: 21.6713
      D4: 28.3951
      D5: 28.441
      D6: 22.1607

  - id: fibonacci
    number: 3
    title: Числа Фибоначчи и золотое сечение
    task: >-
      Трейдеры на бирже KASE строят на графиках «уровни Фибоначчи». Откуда они берутся? Последовательность
      Фибоначчи: F(0) = 0, F(1) = 1, а каждое следующее число — сумма двух предыдущих:
      F(n) = F(n−1) + F(n−2). Посчитайте последовательность до n = 30 и покажите, что отношение соседних чисел
      F(n) / F(n−1) стремится к <b>золотому сечению ≈ 1,618</b>.
    explain: >-
      Первые два числа уже стоят в <code>B2</code> и <code>B3</code>. В <code>B4</code> введите
      <code>=B3+B2</code> и протяните до <code>B32</code>: ссылки относительные, каждая строка складывает две
      строки над собой.<br>
      Отношение в <code>C4</code>: <code>=B4/B3</code>, тоже протяните вниз. Для сравнения в <code>E2</code>
      посчитайте само золотое сечение: <code>=(1+КОРЕНЬ(5))/2</code> (в английском Excel — <code>SQRT</code>).
      Уже к n = 15 отношение совпадает с ним до четырёх знаков.
    mistake: >-
      Начать отношение со строки 3: <code>=B3/B2</code> делит на ноль и даёт <code>#ДЕЛ/0!</code>.
      Отношение имеет смысл с n = 2.
    sheet:
      file: Фибоначчи.xlsx
      name: Фибоначчи
      columns: { A: 60, B: 100, C: 140, D: 30, E: 150 }
      cells:
        A1: {v: n, style: head}
        B1: {v: F(n), style: head}
        C1: {v: F(n) / F(n−1), style: head}
        E1: {v: Золотое сечение, style: head}
        A2: 0
        A3: 1
        A4: 2
        A5: 3
        A6: 4
        A7: 5
        A8: 6
        A9: 7
        A10: 8
        A11: 9
        A12: 10
        A13: 11
        A14: 12
        A15: 13
        A16: 14
        A17: 15
        A18: 16
        A19: 17
        A20: 18
        A21: 19
        A22: 20
        A23: 21
        A24: 22
        A25: 23
        A26: 24
        A27: 25
        A28: 26
        A29: 27
        A30: 28
        A31: 29
        A32: 30
        B2: 0
        B3: 1
    solution:
      cells:
        B4: {f: "=B3+B2"}
        C4: {f: "=B4/B3"}
        E2: {f: "=(1+SQRT(5))/2"}
      fill:
