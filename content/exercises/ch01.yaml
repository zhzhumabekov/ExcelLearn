  - id: body-mass-index
    number: 2
    title: Индекс массы тела сотрудников
    task: >-
      Компания запускает программу «Здоровый офис» и просит посчитать <b>индекс массы тела (ИМТ)</b>
      участников. ИМТ = вес в килограммах / (рост в метрах)². Рост в таблице — в сантиметрах.
    explain: >-
      В книге формула <code>703 × вес / рост²</code> — для фунтов и дюймов. В Казахстане килограммы и сантиметры,
      поэтому множитель не нужен, а рост переводим в метры делением на 100.<br>
      Формула для <code>D5</code>: <code>=C5/(B5/100)^2</code>. Протяните её до <code>D9</code>.
      Справа — шкала ВОЗ, по ней видно, у кого ИМТ в норме.
    mistake: >-
      Забыть скобки: <code>=C5/B5/100^2</code>. Степень выполняется первой, получится вес / рост / 10 000 —
      число в сотни раз меньше. Деление на 100 и возведение в квадрат должны быть в скобках вместе с ростом.
    sheet:
      file: ИМТ_сотрудников.xlsx
      name: ИМТ
      columns: {A: 160, B: 84, C: 84, D: 84, E: 30, F: 230}
      cells:
        A4: {v: Сотрудник, style: head}
        B4: {v: "Рост, см", style: head}
        C4: {v: "Вес, кг", style: head}
        D4: {v: ИМТ, style: head}
        A5: Асхат Бекетов
        B5: 172
        C5: 68
        A6: Гульмира Нурпеисова
        B6: 165
        C6: 59
        A7: Сергей Волков
        B7: 180
        C7: 92
        A8: Камила Рахимова
        B8: 158
        C8: 71
        A9: Нурлан Жаксылыков
        B9: 190
        C9: 80
        F4: {v: Шкала ВОЗ, style: head}
        F5: до 18,5 — недостаток веса
        F6: 18,5–24,9 — норма
        F7: 25–29,9 — избыточный вес
        F8: 30 и выше — ожирение
    solution:
      cells:
        D5: {f: "=C5/(B5/100)^2", fmt: number}
      fill:
        - {source: D5, to: D5:D9}
