# Глава 8 (ЧПС). Собрано генератором; ответы expect посчитаны независимо.
chapter: ch08
exercises:
- id: hockey-bonus
  number: 1
  title: Бонус по годам или 600 млн ₸ сразу
  task: 'Хоккеисту предлагают бонус за контракт: <b>100 млн ₸</b> сейчас и по <b>200 млн ₸</b> через год, через два и через
    три года. Или <b>600 млн ₸</b> сразу. Ставка — 10%, налоги не учитываем. В <code>B6</code> посчитайте ЧПС бонуса по
    годам, в <code>B8</code> — формулой {fn:IF} напишите, что выгоднее: «бонус по годам» или «600 млн сразу».'
  explain: 'Сегодняшние 100 млн ₸ — снаружи {fn:NPV}: <code>{f:=B4+NPV(B1,C4:E4)}</code>. Сравнение — <code>{f:=IF(B6>B7,"бонус
    по годам","600 млн сразу")}</code>.'
  mistake: 'Подать в {fn:NPV} все четыре потока: сегодняшние 100 млн тоже продисконтируются на год, и ЧПС выйдет на 10%
    меньше.'
  sheet:
    file: Бонус.xlsx
    name: Бонус
    columns:
      A: 190
      B: 150
      C: 130
      D: 130
      E: 130
    rows: 9
    cells:
      A1:
        v: Ставка
        style: label
      B1:
        v: 0.1
        fmt: percent
      A3:
        v: Год
        style: head
      A4: Бонус
      B3:
        v: 0
        style: head
      B4:
        v: 100000000
        fmt: kzt
      C3:
        v: 1
        style: head
      C4:
        v: 200000000
        fmt: kzt
      D3:
        v: 2
        style: head
      D4:
        v: 200000000
        fmt: kzt
      E3:
        v: 3
        style: head
      E4:
        v: 200000000
        fmt: kzt
      A6: ЧПС бонуса по годам
      A7: Если сразу
      B7:
        v: 600000000
        fmt: kzt
      A8: Что выгоднее
  solution:
    cells:
      B6:
        f: =B4+NPV(B1,C4:E4)
        fmt: kzt
      B8:
        f: =IF(B6>B7,"бонус по годам","600 млн сразу")
  expect:
    B6: 597370398.1968
    B8: 600 млн сразу
- id: reject-project
  number: 2
  title: Отказаться от проекта?
  task: 'Проект: <b>−4 млн ₸</b> сегодня, <b>+4 млн ₸</b> через год и через два, <b>−3 млн ₸</b> через три года (ликвидация
    оборудования). Стоимость капитала — 15%. В <code>B6</code> посчитайте ЧПС, в <code>B7</code> формулой {fn:IF} напишите
    «вкладывать» или «отказаться».'
  explain: ЧПС больше нуля — проект увеличивает стоимость компании. <code>{f:=B4+NPV(B1,C4:E4)}</code>, затем <code>{f:=IF(B6>0,"вкладывать","отказаться")}</code>.
  mistake: 'Решить по простой сумме: 4 + 4 − 4 − 3 = 1 млн ₸ «в плюс» — но так тенге разных лет складываются как одинаковые.'
  sheet:
    file: Проект.xlsx
    name: Проект
    columns:
      A: 150
      B: 130
      C: 130
      D: 130
      E: 130
    rows: 8
    cells:
      A1:
        v: Ставка
        style: label
      B1:
        v: 0.15
        fmt: percent
      A3:
        v: Год
        style: head
      A4: Поток
      B3:
        v: 0
        style: head
      B4:
        v: -4000000
        fmt: kzt
      C3:
        v: 1
        style: head
      C4:
        v: 4000000
        fmt: kzt
      D3:
        v: 2
        style: head
      D4:
        v: 4000000
        fmt: kzt
      E3:
        v: 3
        style: head
      E4:
        v: -3000000
        fmt: kzt
      A6: ЧПС проекта
      A7: Решение
  solution:
    cells:
      B6:
        f: =B4+NPV(B1,C4:E4)
        fmt: kzt
      B7:
        f: =IF(B6>0,"вкладывать","отказаться")
  expect:
    B6: 530286.8415
    B7: вкладывать
- id: isp-midyear
  number: 3
  title: 'Абонент провайдера: деньги в середине года'
  task: Абонент интернет-провайдера в Астане платит <b>5 000 ₸</b> в месяц пять лет. Будем считать, что выручка каждого
    года приходит в его середине. Ставка — 15%. В <code>B5:F5</code> посчитайте выручку за год, в <code>B7</code> — ЧПС.
  explain: 'Выручка за год — <code>{f:=$B$2*12}</code>, протяните вправо. ЧПС для середины года — <code>{f:=SQRT(1+B1)*NPV(B1,B5:F5)}</code>:
    {fn:NPV} считает деньги в конце года, а корень сдвигает их на полгода раньше.'
  mistake: Умножить на (1 + ставка) — это сдвиг на целый год, к началу года. Для середины нужен корень.
  sheet:
    file: Провайдер.xlsx
    name: Абонент
    columns:
      A: 170
      B: 110
      C: 110
      D: 110
      E: 110
      F: 110
    rows: 8
    cells:
      A1:
        v: Ставка
        style: label
      B1:
        v: 0.15
        fmt: percent
      A2:
        v: Платёж в месяц
        style: label
      B2:
        v: 5000
        fmt: kzt
      A4:
        v: Год
        style: head
      A5: Выручка за год
      A7: ЧПС (середина года)
      B4:
        v: 1
        style: head
      B5:
        fmt: kzt
      C4:
        v: 2
        style: head
      C5:
        fmt: kzt
      D4:
        v: 3
        style: head
      D5:
        fmt: kzt
      E4:
        v: 4
        style: head
      E5:
        fmt: kzt
      F4:
        v: 5
        style: head
      F5:
        fmt: kzt
  solution:
    cells:
      B5:
        f: =$B$2*12
        fmt: kzt
      B7:
        f: =SQRT(1+B1)*NPV(B1,B5:F5)
        fmt: kzt
    fill:
    - source: B5
      to: B5:F5
  expect:
    B5: 60000
    F5: 60000
    B7: 215687.1515
- id: isp-xnpv
