# Глава 6 (текстовые функции). Собрано генератором; ответы expect посчитаны независимо.
chapter: ch06
exercises:
- id: name-address
  number: 1
  title: Имя и адрес из одной строки
  task: 'В анкетах имя и адрес записаны в одну ячейку через запятую. Разложите их: имя — в столбец B, адрес — в столбец
    C (без пробела в начале).'
  explain: 'Граница — первая запятая: <code>{f:=FIND(",",A2)}</code>. Имя — всё до неё: <code>{f:=LEFT(A2,FIND(",",A2)-1)}</code>.
    Адрес — всё после, без пробела: <code>{f:=TRIM(MID(A2,FIND(",",A2)+1,200))}</code>. Протяните вниз.'
  mistake: Забыть «−1» в {fn:LEFT} — в имя попадёт запятая; забыть {fn:TRIM} — адрес начнётся с пробела.
  sheet:
    file: Анкеты.xlsx
    name: Анкеты
    columns:
      A: 330
      B: 150
      C: 250
    cells:
      A1:
        v: Запись из анкеты
        style: head
      B1:
        v: Имя
        style: head
      C1:
        v: Адрес
        style: head
      A2: Асель Нурланова, Алматы, пр. Абая 15
      A3: Данияр Ахметов, Астана, ул. Кенесары 40
      A4: Ольга Пак, Караганда, ул. Ерубаева 3
      A5: Ержан Тулеуов, Шымкент, ул. Байтурсынова 7
  solution:
    cells:
      B2:
        f: =LEFT(A2,FIND(",",A2)-1)
      C2:
        f: =TRIM(MID(A2,FIND(",",A2)+1,200))
    fill:
    - source: B2
      to: B2:B5
    - source: C2
      to: C2:C5
  expect:
    B2: Асель Нурланова
    C2: Алматы, пр. Абая 15
    B3: Данияр Ахметов
    C3: Астана, ул. Кенесары 40
    B4: Ольга Пак
    C4: Караганда, ул. Ерубаева 3
    B5: Ержан Тулеуов
    C5: Шымкент, ул. Байтурсынова 7
- id: sku-price
  number: 2
  title: Артикул и цена разной длины
  task: В прайсе артикул и цена — в одной ячейке через пробел, длина артикула разная. Извлеките артикул в B и цену <b>числом</b>
    в C. Затем попробуйте то же <b>Данные → Текст по столбцам</b> (разделитель — пробел).
  explain: 'Граница — пробел: <code>{f:=LEFT(A2,FIND(" ",A2)-1)}</code> — артикул, <code>{f:=VALUE(MID(A2,FIND(" ",A2)+1,20))}</code>
    — цена.'
  mistake: Взять «первые 5 символов» — у артикулов разная длина. И без {fn:VALUE} цена останется текстом.
