- id: nbsp-sum
  number: 12
  title: Почему СУММ даёт ноль
  task: Суммы скопированы с сайта поставщика, и <code>{f:=SUM(A2:A5)}</code> даёт 0. Перед каждым числом спрятан невидимый
    символ. Найдите его и получите в B числа, а в <code>B6</code> — правильную сумму.
  explain: 'Проверьте: <code>{f:=FIND(CHAR(160),A2)}</code> = 1 — это неразрывный пробел. Уберите его: <code>{f:=VALUE(SUBSTITUTE(A2,CHAR(160),""))}</code>,
    протяните, и <code>{f:=SUM(B2:B5)}</code>.'
  mistake: 'Взять {fn:TRIM} или {fn:CLEAN}: ни одна из них не убирает символ 160.'
  sheet:
    file: Суммы_с_сайта.xlsx
    name: Суммы
    columns:
      A: 130
      B: 130
    cells:
      A1:
        v: С сайта
        style: head
      B1:
        v: Число
        style: head
      A6:
        f: =SUM(A2:A5)
        style: total
      B6:
        style: total
      A2:  1250
      A3:  880
      A4:  2310
      A5:  4075
  solution:
    cells:
      B2:
        f: =VALUE(SUBSTITUTE(A2,CHAR(160),""))
      B6:
        f: =SUM(B2:B5)
    fill:
    - source: B2
