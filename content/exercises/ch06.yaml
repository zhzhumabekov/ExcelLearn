    file: Прайс_строкой.xlsx
    name: Прайс
    columns:
      A: 200
      B: 140
      C: 130
    cells:
      A1:
        v: Строка прайса
        style: head
      B1:
        v: Артикул
        style: head
      C1:
        v: Цена, ₸
        style: head
      A2: АРТ-1024 15990
      C2:
        fmt: kzt
      A3: Б-7 450
      C3:
        fmt: kzt
      A4: ПРЕМ-55821 1250000
      C4:
        fmt: kzt
      A5: К-310 8990
      C5:
        fmt: kzt
      A6: ТВ-4K-55 289000
      C6:
        fmt: kzt
  solution:
    cells:
      B2:
        f: =LEFT(A2,FIND(" ",A2)-1)
      C2:
        f: =VALUE(MID(A2,FIND(" ",A2)+1,20))
    fill:
    - source: B2
      to: B2:B6
    - source: C2
      to: C2:C6
  expect:
    B2: АРТ-1024
    C2: 15990
    B3: Б-7
    C3: 450
    B4: ПРЕМ-55821
    C4: 1250000
    B5: К-310
    C5: 8990
    B6: ТВ-4K-55
    C6: 289000
- id: quarter-split
  number: 3
  title: Год, квартал и выпуск из одной строки
  task: 'Статистика выгружена строками вида «2023-К1 28450» (условный выпуск, млрд ₸). Разложите в три столбца <b>числами</b>:
    год, номер квартала и выпуск.'
  explain: 'Части стоят на одних и тех же местах: год — <code>{f:=VALUE(LEFT(A2,4))}</code>, квартал — 7-й символ <code>{f:=VALUE(MID(A2,7,1))}</code>,
    выпуск — с 9-го: <code>{f:=VALUE(MID(A2,9,20))}</code>.'
  mistake: 'Считать позиции «на глаз»: «2023-К1» — это 7 символов, выпуск начинается с 9-го (после пробела).'
  sheet:
    file: Выпуск_кварталы.xlsx
    name: Кварталы
    columns:
      A: 160
      B: 80
      C: 90
      D: 140
    cells:
      A1:
        v: Запись
        style: head
      B1:
        v: Год
        style: head
      C1:
        v: Квартал
        style: head
      D1:
        v: Выпуск, млрд ₸
        style: head
      A2: 2023-К1 28450
      A3: 2023-К2 31720
      A4: 2023-К3 35980
      A5: 2023-К4 38110
      A6: 2024-К1 30260
      A7: 2024-К2 34410
  solution:
    cells:
      B2:
        f: =VALUE(LEFT(A2,4))
      C2:
        f: =VALUE(MID(A2,7,1))
      D2:
        f: =VALUE(MID(A2,9,20))
    fill:
    - source: B2
      to: B2:B7
    - source: C2
      to: C2:C7
    - source: D2
      to: D2:D7
  expect:
    B2: 2023
    C2: 1
    D2: 28450
    B3: 2023
    C3: 2
    D3: 31720
    B4: 2023
    C4: 3
    D4: 35980
    B5: 2023
    C5: 4
    D5: 38110
    B6: 2024
    C6: 1
    D6: 30260
    B7: 2024
    C7: 2
    D7: 34410
- id: clothing-code
  number: 4
  title: Модель, цвет и размер из кода товара
  task: 'Код одежды «Модель:100-65-L»: номер модели — между двоеточием и первым дефисом, цвет — между дефисами, размер —
    после второго дефиса. Длина частей разная. Извлеките модель и цвет <b>числами</b>, размер — текстом.'
  explain: 'Найдите позиции: двоеточие {fn:FIND}, первый дефис, второй — <code>{f:=FIND("-",A2,FIND("-",A2)+1)}</code>.
    Модель: <code>{f:=VALUE(MID(A2,FIND(":",A2)+1,FIND("-",A2)-FIND(":",A2)-1))}</code>; цвет и размер — так же, между найденными
    позициями.'
  mistake: Искать второй дефис без третьего аргумента {fn:FIND} — она снова найдёт первый.
  sheet:
    file: Коды_одежды.xlsx
    name: Коды
    columns:
      A: 170
      B: 90
      C: 80
      D: 90
    cells:
      A1:
        v: Код товара
        style: head
      B1:
        v: Модель
        style: head
      C1:
        v: Цвет
        style: head
      D1:
        v: Размер
        style: head
      A2: Модель:100-65-L
      A3: Модель:7-120-XL
      A4: Модель:2510-3-M
      A5: Модель:48-17-XXL
      A6: Модель:333-9-S
  solution:
    cells:
      B2:
        f: =VALUE(MID(A2,FIND(":",A2)+1,FIND("-",A2)-FIND(":",A2)-1))
      C2:
        f: =VALUE(MID(A2,FIND("-",A2)+1,FIND("-",A2,FIND("-",A2)+1)-FIND("-",A2)-1))
      D2:
        f: =MID(A2,FIND("-",A2,FIND("-",A2)+1)+1,10)
    fill:
    - source: B2
      to: B2:B6
    - source: C2
      to: C2:C6
    - source: D2
      to: D2:D6
  expect:
    B2: 100
    C2: 65
    D2: L
    B3: 7
    C3: 120
    D3: XL
    B4: 2510
    C4: 3
    D4: M
    B5: 48
    C5: 17
    D5: XXL
    B6: 333
    C6: 9
    D6: S
- id: email-login
  number: 5
  title: 'Почта: первая буква имени и фамилия'
  task: 'Новым сотрудникам нужна почта: первая буква имени, фамилия и <b>@company.kz</b>, всё строчными. Например, Aigerim
    Saparova → asaparova@company.kz.'
  explain: 'Буква имени — <code>{f:=LEFT(A2,1)}</code>, фамилия — всё после пробела: <code>{f:=MID(A2,FIND(" ",A2)+1,100)}</code>.
    Склейте, сделайте строчными и добавьте домен: <code>{f:=LOWER(LEFT(A2,1)&MID(A2,FIND(" ",A2)+1,100))&"@company.kz"}</code>.'
  mistake: 'Забыть {fn:LOWER}: почта не чувствительна к регистру, но в списке рассылки появятся «разные» адреса.'
  sheet:
    file: Почта_сотрудников.xlsx
    name: Почта
    columns:
      A: 190
      B: 240
    cells:
      A1:
        v: Сотрудник
        style: head
      B1:
        v: Почта
        style: head
      A2: Aigerim Saparova
      A3: Daniyar Akhmetov
      A4: Olga Pak
      A5: Yerzhan Tuleuov
      A6: Madina Zhumatova
      A7: Timur Kim
  solution:
    cells:
      B2:
        f: =LOWER(LEFT(A2,1)&MID(A2,FIND(" ",A2)+1,100))&"@company.kz"
    fill:
    - source: B2
      to: B2:B7
  expect:
    B2: asaparova@company.kz
    B3: dakhmetov@company.kz
    B4: opak@company.kz
    B5: ytuleuov@company.kz
    B6: mzhumatova@company.kz
    B7: tkim@company.kz
- id: surname-first
  number: 6
  title: «Фамилия, Имя Отчество»
  task: В анкетах ФИО записаны «Имя Отчество Фамилия» (у некоторых без отчества). Для списка нужна форма «Фамилия, Имя Отчество».
    В B найдите позицию <b>последнего</b> пробела, в C соберите строку.
  explain: 'Сколько пробелов: <code>{f:=LEN(A2)-LEN(SUBSTITUTE(A2," ",""))}</code>. Заменим последний пробел звёздочкой
    и найдём её: <code>{f:=FIND("*",SUBSTITUTE(A2," ","*",LEN(A2)-LEN(SUBSTITUTE(A2," ",""))))}</code>. Фамилия — <code>{f:=MID(A2,B2+1,100)}</code>,
    остальное — <code>{f:=LEFT(A2,B2-1)}</code>.'
  mistake: 'Искать первый пробел: у ФИО с отчеством фамилией окажется «Маратовна Нурланова».'
  sheet:
    file: Список_ФИО.xlsx
    name: ФИО
    columns:
      A: 230
      B: 140
      C: 250
    cells:
      A1:
        v: Как в анкете
        style: head
      B1:
        v: Последний пробел
        style: head
      C1:
        v: Для списка
        style: head
      A2: Асель Маратовна Нурланова
      A3: Тимур Ким
      A4: Данияр Серикович Ахметов
      A5: Ольга Пак
      A6: Мадина Ерлановна Жуматова
  solution:
    cells:
      B2:
        f: =FIND("*",SUBSTITUTE(A2," ","*",LEN(A2)-LEN(SUBSTITUTE(A2," ",""))))
      C2:
        f: =MID(A2,B2+1,100)&", "&LEFT(A2,B2-1)
    fill:
    - source: B2
      to: B2:B6
    - source: C2
      to: C2:C6
  expect:
    B2: 16
    C2: Нурланова, Асель Маратовна
    B3: 6
    C3: Ким, Тимур
    B4: 17
    C4: Ахметов, Данияр Серикович
    B5: 6
    C5: Пак, Ольга
    B6: 17
    C6: Жуматова, Мадина Ерлановна
