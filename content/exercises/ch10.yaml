# Глава 10 (финансовые функции). Собрано генератором; ответы expect посчитаны независимо.
chapter: ch10
exercises:
- id: lottery-pv
  number: 1
  title: 'Выигрыш в лотерею: сколько он стоит сегодня'
  task: Выигрыш — <b>5 000 000 ₸</b> в конце каждого года 20 лет. Стоимость капитала — 10%. Сколько стоит выигрыш сегодня?
    Ответ — в <code>B4</code>.
  explain: 'Это аннуитет: <code>{f:=PV(B1,B2,-B3)}</code>. Знак минус у выплаты делает ответ положительным.'
  mistake: 'Умножить 5 000 000 на 20: 100 млн ₸ «через 20 лет» стоят сегодня вдвое меньше.'
  sheet:
    file: Лотерея.xlsx
    name: Выигрыш
    columns:
      A: 260
      B: 160
    rows: 6
    cells:
      A1:
        v: Ставка
        style: label
      B1:
        v: 0.1
        fmt: percent
      A2:
        v: Лет
        style: label
      B2: 20
      A3:
        v: Выигрыш в год
        style: label
      B3:
        v: 5000000
        fmt: kzt
      A4: Стоимость сегодня
  solution:
    cells:
      B4:
        f: =PV(B1,B2,-B3)
        fmt: kzt
  expect:
    B4: 42567818.5988
- id: perpetuity
  number: 2
  title: 'Аренда навсегда: перпетуитет'
  task: 'Дом сдаётся в аренду: <b>1 400 000 ₸</b> в начале каждого года, бессрочно. Стоимость капитала — 10%. Сколько стоит
    такой поток сегодня? Ответ — в <code>B3</code>.'
  explain: 'Возьмите очень много периодов, например 1000, и тип 1 (в начале года): <code>{f:=PV(B1,1000,-B2,0,1)}</code>.
    Ответ почти совпадает с формулой бессрочной ренты 1 400 000 × 1,1 ÷ 0,1.'
  mistake: 'Забыть тип 1: аренда приходит в начале года, без него стоимость окажется в 1,1 раза меньше.'
  sheet:
    file: Перпетуитет.xlsx
    name: Аренда
    columns:
      A: 260
      B: 160
    rows: 5
    cells:
      A1:
        v: Ставка
        style: label
      B1:
        v: 0.1
        fmt: percent
      A2:
        v: Аренда в начале года
        style: label
      B2:
        v: 1400000
        fmt: kzt
      A3: Стоимость аренды навсегда
  solution:
    cells:
      B3:
        f: =PV(B1,1000,-B2,0,1)
        fmt: kzt
  expect:
    B3: 15400000.0
- id: withdraw-fv
  number: 3
  title: Сколько останется на счёте
  task: На счёте <b>25 000 000 ₸</b>, он приносит 8% в год. В конце каждого года 20 лет снимаю <b>1 500 000 ₸</b>. Сколько
    останется через 20 лет? Ответ — в <code>B5</code>.
  explain: 'Деньги на счёте — вложены (минус), снятые — получены (плюс): <code>{f:=FV(B1,B2,B3,-B4)}</code>.'
  mistake: 'Поставить у снятия минус, как у вклада: тогда Excel решит, что вы ещё и докладываете, и сумма вырастет.'
  sheet:
    file: Счёт.xlsx
    name: Счёт
    columns:
      A: 260
      B: 160
    rows: 7
    cells:
      A1:
        v: Доходность
        style: label
      B1:
        v: 0.08
        fmt: percent
      A2:
        v: Лет
        style: label
      B2: 20
      A3:
        v: Снимаю в конце года
        style: label
      B3:
        v: 1500000
        fmt: kzt
      A4:
        v: На счёте сегодня
        style: label
      B4:
        v: 25000000
        fmt: kzt
      A5: Останется через 20 лет
  solution:
    cells:
      B5:
        f: =FV(B1,B2,B3,-B4)
        fmt: kzt
  expect:
    B5: 47880982.1491
- id: deposit-now
  number: 4
  title: Сколько положить сейчас, чтобы накопить 10 млн
  task: 10 лет в конце каждого месяца вношу <b>20 000 ₸</b>, счёт приносит 0,8% в месяц. Через 10 лет нужно <b>10 000 000
    ₸</b>. Сколько положить на счёт сегодня? Ответ — в <code>B5</code>.
  explain: 'Ищем пс: <code>{f:=-PV(B1,B2,-B3,B4)}</code>. Взносы — минус, будущие 10 млн — плюс (получаем). {fn:PV} вернёт
    вклад со знаком минус, поэтому перед ней минус.'
  mistake: 'Забыть взносы и посчитать только <code>{f:=PV(B1,B2,0,B4)}</code>: тогда сумма сегодня выйдет завышенной.'
  sheet:
    file: Вклад.xlsx
    name: Вклад
    columns:
      A: 260
      B: 160
    rows: 7
    cells:
      A1:
        v: Доходность в месяц
        style: label
      B1:
        v: 0.008
        fmt: percent
      A2:
        v: Месяцев
        style: label
      B2: 120
      A3:
        v: Вношу в конце месяца
        style: label
      B3:
        v: 20000
        fmt: kzt
      A4:
        v: Хочу получить
        style: label
      B4:
        v: 10000000
        fmt: kzt
      A5: Положить сейчас
  solution:
    cells:
      B5:
        f: =-PV(B1,B2,-B3,B4)
        fmt: kzt
  expect:
    B5: 2304477.4558
- id: step-pv
  number: 5
  title: Поступления растут ступенями
  task: 'В конце каждого года 20 лет получаю: годы 1–5 — <b>200 000 ₸</b>, 6–10 — <b>300 000 ₸</b>, 11–20 — <b>400 000 ₸</b>.
    Ставка — 10%. Найдите стоимость сегодня одной формулой с {fn:PV} в <code>B5</code>.'
  explain: 'Представьте: 400 000 все 20 лет, минус 100 000 первые 10 лет, минус ещё 100 000 первые 5 лет: <code>{f:=PV(B1,20,-B4)-PV(B1,10,-(B4-B3))-PV(B1,5,-(B3-B2))}</code>.'
  mistake: 'Посчитать каждую ступень с {fn:PV} от сегодняшнего дня: ступень 11–20 начинается через 10 лет, её нужно ещё
    продисконтировать.'
  sheet:
    file: Ступени.xlsx
    name: Поступления
    columns:
      A: 260
      B: 160
    rows: 7
    cells:
      A1:
        v: Ставка
        style: label
      B1:
        v: 0.1
        fmt: percent
      A2:
        v: Годы 1–5, в год
        style: label
      B2:
        v: 200000
        fmt: kzt
      A3:
        v: Годы 6–10, в год
        style: label
      B3:
        v: 300000
        fmt: kzt
      A4:
        v: Годы 11–20, в год
        style: label
      B4:
        v: 400000
        fmt: kzt
      A5: Стоимость сегодня
  solution:
    cells:
      B5:
        f: =PV(B1,20,-B4)-PV(B1,10,-(B4-B3))-PV(B1,5,-(B3-B2))
        fmt: kzt
  expect:
    B5: 2411890.1004
- id: mortgage
  number: 6
  title: 'Ипотека: платёж, проценты и основной долг'
  task: Ипотека <b>25 000 000 ₸</b> на 20 лет (240 месяцев) под 12% годовых (1% в месяц). Найдите ежемесячный платёж (<code>B4</code>),
    проценты и основной долг в первом месяце (<code>B5</code>, <code>B6</code>) и платёж, если платить в начале месяца (<code>B7</code>).
  explain: '<code>{f:=-PMT(B1,B2,B3)}</code>, <code>{f:=-IPMT(B1,1,B2,B3)}</code>, <code>{f:=-PPMT(B1,1,B2,B3)}</code>;
    в начале месяца — тип 1: <code>{f:=-PMT(B1,B2,B3,0,1)}</code>. Проценты 1-го месяца = 25 000 000 × 1%.'
  mistake: 'Подставить годовую ставку 12%: платёж получится в разы больше настоящего.'
  sheet:
    file: Ипотека.xlsx
    name: Ипотека
    columns:
      A: 260
      B: 160
    rows: 9
    cells:
      A1:
        v: Ставка в месяц
        style: label
      B1:
        v: 0.01
        fmt: percent
      A2:
        v: Месяцев
        style: label
      B2: 240
      A3:
        v: Сумма
        style: label
      B3:
        v: 25000000
        fmt: kzt
      A4: Платёж в конце месяца
      A5: Проценты в 1-м месяце
      A6: Основной долг в 1-м месяце
      A7: Платёж в начале месяца
  solution:
    cells:
      B4:
        f: =-PMT(B1,B2,B3)
        fmt: kzt
      B5:
        f: =-IPMT(B1,1,B2,B3)
        fmt: kzt
      B6:
        f: =-PPMT(B1,1,B2,B3)
        fmt: kzt
      B7:
        f: =-PMT(B1,B2,B3,0,1)
        fmt: kzt
  expect:
    B4: 275271.5334
    B5: 250000.0
    B6: 25271.5334
    B7: 272546.0727
