- id: car-offer
  number: 8
  title: 'Автомобиль: скидка или низкая ставка'
  task: 'Автомобиль за <b>15 000 000 ₸</b>. Схема 1: скидка 10% и кредит на 60 месяцев под 9% годовых. Схема 2: без скидки,
    60 месяцев под 2% годовых. Ваша стоимость капитала — 9% в год. Найдите платежи (<code>B5:B6</code>), стоимость платежей
    сегодня по вашей ставке (<code>C5:C6</code>) и в <code>B8</code> — какая схема выгоднее.'
  explain: 'Платёж: <code>{f:=-PMT(9%/12,60,B1*0.9)}</code> и <code>{f:=-PMT(2%/12,60,B1)}</code>. Стоимость платежей —
    <code>{f:=PV($B$2/12,60,-B5)}</code> и вниз. Выгоднее та, где стоимость меньше: <code>{f:=IF(C5<C6,A5,A6)}</code>.'
  mistake: 'Сравнить только платежи в месяц: они зависят от суммы и ставки, а важна стоимость всех платежей сегодня.'
  sheet:
    file: Автомобиль.xlsx
    name: Схемы
    columns:
      A: 230
      B: 150
      C: 170
    rows: 9
    cells:
      A1:
        v: Цена
        style: label
      B1:
        v: 15000000
        fmt: kzt
      A2:
        v: Стоимость капитала в год
        style: label
      B2:
        v: 0.09
        fmt: percent
      A4:
        v: Схема
        style: head
      B4:
        v: Платёж в месяц
        style: head
      C4:
        v: Стоимость платежей
        style: head
      A5: Скидка 10%, 9% годовых
      A6: Без скидки, 2% годовых
      A8: Выгоднее
  solution:
    cells:
      B5:
        f: =-PMT(9%/12,60,B1*0.9)
        fmt: kzt
      B6:
        f: =-PMT(2%/12,60,B1)
        fmt: kzt
      C5:
        f: =PV($B$2/12,60,-B5)
        fmt: kzt
      B8:
        f: =IF(C5<C6,A5,A6)
    fill:
    - source: C5
      to: C5:C6
  expect:
    B5: 280237.7956
    B6: 262916.4008
    C5: 13500000.0
    C6: 12665569.9805
    B8: Без скидки, 2% годовых
