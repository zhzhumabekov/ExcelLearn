  - id: two-warehouses
    number: 2
    title: Одно имя для двух складов
    task: >-
      Остатки товаров на складе в Алматы — в <code>A1:B3</code>, на складе в Астане — в <code>A6:B8</code>.
      Дайте обоим диапазонам <b>одно имя</b> <code>остатки</code> и посчитайте общий остаток формулой
      <code>=СУММ(остатки)</code>.
    explain: >-
      Выделите <code>A1:B3</code>, затем, удерживая <kbd>Ctrl</kbd>, — <code>A6:B8</code>. Пока оба куска
      выделены, наберите в поле «Имя» <code>остатки</code> и нажмите <kbd>Enter</kbd>.<br>
      Проверьте имя: выберите его в списке ▾ поля «Имя» — должны выделиться оба куска. Итог в
      <code>F1</code>: <code>=СУММ(остатки)</code> — 705.
    mistake: >-
      Отпустить <kbd>Ctrl</kbd> перед вторым диапазоном: выделение заменится, и имя получит только склад
      Астаны (итог 275 вместо 705).
    sheet:
      file: Остатки_складов.xlsx
      name: Склады
      columns: {A: 70, B: 70, C: 150, D: 24, E: 190, F: 80}
      cells:
        A1: 120
        B1: 45
        A2: 80
        B2: 60
        A3: 35
        B3: 90
        C2: {v: ← склад Алматы, style: label}
        A6: 70
        B6: 25
        A7: 55
        B7: 40
        A8: 20
        B8: 65
        C7: {v: ← склад Астана, style: label}
        E1: {v: Всего на двух складах, style: label}
    solution:
      names:
        - {name: остатки, ref: "A1:B3,A6:B8"}
      cells:
        F1: {f: "=SUM(остатки)"}
    expect:
      F1: 705

  - id: city-distance
    number: 3
    title: Расстояние между Алматы и Астаной
    task: >-
      В файле уже есть формула расстояния между двумя городами по их широте и долготе (по поверхности
      Земли). Формула работает, но в ней одни адреса. Дайте имена широте и долготе каждого города и сделайте
      так, чтобы <b>имена появились в формуле</b>.
    explain: >-
      Выделите <code>A3:B6</code> — подписи вместе с числами — и нажмите <b>Создать из выделенного</b>
      (флажок <b>в столбце слева</b>): появятся имена <code>широта1</code>, <code>долгота1</code>,
      <code>широта2</code>, <code>долгота2</code>.<br>
      Новые имена сами в формулу не попадут. Выделите <code>B8</code> и выберите <b>Присвоить имя ▾ →
      Применить имена…</b>, <b>OK</b>. Формула станет читаемой, а ответ не изменится: около <b>972 км</b>.
    mistake: >-
      Ждать, что имена появятся в формуле сами. Excel не переписывает старые формулы — нужно «Применить
      имена».
    sheet:
      file: Расстояние_между_городами.xlsx
      name: Расстояние
      columns: {A: 150, B: 110, C: 120}
      cells:
        A3: широта1
        B3: 43.2389
        C3: {v: Алматы, style: label}
        A4: долгота1
        B4: 76.8897
        A5: широта2
        B5: 51.1694
        C5: {v: Астана, style: label}
        A6: долгота2
        B6: 71.4491
        A8: {v: "Расстояние, км", style: total}
        B8:
          f: "=6371*ACOS(SIN(RADIANS(B3))*SIN(RADIANS(B5))+COS(RADIANS(B3))*COS(RADIANS(B5))*COS(RADIANS(B6-B4)))"
          fmt: number
          style: total
    solution:
      names:
        - {name: широта1, ref: B3}
        - {name: долгота1, ref: B4}
        - {name: широта2, ref: B5}
        - {name: долгота2, ref: B6}
      cells:
        B8:
          f: "=6371*ACOS(SIN(RADIANS(широта1))*SIN(RADIANS(широта2))+COS(RADIANS(широта1))*COS(RADIANS(широта2))*COS(RADIANS(долгота2-долгота1)))"
    expect:
      B8: 972.2502

  - id: portfolio-value
    number: 4
    title: Стоимость пакетов акций
    task: >-
      В портфеле инвестора — акции пяти компаний (компании условные): сколько акций и цена одной акции в
      тенге. Посчитайте стоимость каждого пакета <b>одной формулой</b> <code>=количество*цена</code> и общую
      стоимость портфеля.
    explain: >-
      Выделите <code>B1:C6</code> вместе с заголовками и нажмите <b>Создать из выделенного</b> (флажок
      <b>в строке выше</b>): столбец B получит имя <code>количество</code>, столбец C — <code>цена</code>.<br>
      В <code>D2</code> введите <code>=количество*цена</code> и протяните до <code>D6</code>. Имя указывает на
      весь столбец, а Excel берёт из него значение своей строки (неявное пересечение). Итог в <code>D7</code> —
      <code>=СУММ(D2:D6)</code>: 23 388 000 ₸.<br>
      В Microsoft 365 такую формулу Excel запишет как <code>=@количество*@цена</code>: знак <code>@</code>
      означает «значение своей строки». Без него формула выдаст сразу весь столбец (динамический массив).
    mistake: >-
      Поставить такую формулу в строку, которой нет в диапазоне имени (например, в <code>D8</code>): строки 8
      в <code>B2:B6</code> нет, и Excel вернёт ошибку <code>#ЗНАЧ!</code>.
    sheet:
      file: Портфель_акций.xlsx
      name: Портфель
      columns: {A: 200, B: 110, C: 110, D: 140}
      cells:
        A1: {v: Компания, style: head}
        B1: {v: количество, style: head}
        C1: {v: цена, style: head}
        D1: {v: стоимость, style: head}
        A2: АО «Дала Телеком»
        B2: 150
        C2: {v: 41500, fmt: kzt}
        A3: АО «Каспий Ойл»
        B3: 300
        C3: {v: 18200, fmt: kzt}
        A4: АО «Алтын Тау»
        B4: 80
        C4: {v: 96400, fmt: kzt}
        A5: АО «Жибек Жолы»
        B5: 500
        C5: {v: 2350, fmt: kzt}
        A6: АО «Нур Энерго»
        B6: 220
        C6: {v: 12800, fmt: kzt}
        A7: {v: Портфель, style: total}
        D7: {fmt: kzt, style: total}
    solution:
      names:
        - {name: количество, ref: B2:B6}
        - {name: цена, ref: C2:C6}
      cells:
        D2: {f: "=количество*цена", fmt: kzt}
        D7: {f: "=SUM(D2:D6)"}
      fill:
        - {source: D2, to: D2:D6}
    expect:
      D2: 6225000
      D5: 1175000
      D7: 23388000

  - id: last-five-years
    number: 5
    title: Среднее за последние пять лет
    task: >-
      Продажи компании за 2015–2024 годы — в одном столбце. Создайте имя <code>последние_5</code>, которое
      <b>всегда указывает на пять ячеек над формулой</b>, и посчитайте среднее за последние пять лет:
      <code>=СРЗНАЧ(последние_5)</code>. Когда появятся данные за 2025 год, вставьте строку перед итогом —
      формула сдвинется вниз и сама посчитает уже 2021–2025.
    explain: >-
      Это относительное имя, как «предыдущий_год» в уроке 2.7. Выделите <code>B12</code> — ячейку, где будет
      формула. <b>Формулы → Присвоить имя</b>: имя <code>последние_5</code>, в поле <b>Диапазон</b> —
      <code>=Продажи!B7:B11</code> <b>без знаков $</b>. Для Excel это «пять ячеек над текущей».<br>
      В <code>B12</code>: <code>=СРЗНАЧ(последние_5)</code> — 679,6 млн ₸.
    mistake: >-
      Оставить <code>=Продажи!$B$7:$B$11</code>: имя навсегда «приклеится» к 2020–2024 годам, и после
      добавления нового года среднее не сдвинется.
    sheet:
      file: Продажи_по_годам.xlsx
      name: Продажи
      columns: {A: 160, B: 140}
      cells:
        A1: {v: Год, style: head}
        B1: {v: "Продажи, млн ₸", style: head}
        A2: 2015
        B2: 410
        A3: 2016
        B3: 455
        A4: 2017
        B4: 470
        A5: 2018
        B5: 520
        A6: 2019
        B6: 498
        A7: 2020
        B7: 560
        A8: 2021
        B8: 615
        A9: 2022
        B9: 680
        A10: 2023
        B10: 742
        A11: 2024
        B11: 801
        A12: {v: Среднее за 5 лет, style: total}
        B12: {fmt: number, style: total}
    solution:
      names:
        - {name: последние_5, ref: B7:B11, relativeTo: B12}
      cells:
        B12: {f: "=AVERAGE(последние_5)"}
    expect:
      B12: 679.6
