# Задания к главе 2 — по мотивам заданий 1–5 книги, сюжеты и данные свои (Казахстан).
# Решение — формулы и имена (solution.names); в файл решения имена записываются так, как их хранит Excel.
# Сверка: manage.py exercises_dump | pnpm --dir player exercises:verify
chapter: ch02

exercises:
  - id: stock-returns
    number: 1
    title: Средняя доходность двух акций
    task: >-
      В файле — ежемесячная доходность акций двух компаний за 2023–2024 годы (компании и данные условные).
      Дайте имена столбцам доходности и посчитайте <b>среднемесячную доходность</b> каждой акции формулами с
      именами.
    explain: >-
      Выделите <code>B1:C25</code> вместе с заголовками и нажмите <b>Формулы → Создать из выделенного</b>,
      флажок <b>в строке выше</b>. Получатся имена <code>Дала_Телеком</code> и <code>Каспий_Ойл</code> (пробел
      Excel заменит подчёркиванием).<br>
      В <code>F2</code>: <code>=СРЗНАЧ(Дала_Телеком)</code> — начните набирать имя, и автозавершение предложит
      его. В <code>F3</code> — то же для <code>Каспий_Ойл</code>.
    mistake: >-
      Выделить только числа без заголовков: «Создать из выделенного» будет искать подписи в первой строке
      чисел — а числа именами быть не могут.
