- id: project-phases
  number: 5
  title: Когда закончится каждый этап
  task: Проект стартует в день из <code>B1</code> и состоит из трёх этапов; длительность в календарных днях — в столбце
    B. Этап начинается на следующий день после конца предыдущего, первый — в день старта; день начала входит в длительность.
    Найдите начало и конец каждого этапа, месяц и год окончания.
  explain: 'Конец = начало + дни − 1: <code>{f:=C4+B4-1}</code>. Начало следующего — <code>{f:=D4+1}</code>, первого — <code>{f:=B1}</code>.
    Месяц и год — {fn:MONTH} и {fn:YEAR}. Поменяйте длительность — все даты пересчитаются.'
  mistake: 'Забыть «−1»: каждый этап выйдет на день длиннее.'
  sheet:
    file: Этапы_проекта.xlsx
    name: Этапы
    columns:
      A: 80
      B: 110
      C: 100
      D: 100
      E: 70
      F: 60
    cells:
      A1:
        v: Старт
        style: label
      B1:
        v: '2026-12-04'
        fmt: date
      A3:
        v: Этап
        style: head
      B3:
        v: Дней
        style: head
      C3:
        v: Начало
        style: head
      D3:
        v: Конец
        style: head
      E3:
        v: Месяц
        style: head
      F3:
        v: Год
        style: head
      A4: Этап 1
      B4: 45
      A5: Этап 2
      B5: 60
      A6: Этап 3
      B6: 30
  solution:
    cells:
      C4:
        f: =B1
        fmt: date
      D4:
        f: =C4+B4-1
        fmt: date
      C5:
        f: =D4+1
        fmt: date
      E4:
        f: =MONTH(D4)
      F4:
        f: =YEAR(D4)
    fill:
    - source: D4
      to: D4:D6
    - source: C5
      to: C5:C6
    - source: E4
      to: E4:E6
    - source: F4
      to: F4:F6
