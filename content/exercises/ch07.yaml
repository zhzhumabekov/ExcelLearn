  title: Рабочие дни между датами
  task: Проект идёт с 10.07.2026 по 15.08.2027. Сколько в нём рабочих дней (пн–пт, <code>B3</code>) и сколько, если не считать
    праздники из столбца D (<code>B4</code>)?
  explain: <code>{f:=NETWORKDAYS(B1,B2)}</code> и <code>{f:=NETWORKDAYS(B1,B2,D2:D6)}</code>. Обе даты входят в счёт.
  mistake: 'Поставить даты в другом порядке: функция вернёт то же число, но с минусом.'
