- id: last-monday
  number: 15
  title: Последний понедельник месяца
  task: Инвентаризация на складе — в последний понедельник месяца. Найдите её дату для каждого года и месяца.
  explain: 'Последний день месяца — <code>{f:=DATE(A2,B2+1,0)}</code>. <code>{f:=WEEKDAY(дата,3)}</code> даёт 0 для понедельника,
    1 для вторника… — столько дней и надо отступить назад: <code>{f:=DATE(A2,B2+1,0)-WEEKDAY(DATE(A2,B2+1,0),3)}</code>.'
  mistake: 'Тип 2 вместо 3 сдвинет ответ на день: у типа 2 понедельник — 1, а не 0.'
  sheet:
    file: Инвентаризация.xlsx
    name: Даты
    columns:
      A: 70
      B: 80
      C: 130
    cells:
