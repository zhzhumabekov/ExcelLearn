- id: quarter
  number: 13
  title: Начало квартала и конец предыдущего
  task: 'Квартал — три месяца: январь–март, апрель–июнь и так далее. Для каждой даты найдите первый день её квартала (<code>B</code>)
    и последний день предыдущего квартала (<code>C</code>) — на эту дату сдают отчёт.'
  explain: 'Первый месяц квартала — <code>{f:=INT((MONTH(A2)-1)/3)*3+1}</code>: 1, 4, 7 или 10. Начало квартала — <code>{f:=DATE(YEAR(A2),INT((MONTH(A2)-1)/3)*3+1,1)}</code>,
    конец прошлого — на день раньше: <code>{f:=B2-1}</code>.'
  mistake: Без «−1» внутри {fn:INT} март попадёт во второй квартал, а июнь — в третий.
  sheet:
