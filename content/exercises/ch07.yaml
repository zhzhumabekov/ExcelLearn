- id: four-day-week
  number: 16
  title: Рабочие дни при четырёхдневке
  task: Сотрудник работает с понедельника по четверг; пятница, суббота и воскресенье — выходные. Составьте список его рабочих
    дней в январе 2027 года с учётом праздников из столбца D (<code>A4:A18</code>).
  explain: 'Первый рабочий день — <code>{f:=WORKDAY.INTL(B1-1,1,"0000111",$D$2:$D$3)}</code>: «следующий рабочий день после
    31 декабря». Дальше — <code>{f:=WORKDAY.INTL(A4,1,"0000111",$D$2:$D$3)}</code>, протянуть вниз.'
  mistake: 'Начать с <code>B1</code>, а не с <code>B1-1</code>: функция ищет день <b>после</b> даты, и первый рабочий день
    месяца пропадёт, если он — 1-е число.'
