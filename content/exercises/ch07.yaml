- id: experience
  number: 7
  title: 'Стаж: полные годы и месяцы'
  task: Для надбавки за стаж найдите, сколько полных лет и сколько месяцев сверх них проработал каждый сотрудник на дату
    расчёта <code>B1</code>.
  explain: '<code>{f:=DATEDIF(B4,$B$1,"y")}</code> — полные годы, <code>{f:=DATEDIF(B4,$B$1,"ym")}</code> — месяцы сверх
    полных лет. Excel не подсказывает {fn:DATEDIF}: набирайте имя целиком. На работе вместо <code>$B$1</code> — <code>{f:=TODAY()}</code>.'
  mistake: '"m" вместо "ym" даст все месяцы стажа (у Ахметовой — больше сотни), а не остаток после лет.'
  sheet:
    file: Стаж.xlsx
    name: Стаж
    columns:
      A: 130
      B: 110
      C: 100
      D: 120
    cells:
      A1:
        v: Дата расчёта
        style: label
      B1:
        v: '2026-12-31'
        fmt: date
      A3:
        v: Сотрудник
        style: head
      B3:
        v: Принят
        style: head
      C3:
        v: Полных лет
        style: head
      D3:
        v: Месяцев сверх
        style: head
      A4: Ахметова А.
      B4:
        v: '2015-03-02'
        fmt: date
      A5: Ким О.
      B5:
        v: '2021-09-15'
        fmt: date
      A6: Сапаров Д.
      B6:
        v: '2024-12-31'
        fmt: date
      A7: Нурланова С.
      B7:
        v: '2026-02-10'
        fmt: date
  solution:
    cells:
      C4:
        f: =DATEDIF(B4,$B$1,"y")
      D4:
        f: =DATEDIF(B4,$B$1,"ym")
    fill:
    - source: C4
      to: C4:C7
    - source: D4
      to: D4:D7
  expect:
    C4: 11
    D4: 9
    C5: 5
    D5: 3
    C6: 2
    D6: 0
    C7: 0
    D7: 10
