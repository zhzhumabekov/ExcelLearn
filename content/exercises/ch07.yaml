      A2:
        v: Конец
        style: label
      B2:
        v: '2027-08-15'
        fmt: date
      A3:
        v: Рабочих дней
        style: label
      A4:
        v: Без праздников
        style: label
      D1:
        v: Праздники
        style: head
      D2:
        v: '2026-12-16'
        fmt: date
      D3:
        v: '2027-01-01'
        fmt: date
      D4:
        v: '2027-01-07'
        fmt: date
      D5:
        v: '2027-03-08'
        fmt: date
      D6:
        v: '2027-07-06'
        fmt: date
  solution:
    cells:
      B3:
        f: =NETWORKDAYS(B1,B2)
      B4:
        f: =NETWORKDAYS(B1,B2,D2:D6)
  expect:
    B3: 286
    B4: 281
