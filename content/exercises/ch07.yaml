# Глава 7 (даты). Собрано генератором; ответы expect посчитаны независимо.
chapter: ch07
exercises:
- id: serial-numbers
  number: 1
  title: Номер даты и дата по номеру
  task: В <code>A2:A4</code> — даты. Покажите в <code>B2:B4</code> их номера в Excel. В <code>A6:A8</code> — номера; покажите
    в <code>B6:B8</code> даты, которые за ними стоят. Какой номер у 16 декабря 1991 года?
  explain: Значение то же — меняется формат. <code>{f:=A2}</code> и <b>Формат ячеек → Общий</b> покажут номер; <code>{f:=A6}</code>
    и <b>Формат ячеек → Дата</b> — дату. Окно — правой кнопкой или <kbd>Ctrl</kbd>+<kbd>1</kbd>.
  mistake: 'Excel часто сам ставит формуле формат ячейки, на которую она ссылается: <code>{f:=A2}</code> покажет дату. Это
    не ошибка формулы — поменяйте формат.'
  sheet:
    file: Номера_дат.xlsx
    name: Даты
    columns:
      A: 110
      B: 110
    cells:
      A1:
        v: Дата
        style: head
      B1:
        v: Номер
        style: head
      A5:
        v: Номер
        style: head
      B5:
        v: Дата
        style: head
      A2:
        v: '1991-12-16'
        fmt: date
      A3:
        v: '2006-01-25'
        fmt: date
      A4:
        v: '1950-02-14'
        fmt: date
      A6: 4526
      A7: 45000
      A8: 46000
  solution:
    cells:
      B2:
        f: =A2
      B6:
        f: =A6
        fmt: date
    fill:
    - source: B2
      to: B2:B4
    - source: B6
      to: B6:B8
  expect:
    B2: 33588
    B3: 38742
    B4: 18308
    B6: 4526
    B7: 45000
    B8: 46000
- id: deadline-74
  number: 2
  title: Срок через 74 рабочих дня
  task: Тендерная комиссия ответит через 74 рабочих дня. Найдите дату ответа без учёта праздников (<code>B2</code>) и с
    праздниками из <code>D2:D4</code> (<code>B3</code>).
  explain: <code>{f:=WORKDAY(B1,74)}</code> и <code>{f:=WORKDAY(B1,74,D2:D4)}</code>. На работе вместо <code>B1</code> можно
    поставить <code>{f:=TODAY()}</code> — срок будет считаться от сегодняшней даты.
  mistake: Посчитать <code>{f:=B1+74}</code> — это календарные дни, ответ выйдет на месяц раньше.
  sheet:
    file: Срок_ответа.xlsx
    name: Срок
    columns:
      A: 150
      B: 110
      C: 30
      D: 100
    cells:
      A1:
        v: Сегодня
        style: label
      B1:
        v: '2026-11-02'
        fmt: date
      A2:
        v: Через 74 раб. дня
        style: label
      A3:
        v: С праздниками
        style: label
      D1:
        v: Праздники
        style: head
      D2:
        v: '2026-12-16'
        fmt: date
      D3:
        v: '2027-01-01'
        fmt: date
      D4:
        v: '2027-01-07'
        fmt: date
  solution:
    cells:
      B2:
        f: =WORKDAY(B1,74)
        fmt: date
      B3:
        f: =WORKDAY(B1,74,D2:D4)
        fmt: date
  expect:
    B2: 46430
    B3: 46435
