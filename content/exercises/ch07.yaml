- id: weekend-tue-wed
  number: 11
  title: Выходные во вторник и среду
  task: Аквапарк открыт в субботу и воскресенье, а закрыт по вторникам и средам. Какой день будет 200-м рабочим днём после
    открытия? Найдите ответ кодом выходных (<code>B2</code>) и строкой (<code>B3</code>).
  explain: '<code>{f:=WORKDAY.INTL(B1,200,4)}</code> — код 4: вторник и среда. Строкой: <code>{f:=WORKDAY.INTL(B1,200,"0110000")}</code>
    — семь знаков с понедельника, 1 — выходной.'
  mistake: '{fn:WORKDAY} без .МЕЖД считает выходными субботу и воскресенье — ответ будет другим.'
  sheet:
    file: Аквапарк.xlsx
    name: График
    columns:
      A: 180
      B: 110
    cells:
      A1:
        v: Открытие
        style: label
      B1:
        v: '2027-05-03'
        fmt: date
      A2:
        v: 200-й рабочий день
        style: label
      A3:
        v: То же строкой
        style: label
  solution:
    cells:
      B2:
        f: =WORKDAY.INTL(B1,200,4)
        fmt: date
      B3:
        f: =WORKDAY.INTL(B1,200,"0110000")
        fmt: date
  expect:
    B2: 46790
    B3: 46790
- id: weekend-fri-sat
  number: 12
  title: 'Рабочие дни партнёра: выходные пятница и суббота'
  task: Партнёр из Саудовской Аравии работает с воскресенья по четверг; выходные — пятница и суббота. Сколько у него рабочих
    дней с 10.01.2026 по 31.05.2027, если не считать праздники из столбца D (для примера взяты только праздники с постоянной
    датой)?
  explain: '<code>{f:=NETWORKDAYS.INTL(B1,B2,7,D2:D4)}</code>: код 7 — пятница и суббота, четвёртый аргумент — праздники.'
