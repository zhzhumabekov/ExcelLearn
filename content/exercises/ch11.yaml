- id: bus-fuel
  number: 3
  title: Сколько топлива останется у вахтового автобуса
  task: 'Автобус выезжает из Алматы с <b>400 л</b> топлива и проходит четыре участка (столбец B). Чем тяжелее бак, тем больше
    расход: на 100 км уходит <b>25 + 0,02 × средний запас на участке</b>, а средний запас — (в начале + в конце) / 2. Сколько
    топлива останется по возвращении в Алматы (<code>F5</code>)?'
  explain: 'Средний запас: <code>{f:=(C2+F2)/2}</code>, расход: <code>{f:=25+0.02*D2}</code>, в конце: <code>{f:=C2-B2/100*E2}</code>,
    в начале следующего участка: <code>{f:=F2}</code> в <code>C3</code>. Петля в каждой строке. Файл → Параметры → Формулы
    → «Включить итеративные вычисления».'
  mistake: 'Взять средний запас = запас в начале: расход немного завысится, ответ будет неточным.'
  sheet:
    file: Автобус.xlsx
    name: Маршрут
    columns:
      A: 210
      B: 60
      C: 150
      D: 140
      E: 140
      F: 150
    rows: 6
    cells:
      A1:
        v: Участок
        style: head
      B1:
        v: Км
        style: head
      C1:
        v: В баке в начале, л
        style: head
      D1:
        v: Средний запас, л
        style: head
      E1:
        v: Расход на 100 км
        style: head
      F1:
        v: В баке в конце, л
        style: head
      C2: 400
      A2: Алматы — Конаев
      B2: 70
      A3: Конаев — Талдыкорган
      B3: 200
      A4: Талдыкорган — Уштобе
      B4: 120
      A5: Уштобе — Алматы
      B5: 290
  solution:
    cells:
      D2:
        f: =(C2+F2)/2
      E2:
        f: =25+0.02*D2
      F2:
        f: =C2-B2/100*E2
      C3:
        f: =F2
    iterative: true
    fill:
    - source: D2
      to: D2:D5
    - source: E2
      to: E2:E5
    - source: F2
      to: F2:F5
    - source: C3
      to: C3:C5
  expect:
    D2: 388.5303
    E2: 32.7706
    F2: 377.0606
    D3: 345.1574
    E3: 31.9031
    F3: 313.2543
    C3: 377.0606
    D4: 294.7177
    E4: 30.8944
    F4: 276.1811
    C4: 313.2543
    D5: 233.1691
    E5: 29.6634
    F5: 190.1572
    C5: 276.1811
- id: reciprocal-costs
  number: 4
  title: Взаимное распределение затрат
  task: Бухгалтерия тратит <b>6 000 000 ₸</b>, консалтинг — <b>1 160 000 ₸</b>. 20% работы бухгалтерии — для консалтинга,
    30% — для отдела 1, 50% — для отдела 2. 10% работы консалтинга — для бухгалтерии, 80% — для отдела 1, 10% — для отдела
    2. Найдите полные затраты подразделений с учётом услуг друг другу (<code>C2:C3</code>) и сколько затрат получит каждый
    отдел (<code>B5:B6</code>).
  explain: 'Затраты бухгалтерии = свои + 10% полных затрат консалтинга: <code>{f:=B2+10%*C3}</code>; консалтинга = свои
    + 20% полных бухгалтерии: <code>{f:=B3+20%*C2}</code>. Петля. Отдел 1: <code>{f:=D2*C2+D3*C3}</code>, отдел 2 — так
    же со столбцом E. Файл → Параметры → Формулы → «Включить итеративные вычисления».'
  mistake: 'Распределить только свои затраты, без услуг друг другу: часть затрат «потеряется» между вспомогательными подразделениями.'
  sheet:
    file: Распределение_затрат.xlsx
    name: Затраты
    columns:
      A: 190
      B: 140
      C: 150
      D: 120
      E: 120
    rows: 7
    cells:
      A1:
        v: Подразделение
        style: head
      B1:
        v: Свои затраты
        style: head
      C1:
        v: Всего с услугами
        style: head
      D1:
        v: Доля в отдел 1
        style: head
      E1:
        v: Доля в отдел 2
        style: head
      A2: Бухгалтерия
      B2:
        v: 6000000
        fmt: kzt
      C2:
        fmt: kzt
      D2:
        v: 0.3
        fmt: percent
      E2:
        v: 0.5
        fmt: percent
      A3: Консалтинг
      B3:
        v: 1160000
        fmt: kzt
      C3:
        fmt: kzt
      D3:
        v: 0.8
        fmt: percent
      E3:
        v: 0.1
        fmt: percent
      A5: Отдел 1 получает
      B5:
        fmt: kzt
      A6: Отдел 2 получает
      B6:
        fmt: kzt
  solution:
    cells:
      C2:
        f: =B2+10%*C3
        fmt: kzt
      C3:
        f: =B3+20%*C2
        fmt: kzt
      B5:
        f: =D2*C2+D3*C3
        fmt: kzt
      B6:
        f: =E2*C2+E3*C3
        fmt: kzt
    iterative: true
  expect:
    C2: 6240816.3265
    C3: 2408163.2653
    B5: 3798775.5102
    B6: 3361224.4898
- id: year-balance
  number: 5
  title: Остаток на конец года с процентами на средний баланс
  task: 'В начале года на счёте <b>200 000 ₸</b>, за год доложили <b>100 000 ₸</b>. Банк начисляет 10% годовых — от среднего
    остатка: (на начало + на конец) / 2. Сколько будет на конец года (<code>B4</code>)?'
  explain: 'Остаток на конец = начало + взносы + 10% × (начало + конец) / 2: <code>{f:=B1+B2+10%*(B1+B4)/2}</code> — ячейка
    ссылается сама на себя. Файл → Параметры → Формулы → «Включить итеративные вычисления».'
  mistake: 'Начислить 10% только на 200 000: тогда проценты не учитывают докладку и рост остатка.'
  sheet:
    file: Остаток.xlsx
    name: Счёт
    columns:
      A: 230
      B: 150
    rows: 5
    cells:
      A1:
        v: На начало года
        style: label
      B1:
        v: 200000
        fmt: kzt
      A2:
        v: Доложили за год
        style: label
      B2:
        v: 100000
        fmt: kzt
      A4: На конец года
      B4:
        fmt: kzt
  solution:
    cells:
      B4:
        f: =B1+B2+10%*(B1+B4)/2
        fmt: kzt
    iterative: true
  expect:
    B4: 326315.7895
