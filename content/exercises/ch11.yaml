# Глава 11 (циклические ссылки). Собрано генератором; ответы expect посчитаны независимо.
chapter: ch11
exercises:
- id: bonus-fund-tax
  number: 1
  title: Бонус, отчисление в фонд и налог
  task: Прибыль ТОО до бонусов и налогов — <b>60 000 000 ₸</b>. Сотрудникам платят бонус — 5% от <b>чистой</b> прибыли.
    Отчисление в фонд развития — 5% от прибыли после бонусов. КПН — 20% от прибыли после бонусов и отчисления. Посчитайте
    бонус (<code>B2</code>), отчисление (<code>B3</code>), КПН (<code>B4</code>) и чистую прибыль (<code>B5</code>).
  explain: 'Бонус зависит от чистой прибыли, а она — от бонуса: это петля. <code>{f:=5%*B5}</code>, <code>{f:=5%*(B1-B2)}</code>,
    <code>{f:=20%*(B1-B2-B3)}</code>, <code>{f:=B1-B2-B3-B4}</code>. Файл → Параметры → Формулы → «Включить итеративные
    вычисления».'
  mistake: 'Считать бонус от прибыли до налогов: так проще, но условие — 5% от чистой прибыли.'
  sheet:
    file: Бонус_и_налоги.xlsx
    name: Расчёт
    columns:
      A: 230
      B: 160
    rows: 6
    cells:
      A1:
        v: Прибыль до бонусов
        style: label
      B1:
        v: 60000000
        fmt: kzt
      A2: Бонус
      B2:
        fmt: kzt
      A3: Отчисление в фонд
      B3:
        fmt: kzt
      A4: КПН
      B4:
        fmt: kzt
      A5: Чистая прибыль
      B5:
        fmt: kzt
  solution:
    cells:
      B2:
        f: =5%*B5
        fmt: kzt
      B3:
        f: =5%*(B1-B2)
        fmt: kzt
      B4:
        f: =20%*(B1-B2-B3)
        fmt: kzt
      B5:
        f: =B1-B2-B3-B4
        fmt: kzt
    iterative: true
  expect:
    B2: 2196531.7919
    B3: 2890173.4104
    B4: 10982658.9595
    B5: 43930635.8382
