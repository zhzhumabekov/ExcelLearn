    (на начало + на конец) / 2. Заполните таблицу на 12 месяцев: проценты (<code>C</code>), остаток на конец (<code>D</code>),
    остаток на начало следующего месяца (<code>B</code>).'
  explain: 'Проценты зависят от остатка на конец, а он — от процентов: петля в каждой строке. <code>{f:=2%*(B2+D2)/2}</code>,
    <code>{f:=B2+C2}</code>, со 2-го месяца <code>{f:=D2}</code> в <code>B3</code>; протяните вниз. Файл → Параметры → Формулы
