- id: late
  number: 5
  title: Кто опоздал
  task: Рабочий день начинается в 9:00. Отметьте опоздавших (<code>C2:C5</code>) и посчитайте, на сколько минут они опоздали
    (<code>D2:D5</code>).
  explain: '<code>{f:=IF(B2>TIME(9,0,0),"опоздал","вовремя")}</code>; минуты опоздания — разница × 1 440: <code>{f:=IF(B2>TIME(9,0,0),(B2-TIME(9,0,0))*1440,0)}</code>.'
  mistake: 'Сравнивать с числом 9: время 9:07 — это 0,38 суток, оно всегда меньше 9.'
  sheet:
    file: Опоздания.xlsx
    name: Табель
    columns:
      A: 130
      B: 90
      C: 110
      D: 130
    rows: 6
    cells:
      A1:
        v: Сотрудник
        style: head
      B1:
        v: Пришёл
        style: head
      C1:
        v: Отметка
        style: head
      D1:
        v: Опоздал, мин
        style: head
      A2: Асель
      B2:
        v: 0.369444444
        fmt: time
      A3: Данияр
      B3:
        v: 0.379861111
        fmt: time
      A4: Олжас
      B4:
        v: 0.375
        fmt: time
      A5: Марина
      B5:
        v: 0.396527778
        fmt: time
  solution:
    cells:
      C2:
        f: =IF(B2>TIME(9,0,0),"опоздал","вовремя")
      D2:
        f: =IF(B2>TIME(9,0,0),(B2-TIME(9,0,0))*1440,0)
    fill:
    - source: C2
      to: C2:C5
    - source: D2
      to: D2:D5
  expect:
    C2: вовремя
    D2: 0
    C3: опоздал
    D3: 7
    C4: вовремя
    D4: 0
    C5: опоздал
    D5: 31
