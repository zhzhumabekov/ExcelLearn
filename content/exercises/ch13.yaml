# Глава 13 (время). Собрано генератором; ответы expect посчитаны независимо.
chapter: ch13
exercises:
- id: plus-18-hours
  number: 1
  title: Через 18 часов
  task: Груз отправили из Алматы 13.10.2026 в 14:12 (<code>B1</code>), в пути он будет <b>18 часов</b>. Когда он прибудет
    (<code>B2</code>)?
  explain: '18 часов — это 18/24 суток: <code>{f:=B1+18/24}</code>. То же даёт <code>{f:=B1+TIME(18,0,0)}</code>. Excel
    сам перейдёт на следующий день.'
  mistake: 'Прибавить 18: к дате прибавятся 18 суток, а не часов.'
  sheet:
    file: Через_18_часов.xlsx
    name: Груз
    columns:
      A: 160
      B: 170
    rows: 3
    cells:
      A1:
        v: Отправлен
        style: label
      B1:
        v: 46308.591666667
        fmt: datetime
      A2:
        v: Прибудет
        style: label
      B2:
        fmt: datetime
  solution:
    cells:
      B2:
        f: =B1+18/24
        fmt: datetime
  expect:
    B2: 46309.341666667
- id: marathon
  number: 2
  title: Алматы марафон
  task: Четыре бегуна пробежали Алматы марафон. Найдите среднее время (<code>B7</code>), на сколько Алибек опередил Жанну
    (<code>B8</code>) и сколько минут (<code>C2:C5</code>) и секунд (<code>D2:D5</code>) бежал каждый.
  explain: 'Время — доля суток, поэтому {fn:AVERAGE} и вычитание работают как с числами: <code>{f:=AVERAGE(B2:B5)}</code>,
    <code>{f:=B3-B2}</code>. В сутках 1 440 минут и 86 400 секунд: <code>{f:=B2*1440}</code>, <code>{f:=B2*86400}</code>.'
  mistake: 'Умножить на 60: получатся не минуты, а доля суток × 60 — бессмысленное число.'
  sheet:
    file: Марафон.xlsx
    name: Марафон
    columns:
      A: 220
      B: 110
      C: 100
      D: 100
    rows: 9
    cells:
      A1:
        v: Бегун
        style: head
      B1:
        v: Время
        style: head
      C1:
        v: Минут
        style: head
      D1:
        v: Секунд
        style: head
      A2: Алибек
      B2:
        v: 0.111979167
        fmt: timeSec
      C2:
        fmt: number
      D2: {}
      A3: Жанна
      B3:
        v: 0.128935185
        fmt: timeSec
      C3:
        fmt: number
      D3: {}
      A4: Сергей
      B4:
        v: 0.123634259
        fmt: timeSec
      C4:
        fmt: number
      D4: {}
      A5: Мадина
      B5:
        v: 0.140625
        fmt: timeSec
      C5:
        fmt: number
      D5: {}
      A7:
        v: Среднее время
        style: label
      B7:
        fmt: timeSec
      A8:
        v: Алибек опередил Жанну на
        style: label
      B8:
        fmt: timeSec
  solution:
    cells:
      B7:
        f: =AVERAGE(B2:B5)
        fmt: timeSec
      B8:
        f: =B3-B2
        fmt: timeSec
      C2:
        f: =B2*1440
        fmt: number
      D2:
        f: =B2*86400
    fill:
    - source: C2
      to: C2:C5
    - source: D2
      to: D2:D5
  expect:
    C2: 161.25
    D2: 9675
    C3: 185.6667
