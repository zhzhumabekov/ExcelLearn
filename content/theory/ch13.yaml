# Теория к главе. Собрано генератором gen_theory.py; значения на кадрах посчитаны независимо.
chapter: ch13
title: Время и функции времени
minutes: 6
intro: Как Excel хранит время (доля суток), как его вводить, вычитать и складывать, функции {fn:TIME}, {fn:TIMEVALUE}, {fn:HOUR},
  {fn:MINUTE}, {fn:SECOND}, {fn:NOW}, формат [ч]:мм:сс и автозаполнение рядов. В уроках — смены через полночь, табель курьера
  и расписание приёма врача.
sections:
- title: Время — доля суток
  text: '<p>Excel хранит время числом — долей суток от полуночи: 3:00 — 0,125, 12:00 — 0,5, 18:00 — 0,75. Дата со временем
    — номер дня плюс эта доля: 01.01.2026 6:00 = 46023,25. Время вводят через двоеточие (8:30, 20:30:15), дату и время —
    через пробел (13.10.2026 5:35); Excel сам ставит ячейке формат.</p><p>Поэтому со временем можно считать: разница двух
    времён — доля суток, × 24 — часы, × 1 440 — минуты, × 86 400 — секунды. Формат только меняет вид: 0,5 в формате времени
    — это 12:00.</p>'
  figure:
    id: time-fraction
    caption: 'Формат «Общий» показывает, что за временем стоит доля суток: 3:00 = 0,125'
    sheet:
      file: Доля_суток.xlsx
      name: Время
      columns:
        A: 130
        B: 150
      rows: 5
      cells:
        A1:
          v: Время
          style: head
        B1:
          v: Как число
          style: head
        A2:
          v: 0.125
          fmt: time
        A3:
          v: 0.5
          fmt: time
        A4:
          v: 0.75
          fmt: time
        B2:
          f: =A2
        B3:
          f: =A3
        B4:
          f: =A4
    actions:
    - dragSelect: B2:B4
    - keys:
      - Ctrl
      - '1'
    - dialogPick: Общий
    - dialogButton: OK
    - click: B2
    expect:
      B2: 0.125
      B3: 0.5
      B4: 0.75
- title: Функции времени
  text: '<p><code>{f:=TIME(15,10,30)}</code> собирает время из часов, минут и секунд — 15:10:30; больше суток она не даёт:
    {fn:TIME}(25; 10; 30) = 1:10:30. <code>{f:=TIMEVALUE("8:30")}</code> переводит текст во время. {fn:HOUR}, {fn:MINUTE},
    {fn:SECOND} разбирают время на части.</p><p><code>{f:=NOW()}</code> — текущие дата и время, пересчитываются при каждом
    изменении книги; <code>{f:=NOW()-TODAY()}</code> — только время. <b>Ctrl+Shift+;</b> вписывает текущее время значением
    — оно не меняется.</p>'
- title: Часы больше суток
  text: '<p>Формат ч:мм показывает время суток и отбрасывает целые сутки: сумма 38:48 выглядит как 14:48. Для суммы часов
    нужен формат <b>[ч]:мм:сс</b> — в окне «Формат ячеек» категория «Время», тип 37:30:55.</p><p>Если смена переходит через
    полночь, а дата не записана, конец меньше начала: <code>{f:=IF(C2>B2,24*(C2-B2),24+24*(C2-B2))}</code> прибавляет сутки.</p>'
  figure:
    id: sum-hours
    caption: Сумма часов за неделю в формате [ч]:мм:сс — 38:48:00, а не 14:48
    sheet:
      file: Табель.xlsx
      name: Неделя
      columns:
        A: 140
        B: 150
      rows: 8
      cells:
        A1:
          v: День
          style: head
        B1:
          v: Отработано
          style: head
        A7:
          v: За неделю
          style: label
        A2: Пн
        B2:
          v: 0.322916667
          fmt: time
        A3: Вт
        B3:
          v: 0.340277778
          fmt: time
        A4: Ср
        B4:
          v: 0.3125
          fmt: time
        A5: Чт
        B5:
          v: 0.336805556
          fmt: time
        A6: Пт
        B6:
          v: 0.304166667
          fmt: time
        B7:
          fmt: time
    actions:
    - click: B7
    - type: =SUM(B2:B6)
    - keys:
      - Enter
    - click: B7
    - keys:
      - Ctrl
      - '1'
    - dialogPick: Время
    - dialogPick: '37:30:55'
    - dialogButton: OK
    expect:
      B7: 1.616666667
- title: Ряды времени
  text: '<p>Наберите 9:00 и 9:20 в двух ячейках, выделите их и протяните маркер заполнения: Excel продолжит ряд с тем же
    шагом — 9:40, 10:00… Так же продолжаются даты, числа, дни недели и месяцы.</p>'
  figure:
    id: series
    caption: 'Автозаполнение: по двум первым значениям Excel продолжает ряд с шагом 20 минут и дни недели'
    sheet:
      file: Расписание.xlsx
      name: Приём
      columns:
        A: 110
        B: 150
      rows: 12
      cells:
        A1:
          v: Приём
          style: head
        B1:
          v: День
          style: head
    actions:
    - click: A2
    - type: '9:00'
    - keys:
      - Enter
    - click: A3
    - type: '9:20'
    - keys:
      - Enter
    - fillSeries: A2:A11
    - click: B2
    - type: Понедельник
    - keys:
      - Enter
    - click: B3
    - type: Вторник
    - keys:
      - Enter
    - fillSeries: B2:B8
    expect:
      A11: 0.5
      B8: Воскресенье
- title: Частые ошибки
  text: '<ul><li>Ждать от суммы часов больше 24 в формате ч:мм: нужен [ч]:мм:сс.</li><li>Умножать время на 60, чтобы получить
    минуты: время — доля суток, минут в сутках 1 440.</li><li>Пугаться решёток #### в ячейке времени: это отрицательное
    время, в формате Числовой видно число.</li><li>Прибавлять к дате 18, чтобы получить «через 18 часов»: это 18 суток,
    нужно 18/24.</li></ul>'
terms:
- term: Время в Excel
  meaning: 'доля суток от полуночи: 6:00 = 0,25.'
- term: ВРЕМЯ
  meaning: время из часов, минут и секунд; не больше суток.
- term: ВРЕМЗНАЧ
  meaning: переводит текст «8:30» во время.
- term: ЧАС, МИНУТЫ, СЕКУНДЫ
  meaning: часть времени целым числом.
- term: ТДАТА
  meaning: текущие дата и время, пересчитываются.
- term: '[ч]:мм:сс'
  meaning: формат, в котором часы не обнуляются после 24.
questions:
- q: Как перевести разницу времени в часы?
  a: 'Умножить на 24: (20:30 − 8:30) × 24 = 12. Ячейке — формат Числовой.'
- q: Почему сумма часов за неделю показывает 14:48?
  a: Формат ч:мм отбрасывает целые сутки. Поставьте формат [ч]:мм:сс (Время → 37:30:55).
- q: Как вставить время, которое не будет меняться?
  a: Ctrl+Shift+; — текущее время значением; {fn:NOW} пересчитывается.
