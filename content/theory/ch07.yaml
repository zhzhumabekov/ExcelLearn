# Теория к главе. Собрано генератором gen_theory.py; значения на кадрах посчитаны независимо.
chapter: ch07
title: 'Даты в Excel: номер дня, рабочие дни, сроки'
minutes: 7
intro: Как Excel хранит даты, как их вводить и показывать, как достать из даты год и день недели и как считать рабочие дни
  и сроки. В уроках главы всё это разобрано на реестрах, договорах и табелях.
sections:
- title: Дата — это номер дня
  text: '<p>Excel хранит дату как целое число — <b>номер дня</b>. 01.01.1900 — день № 1, 02.01.1900 — № 2, а 12.10.2026
    — № 46307. Дату в ячейке показывает <b>формат</b>: «Дата» выводит номер как дату, «Общий» — как число.</p><p>Поэтому
    выгрузка из банка или 1С иногда приходит с числами вместо дат. Это не ошибка. Выделите ячейки, щёлкните правой кнопкой
    → <b>Формат ячеек…</b> (или <kbd>Ctrl</kbd>+<kbd>1</kbd>) → <b>Дата</b> → тип → OK. Значения при этом не меняются.</p><p
    class="note">Excel считает 1900 год високосным и знает несуществующее 29.02.1900 — день № 60. Эту ошибку сохранили ради
    совместимости с Lotus 1-2-3. На даты после марта 1900 года она не влияет.</p>'
  figure:
    id: format-date
    caption: 'Формат ячеек → Дата: числа 46307 и 46314 станут датами. «Образец» показывает, как будет выглядеть ячейка'
    sheet:
      file: Выгрузка_банка.xlsx
      name: Платежи
      columns:
        A: 170
      rows: 12
      cells:
        A1:
          v: Дата из выгрузки
          style: head
        A2: 46307
        A3: 46314
    actions:
    - select: A2:A3
    - keys:
      - Ctrl
      - '1'
    - dialogPick: Дата
    - dialogPick: '*14 марта 2012 г.'
    expect:
      A2: 46307
- title: Как вводить даты
  text: '<p>Excel узнаёт дату при вводе и сам ставит ячейке формат «Дата». Русский Excel понимает «04.01.2003», «4.1.03»,
    «4 янв 2003». Если год набран двумя цифрами, век Excel выбирает сам: 00–29 — XXI век, 30–99 — XX век. Надёжнее набирать
    год четырьмя цифрами.</p><p>Если дата прижата к левому краю ячейки, это <b>текст</b>, и считать с ним нельзя. Текст
    в дату превращает <code>{f:=DATEVALUE(B7)}</code>.</p>'
  figure:
    id: typed-dates
    caption: 'Что набрали и что понял Excel: даты прижаты вправо, текст — влево; «29» — 2029 год, «30» — 1930'
    sheet:
      file: Ввод_дат.xlsx
      name: Ввод
      columns:
        A: 180
        B: 130
      rows: 7
      cells:
        A1:
          v: Что набрали
          style: head
        B1:
          v: Что в ячейке
          style: head
        A2: 04.01.2003
        A3: 4.1.03
        A4: 4 янв 2003
        A5: 1.1.29
        A6: 1.1.30
        A7: 15.01.2026 (текстом)
        B7: 15.01.2026
    actions:
    - click: B2
    - type: 04.01.2003
    - keys:
      - Enter
    - click: B3
    - type: 4.1.03
    - keys:
      - Enter
    - click: B4
    - type: 4 янв 2003
    - keys:
      - Enter
    - click: B5
    - type: 1.1.29
    - keys:
      - Enter
    - click: B6
    - type: 1.1.30
    - keys:
      - Enter
    expect:
      B2: 37625
      B3: 37625
      B4: 37625
      B5: 47119
      B6: 10959
- title: Сегодняшняя дата
  text: <ul><li><code>{f:=TODAY()}</code> — дата на сегодня. Excel пересчитывает её при каждом открытии файла. Подходит
    для отчётов «на сегодня», сроков и возраста.</li><li><kbd>Ctrl</kbd>+<kbd>;</kbd> вписывает сегодняшнюю дату как обычное
    значение, и она уже не изменится. Так отмечают, когда создан файл или принят документ.</li></ul>
- title: Части даты и сборка
  text: '<p>{fn:YEAR}, {fn:MONTH}, {fn:DAY} достают из даты год, номер месяца и число. <code>{f:=WEEKDAY(A2,2)}</code> —
    день недели: понедельник — 1, воскресенье — 7. Без второго аргумента неделя начинается с воскресенья. {fn:DATE}(год;
    месяц; день) собирает дату обратно и переносит «лишние» месяцы и дни: <code>{f:=DATE(2026,13,1)}</code> — 01.01.2027,
    а <code>{f:=DATE(2026,3,0)}</code> — последний день февраля.</p>'
  figure:
    id: date-parts
    caption: '22.03.2026 — воскресенье: {fn:WEEKDAY} с типом 2 дала 7, {fn:DATE} собрала дату обратно'
    sheet:
      file: Части_даты.xlsx
      name: Даты
      columns:
        A: 100
        B: 60
        C: 70
        D: 60
        E: 110
        F: 100
      rows: 3
      cells:
        A1:
          v: Дата
          style: head
        B1:
          v: Год
          style: head
        C1:
          v: Месяц
          style: head
        D1:
          v: День
          style: head
        E1:
          v: День недели
          style: head
        F1:
          v: Из частей
          style: head
        A2:
          v: '2026-03-22'
          fmt: date
        F2:
          fmt: date
    actions:
    - click: B2
    - type: =YEAR(A2)
    - keys:
      - Enter
    - click: C2
    - type: =MONTH(A2)
    - keys:
      - Enter
    - click: D2
    - type: =DAY(A2)
    - keys:
      - Enter
    - click: E2
    - type: =WEEKDAY(A2,2)
    - keys:
      - Enter
    - click: F2
    - type: =DATE(B2,C2,D2)
    - keys:
      - Enter
    - click: F2
    - showRefs: F2
    expect:
      B2: 2026
      C2: 3
      D2: 22
      E2: 7
      F2: 46103
- title: Рабочие дни и праздники
  text: '<p><code>{f:=WORKDAY(начало,дней,праздники)}</code> — дата через N рабочих дней. <code>{f:=NETWORKDAYS(начало,конец,праздники)}</code>
    — сколько рабочих дней в периоде, включая обе даты. Праздники — необязательный диапазон с датами. Праздник в субботу
    или воскресенье на ответ не влияет. Если выходной переносится, впишите в список перенесённый день.</p><p>Если выходные
    — не суббота и воскресенье, нужны {fn:WORKDAY.INTL} и {fn:NETWORKDAYS.INTL}. Их третий аргумент — код выходных или строка
    из семи знаков, начиная с понедельника: «0000011» — суббота и воскресенье, «0000001» — только воскресенье.</p><table><tr><th>Код</th><th>Выходные</th><th>Код</th><th>Выходные</th></tr><tr><td>1
    (или пропущен)</td><td>суббота, воскресенье</td><td>11</td><td>только воскресенье</td></tr><tr><td>2</td><td>воскресенье,
    понедельник</td><td>12</td><td>только понедельник</td></tr><tr><td>3</td><td>понедельник, вторник</td><td>13</td><td>только
    вторник</td></tr><tr><td>4</td><td>вторник, среда</td><td>14</td><td>только среда</td></tr><tr><td>5</td><td>среда,
    четверг</td><td>15</td><td>только четверг</td></tr><tr><td>6</td><td>четверг, пятница</td><td>16</td><td>только пятница</td></tr><tr><td>7</td><td>пятница,
    суббота</td><td>17</td><td>только суббота</td></tr></table>'
  figure:
    id: workdays
    caption: 'Декабрь 2026 года, праздник 16 декабря: дата через 15 рабочих дней после 1 декабря и число рабочих дней в
      месяце'
    sheet:
      file: Рабочие_дни.xlsx
      name: Декабрь
      columns:
        A: 170
        B: 110
      rows: 7
      cells:
        A1:
          v: Начало
          style: head
        B1:
          v: '2026-12-01'
          fmt: date
        A2:
          v: Конец
          style: head
        B2:
          v: '2026-12-31'
          fmt: date
        A3:
          v: Праздник
          style: head
        B3:
          v: '2026-12-16'
          fmt: date
        A5: Через 15 раб. дней
        B5:
          fmt: date
        A6: Рабочих дней
    actions:
    - click: B5
    - type: =WORKDAY(B1,15,B3)
    - keys:
      - Enter
    - click: B6
    - type: =NETWORKDAYS(B1,B2,B3)
    - keys:
      - Enter
    - click: B6
    - showRefs: B6
    expect:
      B5: 46379
      B6: 22
- title: 'Сколько прошло: РАЗНДАТ'
  text: '<p><code>{f:=DATEDIF(начало,конец,"m")}</code> — сколько полных месяцев между датами. "y" — полные годы, "d" —
    дни, "ym" — месяцы сверх полных лет. Функции нет в подсказках и в мастере функций Excel, но она работает: набирайте
    имя целиком. Если начало позже конца, будет <code>#ЧИСЛО!</code>.</p>'
  figure:
    id: datedif
    caption: Машина простояла 1 полный год, 17 полных месяцев, 542 дня
    sheet:
      file: Стоянка.xlsx
      name: Стоянка
      columns:
        A: 150
        B: 110
      rows: 6
      cells:
        A1:
          v: Поступил
          style: head
        B1:
          v: '2024-10-15'
          fmt: date
        A2:
          v: Продан
          style: head
        B2:
          v: '2026-04-10'
          fmt: date
        A3: Лет ("y")
        A4: Месяцев ("m")
        A5: Дней ("d")
    actions:
    - click: B3
    - type: =DATEDIF(B1,B2,"y")
    - keys:
      - Enter
    - click: B4
    - type: =DATEDIF(B1,B2,"m")
    - keys:
      - Enter
    - click: B5
    - type: =DATEDIF(B1,B2,"d")
    - keys:
      - Enter
    - click: B4
    - showRefs: B4
    expect:
      B3: 1
      B4: 17
      B5: 542
- title: Ловушки с форматом
  text: '<ul><li>Разность дат показана датой («08.01.1900» вместо 8) — у ячейки формат «Дата». Поставьте «Общий».</li><li>Решётки
    ##### в ячейке с датой: число отрицательное (дата раньше начала отсчёта) или столбец слишком узкий.</li><li>Дата прижата
    влево — это текст. В дату его превратят {fn:DATEVALUE} или «Текст по столбцам».</li></ul>'
terms:
- term: Номер даты
  meaning: целое число дней, считая 01.01.1900 днём № 1; так Excel хранит дату.
- term: Формат «Дата» / «Общий»
  meaning: показывают одно и то же значение как дату или как число.
- term: '{fn:TODAY}'
  meaning: сегодняшняя дата, пересчитывается при открытии; <kbd>Ctrl</kbd>+<kbd>;</kbd> — неизменная.
- term: '{fn:YEAR}, {fn:MONTH}, {fn:DAY}, {fn:WEEKDAY}'
  meaning: год, месяц, число и день недели из даты.
- term: '{fn:DATE}'
  meaning: дата из года, месяца и дня; день 0 — последний день прошлого месяца.
- term: '{fn:WORKDAY} / {fn:NETWORKDAYS}'
  meaning: дата через N рабочих дней / число рабочих дней в периоде.
- term: '{fn:WORKDAY.INTL}'
  meaning: 'то же со своими выходными: код 1–7, 11–17 или строка «0000011».'
- term: '{fn:DATEDIF}'
  meaning: полные годы, месяцы или дни между датами; нет в подсказках Excel.
questions:
- q: В выгрузке вместо даты — 46307. Что сделать?
  a: 'Поставить ячейке формат «Дата» (правая кнопка → Формат ячеек… или <kbd>Ctrl</kbd>+<kbd>1</kbd>): 46307 — это 12.10.2026.'
- q: Чем <code>{f:=TODAY()}</code> отличается от <kbd>Ctrl</kbd>+<kbd>;</kbd>?
  a: '{fn:TODAY} каждый день показывает новую дату. <kbd>Ctrl</kbd>+<kbd>;</kbd> вписывает дату один раз, и она не меняется.'
- q: Сколько рабочих дней даст {fn:NETWORKDAYS} с понедельника по пятницу одной недели?
  a: '5: функция считает и первый, и последний день.'
- q: Магазин закрыт только в воскресенье. Как найти дату через 30 рабочих дней?
  a: <code>{f:=WORKDAY.INTL(A2,30,11)}</code> или <code>{f:=WORKDAY.INTL(A2,30,"0000001")}</code>.
- q: Как найти последний день месяца для даты в <code>A2</code>?
  a: <code>{f:=DATE(YEAR(A2),MONTH(A2)+1,0)}</code> или <code>{f:=EOMONTH(A2,0)}</code>.
