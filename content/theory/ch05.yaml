          fmt: kzt
        B3:
          v: 0.03
          fmt: percent
        A4:
          v: 100000
          fmt: kzt
        B4:
          v: 0.05
          fmt: percent
        A5:
          v: 250000
          fmt: kzt
        B5:
          v: 0.08
          fmt: percent
        D1:
          v: Заказ, ₸
          style: head
        E1:
