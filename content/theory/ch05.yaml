- title: 'Кто лучший: МАКС + ПОИСКПОЗ'
  text: <p>Ещё один частый вопрос — не «сколько», а «кто». Сначала {fn:MAX} находит наибольшую зарплату или продажи, потом
    {fn:MATCH} — её место в столбце, и {fn:INDEX} берёт имя из соседнего столбца. Вместо {fn:MAX} можно взять {fn:LARGE}
    — «пятое по величине» — или {fn:SMALL}. Это урок 5.3.</p>
terms:
- term: '{fn:MATCH}'
  meaning: номер (позиция) значения в строке или столбце.
- term: Тип 0
  meaning: точное совпадение, список в любом порядке; можно <code>*</code> и <code>?</code>.
- term: Тип 1
  meaning: наибольшее не больше искомого; список по возрастанию.
- term: Тип −1
  meaning: наименьшее не меньше искомого; список по убыванию.
- term: '{fn:INDEX} + {fn:MATCH}'
  meaning: 'поиск по названию в любом столбце и по двум условиям: строка × столбец.'
questions:
- q: Что вернёт {fn:MATCH} с типом 0 при поиске «Рис» в <code>A2:A7</code>, если «Рис» стоит в <code>A6</code>?
  a: '5: «Рис» — пятый в диапазоне A2:A7.'
- q: 'Список сумм отсортирован по возрастанию: 0, 50 000, 100 000. Какой тип нужен, чтобы найти ступень для заказа на 70
    000, и что вернёт функция?'
  a: Тип 1; вернёт 2 — ступень «от 50 000».
- q: Почему {fn:INDEX} + {fn:MATCH} не ломается при вставке нового столбца, а {fn:VLOOKUP} может?
  a: В {fn:VLOOKUP} номер столбца вписан числом и после вставки указывает не туда. {fn:MATCH} ищет столбец заново при каждом
    пересчёте.
