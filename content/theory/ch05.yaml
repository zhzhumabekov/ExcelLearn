- title: ИНДЕКС + ПОИСКПОЗ
  text: '<p>Самая полезная связка главы. {fn:MATCH} находит номер строки по названию товара, второй {fn:MATCH} — номер столбца
    по месяцу, {fn:INDEX} берёт значение на пересечении:</p><p><code>{f:=INDEX(B2:E5,MATCH(B7,A2:A5,0),MATCH(B8,B1:E1,0))}</code></p><p>Чем
    это лучше {fn:VLOOKUP}:</p><ul><li>ищет в <b>любом</b> столбце, а не только в первом, и возвращает значения слева от
    него;</li><li>не ломается, если в таблицу вставили столбец: номер ищется, а не вписан числом;</li><li>ищет сразу по
    строке и по столбцу.</li></ul>'
  figure:
    id: two-way
    caption: 'Продажи чак-чака в марте: строка — по товару, столбец — по месяцу. Поменяйте товар или месяц в <code>B7:B8</code>,
      и формула найдёт новое число.'
