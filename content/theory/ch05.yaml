# Теория к главе. Собрано генератором gen_theory.py; значения на кадрах посчитаны независимо.
chapter: ch05
title: 'ПОИСКПОЗ: номер вместо значения'
minutes: 6
intro: Что возвращает {fn:MATCH}, чем отличаются типы 0, 1 и −1 и почему связка {fn:INDEX} + {fn:MATCH} — главный инструмент
  поиска в Excel.
sections:
- title: Место, а не значение
  text: <p><code>{fn:MATCH}</code> отвечает на вопрос «на каком месте?». Она ищет значение в строке или столбце и возвращает
    его <b>номер по порядку</b>, а не само значение.</p><p>Сам по себе номер редко нужен. Но именно номер ждёт {fn:INDEX}
    из главы 4 — и вместе они находят что угодно по названию.</p>
  figure:
    id: exact
    caption: '{f:=MATCH(C2,A2:A7,0)} = 4: «Мука» — четвёртая в списке. Номер считается внутри диапазона, не по строкам листа.'
    sheet:
      file: Товары.xlsx
      name: Товары
      columns:
        A: 120
        B: 30
        C: 100
        D: 90
      rows: 7
      cells:
        A1:
          v: Товар
          style: head
        A2: Чай
        A3: Кофе
        A4: Сахар
        A5: Мука
        A6: Рис
        A7: Масло
        C1:
          v: Ищем
          style: head
        D1:
          v: Место
          style: head
        C2: Мука
    actions:
    - click: D2
    - type: =MATCH(C2,A2:A7,0)
    - keys:
      - Enter
    - click: D2
    - showRefs: D2
    expect:
      D2: 4
- title: 'Тип сопоставления: 0, 1, −1'
  text: '<p><code>{fn:MATCH}(что_ищем; где_ищем; тип)</code> — третий аргумент решает, как искать:</p><table><tr><th>Тип</th><th>Что
    ищет</th><th>Требование к списку</th></tr><tr><td><b>0</b></td><td>точное совпадение</td><td>любой порядок</td></tr><tr><td><b>1</b>
    (или пусто)</td><td>наибольшее значение, не больше искомого</td><td>по возрастанию</td></tr><tr><td><b>−1</b></td><td>наименьшее
    значение, не меньше искомого</td><td>по убыванию</td></tr></table><p>Тип 0 — для названий, кодов и фамилий. Тип 1 —
    для шкал (как {fn:VLOOKUP} с {fn:TRUE}): скидка от суммы заказа, срок окупаемости. С типом 0 работают подстановочные
    знаки: <code>*</code> — любые символы, <code>?</code> — один символ. Образец «Шым*» найдёт «Шымкент».</p><p class="note">Не
    найдено — ошибка <code>#Н/Д</code>, как у {fn:VLOOKUP}.</p>'
  figure:
    id: scale
    caption: 'Заказ на 120 000 ₸: тип 1 нашёл строку «от 100 000» — третью. {fn:INDEX} по этому номеру взял скидку 5%.'
    sheet:
