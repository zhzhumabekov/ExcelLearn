- title: Частые ошибки
  text: '<ul><li>Годовая ставка при месячных платежах: платёж или накопления выходят в разы больше.</li><li>Одинаковые знаки
    у кредита и платежа: ответ с неожиданным знаком или <code>#ЧИСЛО!</code>.</li><li>Забыть тип 1, когда платежи в начале
    периода.</li><li>Забыть последний аргумент {fn:CUMIPMT} и {fn:CUMPRINC} — в них тип обязательный.</li><li>Сравнивать
    предложения по платежу в месяц, а не по стоимости всех платежей сегодня.</li></ul>'
terms:
- term: Аннуитет
  meaning: одинаковые платежи через равные периоды.
- term: '{fn:PV} / {fn:FV}'
  meaning: стоимость платежей сегодня / сумма к концу срока.
- term: '{fn:PMT}'
  meaning: платёж по кредиту или взнос для накопления.
- term: '{fn:PPMT} / {fn:IPMT}'
  meaning: основной долг / проценты в платеже за период.
- term: '{fn:CUMPRINC} / {fn:CUMIPMT}'
  meaning: основной долг / проценты за несколько периодов.
- term: '{fn:RATE} / {fn:NPER}'
  meaning: ставка за период / число периодов.
- term: '{fn:SLN}, {fn:SYD}, {fn:DDB}'
  meaning: 'амортизация: линейная, по сумме чисел лет, двойным уменьшением остатка.'
questions:
- q: Кредит под 18% годовых, платежи ежемесячные. Какую ставку ставить в {fn:PMT}?
  a: 18%/12 = 1,5% в месяц, а число периодов — в месяцах.
- q: Почему <code>{f:=PMT(1.5%,10,1000000)}</code> отрицательный?
  a: Кредит получили (плюс), платежи отдаём — Excel показывает их с минусом. Поставьте минус перед функцией.
- q: 'Рассрочка: 5 платежей по 300 000 ₸ или 1 100 000 ₸ сразу, ставка 12%. Что выгоднее?'
  a: <code>{f:=PV(12%,5,-300000)}</code> = 1 081 433 ₸ — меньше 1 100 000, выгоднее рассрочка.
- q: Чем {fn:DDB} отличается от {fn:SLN}?
  a: '{fn:SLN} списывает поровну, {fn:DDB} — больше в первые годы, процентом от оставшейся стоимости.'
