# Теория к главе. Собрано генератором gen_theory.py; значения на кадрах посчитаны независимо.
chapter: ch10
title: Кредиты, накопления и амортизация
minutes: 8
intro: Аннуитеты и правило знаков, функции ПС, БС, ПЛТ, СТАВКА и КПЕР, график погашения кредита с ОСПЛТ и ПРПЛТ и три способа
  амортизации. В уроках главы всё это разобрано на рассрочке, накоплениях, кредитах ТОО и оборудовании пекарни.
sections:
- title: Аннуитет и правило знаков
  text: '<p><b>Аннуитет</b> — одинаковые платежи через равные периоды: кредит, рассрочка, аренда, взносы на счёт. Пять функций
    — {fn:PV}, {fn:FV}, {fn:PMT}, {fn:RATE} и {fn:NPER} — связывают одни и те же величины: ставку, число периодов, платёж,
    сумму сегодня и сумму в конце. Зная любые четыре, пятую находит своя функция.</p><p>Два правила: ставка и число периодов
    — в одних единицах (месячные платежи — ставка ÷ 12), и деньги, которые получаем, — со знаком плюс, отдаём — минус.</p><table><tr><th>Аргумент</th><th>Что
    это</th><th>Знак</th></tr><tr><td>ставка</td><td>процент <b>за период</b>: в месяц — годовая ÷ 12</td><td>—</td></tr><tr><td>кпер</td><td>число
    периодов: лет или месяцев — как у ставки</td><td>—</td></tr><tr><td>плт</td><td>одинаковый платёж каждый период</td><td>получаем
    «+», отдаём «−»</td></tr><tr><td>пс</td><td>сумма сегодня: кредит, вклад</td><td>получаем «+», отдаём «−»</td></tr><tr><td>бс</td><td>сумма
    после последнего платежа: доплата, цель накоплений</td><td>получаем «+», отдаём «−»</td></tr><tr><td>тип</td><td>0 или
    пропущен — в конце периода, 1 — в начале</td><td>—</td></tr></table>'
- title: 'ПС и БС: сегодня и в будущем'
  text: '<p><code>{f:=PV(ставка,кпер,плт,бс,тип)}</code> — сколько сегодня стоят будущие платежи. Так сравнивают рассрочку
    с оплатой сразу. <code>{f:=FV(ставка,кпер,плт,пс,тип)}</code> — сколько накопится к концу срока с учётом процентов.</p><p>Тип
    1 — платежи в начале периода: каждый работает на период дольше, поэтому ответ в (1 + ставка) раз больше.</p>'
  figure:
    id: pv
    caption: 'Пять платежей по 300 000 ₸ при ставке 12%: в конце года — 1 081 433 ₸, в начале — 1 211 205 ₸'
