- title: 'Кредит: платёж, проценты и основной долг'
  text: <p><code>{f:=-PMT(ставка,кпер,сумма)}</code> — платёж по кредиту (минус перед функцией делает его положительным).
    Каждый платёж состоит из процентов на остаток долга — <code>{f:=-IPMT(ставка,период,кпер,сумма)}</code> — и погашения
    основного долга — <code>{f:=-PPMT(…)}</code>. В начале срока платёж почти весь уходит на проценты, к концу — на долг.</p><p>{fn:CUMIPMT}
    и {fn:CUMPRINC} дают проценты и основной долг сразу за несколько периодов — например, за год для отчёта.</p>
  figure:
