- title: СТАВКА и КПЕР
  text: '<p><code>{f:=RATE(кпер,плт,пс)}</code> — ставка за период, если известны срок, платёж и сумма: так находят настоящую
    ставку рассрочки, где назван только платёж. <code>{f:=NPER(ставка,плт,пс)}</code> — сколько периодов нужно, чтобы погасить
    кредит; дробный ответ значит, что последний платёж будет неполным.</p><p>Если знаки платежа и суммы одинаковые или платёж
    меньше процентов, ответа нет — <code>#ЧИСЛО!</code>.</p>'
- title: Амортизация
  text: '<p>Оборудование дешевеет со временем, и его стоимость за вычетом остаточной списывают в расходы по годам. {fn:SLN}
    — поровну каждый год. {fn:SYD} — по сумме чисел лет: при сроке 5 лет в 1-й год 5/15, во 2-й 4/15 и так далее. {fn:DDB}
    — двойной процент от оставшейся стоимости (при сроке 5 лет — 40%), но не ниже остаточной стоимости.</p><p>Все три способа
    списывают одну и ту же сумму, разница — когда. Какой метод применять в учёте, определяет учётная политика компании.</p>'
  figure:
    id: depreciation
    caption: 'Печь за 15 000 тыс. ₸, остаток 3 000, 5 лет: три способа амортизации'
