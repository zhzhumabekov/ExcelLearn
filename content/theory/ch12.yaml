- title: И, ИЛИ и длинные таблицы
  text: '<p>{fn:AND}(условие1; условие2; …) верна, когда верны <b>все</b> условия, {fn:OR} — когда верно <b>хотя бы одно</b>.
    Обе ставят внутрь {fn:IF}: «покупаем, если акций нет <b>и</b> цена выше средней», «проигрыш, если выпало 2, 3 <b>или</b>
    12».</p><p>В длинной таблице заголовки уезжают при прокрутке. <b>Вид → Закрепить области</b> оставляет на месте строки
    выше и столбцы левее выделенной ячейки. А двойной щелчок по маркеру заполнения копирует формулу вниз до конца данных.</p>'
