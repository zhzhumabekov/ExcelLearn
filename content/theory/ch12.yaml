# Теория к главе. Собрано генератором gen_theory.py; значения на кадрах посчитаны независимо.
chapter: ch12
title: ЕСЛИ и другие логические функции
minutes: 7
intro: 'Как формула выбирает между вариантами: {fn:IF} и вложенные {fn:IF}, {fn:AND} и {fn:OR}, ошибки Excel и {fn:IFERROR},
  а также {fn:IFS}, {fn:CHOOSE} и {fn:SWITCH}. В уроках — оптовые цены, страховка портфеля, правило скользящего среднего
  и прогнозный баланс.'
sections:
- title: 'ЕСЛИ: выбор из двух'
  text: '<p><code>{f:=IF(условие,если_да,если_нет)}</code> проверяет условие и возвращает одно из двух значений. Условие
    — сравнение: <code>&gt;</code>, <code>&lt;</code>, <code>=</code>, <code>&gt;=</code>, <code>&lt;=</code>, <code>&lt;&gt;</code>
    (не равно). Текст в формуле пишут в кавычках: <code>{f:=IF(B2>100,"да","нет")}</code>.</p><p>Если вариантов больше двух,
    на место «если нет» ставят ещё одну {fn:IF} — <b>вложенные ЕСЛИ</b>. Проверки идут по очереди, первая верная решает.
    Так строят шкалы скидок: чем больше заказ, тем ниже цена.</p>'
  figure:
    id: nested-if
    caption: 'Вложенные ЕСЛИ: цена мешка цемента зависит от размера заказа'
