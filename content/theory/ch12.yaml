- title: Ошибки и ЕСЛИОШИБКА
  text: '<p>Код ошибки подсказывает причину: <code>#ДЕЛ/0!</code> — деление на ноль, <code>#Н/Д</code> — значение не найдено,
    <code>#ЗНАЧ!</code> — не тот тип данных, <code>#ИМЯ?</code> — неизвестное имя или функция, <code>#ЧИСЛО!</code> — недопустимое
    число, <code>#ССЫЛКА!</code> — удалены ячейки, на которые ссылалась формула.</p><p><code>{f:=IFERROR(формула,замена)}</code>
    показывает замену, если формула дала ошибку. <code>{f:=AGGREGATE(1,6,диапазон)}</code> — среднее, которое пропускает
    ошибки.</p>'
  figure:
    id: iferror
    caption: 'ЕСЛИОШИБКА: вместо #Н/Д для Тимура — «нет в штате»'
    sheet:
      file: Оклады.xlsx
      name: Оклады
      columns:
        A: 120
        B: 90
        C: 30
        D: 120
        E: 150
      rows: 5
      cells:
        A1:
          v: Сотрудник
          style: head
        B1:
          v: Оклад
          style: head
        D1:
          v: Список
          style: head
        E1:
          v: Оклад
          style: head
        A2: Айгерим
        B2: 520
        A3: Данияр
        B3: 480
        A4: Ольга
        B4: 610
        D2: Айгерим
        D3: Тимур
        D4: Ольга
    actions:
    - click: E2
    - type: =IFERROR(VLOOKUP(D2,$A$2:$B$4,2,FALSE),"нет в штате")
    - keys:
      - Enter
    - click: E2
    - fill: E2:E4
    - click: E3
    expect:
      E2: 520
      E3: нет в штате
      E4: 610
- title: ЕСЛИМН, ВЫБОР и ПЕРЕКЛЮЧ
  text: '<p><code>{f:=IFS(условие1,значение1,условие2,значение2,…)}</code> заменяет вложенные {fn:IF}: пары подряд и одна
    скобка. Последней парой пишут <code>ИСТИНА; иначе</code>. <code>{f:=CHOOSE(номер,значение1,значение2,…)}</code> выбирает
    элемент списка по номеру, в том числе диапазон: <code>{f:=SUM(CHOOSE(3,B2:B4,C2:C4,D2:D4))}</code>. <code>{f:=SWITCH(значение,вариант1,результат1,…,по_умолчанию)}</code>
    заменяет код названием.</p><p>{fn:IFS} и {fn:SWITCH} есть в Excel 2019 и Microsoft 365; в старых версиях — вложенные
    {fn:IF}.</p>'
- title: Частые ошибки
  text: '<ul><li>Проверять границы шкалы не по порядку: первая верная проверка решает, и заказ получит не ту цену.</li><li>Писать
    текст в формуле без кавычек: Excel примет его за имя и покажет #ИМЯ?.</li><li>Прятать все ошибки в {fn:IFERROR}: настоящая
    ошибка в формуле станет незаметной.</li><li>Забыть ИСТИНА в конце {fn:IFS}: если ни одно условие не верно, будет #Н/Д.</li></ul>'
terms:
- term: ЕСЛИ
  meaning: возвращает одно значение, если условие верно, и другое — если нет.
- term: Вложенные ЕСЛИ
  meaning: ЕСЛИ на месте «если нет» другой ЕСЛИ — выбор из нескольких вариантов.
- term: И, ИЛИ
  meaning: все условия верны; хотя бы одно условие верно.
- term: ЕСЛИОШИБКА
  meaning: заменяет результат формулы, если он — ошибка.
- term: ЕСЛИМН
  meaning: пары «условие — значение», первая верная решает.
- term: ВЫБОР
  meaning: элемент списка по номеру.
- term: ПЕРЕКЛЮЧ
  meaning: сравнивает значение со списком вариантов и возвращает результат совпавшего.
- term: Закрепить области
  meaning: строки выше и столбцы левее выделенной ячейки не прокручиваются.
questions:
- q: Сколько ЕСЛИ можно вложить друг в друга?
  a: До 64. Но уже с 3–4 уровнями формулу трудно читать — удобнее {fn:IFS} или таблица с {fn:VLOOKUP}.
- q: Чем ВЫБОР отличается от ПЕРЕКЛЮЧ?
  a: '{fn:CHOOSE} берёт элемент по номеру 1, 2, 3…; {fn:SWITCH} сравнивает значение с любыми вариантами, например кодами
    «XS», «M», и умеет значение по умолчанию.'
- q: Что закрепит «Закрепить области», если выделена C9?
  a: Строки 1–8 и столбцы A и B — всё выше и левее выделенной ячейки.
