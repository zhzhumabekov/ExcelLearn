        D1:
          v: Менеджер
          style: head
        E1:
          v: Продажи, ₸
          style: head
        F1:
          v: Премия
          style: head
        A2:
          v: 0
          fmt: kzt
        B2:
          v: 0
          fmt: percent
        A3:
          v: 1000000
          fmt: kzt
        B3:
          v: 0.03
          fmt: percent
        A4:
          v: 3000000
          fmt: kzt
        B4:
          v: 0.05
          fmt: percent
        A5:
          v: 10000000
          fmt: kzt
        B5:
          v: 0.07
          fmt: percent
        D2: Асель
        E2:
          v: 4200000
          fmt: kzt
        F2:
          fmt: percent
        D3: Ерлан
        E3:
          v: 850000
          fmt: kzt
        F3:
          fmt: percent
        D4: Мария
        E4:
          v: 12500000
          fmt: kzt
        F4:
          fmt: percent
    actions:
    - click: F2
    - type: =VLOOKUP(E2,$A$2:$B$5,2)
    - keys:
      - Enter
    - click: F2
    - fill: F2:F4
    - click: F2
    - showRefs: F2
    expect:
      F2: 0.05
      F3: 0
      F4: 0.07
- title: 'ГПР: то же самое по строкам'
  text: <p>Если ключи записаны не столбцом, а строкой (месяцы, даты, годы в заголовке), нужна <code>{fn:HLOOKUP}</code>.
    Аргументы те же, только вместо номера столбца — <b>номер строки</b> таблицы, а ищет она в первой строке.</p>
  figure:
    id: hlookup
    caption: '{f:=HLOOKUP(B4,B1:E2,2,FALSE)}: нашли «мар» в первой строке таблицы и вернули значение из второй строки —
      цену за март.'
    sheet:
      file: Цемент.xlsx
      name: Цены
      columns:
        A: 150
        B: 90
        C: 90
        D: 90
        E: 90
      rows: 6
      cells:
        A1:
          v: Месяц
          style: head
        A2:
          v: Цена, ₸
          style: head
        B1:
          v: янв
          style: head
        B2:
          v: 2350
          fmt: kzt
        C1:
          v: фев
          style: head
        C2:
          v: 2400
          fmt: kzt
        D1:
          v: мар
          style: head
        D2:
          v: 2480
          fmt: kzt
        E1:
          v: апр
          style: head
        E2:
          v: 2520
          fmt: kzt
        A4: Месяц продажи
        B4: мар
        A5:
          v: Цена, ₸
          style: total
        B5:
          fmt: kzt
          style: total
    actions:
    - click: B5
    - type: =HLOOKUP(B4,B1:E2,2,FALSE)
    - keys:
      - Enter
    - click: B5
    - showRefs: B5
    expect:
      B5: 2480
- title: Если не находит
  text: <ul><li><code>#Н/Д</code> при точном поиске — ключа нет в справочнике. Часто виноваты лишние пробелы («K-101 »)
    или число, записанное как текст. Как чистить такие данные — в главе 6.</li><li><code>#Н/Д</code> при поиске по шкале
    — ключ меньше самого первого значения шкалы.</li><li><code>#ССЫЛКА!</code> — номер столбца больше, чем столбцов в таблице.</li><li>{fn:VLOOKUP}
    ищет только в первом столбце и возвращает значения <b>правее</b> него. Найти «влево» она не умеет — для этого в главе
    5 будет связка {fn:INDEX} и {fn:MATCH}.</li></ul>
terms:
- term: Ключ
  meaning: 'значение, по которому ищем: артикул, табельный номер, сумма продаж.'
- term: Справочник
  meaning: таблица, где ищем; ключи — в первом столбце (для {fn:HLOOKUP} — в первой строке).
- term: '{fn:VLOOKUP}'
  meaning: 'вертикальный просмотр: ищет ключ сверху вниз и возвращает значение из столбца.'
- term: '{fn:HLOOKUP}'
  meaning: 'горизонтальный просмотр: ищет слева направо и возвращает значение из строки.'
- term: Точный поиск
  meaning: 'последний аргумент {fn:FALSE} или 0: ключ должен совпасть полностью.'
- term: Поиск по шкале
  meaning: '{fn:TRUE} или пусто: наибольшее значение не больше ключа; шкала — по возрастанию.'
- term: <code>#Н/Д</code>
  meaning: 'ошибка «нет данных»: подходящий ключ не найден.'
questions:
- q: 'В прайсе столбцы: A — артикул, B — товар, C — цена, D — остаток. Какой номер столбца указать, чтобы получить остаток?'
  a: '4: столбцы считаются от первого столбца таблицы, A — это 1.'
- q: Ищем цену по артикулу и забыли {fn:FALSE}. Что может произойти?
  a: '{fn:VLOOKUP} будет искать по шкале и, если прайс не отсортирован, вернёт цену другого товара — без ошибки. Для артикулов
    всегда ставят {fn:FALSE}.'
- q: 'Шкала скидок: от 0 — 0%, от 50 000 — 3%, от 100 000 — 5%. Какую скидку найдёт поиск по шкале для суммы 99 000?'
  a: '3%: наибольшее значение шкалы, не превышающее 99 000, — это 50 000.'
- q: Месяцы записаны в строке 1, суммы — в строке 2. Какая функция нужна?
  a: '{fn:HLOOKUP}: ключи расположены строкой, ищем по горизонтали.'
