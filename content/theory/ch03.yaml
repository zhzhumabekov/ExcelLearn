# Теория к главе. Собрано генератором gen_theory.py; значения на кадрах посчитаны независимо.
chapter: ch03
title: 'Функции поиска: как Excel находит значение в таблице'
minutes: 7
intro: 'Как устроены {fn:VLOOKUP} и {fn:HLOOKUP}: четыре аргумента, точный поиск и поиск по шкале, типичные ошибки. В уроках
  главы вы увидите всё это в работе.'
sections:
- title: Задача поиска
  text: '<p>Половина рабочих таблиц — это «найди в справочнике»: цену по артикулу в прайсе, оклад по табельному номеру,
    процент премии по сумме продаж. Человек ищет так: берёт <b>ключ</b> (артикул), ведёт глазами по первому столбцу справочника,
    находит строку и смотрит в нужный столбец.</p><p>Ровно так работают функции поиска. <code>{fn:VLOOKUP}</code> — <b>вертикальный</b>
    просмотр: ищет ключ сверху вниз в первом столбце таблицы. <code>{fn:HLOOKUP}</code> — <b>горизонтальный</b>: ищет слева
    направо в первой строке.</p>'
- title: Четыре аргумента ВПР
  text: '<p>{f:=VLOOKUP(E2,$A$2:$C$6,3,FALSE)} читается так: «найди E2 в первом столбце A2:C6 и верни значение из третьего
    столбца той же строки».</p><table><tr><th>Аргумент</th><th>Что это</th><th>В примере</th></tr><tr><td>искомое значение</td><td>ключ,
    который ищем</td><td><code>E2</code> — артикул из заказа</td></tr><tr><td>таблица</td><td>справочник; ключи — в его
    <b>первом</b> столбце</td><td><code>$A$2:$C$6</code> — прайс, закреплён <code>$</code></td></tr><tr><td>номер столбца</td><td>какой
    столбец таблицы вернуть, считая с 1</td><td><code>3</code> — цена</td></tr><tr><td>интервальный просмотр</td><td><code>{fn:FALSE}</code>
    — точное совпадение, <code>{fn:TRUE}</code> — по шкале</td><td><code>{fn:FALSE}</code></td></tr></table><p class="note">Таблицу
    почти всегда закрепляют знаками <code>$</code> (или дают ей имя): формулу потом протягивают на весь заказ, и справочник
    не должен сдвигаться.</p>'
  figure:
    id: exact
    caption: Цена каждого артикула найдена в прайсе. Артикула K-999 в прайсе нет — {fn:VLOOKUP} честно сообщает об этом
      ошибкой <code>#Н/Д</code> («нет данных»).
    sheet:
      file: Прайс.xlsx
      name: Прайс
      columns:
        A: 90
        B: 180
        C: 100
        D: 30
        E: 90
        F: 100
      rows: 7
      cells:
        A1:
          v: Артикул
          style: head
        B1:
          v: Товар
          style: head
        C1:
          v: Цена, ₸
          style: head
        E1:
          v: Заказ
          style: head
        F1:
          v: Цена, ₸
          style: head
        A2: K-101
        B2: Бумага А4, пачка
        C2:
          v: 2650
          fmt: kzt
        A3: K-102
        B3: Ручка синяя
        C3:
          v: 180
          fmt: kzt
        A4: K-205
        B4: Степлер
        C4:
          v: 1450
          fmt: kzt
        A5: K-310
        B5: Папка-регистратор
        C5:
          v: 990
          fmt: kzt
        A6: K-412
        B6: Скобы № 10
        C6:
          v: 120
          fmt: kzt
        E2: K-205
        F2:
          fmt: kzt
        E3: K-102
        F3:
          fmt: kzt
        E4: K-999
        F4:
          fmt: kzt
    actions:
    - click: F2
    - type: =VLOOKUP(E2,$A$2:$C$6,3,FALSE)
    - keys:
      - Enter
    - click: F2
    - fill: F2:F4
    - click: F3
    - showRefs: F3
    expect:
      F2: 1450
      F3: 180
- title: Точный поиск и поиск по шкале
  text: '<p>Последний аргумент решает, как искать. С <code>{fn:FALSE}</code> (или 0) нужен ключ <b>один в один</b>; если
    его нет — <code>#Н/Д</code>. Так ищут артикулы, номера, фамилии.</p><p>С <code>{fn:TRUE}</code> (или если аргумент не
    указан) {fn:VLOOKUP} ищет <b>по шкале</b>: наибольшее значение, которое не больше ключа. Продажи 4,2 млн ₸ — это «от
    3 млн», премия 5%. Так находят ставки налогов, скидки от суммы, премии.</p><p class="note">Для поиска по шкале первый
    столбец обязательно сортируют <b>по возрастанию</b>. И наоборот: если забыть {fn:FALSE} при поиске артикула, Excel будет
    искать по шкале и может вернуть чужую цену без всякой ошибки. Это самая коварная ошибка главы — в уроке 3.2 она показана
    на примере.</p>'
  figure:
    id: scale
    caption: 'Поиск по шкале: у Асель 4,2 млн ₸ — подходит строка «от 3 000 000», премия 5%. Последний аргумент не указан,
      значит — {fn:TRUE}.'
    sheet:
      file: Премии.xlsx
      name: Премии
      columns:
