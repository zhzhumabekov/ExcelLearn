# Теория к главе. Собрано генератором gen_theory.py; значения на кадрах посчитаны независимо.
chapter: ch02
title: 'Имена: формулы, которые можно прочитать'
minutes: 6
intro: Зачем давать ячейкам имена, какими они могут быть, как их создать, найти и где они действуют. После этого уроки главы
  — это просто тренировка рук.
sections:
- title: Что такое имя
  text: '<p><b>Имя</b> — понятная подпись, которую дают ячейке или диапазону. Вместо <code>B4</code> в формуле пишут <code>ставка_налога</code>.
    Excel подставит адрес сам, а человек сразу поймёт, что считает формула.</p><p>Сравните две формулы налога: <code>=B5*B4</code>
    и <code>=прибыль_до_налога*ставка_налога</code>. Считают одно и то же, но вторую можно прочитать вслух и проверить,
    не открывая ячейки.</p>'
  figure:
    id: formula
    caption: В формуле налога — имена, а не адреса. Имена уже созданы для ячеек <code>B2:B5</code>.
    sheet:
      file: Прибыль.xlsx
      name: Прибыль
      columns:
        A: 230
        B: 130
      rows: 7
      cells:
        A1:
          v: Показатель
          style: head
        B1:
          v: Значение
          style: head
        A2: Выручка, ₸
        B2:
          v: 8400000
          fmt: kzt
        A3: Себестоимость, ₸
        B3:
          v: 5100000
          fmt: kzt
        A4: Ставка налога
        B4:
          v: 0.2
          fmt: percent
        A5: Прибыль до налога, ₸
        B5:
          fmt: kzt
        A6: Налог, ₸
        B6:
          fmt: kzt
    names:
    - name: выручка
      ref: B2
    - name: себестоимость
      ref: B3
    - name: ставка_налога
      ref: B4
    - name: прибыль_до_налога
      ref: B5
    actions:
    - click: B5
    - type: =выручка-себестоимость
    - keys:
      - Enter
    - click: B6
    - type: =прибыль_до_налога*ставка_налога
    - keys:
      - Enter
    - click: B6
    expect:
      B5: 3300000
      B6: 660000
- title: Каким может быть имя
  text: '<p>У имён строгие правила. Excel не даст создать неправильное имя и покажет сообщение.</p><table><tr><th>Правило</th><th>Можно</th><th>Нельзя</th></tr><tr><td>начинается
    с буквы или <code>_</code></td><td><code>выручка_2025</code></td><td><code>2025_выручка</code></td></tr><tr><td>без
    пробелов — вместо них <code>_</code> или точка</td><td><code>ставка_налога</code></td><td><code>ставка налога</code></td></tr><tr><td>не
    похоже на адрес ячейки</td><td><code>квартал1</code></td><td><code>КВ1</code>, <code>A1</code></td></tr><tr><td>не одна
    буква R или C (это обозначения строки и столбца)</td><td><code>курс</code></td><td><code>R</code>, <code>C</code></td></tr></table><p>Большие
    и маленькие буквы Excel не различает: <code>Выручка</code> и <code>выручка</code> — одно имя. Кириллица разрешена.</p>'
- title: Три способа создать имя
  text: '<ul><li><b>Поле «Имя»</b>: выделите ячейку, щёлкните в поле «Имя» слева над таблицей, напечатайте имя и нажмите
    <kbd>Enter</kbd>. Самый быстрый способ.</li><li><b>Формулы → Присвоить имя</b>: окно, где можно добавить примечание
    и выбрать область имени.</li><li><b>Формулы → Создать из выделенного</b>: Excel берёт имена из подписей рядом с данными.
    Так за один щелчок получают десятки имён — например, для всех филиалов сразу.</li></ul>'
  figure:
    id: create
    caption: 'Выделены подписи и числа <code>A2:B5</code>, открыто окно «Создать из выделенного». Флажок «в столбце слева»
      значит: имена — из столбца A, ячейки — справа от них.'
    sheet: &id001
      file: Филиалы.xlsx
      name: Филиалы
      columns:
        A: 140
        B: 140
      rows: 6
      cells:
        A1:
          v: Филиал
          style: head
        B1:
          v: Выручка, ₸
          style: head
        A2: Алматы
        B2:
          v: 18400000
          fmt: kzt
        A3: Астана
        B3:
          v: 15200000
          fmt: kzt
        A4: Шымкент
        B4:
          v: 9600000
          fmt: kzt
        A5: Караганда
        B5:
          v: 7300000
          fmt: kzt
    actions:
    - dragSelect: A2:B5
    - ribbonTab: formulas
    - clickRibbon: createFromSelection
- title: Где найти все имена
  text: '<ul><li><b>Стрелка ▾ поля «Имя»</b> — список имён книги. Щёлкните по имени, и Excel выделит его ячейки.</li><li><b>Диспетчер
    имён</b> (Формулы → Диспетчер имён, <kbd>Ctrl</kbd>+<kbd>F3</kbd>) — таблица всех имён: значение, адрес, область. Здесь
    имя можно изменить или удалить.</li><li><b>Клавиша <kbd>F3</kbd></b> во время набора формулы — окно «Вставка имени»:
    не нужно помнить, как точно называется имя. А ещё Excel подсказывает имена прямо при наборе, как функции.</li></ul>'
  figure:
    id: manager
    caption: 'Диспетчер имён: у каждого имени видны значение и адрес. Знаки <code>$</code> в адресе — имя ссылается на ячейку
      абсолютно.'
    sheet: *id001
    names:
    - name: Алматы
      ref: B2
    - name: Астана
      ref: B3
    - name: Шымкент
      ref: B4
    - name: Караганда
      ref: B5
    actions:
    - ribbonTab: formulas
    - clickRibbon: nameManager
- title: 'Область имени: книга или лист'
  text: '<p>Обычно имя действует во всей книге: на любом листе <code>=Алматы</code> вернёт одну и ту же ячейку. Но имени
    можно задать <b>область «лист»</b>: тогда на каждом листе будет своё <code>магазины</code>, и они не перепутаются. С
    другого листа к такому имени обращаются с названием листа: <code>=Астана!магазины</code>.</p><p>Если Excel не узнаёт
    имя, ячейка показывает ошибку <code>#ИМЯ?</code> (в английском Excel — <code>#NAME?</code>): имя написано с опечаткой
    или не видно с этого листа.</p>'
- title: Имена в готовых формулах
  text: '<p>Имена можно дать и после того, как формулы написаны. Команда <b>Формулы → Присвоить имя ▾ → Применить имена…</b>
    заменит адреса в формулах на имена.</p><p>Бывают и особые имена: <b>относительное</b> (например, «ячейка над текущей»
    — <code>предыдущий_год</code>) и имена целых <b>строк и столбцов</b>, когда формула <code>=почасовая_оплата*часы</code>
    берёт значения из своего столбца. Оба приёма разобраны в уроках главы.</p>'
terms:
- term: Имя
  meaning: подпись ячейки или диапазона, которую можно писать в формулах вместо адреса.
- term: Поле «Имя»
  meaning: 'поле слева над таблицей: показывает адрес или имя выделенной ячейки, создаёт имя.'
- term: Создать из выделенного
  meaning: команда, которая делает имена из подписей рядом с данными.
- term: Диспетчер имён
  meaning: окно со списком всех имён книги, <kbd>Ctrl</kbd>+<kbd>F3</kbd>.
- term: Область
  meaning: 'где действует имя: во всей книге или на одном листе.'
- term: <code>#ИМЯ?</code>
  meaning: 'ошибка: Excel не знает такого имени (опечатка или другая область).'
questions:
- q: Можно ли назвать ячейку <code>НДС 12%</code>?
  a: 'Нет: в имени нельзя пробел и знак %. Подойдёт, например, <code>ставка_НДС</code>.'
- q: Почему имя <code>КВ1</code> недопустимо, а <code>квартал1</code> — можно?
  a: <code>КВ1</code> выглядит как адрес ячейки (столбец KV, строка 1), Excel его не примет.
- q: Таблица выручки по 17 филиалам, подписи в столбце A. Как быстрее всего дать имена всем числам?
  a: Выделить подписи вместе с числами и выбрать Формулы → Создать из выделенного, флажок «в столбце слева».
- q: Формула показывает <code>#ИМЯ?</code>. Что проверить первым?
  a: 'Написание имени (опечатка) и его область: возможно, имя действует только на другом листе.'
