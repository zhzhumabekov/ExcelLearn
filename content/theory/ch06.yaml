# Теория к главе. Собрано генератором gen_theory.py; значения на кадрах посчитаны независимо.
chapter: ch06
title: 'Текст в Excel: разобрать, почистить, собрать'
minutes: 7
intro: Как Excel видит текст, какие функции берут часть строки, чистят и склеивают её и когда обойтись без формул. В уроках
  главы — всё это на реальных выгрузках.
sections:
- title: Строка — это символы с номерами
  text: '<p>Для Excel текст в ячейке — цепочка символов, у каждого свой номер: первый, второй, третий… Пробел, запятая и
    дефис — тоже символы и тоже занимают место. Все текстовые функции работают с этими номерами.</p><p>Типичная задача:
    из строки «KZ-1045 Чайник Vitek» достать артикул и название. Пробел стоит на 8-м месте — значит, артикул — первые 7
    символов, а название — всё после 8-го.</p>'
  figure:
    id: positions
    caption: '{fn:LEN} — длина строки, {fn:FIND} — номер пробела, {fn:LEFT} — символы до пробела, {fn:MID} — после него.
      В <code>D2</code>: <code>{f:=LEFT(A2,C2-1)}</code>.'
    sheet:
      file: Выгрузка.xlsx
      name: Товары
      columns:
        A: 200
        B: 80
        C: 80
        D: 100
        E: 150
      rows: 3
      cells:
        A1:
          v: Строка из выгрузки
          style: head
        B1:
          v: Длина
          style: head
        C1:
          v: Пробел
          style: head
        D1:
          v: Артикул
          style: head
        E1:
          v: Название
          style: head
        A2: KZ-1045 Чайник Vitek
    actions:
    - click: B2
    - type: =LEN(A2)
    - keys:
      - Enter
    - click: C2
    - type: =FIND(" ",A2)
    - keys:
      - Enter
    - click: D2
    - type: =LEFT(A2,C2-1)
    - keys:
      - Enter
    - click: E2
    - type: =MID(A2,C2+1,100)
    - keys:
      - Enter
    - click: D2
    - showRefs: D2
    expect:
      B2: 20
      C2: 8
      D2: KZ-1045
      E2: Чайник Vitek
- title: Взять часть строки
  text: '<table><tr><th>Функция</th><th>Что делает</th><th>Пример → результат</th></tr><tr><td><code>{fn:LEFT}</code></td><td>n
    символов слева</td><td><code>{f:=LEFT("Алматы",3)}</code> → Алм</td></tr><tr><td><code>{fn:RIGHT}</code></td><td>n символов
    справа</td><td><code>{f:=RIGHT("Алматы",3)}</code> → аты</td></tr><tr><td><code>{fn:MID}</code></td><td>n символов с
    позиции k</td><td><code>{f:=MID("Алматы",3,2)}</code> → ма</td></tr><tr><td><code>{fn:LEN}</code></td><td>длина строки</td><td><code>{f:=LEN("Алматы")}</code>
    → 6</td></tr><tr><td><code>{fn:FIND}</code></td><td>номер символа; различает регистр</td><td><code>{f:=FIND("а","Алматы")}</code>
    → 4</td></tr><tr><td><code>{fn:SEARCH}</code></td><td>то же без учёта регистра, понимает <code>*</code> и <code>?</code></td><td><code>{f:=SEARCH("а","Алматы")}</code>
    → 1</td></tr></table><p>Когда длина частей разная, номер разделителя находят {fn:FIND} и подставляют в {fn:LEFT} или
    {fn:MID} — как в примере выше. Для второго, третьего пробела у {fn:FIND} есть третий аргумент: с какой позиции начинать
    поиск.</p>'
- title: Почистить данные
  text: '<p>Выгрузки из учётных программ и банков часто «грязные»: лишние пробелы, невидимые символы, числа, записанные
    текстом. Внешне ячейки одинаковые, но {fn:VLOOKUP} не находит, а {fn:SUM} даёт 0.</p><ul><li><code>{fn:TRIM}</code>
    — убирает пробелы по краям и оставляет по одному между словами.</li><li><code>{fn:CLEAN}</code> — убирает непечатаемые
    символы (например, перенос строки).</li><li><code>{f:=SUBSTITUTE(A2,CHAR(160),"")}</code> — убирает неразрывный пробел,
    который {fn:TRIM} не трогает.</li><li><code>{fn:VALUE}</code> — превращает текст «2500» в число 2 500.</li></ul>'
  figure:
    id: clean
    caption: '{fn:TRIM} убрал пробелы по краям и лишние пробелы внутри: длина строки уменьшилась.'
    sheet:
      file: Чистка.xlsx
      name: Чистка
      columns:
        A: 180
        B: 80
        C: 180
        D: 80
      rows: 4
      cells:
        A1:
          v: Из выгрузки
          style: head
        B1:
          v: Длина
          style: head
        C1:
          v: После очистки
          style: head
        D1:
          v: Длина
          style: head
        A2: '  Алматы '
        A3: ул.  Сатпаева   12
    actions:
    - click: B2
    - type: =LEN(A2)
    - keys:
      - Enter
    - click: C2
    - type: =TRIM(A2)
    - keys:
      - Enter
    - click: D2
    - type: =LEN(C2)
    - keys:
      - Enter
    - click: B3
    - type: =LEN(A3)
    - keys:
      - Enter
    - click: C3
    - type: =TRIM(A3)
    - keys:
      - Enter
    - click: D3
    - type: =LEN(C3)
    - keys:
      - Enter
    - click: C3
    - showRefs: C3
    expect:
      B2: 9
      C2: Алматы
      D2: 6
      B3: 18
      C3: ул. Сатпаева 12
      D3: 15
- title: Изменить и собрать
  text: '<ul><li><b>Регистр</b>: {fn:UPPER} — ВСЕ ЗАГЛАВНЫЕ, {fn:LOWER} — все строчные, {fn:PROPER} — Каждое Слово С Заглавной.</li><li><b>Замена</b>:
    {fn:SUBSTITUTE} меняет один текст на другой (все вхождения или только n-е), {fn:REPLACE} — символы на заданных позициях.</li><li><b>Склейка</b>:
    знак <code>&</code> (<code>{f:=A2&", "&B2}</code>), функции {fn:CONCATENATE} и {fn:TEXTJOIN} — последняя ставит разделитель
    сама и умеет пропускать пустые ячейки.</li><li><b>Числа и даты в тексте</b>: {fn:TEXT} задаёт, как показать число внутри
    фразы, например <code>{f:=TEXT(B2,"0%")}</code> → 12%.</li></ul>'
  figure:
    id: join
    caption: 'Адрес собран из трёх ячеек знаком <code>&</code>: <code>{f:=A2&", "&B2&", "&C2}</code>. Запятую с пробелом
      пишут в кавычках — это тоже текст.'
    sheet:
      file: Адреса.xlsx
      name: Адреса
      columns:
        A: 110
        B: 140
        C: 60
        D: 260
      rows: 4
      cells:
        A1:
          v: Город
          style: head
        B1:
          v: Улица
          style: head
        C1:
          v: Дом
          style: head
        D1:
          v: Адрес
          style: head
        A2: Алматы
        B2: пр. Абая
        C2: 52
        A3: Астана
        B3: ул. Кенесары
        C3: 8
    actions:
    - click: D2
    - type: =A2&", "&B2&", "&C2
    - keys:
      - Enter
    - click: D2
    - fill: D2:D3
    - click: D2
    - showRefs: D2
    expect:
      D2: Алматы, пр. Абая, 52
      D3: Астана, ул. Кенесары, 8
- title: 'Без формул: три инструмента'
  text: '<p>Если задача разовая, формулы не обязательны:</p><ul><li><b>Найти и заменить</b> (<kbd>Ctrl</kbd>+<kbd>H</kbd>)
    — заменить символ во всём столбце сразу.</li><li><b>Текст по столбцам</b> (Данные) — разрезать строку по разделителю
    на отдельные столбцы.</li><li><b>Мгновенное заполнение</b> (<kbd>Ctrl</kbd>+<kbd>E</kbd>) — напечатайте один-два примера
    результата, и Excel продолжит по образцу.</li></ul><p class="note">Разница важна: формула пересчитается, если исходные
    данные изменятся, а результат инструментов — это просто значения. Для отчёта, который обновляется каждый месяц, лучше
    формулы.</p>'
  figure:
    id: split
    caption: 'Данные → Текст по столбцам: мастер разрежет строки «Алматы;120;340» по точке с запятой на три столбца.'
    sheet:
      file: Регионы.xlsx
      name: Регионы
      columns:
        A: 220
        B: 90
        C: 90
      rows: 5
      cells:
        A1:
          v: Регион;январь;февраль
          style: head
        A2: Алматы;120;340
        A3: Астана;95;210
        A4: Шымкент;80;150
    actions:
    - dragSelect: A2:A4
    - ribbonTab: data
    - clickRibbon: textToColumns
terms:
- term: Строка
  meaning: текст в ячейке; цепочка символов, у каждого — номер, считая с 1.
- term: '{fn:LEFT}, {fn:RIGHT}, {fn:MID}'
  meaning: взять часть строки слева, справа, из середины.
- term: '{fn:FIND} / {fn:SEARCH}'
  meaning: номер символа или фрагмента; {fn:SEARCH} не различает регистр.
- term: '{fn:TRIM}'
  meaning: убрать лишние пробелы.
- term: <code>&</code>
  meaning: 'склеить текст: <code>{f:=A2&" "&B2}</code>.'
- term: '{fn:CHAR}(160)'
  meaning: неразрывный пробел из веб-страниц и банковских выгрузок; его не видно.
- term: Мгновенное заполнение
  meaning: '<kbd>Ctrl</kbd>+<kbd>E</kbd>: Excel продолжает закономерность по примеру.'
questions:
- q: Что вернёт <code>{f:=LEFT("Шымкент",3)}</code>?
  a: «Шым» — три символа слева.
- q: Чем {fn:FIND} отличается от {fn:SEARCH}?
  a: '{fn:FIND} различает заглавные и строчные буквы; {fn:SEARCH} — нет и понимает подстановочные знаки.'
- q: В ячейке «2 500», но {fn:SUM} не считает её. Что могло случиться?
  a: Число записано текстом, или пробел в нём неразрывный — {fn:CHAR}(160). Помогут {fn:SUBSTITUTE} и {fn:VALUE}.
- q: Каждый месяц приходит новая выгрузка, и из неё нужно вытаскивать артикулы. Формулы или мгновенное заполнение?
  a: 'Формулы: они пересчитаются для новых данных. Мгновенное заполнение даёт значения, его пришлось бы повторять каждый
    месяц.'
