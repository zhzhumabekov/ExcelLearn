- title: Частые ошибки
  text: '<ul><li>Не передать в {fn:IRR} сегодняшний поток «как в {fn:NPV}»: все потоки положительные — <code>#ЧИСЛО!</code>.</li><li>Выбирать
    из нескольких проектов по ВСД: она не учитывает масштаб, выбирайте по ЧПС.</li><li>Доверять одной формуле {fn:IRR},
    когда знак потока меняется несколько раз: проверьте предположениями.</li><li>Считать {fn:IRR} для потоков с неравными
    датами: нужна {fn:XIRR}.</li><li>Перепутать ставки в {fn:MIRR}: вторая — под которую берут деньги, третья — под которую
    вкладывают.</li></ul>'
terms:
- term: ВСД (IRR)
  meaning: ставка, при которой ЧПС проекта равна нулю; доходность вложенных денег в год.
- term: Предположение
  meaning: 'второй аргумент {fn:IRR}: с какой ставки начать поиск; по умолчанию 10%.'
- term: Смена знака
  meaning: переход потока с минуса на плюс или обратно; сколько смен — не больше стольких ВСД.
- term: '{fn:XIRR}'
  meaning: ВСД потоков в любые даты, в процентах годовых.
- term: МВСД ({fn:MIRR})
  meaning: доходность с разными ставками займа и вклада; ответ всегда один.
questions:
- q: ВСД проекта 18%, деньги стоят компании 15%. Выгоден ли проект?
  a: 'Да: ВСД выше стоимости капитала, а значит, ЧПС при 15% больше нуля.'
- q: '{fn:IRR} с предположениями 10% и 90% дала разные ответы. Что это значит?'
  a: У проекта несколько ВСД. Говорить о «процентах в год» нельзя — решайте по ЧПС.
- q: У проекта А ВСД 40%, у Б — 50%. Взять можно один. Какой?
  a: 'Тот, у которого больше ЧПС при стоимости капитала: ВСД не учитывает масштаб.'
- q: Займ возвращают частями в разные даты. Какой функцией считать доходность?
  a: <code>{f:=XIRR(потоки,даты)}</code>.
