- title: ВСД или ЧПС
  text: '<p>Чтобы решить, выгоден ли проект, достаточно ВСД: она выше стоимости капитала — значит, и ЧПС больше нуля. Но
    чтобы выбрать один проект из нескольких, нужна ЧПС: ВСД не видит масштаба. 50% от 10 млн ₸ — это меньше денег, чем 40%
    от 100 млн ₸.</p><table><tr><th>Вопрос</th><th>Чем отвечать</th></tr><tr><td>Выгоден ли проект?</td><td>ВСД больше стоимости
    капитала (или ЧПС больше нуля)</td></tr><tr><td>Какой из проектов взять, если можно один?</td><td>больший ЧПС</td></tr><tr><td>Потоки
    в разные даты</td><td><code>{f:=XIRR(значения,даты)}</code></td></tr><tr><td>Ставка займа и вклада разные</td><td><code>{f:=MIRR(значения,ставка_займа,ставка_вклада)}</code></td></tr></table>'
- title: ЧИСТВНДОХ и МВСД
  text: '<p><code>{f:=XIRR(значения,даты)}</code> — ВСД для потоков в любые даты, в процентах годовых: ставка, при которой
    {fn:XNPV} равна нулю. {fn:IRR} для таких потоков ошибается — она считает, что они идут ровно через год.</p><p>ВСД неявно
    считает, что и занимают, и вкладывают под одну ставку — саму ВСД. <code>{f:=MIRR(значения,ставка_займа,ставка_вклада)}</code>
    берёт реальные ставки: расходы дисконтируются к сегодняшнему дню под ставку займа, доходы растут к последнему году под
    ставку вклада, и МВСД = (будущее ÷ сегодняшнее) в степени 1/(лет) − 1. У МВСД ответ всегда один.</p>'
  figure:
    id: mirr
    caption: 'Заём 120 млн ₸ под 10%, доходы — на депозит под 12%: ВСД 13,07%, МВСД 12,61%'
