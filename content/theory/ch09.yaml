- title: Две ВСД и ни одной
  text: '<p>{fn:IRR} ищет ответ шагами от <b>предположения</b> — второго аргумента, по умолчанию 10%. Если ставок, где ЧПС
    = 0, несколько, от предположения зависит, какую найдёт Excel. Если ни одной — <code>#ЧИСЛО!</code>. Проверка: таблица
    с разными предположениями.</p><p>Сколько раз меняется знак потока, столько ВСД может быть, но не больше. У обычного
    проекта — сначала расход, потом доходы — знак меняется один раз, и ВСД одна. Когда ВСД несколько или нет, говорить о
    «процентах в год» нельзя — решайте по ЧПС.</p>'
  figure:
