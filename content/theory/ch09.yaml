# Теория к главе. Собрано генератором gen_theory.py; значения на кадрах посчитаны независимо.
chapter: ch09
title: 'ВСД: сколько процентов в год даёт проект'
minutes: 7
intro: Что такое внутренняя ставка доходности, как её считать функциями ВСД и ЧИСТВНДОХ, почему у проекта может быть две
  ВСД или ни одной, когда выбирать по ЧПС и что такое МВСД. В уроках главы всё это разобрано на складе, карьере, займе ИП
  и кредите с депозитом.
sections:
- title: ВСД — ставка, при которой ЧПС = 0
  text: '<p>ЧПС проекта зависит от ставки: чем выше ставка, тем дешевле будущие доходы и тем меньше ЧПС. <b>Внутренняя ставка
    доходности</b> (ВСД, IRR) — ставка, при которой ЧПС ровно ноль. Если ВСД у проекта одна, её смысл простой: вложенные
    деньги приносят столько процентов в год.</p><p><code>{f:=IRR(значения)}</code> — первый поток сегодняшний, каждый следующий
    — через период. Проект выгоден, если ВСД выше стоимости капитала — ставки, под которую компания берёт деньги.</p>'
