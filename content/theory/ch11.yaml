# Теория к главе. Собрано генератором gen_theory.py; значения на кадрах посчитаны независимо.
chapter: ch11
title: 'Циклические ссылки: когда формула зависит от себя'
minutes: 5
intro: Что такое циклическая ссылка, почему она часто описывает задачу верно и как её решить итеративными вычислениями.
  В уроках главы — премия, благотворительность от чистой прибыли и среднее по всему столбцу.
sections:
- title: Циклическая ссылка — не всегда ошибка
  text: '<p><b>Циклическая ссылка</b> — формула, которая прямо или через другие ячейки зависит от самой себя: A1 влияет
    на D3, D3 — на F6, а F6 — снова на A1. Excel предупреждает о ней, показывает в ячейках петли 0, а в строке состояния
    внизу окна — «Циклические ссылки: адрес».</p><p>Часто петля — честное описание задачи. Пожертвование — 10% чистой прибыли,
    но пожертвование само уменьшает прибыль и налог. Три формулы зависят друг от друга по кругу, и все они верны.</p>'
  figure:
    id: circular-warning
    caption: Третья формула замкнула петлю «пожертвование → прибыль до налога → чистая прибыль» — Excel предупреждает о
      циклической ссылке
    sheet: &id001
      file: Благотворительность.xlsx
      name: Расчёт
      columns:
        A: 210
        B: 150
      rows: 7
      cells:
        A1: доход
        B1:
          v: 15000000
          fmt: kzt
        A2: налоговая_ставка
        B2:
          v: 0.2
          fmt: percent
        A3: издержки
        B3:
          v: 10000000
          fmt: kzt
        A4: благотворительность
        B4:
          fmt: kzt
        A5: до_уплаты_налогов
        B5:
          fmt: kzt
        A6: после_уплаты_налогов
        B6:
          fmt: kzt
    names: &id002
    - name: доход
      ref: B1
    - name: налоговая_ставка
      ref: B2
    - name: издержки
      ref: B3
    - name: благотворительность
      ref: B4
    - name: до_уплаты_налогов
      ref: B5
    - name: после_уплаты_налогов
      ref: B6
    actions:
    - &id003
      click: B4
    - &id004
      type: =0.1*после_уплаты_налогов
    - &id005
      keys:
      - Enter
    - &id006
      click: B5
    - &id007
      type: =доход-издержки-благотворительность
    - &id008
      keys:
      - Enter
    - &id009
      click: B6
    - &id010
      type: =(1-налоговая_ставка)*до_уплаты_налогов
    - &id011
      keys:
      - Enter
    expect:
      B4: 0
      B6: 0
- title: Итеративные вычисления
  text: '<p><b>Файл → Параметры → Формулы</b>, флажок <b>Включить итеративные вычисления</b>. Excel пересчитывает петлю
    по кругу: каждый раз берёт значения прошлого круга, пока они не перестанут меняться больше чем на <b>относительную погрешность</b>
    (по умолчанию 0,001), но не больше <b>предельного числа итераций</b> (100). Для точности погрешность можно уменьшить
    до 0,000001.</p><p>Точный ответ гарантирован, когда зависимости в петле линейные — как налоги, премии и отчисления в
    процентах. Настройка хранится в книге: в файле с включёнными итерациями она действует для всех листов.</p>'
  figure:
    id: iteration-options
    caption: 'Файл → Параметры → Формулы: флажок «Включить итеративные вычисления», число итераций и погрешность'
    sheet: *id001
    names: *id002
    actions:
    - *id003
    - *id004
    - *id005
    - *id006
    - *id007
    - *id008
    - *id009
    - *id010
    - *id011
    - &id012
      dialogButton: OK
    - &id013
      fileMenu: options
    - &id014
      dialogPick: Формулы
    - &id015
      dialogCheck: Включить итеративные вычисления
- title: Ответ
  text: '<p>После OK петля решена: пожертвование — 370 370 ₸, ровно 10% от чистой прибыли 3 703 704 ₸. Строка состояния
    больше не сообщает о циклической ссылке.</p>'
  figure:
    id: circular-solved
    caption: 'Итерации включены: пожертвование 370 370 ₸ — 10% от чистой прибыли'
    sheet: *id001
    names: *id002
    actions:
    - *id003
    - *id004
    - *id005
    - *id006
    - *id007
    - *id008
    - *id009
    - *id010
    - *id011
    - *id012
    - *id013
    - *id014
    - *id015
    - dialogButton: OK
    - click: B4
    expect:
      B4: 370370.37
- title: Весь столбец внутри столбца
  text: '<p><code>{f:=AVERAGE(B:B)}</code> — среднее всего столбца B: удобно, когда строки дописывают каждый месяц. Но если
    поставить такую формулу в сам столбец B, она будет ссылаться на себя — снова циклическая ссылка. Итерации её решат,
    но проще поставить формулу в другой столбец.</p>'
- title: Частые ошибки
  text: '<ul><li>Включить итерации «на всякий случай»: случайная петля перестанет вызывать предупреждение и тихо даст неверный
    ответ.</li><li>Оставить погрешность 0,001 там, где важны точные суммы: уменьшите её.</li><li>Ждать от итераций ответа
    в нелинейной петле: он не гарантирован, проверьте результат.</li></ul>'
terms:
- term: Циклическая ссылка
  meaning: формула прямо или через другие ячейки зависит от самой себя.
- term: Итеративные вычисления
  meaning: пересчёт петли по кругу, пока значения не перестанут меняться.
- term: Предельное число итераций
  meaning: сколько раз пересчитывать петлю самое большее (по умолчанию 100).
- term: Относительная погрешность
  meaning: изменение, меньше которого Excel останавливается (по умолчанию 0,001).
questions:
- q: Excel сообщил о циклической ссылке. Это ошибка?
  a: Не обязательно. Если петля задумана (налог от прибыли после пожертвования), включите итеративные вычисления. Если нет
    — найдите ячейку из строки состояния и исправьте формулу.
- q: Где включаются итеративные вычисления?
  a: Файл → Параметры → Формулы → «Включить итеративные вычисления».
- q: Почему {f:=AVERAGE(B:B)} в ячейке B20 даёт циклическую ссылку?
  a: 'Столбец B включает и саму B20: формула усредняет и себя. Поставьте её в другой столбец.'
