- title: Частые ошибки
  text: '<ul><li>Передать в {fn:NPV} сегодняшний поток: ЧПС выйдет в (1 + r) раз меньше.</li><li>Оставить пустую ячейку
    в диапазоне {fn:NPV}: следующие потоки сдвинутся на год раньше.</li><li>Вписать ставку в формулу числом: при новой ставке
    придётся исправлять каждую формулу. Ставку держат в отдельной ячейке с именем.</li><li>Решать по простой сумме потоков:
    тенге разных лет складываются как одинаковые.</li><li>В {fn:XNPV} поставить первой не самую раннюю дату или захватить
    пустую строку — <code>#ЧИСЛО!</code>.</li></ul>'
terms:
- term: Дисконтирование
  meaning: 'перевод будущих денег в сегодняшние: поток через n лет делят на (1 + r) в степени n.'
- term: Ставка дисконтирования
  meaning: сколько в год можно заработать на деньгах в другом месте; стоимость капитала.
- term: ЧПС (NPV)
  meaning: сумма потоков проекта, приведённых к сегодняшнему дню; больше нуля — проект выгоден.
- term: '{fn:NPV}'
  meaning: ЧПС потоков через равные периоды; первый поток — через период.
- term: '{fn:XNPV}'
  meaning: ЧПС потоков в любые даты; результат — в деньгах первой даты.
- term: '{fn:SQRT}'
  meaning: квадратный корень; √(1 + r) — рост денег за полгода.
questions:
- q: 'Проект: −5 млн ₸ сегодня и +6 млн ₸ через год. Ставка 25%. Выгоден ли он?'
  a: 'Нет: 6 000 000 ÷ 1,25 = 4 800 000 ₸, ЧПС = −200 000 ₸. При ставке 10% он был бы выгоден.'
- q: Почему <code>{f:=NPV(ставка,B4:D4)}</code> для проекта с расходом в <code>B4</code> сегодня даёт неверный ответ?
  a: '{fn:NPV} считает первый поток полученным через год и дисконтирует и сегодняшний расход. Правильно — <code>{f:=B4+NPV(ставка,C4:D4)}</code>.'
- q: Подписка приносит деньги каждый месяц. Как поправить ответ {fn:NPV}?
  a: 'Умножить на <code>{f:=SQRT(1+ставка)}</code>: деньги в среднем приходят в середине года.'
- q: Как с {fn:XNPV} получить ЧПС на сегодня, если первый поток — через полгода?
  a: Добавить первой строкой сегодняшнюю дату с потоком 0 и включить её в диапазоны значений и дат.
