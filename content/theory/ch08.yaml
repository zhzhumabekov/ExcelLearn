- title: Чистая приведённая стоимость
  text: '<p><b>Чистая приведённая стоимость</b> (ЧПС, NPV) — сумма всех потоков проекта, каждый из которых приведён к сегодняшнему
    дню. Расходы входят со знаком минус. ЧПС больше нуля — проект увеличивает стоимость компании при этой ставке, меньше
    нуля — уменьшает.</p><p>Простая сумма потоков может обмануть. У проекта 1 она равна нулю, у проекта 2 — плюс миллион,
    а по ЧПС при ставке 20% лучше первый: его большой расход — через два года, и сегодняшними деньгами он меньше. При ставке
    2% будущие деньги почти не дешевеют, и порядок проектов меняется.</p>'
