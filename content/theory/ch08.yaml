# Теория к главе. Собрано генератором gen_theory.py; значения на кадрах посчитаны независимо.
chapter: ch08
title: 'ЧПС: сколько будущие деньги стоят сегодня'
minutes: 7
intro: 'Почему тенге сегодня дороже тенге через год, что такое чистая приведённая стоимость и как считать её в Excel: вручную,
  функцией ЧПС с поправкой на начало или середину года и функцией ЧИСТНЗ для потоков с датами. В уроках главы всё это разобрано
  на проектах ТОО, подписках и графиках возврата.'
sections:
- title: Тенге сегодня дороже тенге завтра
  text: '<p>Сегодняшние деньги можно положить на депозит под ставку r, и через год их станет в 1 + r раз больше, через два
    года — в (1 + r)² раз, через n лет — в (1 + r) в степени n. Поэтому будущие деньги сравнивают с сегодняшними, только
    приведя их к сегодняшнему дню: поток через n лет делят на (1 + r) в степени n. Это <b>дисконтирование</b>, а r — <b>ставка
    дисконтирования</b>.</p><p>Ставка — сколько в год компания могла бы заработать на деньгах в другом месте, её ещё называют
    стоимостью капитала. Её задают финансисты, и от неё зависит ответ: чем выше ставка, тем дешевле сегодня далёкие деньги.</p>'
