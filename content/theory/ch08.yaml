- title: Функция ЧПС и когда приходят деньги
  text: '<p><code>{f:=NPV(ставка,значения)}</code> считает, что <b>первый</b> поток приходит через год, второй — через два,
    и так далее. Сегодняшний поток в неё не передают, его прибавляют снаружи. Иначе всё сдвинется на год, и ЧПС выйдет в
    (1 + r) раз меньше — ошибка тихая, число похоже на правду.</p><p>Если деньги приходят в начале года, ответ {fn:NPV}
    умножают на 1 + r: каждый поток пришёл на год раньше. Если равномерно в течение года (подписки, аренда, зарплаты), их
    считают полученными в середине года и умножают на √(1 + r): за полгода деньги растут в √(1 + r) раза.</p><table><tr><th>Когда
    приходят деньги</th><th>Формула</th></tr><tr><td>Первый поток сегодня, остальные — в конце года</td><td><code>{f:=B4+NPV(ставка,C4:F4)}</code></td></tr><tr><td>Все
    потоки — в конце года</td><td><code>{f:=NPV(ставка,B4:F4)}</code></td></tr><tr><td>Все потоки — в начале года</td><td><code>{f:=(1+ставка)*NPV(ставка,B4:F4)}</code></td></tr><tr><td>Равномерно
    в течение года (середина)</td><td><code>{f:=SQRT(1+ставка)*NPV(ставка,B4:F4)}</code></td></tr><tr><td>В любые даты</td><td><code>{f:=XNPV(ставка,потоки,даты)}</code></td></tr></table><p
    class="note">Пустую ячейку в диапазоне {fn:NPV} пропускает вместе с её годом, и следующие потоки сдвигаются. Если в
    каком-то году денег нет, пишите 0.</p>'
- title: 'ЧИСТНЗ: потоки в разные даты'
  text: '<p><code>{f:=XNPV(ставка,значения,даты)}</code> — ЧПС потоков, которые приходят в любые даты. Каждый поток делится
    на (1 + ставка) в степени (дата − первая дата) / 365. Результат — в деньгах <b>первой даты</b>, поэтому первой должна
    стоять самая ранняя. Чтобы получить ЧПС на сегодня, добавьте первой строкой сегодняшнюю дату с потоком 0.</p><p>В отличие
    от {fn:NPV}, {fn:XNPV} пустые ячейки не пропускает: пустой поток или дата раньше первой дают <code>#ЧИСЛО!</code>.</p>'
