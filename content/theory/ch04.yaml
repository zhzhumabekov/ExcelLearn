# Теория к главе. Собрано генератором gen_theory.py; значения на кадрах посчитаны независимо.
chapter: ch04
title: 'ИНДЕКС: значение по номеру строки и столбца'
minutes: 5
intro: Как обратиться к ячейке таблицы по её «координатам» и почему номера считают внутри массива. Это основа для главы
  5, где номера будет находить {fn:MATCH}.
sections:
- title: Таблица как карта
  text: '<p>Любая таблица — это сетка: строки и столбцы. Чтобы назвать одну клетку, хватит двух чисел, как в кинотеатре:
    ряд и место. Функция <code>{fn:INDEX}</code> так и работает — получает <b>номер строки</b> и <b>номер столбца</b> и
    возвращает значение на их пересечении.</p><p>Это удобно, когда номера получаются сами: зона доставки из адреса, номер
    месяца из даты, позиция из другой формулы. В главе 5 номера будет находить функция {fn:MATCH}, и вместе они заменят
    {fn:VLOOKUP} почти везде.</p>'
- title: Синтаксис и главное правило
  text: '<p><code>{fn:INDEX}(массив; номер_строки; номер_столбца)</code></p><ul><li><b>Массив</b> — диапазон с данными,
    <b>без подписей</b>: <code>B2:E5</code>.</li><li>Номера считаются <b>внутри массива</b>, от его левого верхнего угла,
    а не от начала листа. Строка 1 массива <code>B2:E5</code> — это строка 2 листа.</li><li>Номера можно брать из ячеек:
    <code>{f:=INDEX(B2:E5,B7,B8)}</code>. Тогда, чтобы получить другое значение, меняют только номера, формулу не трогают.</li></ul>'
