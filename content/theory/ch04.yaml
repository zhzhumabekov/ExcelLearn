- title: Один столбец — один номер
  text: '<p>Если массив — один столбец или одна строка, второй номер не нужен: <code>{f:=INDEX(A2:A6,4)}</code> — четвёртое
    значение списка. Так выбирают дежурного по номеру недели, название месяца по его номеру, город из списка маршрута.</p>'
  figure:
    id: list
    caption: Четвёртый в списке — Ерлан. Номер взят из ячейки <code>C2</code>.
