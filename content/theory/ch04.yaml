- title: Ноль — вся строка или весь столбец
  text: '<p>Если вместо номера столбца поставить 0, {fn:INDEX} вернёт <b>всю строку</b>, а с нулём вместо номера строки
    — <b>весь столбец</b>. Сам по себе такой результат в ячейку не помещается, но его можно передать другой функции: <code>{f:=SUM(INDEX(B2:E5,0,2))}</code>
    — сумма второго столбца массива.</p>'
  figure:
