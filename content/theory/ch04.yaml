- title: Частые ошибки
  text: '<ul><li>Номера считают от начала листа, а не от массива: в массиве <code>B2:E5</code> «строка 3 листа» — это номер
    2.</li><li>Включают в массив подписи — и все номера сдвигаются на единицу.</li><li>Номер больше размера массива — ошибка
    <code>#ССЫЛКА!</code> (<code>#REF!</code>).</li></ul>'
terms:
- term: Массив
  meaning: диапазон с данными без подписей, внутри которого считаются номера.
- term: '{fn:INDEX}'
  meaning: значение массива по номеру строки и номеру столбца.
- term: Номер строки/столбца
  meaning: позиция внутри массива, считая с 1 от левого верхнего угла.
- term: 0 вместо номера
  meaning: вся строка или весь столбец массива — для {fn:SUM}, {fn:AVERAGE} и др.
- term: <code>#ССЫЛКА!</code>
  meaning: 'ошибка: номер выходит за пределы массива.'
questions:
- q: Массив <code>C4:J11</code>. Какие номера строки и столбца у ячейки <code>E6</code>?
  a: Строка 3 (4, 5, 6), столбец 3 (C, D, E).
- q: Что вернёт <code>{f:=INDEX(A2:A13,12)}</code>, если в <code>A2:A13</code> — месяцы от января до декабря?
  a: Декабрь — двенадцатое значение списка.
- q: Как одной формулой найти сумму третьей строки массива <code>B2:M10</code>?
  a: <code>{f:=SUM(INDEX(B2:M10,3,0))}</code> — ноль вместо номера столбца.
