# Теория к главе. Собрано генератором gen_theory.py; значения на кадрах посчитаны независимо.
chapter: ch01
title: 'Как Excel считает: ячейки, формулы и ссылки'
minutes: 8
intro: 'Всё, на чём держатся уроки главы и всего курса: окно Excel, адреса и диапазоны, формулы и функции, копирование и
  знак <code>$</code>, порядок действий. Прочитайте перед уроками — тогда в анимации будет понятен каждый шаг.'
sections:
- title: 'Окно Excel: что где'
  text: '<p>Прежде чем считать, разберёмся, из чего состоит окно. В уроках курса оно нарисовано так же, как в настоящем
    Excel, — найдите эти части на картинке:</p><ul><li><b>Лента</b> — вкладки «Главная», «Формулы», «Данные» с кнопками
    команд.</li><li><b>Поле «Имя»</b> — слева над таблицей. Показывает адрес выделенной ячейки.</li><li><b>Строка формул</b>
    (значок <i>fx</i>) — что на самом деле записано в ячейке.</li><li><b>Сетка</b>: столбцы обозначены буквами (A, B, C…),
    строки — числами (1, 2, 3…).</li><li><b>Ярлыки листов</b> внизу: одна книга Excel может содержать много листов.</li></ul>'
  figure:
    id: window
    caption: 'Выделена ячейка <code>D3</code>: в поле «Имя» — её адрес, в строке формул — формула <code>{f:=B3*C3}</code>,
      а в самой ячейке — результат 3 600.'
    sheet: &id001
      file: Заказ.xlsx
      name: Заказ
      columns:
        A: 130
        B: 100
        C: 90
        D: 110
      rows: 5
      cells:
        A1:
          v: Товар
          style: head
        B1:
          v: Цена, ₸
          style: head
        C1:
          v: Кол-во
          style: head
        D1:
          v: Сумма, ₸
          style: head
        A2: Тетрадь
        B2:
          v: 350
          fmt: kzt
        C2: 12
        D2:
          fmt: kzt
        A3: Ручка
        B3:
          v: 180
          fmt: kzt
        C3: 20
        D3:
          fmt: kzt
        A4: Папка
        B4:
          v: 990
          fmt: kzt
        C4: 5
        D4:
          fmt: kzt
    actions:
    - &id002
      click: D2
    - &id003
      type: =B2*C2
    - &id004
      keys:
      - Enter
    - &id005
      click: D2
    - &id006
      fill: D2:D4
    - click: D3
    expect: &id007
      D2: 4200
      D3: 3600
      D4: 4950
- title: Ячейка, адрес, диапазон
  text: '<p><b>Ячейка</b> — пересечение столбца и строки. Её <b>адрес</b> — буква столбца и номер строки: <code>B3</code>
    — столбец B, строка 3. Сначала всегда буква, потом число.</p><p><b>Диапазон</b> — прямоугольник из ячеек. Его записывают
    через двоеточие: <code>A2:C4</code> означает «от A2 до C4», это 9 ячеек. Несколько диапазонов перечисляют через точку
    с запятой (в английском Excel — через запятую): {f:=SUM(B2:B4,D2:D4)}.</p>'
  figure:
    id: range
    caption: Выделен диапазон <code>A2:C4</code> — три строки и три столбца. Чтобы выделить такой диапазон, протяните мышью
      от A2 до C4.
    sheet: *id001
    actions:
    - dragSelect: A2:C4
- title: Значение и формула
  text: '<p>В ячейку можно записать <b>значение</b> (число, текст, дату) или <b>формулу</b>. Формула всегда начинается со
    знака <code>=</code>. Ячейка показывает результат, а саму формулу видно в строке формул.</p><p>В формулах работают обычные
    знаки арифметики:</p><table><tr><th>Знак</th><th>Действие</th><th>Пример</th><th>Результат</th></tr><tr><td><code>+</code></td><td>сложение</td><td><code>=12+3</code></td><td>15</td></tr><tr><td><code>-</code></td><td>вычитание</td><td><code>=12-3</code></td><td>9</td></tr><tr><td><code>*</code></td><td>умножение</td><td><code>=12*3</code></td><td>36</td></tr><tr><td><code>/</code></td><td>деление</td><td><code>=12/3</code></td><td>4</td></tr><tr><td><code>^</code></td><td>степень</td><td><code>=2^3</code></td><td>8</td></tr></table><p>Вместо
    чисел в формулу ставят <b>ссылки</b> на ячейки: <code>=B2*C2</code> — «цену из B2 умножить на количество из C2». Поменяете
    цену — сумма пересчитается сама. Ссылку не обязательно печатать: наберите <code>=</code> и щёлкните по нужной ячейке.</p><p><b>Функция</b>
    — готовая формула с именем: <code>{fn:SUM}</code> складывает, <code>{fn:AVERAGE}</code> считает среднее, <code>{fn:MAX}</code>
    находит наибольшее. После имени в скобках идут <b>аргументы</b> — то, с чем функция работает: {f:=SUM(D2:D4)}.</p>'
- title: 'Копирование: ссылки сдвигаются'
  text: '<p>Одну формулу не пишут заново для каждой строки — её копируют. Удобнее всего <b>маркером заполнения</b>: это
    маленький квадрат в правом нижнем углу выделенной ячейки. Потяните его вниз, и формула скопируется на соседние ячейки.</p><p>При
    копировании ссылки <b>сдвигаются</b> вместе с формулой: <code>=B2*C2</code> в строке 2 превращается в <code>=B4*C4</code>
    в строке 4. Такие ссылки называются <b>относительными</b>: Excel запоминает не адрес, а «ячейку на две левее в той же
    строке».</p>'
  figure:
    id: relative
    caption: 'Формулу из <code>D2</code> протянули до <code>D4</code>. В <code>D4</code> ссылки сдвинулись на две строки:
      <code>{f:=B4*C4}</code>. Цветные рамки показывают, на какие ячейки ссылается формула.'
    sheet: *id001
    actions:
    - *id002
    - *id003
    - *id004
    - *id005
    - *id006
    - click: D4
    - showRefs: D4
    expect: *id007
- title: 'Знак $: абсолютные и смешанные ссылки'
  text: '<p>Иногда сдвиг мешает. Ставка комиссии записана в одной ячейке <code>E2</code>, и все строки должны ссылаться
    именно на неё. Если протянуть <code>=B2*E2</code>, в следующей строке получится <code>=B3*E3</code> — а E3 пустая.</p><p>Знак
    <code>$</code> закрепляет часть адреса: <code>$E$2</code> не сдвигается никуда. Ставить доллары вручную не нужно — после
    ссылки нажмите <kbd>F4</kbd>, и Excel переберёт варианты:</p><table><tr><th>Запись</th><th>Название</th><th>Что закреплено</th></tr><tr><td><code>E2</code></td><td>относительная</td><td>ничего
    — сдвигается и столбец, и строка</td></tr><tr><td><code>$E$2</code></td><td>абсолютная</td><td>и столбец, и строка</td></tr><tr><td><code>E$2</code></td><td>смешанная</td><td>только
    строка (столбец сдвигается)</td></tr><tr><td><code>$E2</code></td><td>смешанная</td><td>только столбец (строка сдвигается)</td></tr></table><p>Смешанные
    ссылки нужны в двумерных таблицах: например, в таблице «цена × себестоимость» строка цен закреплена по строке, а столбец
    себестоимости — по столбцу. Это будет в уроках главы.</p>'
  figure:
    id: absolute
    caption: 'В <code>C5</code> формула <code>{f:=B5*$E$2}</code>: продажи сдвинулись вместе с формулой, а ставка осталась
      на месте.'
    sheet:
      file: Комиссия.xlsx
      name: Комиссия
      columns:
        A: 120
        B: 130
        C: 130
        D: 30
        E: 90
      rows: 6
      cells:
        A1:
          v: Менеджер
          style: head
        B1:
          v: Продажи, ₸
          style: head
        C1:
          v: Комиссия, ₸
          style: head
        E1:
          v: Ставка
          style: head
        E2:
          v: 0.05
          fmt: percent
        A2: Асель
        B2:
          v: 4200000
          fmt: kzt
        C2:
          fmt: kzt
        A3: Даурен
        B3:
          v: 3150000
          fmt: kzt
        C3:
          fmt: kzt
        A4: Мария
        B4:
          v: 5600000
          fmt: kzt
        C4:
          fmt: kzt
        A5: Нурлан
        B5:
          v: 2700000
          fmt: kzt
        C5:
          fmt: kzt
    actions:
    - click: C2
    - type: =B2*$E$2
    - keys:
      - Enter
    - click: C2
    - fill: C2:C5
    - click: C5
    - showRefs: C5
    expect:
      C2: 210000
      C3: 157500
      C4: 280000
      C5: 135000
- title: Порядок действий
  text: '<p>Excel считает как в школе: сначала скобки, потом степень, потом умножение и деление, в конце сложение и вычитание.
    Действия одного уровня — слева направо.</p><table><tr><th>Формула</th><th>Как считает Excel</th><th>Результат</th></tr><tr><td><code>=2+3*4</code></td><td>сначала
    3 × 4 = 12, потом 2 + 12</td><td>14</td></tr><tr><td><code>=(2+3)*4</code></td><td>сначала скобки: 5, потом 5 × 4</td><td>20</td></tr><tr><td><code>=100/4*2</code></td><td>слева
    направо: 25 × 2</td><td>50</td></tr><tr><td><code>=8^1/3</code></td><td>сначала степень: 8, потом 8 / 3</td><td>2,67</td></tr><tr><td><code>=8^(1/3)</code></td><td>корень
    третьей степени</td><td>2</td></tr></table><p class="note">Если сомневаетесь, поставьте скобки: лишние скобки результат
    не испортят, а забытые — могут.</p>'
- title: 'Модель: входы и выходы'
  text: '<p>Таблица, в которой итог считается формулами из исходных цифр, называется <b>моделью</b>. Исходные цифры — <b>входы</b>
    (цена, количество, ставка), итоги — <b>выходы</b> (сумма, прибыль). Хорошая модель отвечает на вопрос «что будет, если…»:
    поменяли вход — все выходы пересчитались.</p><ul><li>Входы вписывайте <b>числами</b> в отдельные ячейки с подписью.</li><li>Выходы
    считайте <b>только формулами</b> — никаких чисел с калькулятора.</li><li>Не прячьте числа внутри формул: <code>=B2*0,05</code>
    хуже, чем <code>=B2*$E$2</code>. Ставка поменяется — придётся искать её во всех формулах.</li></ul>'
terms:
- term: Адрес
  meaning: 'буква столбца и номер строки ячейки: <code>B3</code>.'
- term: Диапазон
  meaning: 'прямоугольник ячеек через двоеточие: <code>A2:C4</code>.'
- term: Формула
  meaning: запись, начинающаяся с <code>=</code>; ячейка показывает её результат.
- term: Функция
  meaning: 'готовая формула с именем: <code>{fn:SUM}</code>, <code>{fn:AVERAGE}</code>.'
- term: Аргумент
  meaning: 'то, что передают функции в скобках: {f:=SUM(D2:D4)} — аргумент D2:D4.'
- term: Маркер заполнения
  meaning: 'квадрат в углу выделенной ячейки: тянут, чтобы скопировать формулу.'
- term: Относительная ссылка
  meaning: <code>B2</code> — сдвигается при копировании.
- term: Абсолютная ссылка
  meaning: <code>$E$2</code> — не сдвигается; ставится клавишей <kbd>F4</kbd>.
- term: Смешанная ссылка
  meaning: <code>E$2</code> или <code>$E2</code> — закреплена только строка или столбец.
- term: Модель
  meaning: входы (числа) → формулы → выходы; меняете вход — пересчитывается всё.
questions:
- q: В <code>D2</code> записано <code>=B2*C2</code>. Какая формула окажется в <code>D7</code>, если протянуть её вниз?
  a: '<code>=B7*C7</code>: относительные ссылки сдвинулись на 5 строк.'
- q: Ставка в <code>E2</code>, формулу <code>=B2*E2</code> протянули вниз — и ниже второй строки всё по нулям. Почему и
    как исправить?
  a: 'Ссылка на ставку тоже сдвинулась: <code>E3</code>, <code>E4</code>… пустые. Нужно закрепить её: <code>=B2*$E$2</code>
    (после E2 нажать <kbd>F4</kbd>).'
- q: Сколько будет <code>=10-2*3</code>?
  a: '4: сначала умножение 2 × 3 = 6, потом 10 − 6.'
- q: Почему итог модели нельзя вписывать числом, даже если он посчитан верно?
  a: Число не пересчитается, когда поменяется вход. Таблица будет показывать старый итог, и этого никто не заметит.
- q: Что выделено, если в формуле написано <code>B2:D2</code>?
  a: 'Три ячейки строки 2: B2, C2 и D2.'
