# Глава 12 (ЕСЛИ и логические функции). Собрано генератором; ответы expect посчитаны независимо.
id: error-types
chapter: ch12
order: 6
title: 'Ошибки Excel: #ДЕЛ/0!, #ЗНАЧ!, #ИМЯ?, #ЧИСЛО!'
source: Errortypes.xlsx (рис. 12.9)
sheet:
  file: Ошибки.xlsx
  name: Ошибки
  columns:
    A: 200
    B: 80
    C: 80
    D: 150
  rows: 8
  cells:
    A1:
      v: Что сделали
      style: head
    B1:
      v: Число
      style: head
    C1:
      v: Второе
      style: head
    D1:
      v: Результат
      style: head
    A2: Деление на ноль
    B2: 5
    C2: 0
    A3: Сложили с текстом
    B3: 3
    C3: кг
    A4: Неизвестное имя
    A5: Корень из минуса
    A7: Деление с проверкой
expect:
  D2: '#DIV/0!'
  D3: '#VALUE!'
  D4: '#NAME?'
  D5: '#NUM!'
  D7: нет данных
steps:
- title: Ситуация
  text: 'Ошибка в ячейке — не поломка, а подсказка: по её коду видно, что не так. Разберём самые частые и научимся заменять
    ожидаемую ошибку понятным текстом.'
  actions:
  - wait: 2500
- title: '#ДЕЛ/0! и #ЗНАЧ!'
  text: '<code>{f:=B2/C2}</code> — <code>#ДЕЛ/0!</code>: делитель равен нулю. <code>{f:=B3+C3}</code> — <code>#ЗНАЧ!</code>:
    к числу пытаются прибавить текст «кг». Excel складывает только числа.'
  actions:
  - click: D2
  - type: =B2/C2
  - keys:
    - Enter
  - click: D3
  - type: =B3+C3
  - keys:
    - Enter
- title: '#ИМЯ? и #ЧИСЛО!'
  text: '<code>{f:=SUM(продажи)}</code> — <code>#ИМЯ?</code>: имени <code>продажи</code> в книге нет (или опечатка в названии
    функции). <code>{f:=SQRT(-1)}</code> — <code>#ЧИСЛО!</code>: аргумент недопустим, корня из отрицательного числа нет.
    Ещё бывает <code>#ССЫЛКА!</code> — когда удалили строку или столбец, на которые ссылалась формула.'
  actions:
  - click: D4
  - type: =SUM(продажи)
  - keys:
    - Enter
  - click: D5
  - type: =SQRT(-1)
  - keys:
    - Enter
- title: Замена ожидаемой ошибки
  text: Средняя цена = выручка ÷ количество, но у товара без продаж количество 0. <code>{f:=IFERROR(B2/C2,"нет данных")}</code>
    — вместо <code>#ДЕЛ/0!</code> понятный текст. Так отчёт выглядит аккуратно, а настоящие ошибки в других местах остаются
    видны.
  actions:
  - click: D7
  - type: =IFERROR(B2/C2,"нет данных")
  - keys:
    - Enter
- title: Что запомнить
  text: <code>#ДЕЛ/0!</code> — деление на 0, <code>#ЗНАЧ!</code> — не тот тип данных, <code>#ИМЯ?</code> — неизвестное имя,
    <code>#ЧИСЛО!</code> — недопустимое число, <code>#Н/Д</code> — не нашлось, <code>#ССЫЛКА!</code> — удалённые ячейки.
    {fn:IFERROR} заменяет любую из них. <b>На работе пригодится</b>, чтобы быстро понять, что сломалось в чужом файле.
  actions:
  - click: D7
