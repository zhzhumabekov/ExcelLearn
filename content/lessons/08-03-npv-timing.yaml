steps:
- title: Ситуация
  text: 'Онлайн-школа в Алматы продаёт подписки: деньги приходят каждый месяц, весь год. В бизнес-плане — выручка на 5 лет
    вперёд, ставка 15%. {fn:NPV} считает, что поток года приходит в его <b>конце</b>. А здесь деньги идут равномерно. Как
    это учесть?'
  actions:
  - wait: 3000
- title: Деньги в конце года
  text: 'Сначала — как будто вся выручка года приходит 31 декабря: <code>{f:=NPV(ставка,B4:F4)}</code>. Сегодняшних потоков
    нет, поэтому все пять — внутри {fn:NPV}: выручка первого года делится на 1,15, второго — на 1,15², и так далее. ЧПС
    — <b>46 420 310 ₸</b>.'
  actions:
  - click: B6
  - type: =NPV(ставка,
  - dragRef: B4:F4
  - type: )
  - keys:
    - Enter
- title: 'В начале года: × (1 + ставка)'
  text: 'Если бы деньги приходили 1 января, каждый поток пришёл бы на год раньше. Год ожидания — это множитель 1 + ставка:
    тенге, полученный в начале года, к его концу вырос бы в 1,15 раза. Поэтому <code>{f:=(1+ставка)*B6}</code> — ЧПС для
    начала года: <b>53 383 357 ₸</b>.'
  actions:
  - click: B7
  - type: =(1+ставка)*
  - clickRef: B6
  - keys:
    - Enter
- title: 'В середине года: × {fn:SQRT}(1 + ставка)'
  text: 'Ежемесячные платежи в среднем приходят к середине года — на полгода раньше конца. За полгода деньги растут в √1,15
    ≈ 1,0724 раза: два таких полугодия подряд дают ровно 1,15. {fn:SQRT} — квадратный корень: <code>{f:=SQRT(1+ставка)*B6}</code>
    — <b>49 780 237 ₸</b>. Так обычно оценивают подписки, аренду и зарплаты.'
  actions:
  - click: B8
  - type: =SQRT(1+ставка)*
  - clickRef: B6
  - keys:
    - Enter
- title: Сравним три ответа
  text: 'Конец года — 46 420 310 ₸, середина — 49 780 237 ₸, начало — 53 383 357 ₸. Чем раньше приходят деньги, тем выше
    ЧПС. Разница между концом и серединой года — около 7%: в бизнес-плане на десятки миллионов это заметно. Выбирайте момент,
    который ближе к тому, как деньги приходят на самом деле.'
  actions:
  - showRefs: B8
  - wait: 2500
- title: 'Частая ошибка: полставки вместо корня'
  text: 'Взять «половину ставки»: <code>{f:=(1+ставка/2)*B6}</code>. Множитель 1,075 вместо 1,0724 — ответ чуть завышен.
    Два полугодия по 7,5% дают 1,075 × 1,075 = 1,1556, а не 1,15: проценты за второе полугодие начисляются и на проценты
    первого. Поэтому полгода — это корень из (1 + ставка).'
  actions:
  - wait: 3000
- title: Что запомнить
  text: '{fn:NPV} — деньги в конце каждого года. Начало года — умножьте на (1 + ставка), середина — на <code>{f:=SQRT(1+ставка)}</code>.
    <b>На работе пригодится</b> для бизнес-планов с ежемесячной выручкой: подписки, аренда, услуги по абонементу.'
  actions:
  - click: B8
