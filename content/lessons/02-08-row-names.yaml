# Глава 2. Свой пример по мотивам рис. 2.17 (Namedrows): имена целых строк, =почасовая_оплата*часы.
id: row-names
chapter: ch02
order: 8
title: "Имена строк: =почасовая_оплата*часы"
source: Свой пример (оплата смены по дням недели)

sheet:
  file: Оплата_смены.xlsx
  name: Неделя
  columns: {A: 150, B: 60, C: 60, D: 60, E: 60, F: 60, G: 60, H: 60, I: 80}
  rows: 7
  cells:
    A2: {v: День, style: head}
    B2: {v: Пн, style: head}
    C2: {v: Вт, style: head}
    D2: {v: Ср, style: head}
    E2: {v: Чт, style: head}
    F2: {v: Пт, style: head}
    G2: {v: Сб, style: head}
    H2: {v: Вс, style: head}
    I2: {v: Итого, style: head}
    A3: {v: "Ставка, ₸/час", style: label}
    B3: 1800
    C3: 1800
    D3: 1800
    E3: 1800
    F3: 1800
    G3: 2500
    H3: 2500
    A4: {v: Часы, style: label}
    B4: 8
    C4: 8
    D4: 6
    E4: 8
    F4: 10
    G4: 12
    H4: 12
    A5: {v: "Оплата за день, ₸", style: label}

expect:
  B5: 14400
  G5: 30000
  H5: 30000
  I5: 132000

steps:
  - title: Ситуация
    text: >-
      Бариста работает всю неделю, а в выходные ставка выше. В строке 3 — ставка по дням, в строке 4 — часы.
      Хотим в каждом столбце посчитать оплату одной понятной формулой: <code>=почасовая_оплата*часы</code>.
      Для этого имена дадим <b>целым строкам</b>.
    say: >-
      Бариста работает всю неделю, в выходные ставка выше. Посчитаем оплату за каждый день одной понятной
      формулой. Для этого дадим имена целым строкам.
    actions:
      - wait: 3000

  - title: Выделите строку целиком
    text: >-
      Щёлкните по <b>номеру строки 3</b> слева — выделится вся строка. В поле «Имя» наберите
      <code>почасовая_оплата</code> и нажмите <kbd>Enter</kbd>.
    say: >-
      Щёлкаем по номеру строки три — выделяется вся строка. В поле «Имя» набираем «почасовая оплата».
    actions:
      - selectRow: 3
      - nameBox: почасовая_оплата

  - title: Вторая строка
    text: >-
      Так же: щёлкните по номеру строки <b>4</b> и назовите её <code>часы</code>.
    say: Так же называем строку четыре — «часы».
    actions:
      - selectRow: 4
      - nameBox: часы

  - title: Формула из имён строк
    text: >-
      В <code>B5</code> введите <code>=почасовая_оплата*часы</code>: <b>14 400 ₸</b>. Имя указывает на всю
      строку, а Excel берёт из неё значение <b>того же столбца</b>, где стоит формула, — это называется
      <b>неявное пересечение</b>.
    say: >-
      В Бэ пять вводим «почасовая оплата, умноженная на часы» — четырнадцать тысяч четыреста тенге. Из
      строки Excel берёт значение того же столбца, где стоит формула.
    actions:
      - click: B5
      - type: =почасовая_оплата*часы
      - keys: [Enter]

  - title: Протяните на всю неделю
    text: >-
      Протяните <code>B5</code> до <code>H5</code>: в каждом столбце — ставка этого дня × часы этого дня.
      Формула во всех ячейках одна и та же. В субботу и воскресенье — по <b>30 000 ₸</b>.
    say: >-
      Протягиваем формулу на всю неделю. В каждом столбце — ставка и часы своего дня. В выходные — по тридцать
      тысяч.
    actions:
      - click: B5
      - fill: B5:H5
      - click: G5
      - wait: 1200

  - title: Итог за неделю
    text: >-
      В <code>I5</code> — <code>{f:=SUM(B5:H5)}</code>: за неделю бариста заработал <b>132 000 ₸</b> (до
      удержаний).
    say: В Итого складываем неделю — сто тридцать две тысячи тенге до удержаний.
    actions:
      - click: I5
      - type: "=SUM("
      - dragRef: B5:H5
      - type: ")"
      - keys: [Enter]

  - title: Что запомнить
    text: >-
      Имя можно дать <b>целой строке</b> (щелчок по номеру строки) или <b>столбцу</b> (по букве). В формуле
      такое имя даёт значение из той же строки или столбца, где стоит формула. <b>На работе пригодится</b>
      для табелей и графиков по дням и месяцам.
    say: >-
      Готово! Имя можно дать целой строке или столбцу, и формула возьмёт из них значение своего столбца.
      Удобно для табелей и графиков по дням.
    actions:
      - click: H5
