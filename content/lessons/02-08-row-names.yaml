# Глава 2. Свой пример по мотивам рис. 2.17 (Namedrows): имена целых строк, =почасовая_оплата*часы.
id: row-names
chapter: ch02
order: 8
title: "Имена строк: =почасовая_оплата*часы"
source: Свой пример (оплата смены по дням недели)

sheet:
  file: Оплата_смены.xlsx
  name: Неделя
  columns: { A: 150, B: 60, C: 60, D: 60, E: 60, F: 60, G: 60, H: 60, I: 80 }
  rows: 6
  cells:
    A1: {v: День, style: head}
    B1: {v: Пн, style: head}
    C1: {v: Вт, style: head}
    D1: {v: Ср, style: head}
    E1: {v: Чт, style: head}
    F1: {v: Пт, style: head}
    G1: {v: Сб, style: head}
    H1: {v: Вс, style: head}
    I1: {v: Итого, style: head}
    A2: {v: "Ставка, ₸/час", style: label}
    B2: 1800
    C2: 1800
    D2: 1800
    E2: 1800
    F2: 1800
    G2: 2500
    H2: 2500
    A3: {v: Часы, style: label}
    B3: 8
    C3: 8
    D3: 6
    E3: 8
    F3: 10
    G3: 12
    H3: 12
    A4: {v: "Оплата за день, ₸", style: label}

expect:
  B4: 14400
  G4: 30000
  H4: 30000
  I4: 132000

steps:
  - title: Ситуация
    text: >-
      Бариста работает всю неделю, а в выходные ставка выше. В строке 2 — ставка по дням, в строке 3 — часы.
      Хотим в каждом столбце посчитать оплату одной понятной формулой: <code>=почасовая_оплата*часы</code>.
      Для этого имена дадим <b>целым строкам</b>.
    say: >-
      Бариста работает всю неделю, в выходные ставка выше. Посчитаем оплату за каждый день одной понятной
      формулой. Для этого дадим имена целым строкам.
    actions:
      - wait: 3000

  - title: Выделите строку целиком
    text: >-
      Щёлкните по <b>номеру строки 2</b> слева — выделится вся строка. В поле «Имя» наберите
      <code>почасовая_оплата</code> и нажмите <kbd>Enter</kbd>.
    say: >-
      Щёлкаем по номеру строки два — выделяется вся строка. В поле «Имя» набираем «почасовая оплата».
    actions:
      - selectRow: 2
      - nameBox: почасовая_оплата

  - title: Вторая строка
    text: >-
      Так же: щёлкните по номеру строки <b>3</b> и назовите её <code>часы</code>.
    say: Так же называем строку три — «часы».
    actions:
      - selectRow: 3
      - nameBox: часы

  - title: Формула из имён строк
    text: >-
      В <code>B4</code> введите <code>=почасовая_оплата*часы</code>: <b>14 400 ₸</b>. Имя указывает на всю
      строку, а Excel берёт из неё значение <b>того же столбца</b>, где стоит формула, — это называется
      <b>неявное пересечение</b>.
    say: >-
      В Бэ четыре вводим «почасовая оплата, умноженная на часы» — четырнадцать тысяч четыреста тенге. Из
      строки Excel берёт значение того же столбца, где стоит формула.
    actions:
      - click: B4
      - type: =почасовая_оплата*часы
      - keys: [Enter]

  - title: Протяните на всю неделю
    text: >-
      Протяните <code>B4</code> до <code>H4</code>: в каждом столбце — ставка этого дня × часы этого дня.
      Формула во всех ячейках одна и та же. В субботу и воскресенье — по <b>30 000 ₸</b>.
    say: >-
      Протягиваем формулу на всю неделю. В каждом столбце — ставка и часы своего дня. В выходные — по тридцать
      тысяч.
    actions:
      - click: B4
      - fill: B4:H4
      - click: G4
      - wait: 1200

  - title: Итог за неделю
    text: >-
      В <code>I4</code> — <code>{f:=SUM(B4:H4)}</code>: за неделю бариста заработал <b>132 000 ₸</b> (до
      удержаний).
    say: В Итого складываем неделю — сто тридцать две тысячи тенге до удержаний.
    actions:
      - click: I4
      - type: "=SUM("
      - dragRef: B4:H4
      - type: ")"
      - keys: [Enter]

  - title: "В Microsoft 365: знак @"
    text: >-
      В Excel из Microsoft 365 формула <code>=почасовая_оплата*часы</code> попробует выдать результат сразу на
      всю строку и покажет ошибку <code>#ПЕРЕНОС!</code>. Чтобы взять значение <b>своего столбца</b>, поставьте
      перед именами знак <code>@</code>: <code>=@почасовая_оплата*@часы</code>. Так Excel 365 записывает
      неявное пересечение; в Excel 2019 и раньше <code>@</code> не нужен — он подразумевается.
    say: >-
      Важно для Microsoft 365: там такая формула пытается выдать результат на всю строку и показывает ошибку.
      Чтобы взять значение своего столбца, перед именами ставят знак «собака».
    actions:
      - click: B4
      - wait: 3500

  - title: Что запомнить
    text: >-
      Имя можно дать <b>целой строке</b> (щелчок по номеру строки) или <b>столбцу</b> (по букве). В формуле
      такое имя даёт значение из той же строки или столбца, где стоит формула. <b>На работе пригодится</b>
      для табелей и графиков по дням и месяцам.
    say: >-
      Готово! Имя можно дать целой строке или столбцу, и формула возьмёт из них значение своего столбца.
      Удобно для табелей и графиков по дням.
    actions:
      - click: H4
