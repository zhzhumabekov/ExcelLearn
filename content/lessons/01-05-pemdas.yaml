# Свой пример по мотивам рис. 1.6: порядок операций на расчёте среднегодового роста выручки филиалов.
id: order-of-operations
chapter: ch01
order: 5
title: Порядок выполнения операций
source: Свой пример (среднегодовой рост выручки филиалов)

sheet:
  file: Рост_выручки.xlsx
  name: Филиалы
  columns: { A: 90, B: 110, C: 110, D: 110, E: 110, F: 40 }
  rows: 8
  cells:
    A1: {v: Филиал, style: head}
    B1: {v: "2023, млн ₸", style: head}
    C1: {v: "2025, млн ₸", style: head}
    D1: {v: Рост в год, style: head}
    E1: {v: С ошибкой, style: head}
    A2: Алматы
    B2: 50
    C2: 72
    A3: Астана
    B3: 120
    C3: 150
    A4: Актобе
    B4: 80
    C4: 64
    D2: {fmt: percent}
    D3: {fmt: percent}
    D4: {fmt: percent}
    E2: {fmt: percent}
    E3: {fmt: percent}
    E4: {fmt: percent}
    A7: {v: Пример, style: label}

expect:
  B7: 6500
  D2: 0.2
  D3: 0.118
  D4: -0.1056
  E2: -0.28
  E3: -0.375
  E4: -0.6

steps:
  - title: Ситуация
    text: >-
      Финансовый директор просит показать, на сколько процентов <b>в среднем за год</b> росла выручка
      филиалов с 2023 по 2025 год. Формула короткая, но в ней легко ошибиться, если не знать, в каком
      порядке Excel выполняет действия: сначала <b>скобки</b>, затем <b>степень</b> (<code>^</code>), затем
      <b>умножение и деление</b>, в конце <b>сложение и вычитание</b> — каждый раз слева направо.
    say: >-
      Финансовый директор просит показать средний годовой рост выручки филиалов. Формула короткая, но важно
      знать порядок действий: сначала скобки, потом степень, потом умножение и деление, и в конце сложение
      и вычитание.
    actions:
      - wait: 3000

  - title: Простой пример
    text: >-
      Заказ: доставка 2 000 ₸ и 3 товара по 1 500 ₸. Формула <code>=2000+3*1500</code> даёт <b>6 500</b>:
      Excel сначала умножает 3 × 1 500, а потом прибавляет доставку. Если бы нужно было сначала сложить,
      понадобились бы скобки: <code>=(2000+3)*1500</code>.
    say: >-
      Простой пример: доставка две тысячи тенге и три товара по полторы тысячи. Excel сначала умножает, а
      потом прибавляет доставку — получается шесть с половиной тысяч.
    actions:
      - click: B7
      - type: "=2000+3*1500"
      - keys: [Enter]

  - title: Правильная формула роста
    text: >-
      За два года выручка Алматы выросла в 72 / 50 = 1,44 раза. Средний рост в год — корень второй степени
      из этого числа минус 1. В <code>D2</code> вводим <code>=(C2/B2)^(1/2)-1</code>. Скобки вокруг
      <code>1/2</code> обязательны. Получаем <b>20%</b> в год. Знак <code>^</code> — возведение в степень
      (<kbd>Shift</kbd>+<kbd>6</kbd> в английской раскладке).
    say: >-
      За два года выручка Алматы выросла в одну целую сорок четыре сотых раза. Средний рост в год — корень из
      этого числа минус единица. Степень одна вторая обязательно берём в скобки. Получаем двадцать процентов
      в год.
    actions:
      - click: D2
      - type: "=("
      - clickRef: C2
      - type: "/"
      - clickRef: B2
      - type: ")^(1/2)-1"
      - keys: [Enter]
      - click: D2
      - fill: D2:D4

  - title: Частая ошибка
    text: >-
      Без скобок вокруг <code>1/2</code>: <code>=(C2/B2)^1/2-1</code>. Степень выполняется раньше деления,
      поэтому Excel возводит 1,44 в степень 1, делит на 2 и вычитает 1: <b>−28%</b>. Выручка росла, а
      формула показывает падение.
    say: >-
      А теперь частая ошибка: без скобок вокруг одной второй. Степень выполняется раньше деления, и Excel
      считает совсем другое. Выручка росла, а формула показывает падение на двадцать восемь процентов.
    actions:
      - click: E2
      - type: "=("
      - clickRef: C2
      - type: "/"
      - clickRef: B2
      - type: ")^1/2-1"
      - keys: [Enter]
      - click: E2
      - fill: E2:E4

  - title: Сравним
    text: >-
      В <code>D2</code> степень — <code>1/2</code>, в <code>E2</code> — просто 1, а деление на 2 идёт
      отдельно. Проверяйте результат здравым смыслом: если цифра выглядит странно, ищите ошибку в скобках.
      Не уверены — ставьте скобки: лишние не помешают.
    say: >-
      Сравним формулы. Проверяйте результат здравым смыслом: если цифра выглядит странно, ищите ошибку в
      скобках. А если сомневаетесь — ставьте скобки.
    actions:
      - showRefs: D2
      - showRefs: E2

  - title: Что запомнить
    text: >-
      Порядок: скобки → <code>^</code> → <code>*</code> и <code>/</code> → <code>+</code> и <code>-</code>,
      каждый уровень слева направо. Филиал в Актобе за два года терял в среднем <b>10,56%</b> в год.
      <b>На работе пригодится</b> для темпов роста, наценок, скидок и процентов.
    say: >-
      Готово! Сначала скобки, затем степень, затем умножение и деление, затем сложение и вычитание. Это
      пригодится для темпов роста, наценок, скидок и процентов.
    actions:
      - click: D4
