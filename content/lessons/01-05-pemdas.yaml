# Глава 1, рис. 1.6. Данные — lesson_import из «PEMDAS temp.xlsx»; expect — из PEMDASfinal.xlsx.
id: order-of-operations
chapter: ch01
order: 5
title: Порядок выполнения операций
source: Рис. 1.6, PEMDAS temp.xlsx

sheet:
  file: PEMDAS temp.xlsx
  name: Sheet1
  columns: {A: 30, B: 30, C: 80, D: 80, E: 80, F: 190, G: 150, H: 64}
  rows: 10
  cells:
    D3: {v: This Year, style: head}
    E3: {v: Next Year, style: head}
    F3: {v: Square Root of Improvement, style: head}
    G3: {v: Wrong, style: head}
    C9: {v: Example, style: label}
    D4: 100
    E4: 150
    D5: 200
    E5: 2000
    D6: 80
    E6: 400

expect:
  D9: 14
  F4: 0.7071
  F5: 3
  F6: 2
  G4: 5
  G5: 127.2792
  G6: 35.7771

steps:
  - title: Задача
    text: >-
      Excel считает формулу по правилам математики: сначала <b>скобки</b>, затем <b>возведение в степень</b>
      (<code>^</code>), затем <b>умножение и деление</b>, в конце <b>сложение и вычитание</b> — каждый раз
      слева направо.
    say: >-
      Excel выполняет операции по правилам математики: сначала скобки, потом возведение в степень, потом
      умножение и деление, и в конце сложение и вычитание.
    actions:
      - wait: 3000

  - title: Пример из книги
    text: >-
      <code>=3+6*(5+4)/3-7</code>: скобки → 3+6×9/3−7, умножение → 3+54/3−7, деление → 3+18−7,
      сложение → 21−7, вычитание → <b>14</b>.
    say: >-
      Пример: три плюс шесть умножить на сумму пяти и четырёх, делённую на три, минус семь. Сначала скобки,
      потом умножение и деление, потом сложение и вычитание. Получается четырнадцать.
    actions:
      - click: D9
      - type: "=3+6*(5+4)/3-7"
      - keys: [Enter]

  - title: Правильная формула
    text: >-
      Нужен квадратный корень из прироста продаж. В <code>F4</code> вводим <code>=((E4-D4)/D4)^0.5</code>:
      скобки заставляют Excel сначала посчитать прирост (0,5), а потом извлечь корень — <b>0,707</b>.
      Знак <code>^</code> — возведение в степень (на клавиатуре — на цифре 6).
    say: >-
      Нужен квадратный корень из прироста продаж. Берём прирост в скобки и только потом возводим в степень
      ноль пять. Получаем ноль семьсот семь. Знак возведения в степень — «крышечка» на клавише шесть.
    actions:
      - click: F4
      - type: "=(("
      - clickRef: E4
      - type: "-"
      - clickRef: D4
      - type: ")/"
      - clickRef: D4
      - type: ")^0.5"
      - keys: [Enter]
      - click: F4
      - fill: F4:F6

  - title: Неправильная формула
    text: >-
      Без внешних скобок: <code>=(E4-D4)/D4^0.5</code>. Степень выполняется раньше деления, поэтому Excel
      делит 50 на корень из 100: 50 / 10 = <b>5</b> — неверно.
    say: >-
      А теперь без внешних скобок. Возведение в степень выполняется раньше деления: Excel делит пятьдесят
      на корень из ста и получает пять. Это неверно.
    actions:
      - click: G4
      - type: "=("
      - clickRef: E4
      - type: "-"
      - clickRef: D4
      - type: ")/"
      - clickRef: D4
      - type: "^0.5"
      - keys: [Enter]
      - click: G4
      - fill: G4:G6

  - title: Сравним
    text: >-
      В <code>F4</code> корень берётся из всего прироста, в <code>G4</code> — только из <code>D4</code>.
      Не уверены в порядке — ставьте скобки: лишние не помешают.
    say: >-
      Сравним формулы: в первой корень берётся из всего прироста, во второй — только из знаменателя.
      Если сомневаетесь, ставьте скобки.
    actions:
      - showRefs: F4
      - showRefs: G4

  - title: Готово!
    text: >-
      Порядок: скобки → <code>^</code> → <code>*</code> и <code>/</code> → <code>+</code> и <code>-</code>,
      каждый уровень слева направо.
    say: Готово! Скобки, затем степень, затем умножение и деление, затем сложение и вычитание.
    actions:
      - click: F6
