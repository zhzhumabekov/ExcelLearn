# Свой пример по мотивам рис. 1.4: та же пекарня, но цена закреплена договором — одна на всех поставщиков.
id: bakery-absolute-refs
chapter: ch01
order: 3
title: "Абсолютные ссылки: знак $ и клавиша F4"
source: Свой пример (пекарня в Шымкенте, единая договорная цена)

