  B13: 176400
  C13: 474000
  D13: 143100
  B14: 196000
  C16: 434500
  D18: 185500
  E13: 793500
  E18: 702550
  B19: 980000
  C19: 2409500
  D19: 861250

steps:
  - title: Ситуация
    text: >-
      Пекарня заключила договоры по <b>единой цене</b>: за килограмм сахара, масла и муки она платит всем
      поставщикам одинаково. Цена записана один раз — в строке 2. Посчитаем оплату так же, как в прошлом
      уроке, и посмотрим, что пойдёт не так.
    say: >-
      Пекарня заключила договоры по единой цене: всем поставщикам платят одинаково, и цена записана один раз,
      во второй строке. Посчитаем оплату как раньше и посмотрим, что пойдёт не так.
    actions:
      - wait: 3000

  - title: Формула как раньше
    text: >-
      В <code>B13</code> вводим <code>=B2*B4</code>: цена сахара × килограммы у «Береке». Для первой
      строки результат верный — <b>176 400 ₸</b>.
    say: >-
      В Бэ тринадцать вводим цену из Бэ два, умноженную на килограммы из Бэ четыре. Для первого
      поставщика всё верно.
    actions:
      - click: B13
      - type: "="
      - clickRef: B2
      - type: "*"
      - clickRef: B4
      - keys: [Enter]

  - title: "Частая ошибка: копируем как есть"
    text: >-
      Копируем <code>B13</code> на <code>B13:D18</code>. Во второй строке — ошибка <code>#ЗНАЧ!</code>
      (<code>#VALUE!</code> в английском Excel), а ниже — неверные суммы. Хуже всего то, что неверные суммы
      <b>выглядят как нормальные числа</b>: такую ошибку легко отправить в банк.
    say: >-
      Копируем формулу на всю таблицу — и видим ошибку во второй строке, а ниже неправильные суммы. Опаснее
      всего то, что неправильные суммы выглядят как обычные числа.
    actions:
      - click: B13
      - keys: [Ctrl, C]
      - dragSelect: B13:D18
      - keys: [Enter]

  - title: Почему так вышло
    text: >-
      В <code>B14</code> записано <code>=B3*B5</code>: при копировании вниз ссылка на цену тоже «уехала»
      на строку и указывает на слово <i>Сахар</i>. А нам нужно, чтобы <b>строка 2 не менялась</b>.
    say: >-
      Смотрим, что в ячейке ниже: ссылка на цену сдвинулась на строку и указывает на слово «Сахар». А цена
      всегда во второй строке — эту строку нужно закрепить.
    actions:
      - showRefs: B14

  - title: Отменяем вставку
    text: >-
      <kbd>Ctrl</kbd>+<kbd>Z</kbd> — отменяем вставку и исправим формулу в <code>B13</code>.
    say: Отменяем вставку сочетанием Control Z.
    actions:
      - keys: [Ctrl, Z]

  - title: Закрепляем строку клавишей F4
    text: >-
      Снова вводим формулу в <code>B13</code>. Щёлкнув <code>B2</code>, нажимайте <kbd>F4</kbd>: ссылка
      меняется по кругу <code>$B$2</code> → <code>B$2</code> → <code>$B2</code> → <code>B2</code>. Нам нужна
      <code>B$2</code>: знак <code>$</code> перед 2 запрещает строке меняться при копировании.
      Это <b>абсолютная адресация</b> строки.
    say: >-
      Вводим формулу заново. Щёлкнув Бэ два, нажимаем F4: появляются знаки доллара. Нажимаем ещё
      раз — доллар остаётся только перед номером строки. Теперь строка два не будет меняться
      при копировании.
    actions:
      - click: B13
      - type: "="
      - clickRef: B2
      - keys: [F4]
      - keys: [F4]
      - type: "*"
      - clickRef: B4
      - keys: [Enter]

  - title: Копируем снова
    text: >-
      Копируем <code>B13</code> на <code>B13:D18</code>. Ошибок нет: в <code>C16</code> —
      <code>=C$2*C7</code>. Столбец сдвинулся (у каждого продукта своя цена), а строка цены осталась 12.
    say: >-
      Копируем ещё раз — ошибок нет. Столбец в ссылке на цену сдвигается, а строка два остаётся
      на месте.
    actions:
      - click: B13
      - keys: [Ctrl, C]
      - dragSelect: B13:D18
      - keys: [Enter]
      - showRefs: C16

  - title: Итоги
    text: >-
      К оплате поставщику — <code>{f:=SUM(B13:D13)}</code> с протягиванием вниз, по продуктам —
      кнопка <b>Σ Автосумма</b> для <code>B19:D19</code>.
    say: >-
      Осталось посчитать итоги: по поставщику — функцией {fn:SUM} с протягиванием вниз, по продуктам —
      кнопкой «Автосумма».
    actions:
      - click: E13
      - type: "=SUM("
      - dragRef: B13:D13
      - type: ")"
      - keys: [Enter]
      - click: E13
      - fill: E13:E18
      - dragSelect: B19:D19
      - clickRibbon: autosum

  - title: Что запомнить
    text: >-
      Знак <code>$</code> закрепляет часть ссылки при копировании: <code>$B$2</code> — ячейку целиком,
      <code>B$2</code> — строку, <code>$B2</code> — столбец. Ставится клавишей <kbd>F4</kbd>.
      <b>На работе пригодится</b> везде, где есть одно общее число: курс доллара, ставка налога, норма
      расхода, процент скидки.
    say: >-
      Готово! Знак доллара закрепляет часть ссылки при копировании, а ставится клавишей F4. Это нужно везде,
      где есть одно общее число: курс валюты, ставка налога или процент скидки.
    actions:
      - click: C19
