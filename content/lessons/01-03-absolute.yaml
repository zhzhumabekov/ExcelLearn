steps:
  - title: Ситуация
    text: >-
      Пекарня заключила договоры по <b>единой цене</b>: за килограмм сахара, масла и муки она платит всем
      поставщикам одинаково. Цена записана один раз — в строке 12. Посчитаем оплату так же, как в прошлом
      уроке, и посмотрим, что пойдёт не так.
    say: >-
      Пекарня заключила договоры по единой цене: всем поставщикам платят одинаково, и цена записана один раз,
      в двенадцатой строке. Посчитаем оплату как раньше и посмотрим, что пойдёт не так.
    actions:
      - wait: 3000

  - title: Формула как раньше
    text: >-
      В <code>E23</code> вводим <code>=E12*E14</code>: цена сахара × килограммы у «Береке». Для первой
      строки результат верный — <b>176 400 ₸</b>.
    say: >-
      В Е двадцать три вводим цену из Е двенадцать, умноженную на килограммы из Е четырнадцать. Для первого
      поставщика всё верно.
    actions:
      - click: E23
      - type: "="
      - clickRef: E12
      - type: "*"
      - clickRef: E14
      - keys: [Enter]

  - title: "Частая ошибка: копируем как есть"
    text: >-
      Копируем <code>E23</code> на <code>E23:G28</code>. Во второй строке — ошибка <code>#ЗНАЧ!</code>
      (<code>#VALUE!</code> в английском Excel), а ниже — неверные суммы. Хуже всего то, что неверные суммы
      <b>выглядят как нормальные числа</b>: такую ошибку легко отправить в банк.
    say: >-
      Копируем формулу на всю таблицу — и видим ошибку во второй строке, а ниже неправильные суммы. Опаснее
      всего то, что неправильные суммы выглядят как обычные числа.
    actions:
      - click: E23
      - keys: [Ctrl, C]
      - dragSelect: E23:G28
      - keys: [Enter]

  - title: Почему так вышло
    text: >-
      В <code>E24</code> записано <code>=E13*E15</code>: при копировании вниз ссылка на цену тоже «уехала»
      на строку и указывает на слово <i>Сахар</i>. А нам нужно, чтобы <b>строка 12 не менялась</b>.
    say: >-
      Смотрим, что в ячейке ниже: ссылка на цену сдвинулась на строку и указывает на слово «Сахар». А цена
      всегда в двенадцатой строке — эту строку нужно закрепить.
    actions:
      - showRefs: E24

  - title: Отменяем вставку
    text: >-
      <kbd>Ctrl</kbd>+<kbd>Z</kbd> — отменяем вставку и исправим формулу в <code>E23</code>.
    say: Отменяем вставку сочетанием Control Z.
    actions:
      - keys: [Ctrl, Z]

  - title: Закрепляем строку клавишей F4
    text: >-
      Снова вводим формулу в <code>E23</code>. Щёлкнув <code>E12</code>, нажимайте <kbd>F4</kbd>: ссылка
      меняется по кругу <code>$E$12</code> → <code>E$12</code> → <code>$E12</code> → <code>E12</code>. Нам нужна
      <code>E$12</code>: знак <code>$</code> перед 12 запрещает строке меняться при копировании.
      Это <b>абсолютная адресация</b> строки.
    say: >-
      Вводим формулу заново. Щёлкнув Е двенадцать, нажимаем F4: появляются знаки доллара. Нажимаем ещё
      раз — доллар остаётся только перед номером строки. Теперь строка двенадцать не будет меняться
      при копировании.
    actions:
      - click: E23
      - type: "="
      - clickRef: E12
      - keys: [F4]
      - keys: [F4]
      - type: "*"
      - clickRef: E14
      - keys: [Enter]

  - title: Копируем снова
    text: >-
      Копируем <code>E23</code> на <code>E23:G28</code>. Ошибок нет: в <code>F26</code> —
      <code>=F$12*F17</code>. Столбец сдвинулся (у каждого продукта своя цена), а строка цены осталась 12.
    say: >-
      Копируем ещё раз — ошибок нет. Столбец в ссылке на цену сдвигается, а строка двенадцать остаётся
      на месте.
    actions:
      - click: E23
      - keys: [Ctrl, C]
      - dragSelect: E23:G28
      - keys: [Enter]
      - showRefs: F26

  - title: Итоги
    text: >-
      К оплате поставщику — <code>{f:=SUM(E23:G23)}</code> с протягиванием вниз, по продуктам —
      кнопка <b>Σ Автосумма</b> для <code>E29:G29</code>.
    say: >-
      Осталось посчитать итоги: по поставщику — функцией {fn:SUM} с протягиванием вниз, по продуктам —
      кнопкой «Автосумма».
    actions:
      - click: H23
      - type: "=SUM("
      - dragRef: E23:G23
      - type: ")"
      - keys: [Enter]
      - click: H23
      - fill: H23:H28
      - dragSelect: E29:G29
      - clickRibbon: autosum

  - title: Что запомнить
    text: >-
      Знак <code>$</code> закрепляет часть ссылки при копировании: <code>$E$12</code> — ячейку целиком,
      <code>E$12</code> — строку, <code>$E12</code> — столбец. Ставится клавишей <kbd>F4</kbd>.
      <b>На работе пригодится</b> везде, где есть одно общее число: курс доллара, ставка налога, норма
      расхода, процент скидки.
    say: >-
      Готово! Знак доллара закрепляет часть ссылки при копировании, а ставится клавишей F4. Это нужно везде,
      где есть одно общее число: курс валюты, ставка налога или процент скидки.
    actions:
      - click: F29
