steps:
- title: Ситуация
  text: 'ТОО в Караганде выбирает один из двух проектов. Проект 1: вложить <b>10 млн ₸</b> сегодня и ещё <b>14 млн ₸</b>
    через два года, а через год получить <b>24 млн ₸</b>. Проект 2: <b>6 млн ₸</b> сегодня, <b>1 млн ₸</b> через два года,
    <b>8 млн ₸</b> через год. Потоки — в строках 4 и 5, минус — деньги уходят. Какой проект выгоднее?'
  actions:
  - wait: 3000
- title: Простая сумма потоков
  text: 'В <code>E4</code> сложим потоки проекта 1: <code>{f:=SUM(B4:D4)}</code> — <b>0 ₸</b>. Протянем до <code>E5</code>:
    у проекта 2 — <b>1 000 000 ₸</b>. Кажется, второй лучше. Но простая сумма складывает тенге разных лет как одинаковые.
    А тенге сегодня ценнее тенге через два года: его можно положить на депозит, и он вырастет.'
  actions:
  - click: E4
  - type: =SUM(
  - dragRef: B4:D4
  - type: )
  - keys:
    - Enter
  - click: E4
  - fill: E4:E5
- title: Ставка и её имя
  text: 'Ставка 20% в <code>B1</code> — сколько в год компания может заработать на деньгах в другом месте. Её называют <b>ставкой
    дисконтирования</b>, или стоимостью капитала. Назовём <code>B1</code> именем <code>ставка</code>: формулы будут читаться
    словами. Короткое имя <code>r</code> не подойдёт — буквы R и C Excel понимает как «строка» и «столбец».'
  actions:
  - click: B1
  - nameBox: ставка
- title: Поток — в сегодняшние деньги
  text: 'Тенге сегодня через год станет 1 + ставка = 1,2 ₸, через два — 1,2 × 1,2 = 1,44 ₸. Обратно: будущий поток делим
    на (1 + ставка) в степени числа лет. В <code>B7</code>: <code>{f:=B4/(1+ставка)^B$3}</code>. <code>B4</code> — поток,
    <code>^</code> — степень, <code>B$3</code> — год из заголовка (<kbd>F4</kbd> дважды закрепляет строку 3). Протянем до
    <code>D7</code>: 24 млн через год сегодня стоят <b>20 000 000 ₸</b>, −14 млн через два — <b>−9 722 222 ₸</b>. Год 0
    делится на 1,2⁰ = 1 и не меняется.'
  actions:
  - click: B7
  - type: '='
  - clickRef: B4
  - type: /(1+ставка)^
  - clickRef: B3
  - keys:
    - F4
  - keys:
    - F4
  - keys:
    - Enter
  - click: B7
  - fill: B7:D7
- title: Второй проект
  text: 'Скопируйте <code>B7:D7</code> (<kbd>Ctrl</kbd>+<kbd>C</kbd>) и вставьте в <code>B8:D8</code>. Ссылка на поток сдвинулась
    на строку вниз — на проект 2. Год по-прежнему берётся из строки 3: её держит знак <code>$</code> в <code>B$3</code>.
    А имя <code>ставка</code> всегда указывает на <code>B1</code>. Проект 2 сегодняшними деньгами: −6 000 000 ₸, 6 666 667
    ₸ и −694 444 ₸.'
  actions:
  - dragSelect: B7:D7
  - keys:
    - Ctrl
    - C
  - dragSelect: B8:D8
  - keys:
    - Enter
- title: ЧПС — сумма сегодняшних денег
  text: '<b>Чистая приведённая стоимость</b> (ЧПС) — сумма потоков, приведённых к сегодняшнему дню. В <code>E7</code>: <code>{f:=SUM(B7:D7)}</code>,
    протянем до <code>E8</code>. Проект 1 — <b>277 778 ₸</b>, проект 2 — <b>−27 778 ₸</b>. По ЧПС лучше первый: его большой
    расход — через два года, а сегодняшними деньгами он меньше. ЧПС больше нуля — проект увеличивает стоимость компании,
    меньше нуля — уменьшает.'
  actions:
  - click: E7
  - type: =SUM(
  - dragRef: B7:D7
  - type: )
  - keys:
    - Enter
  - click: E7
  - fill: E7:E8
- title: Что если ставка 2%
  text: 'Впишите в <code>B1</code> <b>2%</b>. Все формулы ссылаются на имя <code>ставка</code> и пересчитываются сами. При
    низкой ставке будущие деньги почти не дешевеют: ЧПС проекта 1 — <b>73 049 ₸</b>, проекта 2 — <b>881 968 ₸</b>. Теперь
    лучше второй, как и по простой сумме. Какой проект выгоднее, зависит от ставки — её задают финансисты компании.'
  actions:
  - click: B1
  - type: 2%
  - keys:
    - Enter
  - click: E8
  - wait: 1500
- title: 'Частая ошибка: ставка числом в формуле'
  text: 'Вписать ставку прямо в формулу: <code>{f:=B4/1.2^B3}</code>. Пока ставка 20%, ответ верный. Но когда ставка поменяется,
    придётся исправлять каждую формулу, и какую-нибудь обязательно забудут. Ставка — в отдельной ячейке с именем: поменяли
    одно число, и пересчитался весь расчёт.'
  actions:
  - click: B7
  - showRefs: B7
  - wait: 2000
- title: Что запомнить
  text: ЧПС — сумма потоков, каждый поделён на (1 + ставка) в степени числа лет. Поток сегодня (год 0) не меняется. ЧПС
    больше нуля — проект выгоден при этой ставке. <b>На работе пригодится</b> для выбора между проектами, оборудованием,
    арендой и покупкой.
  actions:
  - click: E7
