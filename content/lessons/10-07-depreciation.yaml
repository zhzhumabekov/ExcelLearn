steps:
- title: Ситуация
  text: Пекарня купила печь за <b>15 млн ₸</b> (в таблице — тыс. ₸). Через 5 лет её можно будет продать за <b>3 млн</b>.
    Значит, за 5 лет печь «износится» на 12 млн, и эти 12 млн нужно распределить по годам как расход — это <b>амортизация</b>.
    Сравним три способа.
  actions:
  - wait: 3000
- title: Имена из подписей
  text: 'Выделите <code>A1:B3</code> и нажмите <b>Формулы → Создать из выделенного</b> (глава 2): подписи слева станут именами
    <code>Стоимость</code>, <code>Остаток</code> и <code>Срок</code>. Формулы амортизации с ними читаются как фраза.'
  actions:
  - dragSelect: A1:B3
  - clickRibbon: createFromSelection
  - wait: 800
  - dialogButton: OK
- title: 'Линейная: {fn:SLN}'
  text: 'В <code>B6</code>: <code>{f:=SLN(Стоимость,Остаток,Срок)}</code> — износ делится поровну: (15 000 − 3 000) ÷ 5
    = <b>2 400</b> тыс. ₸ в год. Номер года не нужен — каждый год одинаково. Протяните до <code>F6</code>.'
  actions:
  - click: B6
  - type: =SLN(Стоимость,Остаток,Срок)
  - keys:
    - Enter
  - click: B6
  - fill: B6:F6
- title: 'Сумма чисел лет: {fn:SYD}'
  text: 'В <code>B7</code>: <code>{f:=SYD(Стоимость,Остаток,Срок,B5)}</code> — четвёртый аргумент — номер года из заголовка.
    Сумма чисел лет 1 + 2 + 3 + 4 + 5 = 15: в 1-й год списывается 5/15 износа (4 000), во 2-й — 4/15 (3 200) и так далее.
    Протяните до <code>F7</code>.'
  actions:
  - click: B7
  - type: =SYD(Стоимость,Остаток,Срок,B5)
  - keys:
    - Enter
  - click: B7
  - fill: B7:F7
- title: 'Двойное уменьшение остатка: {fn:DDB}'
  text: 'В <code>B8</code>: <code>{f:=DDB(Стоимость,Остаток,Срок,B5)}</code> — каждый год списывается 2 ÷ 5 = 40% от того,
    что осталось: 6 000, 3 600, 2 160. В 4-й год 40% увели бы стоимость ниже 3 000, поэтому {fn:DDB} списывает только 240,
    а в 5-й — 0. Протяните до <code>F8</code>.'
  actions:
  - click: B8
  - type: =DDB(Стоимость,Остаток,Срок,B5)
  - keys:
    - Enter
  - click: B8
  - fill: B8:F8
- title: Итого — одинаково
  text: 'В <code>G6</code>: <code>{f:=SUM(B6:F6)}</code>, протяните до <code>G8</code>. Все три способа списывают ровно
    <b>12 000</b> — разница только в том, <b>когда</b>. {fn:SYD} и {fn:DDB} переносят большую часть расходов на первые годы,
    когда оборудование новое и теряет в цене быстрее всего.'
  actions:
  - click: G6
  - type: =SUM(B6:F6)
  - keys:
    - Enter
  - click: G6
  - fill: G6:G8
- title: Что запомнить
  text: '{fn:SLN} — поровну по годам, {fn:SYD} — по сумме чисел лет, {fn:DDB} — двойной процент от остатка, но не ниже остаточной
    стоимости. Какой метод применять в учёте и для налогов, определяет учётная политика компании. <b>На работе пригодится</b>
    для бюджета, планирования замены оборудования.'
  actions:
  - click: G8
