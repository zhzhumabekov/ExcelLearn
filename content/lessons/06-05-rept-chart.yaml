# Глава 6 (текстовые функции). Собрано генератором; ответы expect посчитаны независимо.
id: rept-chart
chapter: ch06
order: 5
title: 'График из символов: ПОВТОР'
source: Свой пример (оценки тренинга от сотрудников)
sheet:
  file: Оценки_тренинга.xlsx
  name: Оценки
  columns:
    A: 90
    B: 150
    C: 200
  rows: 10
  cells:
    A1:
      v: Оценка
      style: head
    B1:
      v: Сколько поставили
      style: head
    C1:
      v: График
      style: head
    A2: 1
    B2: 2
    A3: 2
    B3: 3
    A4: 3
    B4: 5
    A5: 4
    B5: 8
    A6: 5
    B6: 14
    A7: 6
    B7: 21
    A8: 7
    B8: 17
expect:
  C2: '||'
  C3: '|||'
  C4: '|||||'
  C5: '||||||||'
  C6: '||||||||||||||'
  C7: '|||||||||||||||||||||'
  C8: '|||||||||||||||||'
steps:
- title: Ситуация
  text: После корпоративного тренинга сотрудники поставили оценки от 1 до 7. Известно, сколько человек поставили каждую
    оценку. Построим график <b>прямо в ячейках</b> — без диаграммы.
  actions:
  - wait: 3000
- title: '{fn:REPT}'
  text: '<code>{f:=REPT("|",B2)}</code>: {fn:REPT} повторяет текст из первого аргумента столько раз, сколько указано во
    втором. В <code>B2</code> — сколько человек поставили оценку 1, и столько же палочек «|» появится в ячейке. Протяните
    вниз — получилась гистограмма: длина полоски = число голосов, и сразу видно, что хороших оценок (6 и 7) заметно больше.'
  actions:
  - click: C2
  - type: =REPT("|",
  - clickRef: B2
  - type: )
  - keys:
    - Enter
  - click: C2
  - fill: C2:C8
- title: Частая ошибка
  text: 'Если количества большие (сотни), полоски не поместятся. Делите: <code>{f:=REPT("|",B2/10)}</code> — один символ
    на десять человек. Дробную часть {fn:REPT} отбрасывает.'
  actions:
  - showRefs: C8
  - wait: 2500
- title: Что запомнить
  text: '{fn:REPT}(текст; сколько раз) повторяет строку — так строят графики в ячейках, шкалы и разделители. <b>На работе
    пригодится</b> для быстрых отчётов, где диаграмма — лишнее.'
  actions:
  - click: C2
