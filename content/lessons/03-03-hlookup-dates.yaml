# Глава 3. Свой пример по мотивам рис. 3.3 (Datelookup): цена меняется по датам — ГПР по первой строке.
id: hlookup-dates
chapter: ch03
order: 3
title: "ГПР: цена на дату продажи"
source: Свой пример (цена мешка цемента в 2025 году)

sheet:
  file: Цены_по_датам.xlsx
  name: Цены
  columns: {A: 170, B: 110, C: 110, D: 110, E: 30}
  rows: 13
  cells:
    A2: {v: Действует с, style: label}
    B2: {v: "2025-01-01", fmt: date, style: head}
    C2: {v: "2025-05-01", fmt: date, style: head}
    D2: {v: "2025-08-01", fmt: date, style: head}
    A3: {v: "Цена мешка, ₸", style: label}
    B3: {v: 2450, fmt: kzt}
    C3: {v: 2600, fmt: kzt}
    D3: {v: 2750, fmt: kzt}
    A7: {v: Продажа, style: head}
    B7: {v: Дата, style: head}
    C7: {v: Цена, style: head}
    A8: Счёт № 112
    B8: {v: "2025-02-15", fmt: date}
    A9: Счёт № 245
    B9: {v: "2025-05-01", fmt: date}
    A10: Счёт № 318
    B10: {v: "2025-07-20", fmt: date}
    A11: Счёт № 402
    B11: {v: "2025-11-03", fmt: date}
    C8: {fmt: kzt}

expect:
  C8: 2450
  C9: 2600
  C10: 2600
  C11: 2750

steps:
  - title: Ситуация
    text: >-
      Цемент трижды за 2025 год дорожал: с 1 января мешок стоил 2 450 ₸, с 1 мая — 2 600 ₸, с 1 августа —
      2 750 ₸. Бухгалтер выставляет счета задним числом, и цену нужно брать <b>на дату продажи</b>. Даты здесь
      идут по строке, а не по столбцу, — для этого есть <code>{fn:HLOOKUP}</code>, <b>горизонтальный просмотр</b>.
    say: >-
      Цемент трижды за год дорожал. Цену нужно брать на дату продажи. Даты записаны в строку — для этого есть
      {fn:HLOOKUP}, горизонтальный просмотр.
    actions:
      - wait: 3000

  - title: Имя для таблицы цен
    text: >-
      Выделите <code>B2:D3</code> — даты вместе с ценами — и назовите диапазон <code>прайс</code>.
    say: Выделяем даты вместе с ценами и называем диапазон «прайс».
    actions:
      - dragSelect: B2:D3
      - nameBox: прайс

  - title: "{fn:HLOOKUP}: ищем в первой строке"
    text: >-
      В <code>C8</code> введите <code>{f:=HLOOKUP(B8,прайс,2,TRUE)}</code>. Всё как у {fn:VLOOKUP}, только
      Excel ищет дату в <b>первой строке</b> таблицы, а ответ берёт из строки номер 2. Дата 15.02.2025 — между
      1 января и 1 мая, значит, цена <b>2 450 ₸</b>.
    say: >-
      Вводим {fn:HLOOKUP}: ищем дату продажи в первой строке прайса и берём ответ из второй строки. Пятнадцатое
      февраля — между январём и маем, цена две тысячи четыреста пятьдесят.
    actions:
      - click: C8
      - type: =HLOOKUP(
      - clickRef: B8
      - type: ",прайс,2,TRUE)"
      - keys: [Enter]
      - click: C8
      - fill: C8:C11

  - title: Почему здесь ИСТИНА
    text: >-
      Дата для Excel — это число (количество дней с 1900 года), поэтому даты в первой строке отсортированы по
      возрастанию, и работает приблизительный поиск «не позже»: 20.07.2025 → цена с 1 мая, <b>2 600 ₸</b>;
      ровно 01.05.2025 — тоже новая цена; 03.11.2025 → цена с 1 августа, <b>2 750 ₸</b>.
    say: >-
      Дата для Excel — это число, поэтому даты отсортированы, и работает приблизительный поиск: берётся
      последняя дата изменения цены, не позже даты продажи.
    actions:
      - showRefs: C10
      - wait: 1800
      - click: C11
      - wait: 1200

  - title: "Частая ошибка: ЛОЖЬ для дат"
    text: >-
      С <code>ЛОЖЬ</code> {fn:HLOOKUP} нашёл бы цену только для продажи ровно 01.05.2025, а для остальных дат —
      <code>#Н/Д</code>. Для периодов «с такой-то даты» нужен приблизительный поиск.
    say: >-
      С «ложью» Excel нашёл бы цену только для продажи ровно первого мая. Для периодов нужен приблизительный
      поиск.
    actions:
      - wait: 3000

  - title: Что запомнить
    text: >-
      <code>{fn:HLOOKUP}</code> — то же, что {fn:VLOOKUP}, но ищет в <b>первой строке</b> и берёт ответ из строки
      с указанным номером. Даты — числа, поэтому «цена на дату» ищется с <code>ИСТИНА</code>. <b>На работе
      пригодится</b> для тарифов, курсов, прайсов, которые меняются с определённых дат.
    say: >-
      Готово! {fn:HLOOKUP} ищет в первой строке таблицы. Даты — это числа, поэтому цену на дату ищут
      приблизительным поиском.
    actions:
      - click: C9
