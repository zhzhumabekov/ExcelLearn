steps:
- title: Ситуация
  text: 'В таблице — продажи четырёх филиалов по кварталам, млн ₸. Нужно достать одно число по его <b>месту</b> в таблице:
    как в кинотеатре место находят по ряду и креслу. В Excel для этого есть функция <code>{fn:INDEX}</code>.'
  actions:
  - wait: 3000
- title: Массив — без подписей
  text: 'Сначала решим, где искать. Числа занимают <code>B2:E5</code> — это <b>массив</b>. Номера строк и столбцов считаются
    <b>внутри массива</b>: строка 1 — Алматы, столбец 1 — I квартал. Подписи и номера строк листа не считаются.'
  actions:
  - dragSelect: B2:E5
  - wait: 1500
- title: ИНДЕКС с номерами
  text: 'В <code>B9</code> наберите <code>{fn:INDEX}(</code>, протяните массив и допишите <code>3,2)</code>: строка 3 —
    Шымкент, столбец 2 — II кв. Ответ — <b>240</b> млн ₸.'
  actions:
  - click: B9
  - type: =INDEX(
  - dragRef: B2:E5
  - type: ',3,2)'
  - keys:
    - Enter
- title: Номера — из ячеек
  text: 'Номера удобнее брать из ячеек: <code>{f:=INDEX(B2:E5,B7,B8)}</code>. Теперь, чтобы достать другое число, формулу
    не трогают — меняют только номера.'
  actions:
  - click: B9
  - type: =INDEX(B2:E5,
  - clickRef: B7
  - type: ','
  - clickRef: B8
  - type: )
  - keys:
    - Enter
- title: Другое число
  text: 'Впишите строку <b>1</b> и столбец <b>4</b>: Алматы, IV кв. — <b>501</b> млн ₸.'
  actions:
  - click: B7
  - type: '1'
  - keys:
    - Enter
  - click: B8
  - type: '4'
  - keys:
    - Enter
  - click: B9
  - showRefs: B9
- title: Что будет в главе
  text: '<b>4.1</b> — {fn:INDEX} на таблице расстояний между городами<br><b>4.2</b> — номера из ячеек и протягивание: маршрут
    выездной серии<br><b>4.3</b> — ноль вместо номера — вся строка или весь столбец'
  actions:
  - wait: 4000
- title: Что запомнить
  text: '<code>{fn:INDEX}(массив; строка; столбец)</code> — значение на пересечении; номера считаются от левого верхнего
    угла массива. <b>На работе пригодится</b>: выбрать показатель филиала за месяц, тариф по зоне и весу, ставку из таблицы.
    В главе 5 номера будет находить сама функция <code>{fn:MATCH}</code>.'
  actions:
  - click: B9
