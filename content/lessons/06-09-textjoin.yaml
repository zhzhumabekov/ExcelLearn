# Глава 6 (текстовые функции). Собрано генератором; ответы expect посчитаны независимо.
id: textjoin
chapter: ch06
order: 9
title: 'ОБЪЕДИНИТЬ: адрес из частей одной формулой'
source: Свой пример (адреса филиалов для рассылки)
sheet:
  file: Адреса_филиалов.xlsx
  name: Адреса
  columns:
    A: 90
    B: 100
    C: 150
    D: 60
    E: 90
  rows: 13
  cells:
    A1:
      v: Индекс
      style: head
    B1:
      v: Город
      style: head
    C1:
      v: Улица
      style: head
    D1:
      v: Дом
      style: head
    E1:
      v: Офис
      style: head
    A6:
      v: 'ОБЪЕДИНИТЬ:'
      style: label
    A10:
      v: 'Знак &:'
      style: label
    A2: '050000'
    B2: Алматы
    C2: пр. Абая
    D2: '10'
    E2: офис 5
    A3: '010000'
    B3: Астана
    C3: ул. Кенесары
    D3: '40'
    A4: '160000'
    B4: Шымкент
    C4: ул. Байтурсынова
    D4: '7'
    E4: офис 12
expect:
  A7: 050000, Алматы, пр. Абая, 10, офис 5
  A11: 050000, Алматы, пр. Абая, 10, офис 5
  A8: 010000, Астана, ул. Кенесары, 40
  A12: '010000, Астана, ул. Кенесары, 40, '
  A9: 160000, Шымкент, ул. Байтурсынова, 7, офис 12
  A13: 160000, Шымкент, ул. Байтурсынова, 7, офис 12
steps:
- title: Ситуация
  text: 'Для рассылки нужно собрать адрес филиала в одну строку: индекс, город, улица, дом и офис через запятую. У филиала
    в Астане офиса нет — лишней запятой быть не должно.'
  say: Соберём адрес из частей через запятую. У одного филиала офиса нет — лишней запятой быть не должно.
  actions:
  - wait: 3000
- title: '{fn:TEXTJOIN}'
  text: '<code>{f:=TEXTJOIN(", ",TRUE,A2:E2)}</code>: первый аргумент — разделитель, второй <code>ИСТИНА</code> — пропускать
    пустые ячейки, дальше — диапазон. Протяните вниз: в Астане запятой в конце нет.'
  say: '{fn:TEXTJOIN}: разделитель, пропускать ли пустые ячейки и диапазон. В Астане лишней запятой нет.'
  actions:
  - click: A7
  - type: =TEXTJOIN(", ",TRUE,
  - dragRef: A2:E2
  - type: )
  - keys:
    - Enter
  - click: A7
  - fill: A7:A9
- title: То же через &
  text: <code>{f:=A2&", "&B2&", "&C2&", "&D2&", "&E2}</code> — разделитель приходится писать четыре раза, а пустой офис
    оставляет в конце «, ».
  say: 'Знаком амперсанд то же самое длиннее: разделитель повторяется, а пустой офис оставляет запятую в конце.'
  actions:
  - click: A11
  - type: '='
  - clickRef: A2
  - type: '&", "&'
  - clickRef: B2
  - type: '&", "&'
  - clickRef: C2
  - type: '&", "&'
  - clickRef: D2
  - type: '&", "&'
  - clickRef: E2
  - keys:
    - Enter
  - click: A11
  - fill: A11:A13
- title: Частая ошибка
  text: 'Поставить второй аргумент <code>ЛОЖЬ</code>: тогда пустые ячейки не пропускаются, и в адресе Астаны появится «,
    » в конце. И помните: {fn:TEXTJOIN} есть в Excel 2019 и Microsoft 365, в старых версиях — только {fn:CONCATENATE} и
    &.'
  say: С «ложью» пустые ячейки не пропускаются. И {fn:TEXTJOIN} есть только в новых версиях Excel.
  actions:
  - wait: 3000
- title: Что запомнить
  text: '{fn:TEXTJOIN}(разделитель; пропускать пустые; диапазон) соединяет целый диапазон одним разделителем. <b>На работе
    пригодится</b> для адресов, списков товаров в заказе, ФИО из частей.'
  say: Готово! {fn:TEXTJOIN} соединяет диапазон одним разделителем и пропускает пустые ячейки.
  actions:
  - click: A7
