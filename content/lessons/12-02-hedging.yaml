steps:
- title: Ситуация
  text: 'Инвестор купил 100 акций по 5 500 ₸ и боится падения. Для страховки он купил 60 пут-опционов по 500 ₸: каждый даёт
    право через полгода продать акцию по 4 500 ₸, даже если она подешевеет. Посчитаем доходность портфеля при разных ценах
    через полгода — с опционами и без.'
  actions:
  - wait: 3000
- title: Имена
  text: 'Выделите <code>A1:B6</code> и <b>Формулы → Создать из выделенного</b>. В <code>B6</code> уже посчитана начальная
    стоимость: 100 × 5 500 + 60 × 500 = 580 000 ₸.'
  actions:
  - dragSelect: A1:B6
  - clickRibbon: createFromSelection
  - wait: 800
  - dialogButton: OK
- title: 'Опционы: {fn:IF}'
  text: 'В <code>B9</code>: <code>{f:=IF(A9<цена_исполнения,цена_исполнения-A9,0)*число_опционов}</code>. Если акция дешевле
    4 500 ₸, опцион приносит разницу: купили на рынке дешевле, продали по 4 500. Иначе он ничего не стоит — 0. При цене
    2 000: (4 500 − 2 000) × 60 = <b>150 000 ₸</b>. Протяните до <code>B18</code>.'
  actions:
  - click: B9
  - type: =IF(A9<цена_исполнения,цена_исполнения-A9,0)*число_опционов
  - keys:
    - Enter
  - click: B9
  - fill: B9:B18
- title: Акции
  text: 'В <code>C9</code>: <code>{f:=число_акций*A9}</code> — сколько стоят 100 акций по новой цене. Протяните до <code>C18</code>.'
  actions:
  - click: C9
  - type: =число_акций*A9
  - keys:
    - Enter
  - click: C9
  - fill: C9:C18
- title: Доходность с опционами и без
  text: 'Доходность — (стало − было) ÷ было. С опционами: <code>{f:=(C9+B9-начальная_стоимость)/начальная_стоимость}</code>.
    Без опционов: <code>{f:=(C9-число_акций*цена_акции)/(число_акций*цена_акции)}</code>. Протяните обе до строки 18.'
  actions:
  - click: D9
  - type: =(C9+B9-начальная_стоимость)/начальная_стоимость
  - keys:
    - Enter
  - click: D9
  - fill: D9:D18
  - click: E9
  - type: =(C9-число_акций*цена_акции)/(число_акций*цена_акции)
  - keys:
    - Enter
  - click: E9
  - fill: E9:E18
- title: Что показывает таблица
  text: 'При цене 2 000 ₸ без опционов портфель теряет 63,6%, а с опционами — только 39,7%: опционы возместили падение.
    При росте до 6 500 ₸ без опционов — +18,2%, с опционами — +12,1%: страховка стоила денег. Поэтому покупку пут-опционов
    называют страхованием портфеля.'
  actions:
  - click: D9
  - wait: 1500
  - click: D18
  - wait: 1500
- title: Что запомнить
  text: '{fn:IF} внутри расчёта: «если цена ниже порога — платим разницу, иначе 0». Так моделируют страховки, бонусы при
    выполнении плана, штрафы за просрочку. <b>На работе пригодится</b> для сравнения сценариев «что если цена упадёт».'
  actions:
  - click: B9
