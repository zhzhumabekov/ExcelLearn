# Глава 12 (ЕСЛИ и логические функции). Собрано генератором; ответы expect посчитаны независимо.
id: switch
chapter: ch12
order: 10
title: 'ПЕРЕКЛЮЧ: код — в понятное название'
source: Switchfinal.xlsx (рис. 12.16)
sheet:
  file: Размеры.xlsx
  name: Размеры
  columns:
    A: 90
    B: 220
  rows: 8
  cells:
    A1:
      v: Код
      style: head
    B1:
      v: Размер
      style: head
    A2: M
    A3: XS
    A4: XXL
    A5: L
    A6: ABC
    A7: S
expect:
  B2: Средний
  B3: Очень маленький
  B4: Самый большой
  B5: Большой
  B6: Неверный код
  B7: Маленький
steps:
- title: Ситуация
  text: 'Магазин одежды в Шымкенте выгрузил остатки: размеры записаны кодами XS, M, XXL. Для сайта нужны понятные названия.
    Сравнивать одно значение со списком вариантов удобно функцией {fn:SWITCH}.'
  actions:
  - wait: 3000
- title: '{fn:SWITCH}: значение — результат'
  text: 'В <code>B2</code>: <code>{f:=SWITCH(A2,"XXL","Самый большой","XL","Очень большой","L","Большой","M","Средний","S","Маленький","XS","Очень
    маленький","XXS","Самый маленький","Неверный код")}</code>. Первый аргумент — что сравниваем (код), дальше пары «вариант
    — результат», а последний одиночный аргумент — ответ по умолчанию, если ничего не совпало. Код M — «Средний».'
  actions:
  - click: B2
  - type: =SWITCH(A2,"XXL","Самый большой","XL","Очень большой","L","Большой","M","Средний","S","Маленький","XS","Очень
      маленький","XXS","Самый маленький","Неверный код")
  - keys:
    - Enter
- title: Все коды
  text: 'Протяните до <code>B7</code>. У кода ABC совпадений нет — «Неверный код»: так сразу видно ошибку в выгрузке. Без
    значения по умолчанию было бы <code>#Н/Д</code>.'
  actions:
  - click: B2
  - fill: B2:B7
- title: Что запомнить
  text: '<code>{f:=SWITCH(значение,вариант1,результат1,…,по_умолчанию)}</code> — замена кода названием. Отличие от {fn:IFS}:
    сравнивается одно значение на равенство. Есть в Excel 2019 и Microsoft 365. <b>На работе пригодится</b> для кодов регионов,
    статусов заказов, размеров.'
  actions:
  - click: B6
