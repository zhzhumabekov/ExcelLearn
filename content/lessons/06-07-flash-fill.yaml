steps:
- title: Ситуация
  text: 'IT-отделу нужны имена, фамилии и адреса почты сотрудников, а в списке — «Имя Фамилия» в одной ячейке. Вместо формул
    возьмём <b>Мгновенное заполнение</b>: Excel сам поймёт закономерность по примеру.'
  say: 'Нужно разложить имена и составить адреса почты. Возьмём мгновенное заполнение: Excel сам поймёт закономерность по
    примеру.'
  actions:
  - wait: 3000
- title: Имя — по одному примеру
  text: В <code>B2</code> напечатайте <b>Aigerim</b>, нажмите <kbd>Enter</kbd>, затем <kbd>Ctrl</kbd>+<kbd>E</kbd>. Excel
    заполнил имена остальных сотрудников.
  say: Печатаем первое имя, Enter и Control E — Excel заполняет остальные имена.
  actions:
  - click: B2
  - type: Aigerim
  - keys:
    - Enter
  - keys:
    - Ctrl
    - E
  - wait: 600
- title: Фамилия
  text: 'Так же: <b>Saparova</b> в <code>C2</code>, <kbd>Enter</kbd>, <kbd>Ctrl</kbd>+<kbd>E</kbd>.'
  say: 'Так же с фамилией: пример, Enter и Control E.'
  actions:
  - click: C2
  - type: Saparova
  - keys:
    - Enter
  - keys:
    - Ctrl
    - E
  - wait: 600
- title: Адрес почты
  text: 'Пример <b>saparova@company.kz</b>: фамилия строчными плюс домен. <b>Данные → Мгновенное заполнение</b> делает то
    же, что <kbd>Ctrl</kbd>+<kbd>E</kbd>.'
  say: Почта — фамилия строчными и домен компании. Кнопка на вкладке «Данные» делает то же, что Control E.
  actions:
  - click: D2
  - type: saparova@company.kz
  - keys:
    - Enter
  - clickRibbon: flashFill
  - wait: 600
- title: Тенге и тиыны
  text: На листе «Цены» — цены вида «845,50 ₸». Пример <b>845</b> в <code>B2</code> → <kbd>Ctrl</kbd>+<kbd>E</kbd> даёт
    тенге, пример <b>50</b> в <code>C2</code> — тиыны.
  say: На листе «Цены» по одному примеру получаем тенге и тиыны.
  actions:
  - sheetTab: Цены
  - click: B2
  - type: '845'
  - keys:
    - Enter
  - keys:
    - Ctrl
    - E
  - click: C2
  - type: '50'
  - keys:
    - Enter
  - keys:
    - Ctrl
    - E
  - wait: 600
- title: Частая ошибка
  text: 'Мгновенное заполнение записывает <b>значения</b>, а не формулы: поменяете исходную строку — результат не обновится.
    На неоднородных данных проверяйте результат: если ошибся, дайте ещё один пример.'
  say: 'Мгновенное заполнение записывает значения, а не формулы: при изменении данных результат не обновится. Проверяйте
    результат.'
  actions:
  - wait: 3000
- title: Что запомнить
  text: Пример в первой ячейке → <kbd>Enter</kbd> → <kbd>Ctrl</kbd>+<kbd>E</kbd> (или <b>Данные → Мгновенное заполнение</b>).
    Работает для частей текста, смены регистра и склейки с постоянным текстом. <b>На работе пригодится</b>, когда нужно
    быстро и один раз.
  say: Готово! Пример, Enter, Control E — и Excel заполняет столбец сам.
  actions:
  - click: C2
