steps:
- title: Ситуация
  text: 'Цементный завод в Шымкенте продаёт мешки со скидкой за объём: до 500 мешков — 3 000 ₸, до 1 200 — 2 700 ₸, до 2
    000 — 2 300 ₸, больше — 2 000 ₸. Нужна одна формула, которая по числу мешков сама выберет цену. Для выбора «если… то…
    иначе…» в Excel есть {fn:IF}.'
  actions:
  - wait: 3000
- title: Имена границ и цен
  text: 'Дадим имена: выделите <code>A2:B4</code> и <b>Формулы → Создать из выделенного</b> — границы станут <code>опт1</code>,
    <code>опт2</code>, <code>опт3</code>. Так же <code>D2:E5</code> — цены <code>цена1</code>…<code>цена4</code>. Формула
    будет читаться как условие задачи.'
  actions:
  - dragSelect: A2:B4
  - clickRibbon: createFromSelection
  - wait: 800
  - dialogButton: OK
  - dragSelect: D2:E5
  - clickRibbon: createFromSelection
  - wait: 800
  - dialogButton: OK
- title: '{fn:IF} внутри {fn:IF}'
  text: 'В <code>B9</code>: <code>{f:=IF(A9<=опт1,цена1*A9,IF(A9<=опт2,цена2*A9,IF(A9<=опт3,цена3*A9,цена4*A9)))}</code>.
    {fn:IF}(условие; если да; если нет): если заказ не больше <code>опт1</code>, стоимость — <code>цена1</code> × мешки,
    иначе проверяется следующая граница — новой {fn:IF} на месте «если нет». Проверки идут слева направо, первая верная
    решает. 450 ≤ 500 — <b>1 350 000 ₸</b>.'
  actions:
  - click: B9
  - type: =IF(A9<=опт1,цена1*A9,IF(A9<=опт2,цена2*A9,IF(A9<=опт3,цена3*A9,цена4*A9)))
  - keys:
    - Enter
- title: Каждый заказ — свою ветку
  text: 'Протяните формулу до <code>B12</code>. 900 мешков не проходят первую проверку, но проходят вторую: 2 700 × 900
    = 2 430 000 ₸. 1 500 — третья ветка, 3 450 000 ₸. 2 600 не прошли ни одну проверку — работает последнее «иначе»: 2 000
    × 2 600 = <b>5 200 000 ₸</b>.'
  actions:
  - click: B9
  - fill: B9:B12
- title: 'Частая ошибка: порядок проверок и скобки'
  text: 'Проверять границы с конца: <code>{f:=IF(A9<=опт3,цена3*A9,…)}</code> — тогда и 450 мешков попадут в первую проверку
    «не больше 2 000» и получат не ту цену. Проверяйте от меньшей границы к большей. И считайте скобки: на каждую {fn:IF}
    — одна закрывающая в конце.'
  actions:
  - click: B9
  - showRefs: B9
  - wait: 2500
- title: Что запомнить
  text: <code>{f:=IF(условие,если_да,если_нет)}</code>; вложенные {fn:IF} — цепочка проверок, первая верная решает, последнее
    «иначе» — для всех остальных. В Excel можно вложить до 64 {fn:IF}. <b>На работе пригодится</b> для шкал скидок, тарифов,
    комиссий.
  actions:
  - click: B12
