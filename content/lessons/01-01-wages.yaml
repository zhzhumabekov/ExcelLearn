# Свой пример по мотивам рис. 1.1 (почасовая оплата сотрудников кафе). Прототип: prototypes/lesson-02-wages.html
id: wages-weekly-salary
chapter: ch01
order: 1
title: Расчёт недельной платёжной ведомости
source: Свой пример (кафе в Алматы, почасовая оплата)

sheet:
  file: Табель_кафе.xlsx
  name: Неделя
  columns: { A: 150, B: 60, C: 110, D: 120, E: 130, F: 30 }
  rows: 14
  cells:
    A1: { v: Сотрудник, style: head }
    B1: { v: Часы, style: head }
    C1: { v: Ставка в час, style: head }
    D1: { v: За неделю, style: head }
    A2: Айгерим Сапарова
    B2: 49
    C2: { v: 1800, fmt: kzt }
    A3: Данияр Ахметов
    B3: 36
    C3: { v: 2300, fmt: kzt }
    A4: Ольга Пак
    B4: 43
    C4: { v: 2500, fmt: kzt }
    A5: Ержан Тулеуов
    B5: 35
    C5: { v: 1800, fmt: kzt }
    A6: Мадина Жуматова
    B6: 38
    C6: { v: 1600, fmt: kzt }
    A7: Тимур Ким
    B7: 38
    C7: { v: 2500, fmt: kzt }
    A8: Асель Нурланова
    B8: 42
    C8: { v: 2000, fmt: kzt }
    A9: Руслан Искаков
    B9: 39
    C9: { v: 1600, fmt: kzt }
    # Пустые ячейки с форматом: сюда попадут результаты формул
    D2: { fmt: kzt }
    D3: { fmt: kzt }
    D4: { fmt: kzt }
    D5: { fmt: kzt }
    D6: { fmt: kzt }
    D7: { fmt: kzt }
    D8: { fmt: kzt }
    D9: { fmt: kzt }
    A10: { v: Итого, style: label }
    C12: { v: В среднем, style: label }
    D12: { fmt: kzt }

# FORMULATEXT сверяется в английском режиме.
expect:
  D2: 88200
  D3: 82800
  D4: 107500
  D5: 63000
  D6: 60800
  D7: 95000
  D8: 84000
  D9: 62400
  E2: "=B2*C2"
  E9: "=B9*C9"
  B10: 320
  B11: "=SUM(B2:B9)"
  D12: 80462.5
  D13: "=AVERAGE(D2:D9)"

steps:
  - title: Ситуация
    text: >-
      Вы администратор кафе в Алматы. Сотрудники работают сменами, и оплата у них <b>почасовая</b>:
      у каждого свои часы и своя ставка. В пятницу бухгалтер ждёт от вас <b>оплату каждого за неделю</b>,
      <b>сумму часов</b> и <b>среднюю оплату</b>. Удержания (ОПВ, ИПН) бухгалтер посчитает сам — нам нужна
      сумма до удержаний.
    say: >-
      Вы администратор кафе в Алматы. Оплата у сотрудников почасовая, у каждого свои часы и ставка. Посчитаем
      оплату каждого за неделю, сумму часов и среднюю оплату — до удержаний.
    actions:
      - wait: 3500

  - title: Формула =B2*C2
    text: >-
      Оплата Айгерим — это часы × ставка. Выделите <code>D2</code>, введите <code>=</code>, щёлкните
      <code>B2</code>, введите <code>*</code> и щёлкните <code>C2</code>. Ссылки окрашиваются в разные
      цвета — сразу видно, откуда берутся данные. После <kbd>Enter</kbd>: <b>88 200 ₸</b>.
    say: >-
      Оплата Айгерим — это часы, умноженные на ставку. Выделяем ячейку Дэ два, ставим знак «равно»,
      щёлкаем Бэ два, ставим звёздочку — знак умножения — и щёлкаем Цэ два. Нажимаем Enter —
      восемьдесят восемь тысяч двести тенге.
    actions:
      - click: D2
      - type: "="
      - clickRef: B2
      - type: "*"
      - clickRef: C2
      - keys: [Enter]

  - title: "Копирование: Ctrl+C"
    text: >-
      Частая ошибка новичков — набрать в ячейке <code>=49*1800</code>. Тогда при смене часов формулу придётся
      исправлять вручную. Ссылки на ячейки пересчитываются сами, и их можно копировать. Выделите
      <code>D2</code> и нажмите <kbd>Ctrl</kbd>+<kbd>C</kbd> — вокруг ячейки «бегущая» рамка.
    say: >-
      Не пишите в формуле сами числа — только ссылки на ячейки: тогда формула пересчитается сама, и её можно
      копировать. Выделяем Дэ два и нажимаем Control C. Вокруг ячейки появляется бегущая рамка.
    actions:
      - click: D2
      - keys: [Ctrl, C]

  - title: Вставка в D3:D9
    text: >-
      Выделите <code>D3:D9</code> и нажмите <kbd>Enter</kbd> (или <kbd>Ctrl</kbd>+<kbd>V</kbd>). Формула
      применится ко всем сотрудникам сразу — хоть к восьми, хоть к восьмистам.
    say: >-
      Выделяем диапазон от Дэ три до Дэ девять и нажимаем Enter. Формула применяется ко всем сотрудникам
      сразу — хоть к восьмистам.
    actions:
      - dragSelect: D3:D9
      - keys: [Enter]

  - title: Маркер заполнения
    text: >-
      Второй способ. Отменим вставку (<kbd>Ctrl</kbd>+<kbd>Z</kbd>) и наведём курсор на квадратик в правом
      нижнем углу <code>D2</code>: курсор станет <b>тонким чёрным крестиком</b>. Зажмите левую кнопку мыши
      и протяните до <code>D9</code>.
    say: >-
      Есть и второй способ. Отменим вставку сочетанием Control Z. Наводим курсор на квадратик в правом
      нижнем углу Дэ два — он становится тонким чёрным крестиком. Зажимаем кнопку мыши и тянем до Дэ девять.
    actions:
      - keys: [Ctrl, Z]
      - click: D2
      - fill: D2:D9

  - title: Относительные ссылки
    text: >-
      Выделим <code>D6</code>: в ней <code>=B6*C6</code> — часы и ставка Мадины. В каждой строке Excel
      перемножает два значения <b>слева</b> от ячейки: при копировании ссылки сдвигаются вместе с формулой.
    say: >-
      Выделим Дэ шесть: здесь часы и ставка Мадины. В каждой строке Excel перемножает два значения слева от
      ячейки — ссылки сдвинулись вместе с формулой.
    actions:
      - click: D6
      - showRefs: D6
      - click: D3
      - showRefs: D3

  - title: "{fn:FORMULATEXT}: текст формулы на листе"
    text: >-
      Бухгалтеру удобно видеть, <b>как</b> посчитана сумма. Функция <code>{fn:FORMULATEXT}</code> выводит текст
      формулы прямо на лист. Вводим в <code>E2</code> формулу <code>{f:=FORMULATEXT(D2)}</code> и
      протягиваем вниз.
    say: >-
      Бухгалтеру удобно видеть, как посчитана сумма. Функция {fn:FORMULATEXT} выводит текст формулы на лист.
      Вводим её в Е два со ссылкой на Дэ два и протягиваем вниз.
    actions:
      - click: E2
      - type: "=FORMULATEXT("
      - clickRef: D2
      - type: ")"
      - keys: [Enter]
      - click: E2
      - fill: E2:E9

  - title: "Сумма часов: {fn:SUM}"
    text: >-
      В <code>B10</code> считаем, сколько часов кафе отработало за неделю: <code>{f:=SUM(B2:B9)}</code>.
      Получаем <b>320</b>. В <code>B11</code> выводим текст формулы через <code>{fn:FORMULATEXT}</code>.
    say: >-
      В ячейке Бэ десять считаем общее число часов функцией {fn:SUM} — от Бэ два до Бэ девять.
      Получаем триста двадцать часов. В Бэ одиннадцать выводим текст этой формулы.
    actions:
      - click: B10
      - type: "=SUM("
      - dragRef: B2:B9
      - type: ")"
      - keys: [Enter]
      - type: "=FORMULATEXT(B10)"
      - keys: [Enter]

  - title: "Средняя оплата: {fn:AVERAGE}"
    text: >-
      В <code>D12</code> вводим <code>{f:=AVERAGE(D2:D9)}</code>. Средняя оплата за неделю —
      <b>80 463 ₸</b> (в ячейке 80 462,5; формат «тенге» показывает без тиынов).
    say: >-
      В Дэ двенадцать вводим функцию {fn:AVERAGE} от Дэ два до Дэ девять. Средняя оплата за неделю —
      около восьмидесяти тысяч пятисот тенге.
    actions:
      - click: D12
      - type: "=AVERAGE("
      - dragRef: D2:D9
      - type: ")"
      - keys: [Enter]
      - type: "=FORMULATEXT(D12)"
      - keys: [Enter]

  - title: Что запомнить
    text: >-
      В формулах — <b>ссылки, а не числа</b> (<code>=B2*C2</code>). Формулу копируют через
      <kbd>Ctrl</kbd>+<kbd>C</kbd> / <kbd>Enter</kbd> или маркером заполнения; <code>{fn:SUM}</code> и
      <code>{fn:AVERAGE}</code> дают итог и среднее, <code>{fn:FORMULATEXT}</code> показывает расчёт.
      <b>На работе пригодится</b> для табеля, сдельной оплаты, расчёта премий.
    say: >-
      Готово! В формулах — ссылки, а не числа. Формулу копируют или протягивают маркером, а сумма и среднее
      считаются функциями. Это пригодится для табеля, сдельной оплаты и премий.
    actions:
      - click: D12
