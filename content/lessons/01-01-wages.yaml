# Свой пример по мотивам рис. 1.1 (почасовая оплата сотрудников кафе). Прототип: prototypes/lesson-02-wages.html
id: wages-weekly-salary
chapter: ch01
order: 1
title: Расчёт недельной платёжной ведомости
source: Свой пример (кафе в Алматы, почасовая оплата)

sheet:
  file: Табель_кафе.xlsx
  name: Неделя
  columns: { A: 20, B: 150, C: 60, D: 110, E: 120, F: 130, G: 30 }
  rows: 16
  cells:
    B3: { v: Сотрудник, style: head }
    C3: { v: Часы, style: head }
    D3: { v: Ставка в час, style: head }
    E3: { v: За неделю, style: head }
    B4: Айгерим Сапарова
    C4: 49
    D4: { v: 1800, fmt: kzt }
    B5: Данияр Ахметов
    C5: 36
    D5: { v: 2300, fmt: kzt }
    B6: Ольга Пак
    C6: 43
    D6: { v: 2500, fmt: kzt }
    B7: Ержан Тулеуов
    C7: 35
    D7: { v: 1800, fmt: kzt }
    B8: Мадина Жуматова
    C8: 38
    D8: { v: 1600, fmt: kzt }
    B9: Тимур Ким
    C9: 38
    D9: { v: 2500, fmt: kzt }
    B10: Асель Нурланова
    C10: 42
    D10: { v: 2000, fmt: kzt }
    B11: Руслан Искаков
    C11: 39
    D11: { v: 1600, fmt: kzt }
    # Пустые ячейки с форматом: сюда попадут результаты формул
    E4: { fmt: kzt }
    E5: { fmt: kzt }
    E6: { fmt: kzt }
    E7: { fmt: kzt }
    E8: { fmt: kzt }
    E9: { fmt: kzt }
    E10: { fmt: kzt }
    E11: { fmt: kzt }
    B12: { v: Итого, style: label }
    D14: { v: В среднем, style: label }
    E14: { fmt: kzt }

# FORMULATEXT сверяется в английском режиме.
expect:
  E4: 88200
  E5: 82800
  E6: 107500
  E7: 63000
  E8: 60800
  E9: 95000
  E10: 84000
  E11: 62400
  F4: "=C4*D4"
  F11: "=C11*D11"
  C12: 320
  C13: "=SUM(C4:C11)"
  E14: 80462.5
  E15: "=AVERAGE(E4:E11)"

steps:
  - title: Ситуация
    text: >-
      Вы администратор кафе в Алматы. Сотрудники работают сменами, и оплата у них <b>почасовая</b>:
      у каждого свои часы и своя ставка. В пятницу бухгалтер ждёт от вас <b>оплату каждого за неделю</b>,
      <b>сумму часов</b> и <b>среднюю оплату</b>. Удержания (ОПВ, ИПН) бухгалтер посчитает сам — нам нужна
      сумма до удержаний.
    say: >-
      Вы администратор кафе в Алматы. Оплата у сотрудников почасовая, у каждого свои часы и ставка. Посчитаем
      оплату каждого за неделю, сумму часов и среднюю оплату — до удержаний.
    actions:
      - wait: 3500

  - title: Формула =C4*D4
    text: >-
      Оплата Айгерим — это часы × ставка. Выделите <code>E4</code>, введите <code>=</code>, щёлкните
      <code>C4</code>, введите <code>*</code> и щёлкните <code>D4</code>. Ссылки окрашиваются в разные
      цвета — сразу видно, откуда берутся данные. После <kbd>Enter</kbd>: <b>88 200 ₸</b>.
    say: >-
      Оплата Айгерим — это часы, умноженные на ставку. Выделяем ячейку Е четыре, ставим знак «равно»,
      щёлкаем Цэ четыре, ставим звёздочку — знак умножения — и щёлкаем Дэ четыре. Нажимаем Enter —
      восемьдесят восемь тысяч двести тенге.
    actions:
      - click: E4
      - type: "="
      - clickRef: C4
      - type: "*"
      - clickRef: D4
      - keys: [Enter]

  - title: "Копирование: Ctrl+C"
    text: >-
      Частая ошибка новичков — набрать в ячейке <code>=49*1800</code>. Тогда при смене часов формулу придётся
      исправлять вручную. Ссылки на ячейки пересчитываются сами, и их можно копировать. Выделите
      <code>E4</code> и нажмите <kbd>Ctrl</kbd>+<kbd>C</kbd> — вокруг ячейки «бегущая» рамка.
    say: >-
      Не пишите в формуле сами числа — только ссылки на ячейки: тогда формула пересчитается сама, и её можно
      копировать. Выделяем Е четыре и нажимаем Control C. Вокруг ячейки появляется бегущая рамка.
    actions:
      - click: E4
      - keys: [Ctrl, C]

  - title: Вставка в E5:E11
    text: >-
      Выделите <code>E5:E11</code> и нажмите <kbd>Enter</kbd> (или <kbd>Ctrl</kbd>+<kbd>V</kbd>). Формула
      применится ко всем сотрудникам сразу — хоть к восьми, хоть к восьмистам.
    say: >-
      Выделяем диапазон от Е пять до Е одиннадцать и нажимаем Enter. Формула применяется ко всем сотрудникам
      сразу — хоть к восьмистам.
    actions:
      - dragSelect: E5:E11
      - keys: [Enter]

  - title: Маркер заполнения
    text: >-
      Второй способ. Отменим вставку (<kbd>Ctrl</kbd>+<kbd>Z</kbd>) и наведём курсор на квадратик в правом
      нижнем углу <code>E4</code>: курсор станет <b>тонким чёрным крестиком</b>. Зажмите левую кнопку мыши
      и протяните до <code>E11</code>.
    say: >-
      Есть и второй способ. Отменим вставку сочетанием Control Z. Наводим курсор на квадратик в правом
      нижнем углу Е четыре — он становится тонким чёрным крестиком. Зажимаем кнопку мыши и тянем до Е
      одиннадцать.
    actions:
      - keys: [Ctrl, Z]
      - click: E4
      - fill: E4:E11

  - title: Относительные ссылки
    text: >-
      Выделим <code>E8</code>: в ней <code>=C8*D8</code> — часы и ставка Мадины. В каждой строке Excel
      перемножает два значения <b>слева</b> от ячейки: при копировании ссылки сдвигаются вместе с формулой.
    say: >-
      Выделим Е восемь: здесь часы и ставка Мадины. В каждой строке Excel перемножает два значения слева от
      ячейки — ссылки сдвинулись вместе с формулой.
    actions:
      - click: E8
      - showRefs: E8
      - click: E5
      - showRefs: E5

  - title: "{fn:FORMULATEXT}: текст формулы на листе"
    text: >-
      Бухгалтеру удобно видеть, <b>как</b> посчитана сумма. Функция <code>{fn:FORMULATEXT}</code> выводит текст
      формулы прямо на лист. Вводим в <code>F4</code> формулу <code>{f:=FORMULATEXT(E4)}</code> и
      протягиваем вниз.
    say: >-
      Бухгалтеру удобно видеть, как посчитана сумма. Функция {fn:FORMULATEXT} выводит текст формулы на лист.
      Вводим её в Эф четыре со ссылкой на Е четыре и протягиваем вниз.
    actions:
      - click: F4
      - type: "=FORMULATEXT("
      - clickRef: E4
      - type: ")"
      - keys: [Enter]
      - click: F4
      - fill: F4:F11

  - title: "Сумма часов: {fn:SUM}"
    text: >-
      В <code>C12</code> считаем, сколько часов кафе отработало за неделю: <code>{f:=SUM(C4:C11)}</code>.
      Получаем <b>320</b>. В <code>C13</code> выводим текст формулы через <code>{fn:FORMULATEXT}</code>.
    say: >-
      В ячейке Цэ двенадцать считаем общее число часов функцией {fn:SUM} — от Цэ четыре до Цэ одиннадцать.
      Получаем триста двадцать часов. В Цэ тринадцать выводим текст этой формулы.
    actions:
      - click: C12
      - type: "=SUM("
      - dragRef: C4:C11
      - type: ")"
      - keys: [Enter]
      - type: "=FORMULATEXT(C12)"
      - keys: [Enter]

  - title: "Средняя оплата: {fn:AVERAGE}"
    text: >-
      В <code>E14</code> вводим <code>{f:=AVERAGE(E4:E11)}</code>. Средняя оплата за неделю —
      <b>80 463 ₸</b> (в ячейке 80 462,5; формат «тенге» показывает без тиынов).
    say: >-
      В Е четырнадцать вводим функцию {fn:AVERAGE} от Е четыре до Е одиннадцать. Средняя оплата за неделю —
      около восьмидесяти тысяч пятисот тенге.
    actions:
      - click: E14
      - type: "=AVERAGE("
      - dragRef: E4:E11
      - type: ")"
      - keys: [Enter]
      - type: "=FORMULATEXT(E14)"
      - keys: [Enter]

  - title: Что запомнить
    text: >-
      В формулах — <b>ссылки, а не числа</b> (<code>=C4*D4</code>). Формулу копируют через
      <kbd>Ctrl</kbd>+<kbd>C</kbd> / <kbd>Enter</kbd> или маркером заполнения; <code>{fn:SUM}</code> и
      <code>{fn:AVERAGE}</code> дают итог и среднее, <code>{fn:FORMULATEXT}</code> показывает расчёт.
      <b>На работе пригодится</b> для табеля, сдельной оплаты, расчёта премий.
    say: >-
      Готово! В формулах — ссылки, а не числа. Формулу копируют или протягивают маркером, а сумма и среднее
      считаются функциями. Это пригодится для табеля, сдельной оплаты и премий.
    actions:
      - click: E14
