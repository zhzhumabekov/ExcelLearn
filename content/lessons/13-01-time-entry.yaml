# Глава 13 (время). Собрано генератором; ответы expect посчитаны независимо.
id: time-entry
chapter: ch13
order: 1
title: Ввод времени и функция ВРЕМЯ
source: Time.xlsx (рис. 13.1)
sheet:
  file: Время.xlsx
  name: Время
  columns:
    A: 200
    B: 170
  rows: 12
  cells:
    A1:
      v: Что вводим
      style: head
    B1:
      v: Результат
      style: head
    A2: Набрали 8:30
    A3: Набрали 20:30
    A4: ВРЕМЯ(15; 10; 30)
    B4:
      fmt: timeSec
    A5: ВРЕМЯ(25; 10; 30)
    B5:
      fmt: timeSec
    A6: Дата и время
    A7: ВРЕМЗНАЧ("8:30")
    A9: Часы из B4
    A10: Минуты из B4
    A11: Секунды из B4
expect:
  B2: 0.354166667
  B3: 0.854166667
  B4: 0.632291667
  B5: 0.048958333
  B6: 46308.232638889
  B7: 0.354166667
  B9: 15
  B10: 10
  B11: 30
steps:
- title: Ситуация
  text: 'Диспетчер автобусного парка в Шымкенте ведёт расписание. Время в Excel вводят через двоеточие: часы:минуты или
    часы:минуты:секунды. Excel узнаёт время и сам ставит ячейке формат времени, а хранит его числом — долей суток.'
  actions:
  - wait: 3000
- title: Набираем время
  text: 'В <code>B2</code> наберите 8:30, в <code>B3</code> — 20:30: вечернее время пишут в 24-часовом виде. За ячейкой
    — числа: 8:30 — это 8,5 из 24 часов, 0,3542 суток; 20:30 — 0,8542.'
  actions:
  - click: B2
  - type: '8:30'
  - keys:
    - Enter
  - click: B3
  - type: '20:30'
  - keys:
    - Enter
- title: Функция {fn:TIME}
  text: '<code>{f:=TIME(15,10,30)}</code> в <code>B4</code> — 15 часов, 10 минут, 30 секунд: 15:10:30. {fn:TIME} собирает
    время из часов, минут и секунд, которые лежат в разных ячейках или посчитаны формулой. Больше суток она не даёт: <code>{f:=TIME(25,10,30)}</code>
    — это 25 − 24 = <b>1:10:30</b>.'
  actions:
  - click: B4
  - type: =TIME(15,10,30)
  - keys:
    - Enter
  - click: B5
  - type: =TIME(25,10,30)
  - keys:
    - Enter
- title: Дата и время в одной ячейке
  text: 'Наберите дату, пробел и время: 13.10.2026 5:35. В ячейке — серийный номер дня плюс доля суток: 46308,2326. Целая
    часть — 13 октября, дробная 0,2326 — это 5:35 утра.'
  actions:
  - click: B6
  - type: 13.10.2026 5:35
  - keys:
    - Enter
- title: '{fn:TIMEVALUE}: текст → время'
  text: <code>{f:=TIMEVALUE("8:30")}</code> превращает текст «8:30» в число <b>0,3542</b> — ту же долю суток. Нужна, когда
    время пришло текстом из другой программы и его нельзя сложить или вычесть.
  actions:
  - click: B7
  - type: =TIMEVALUE("8:30")
  - keys:
    - Enter
- title: '{fn:HOUR}, {fn:MINUTE}, {fn:SECOND}'
  text: Обратная задача — разобрать время на части. <code>{f:=HOUR(B4)}</code> — 15, <code>{f:=MINUTE(B4)}</code> — 10,
    <code>{f:=SECOND(B4)}</code> — 30. Так считают, например, во сколько часов пришло больше всего звонков.
  actions:
  - click: B9
  - type: =HOUR(B4)
  - keys:
    - Enter
  - click: B10
  - type: =MINUTE(B4)
  - keys:
    - Enter
  - click: B11
  - type: =SECOND(B4)
  - keys:
    - Enter
- title: Что запомнить
  text: Время вводят через двоеточие, хранится оно долей суток. <code>{f:=TIME(часы,минуты,секунды)}</code> собирает время,
    {fn:HOUR}, {fn:MINUTE}, {fn:SECOND} — разбирают, {fn:TIMEVALUE} — переводит текст в время. <b>На работе пригодится</b>
    для графиков смен, расписаний, учёта звонков.
  actions:
  - click: B4
