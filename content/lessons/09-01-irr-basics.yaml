steps:
- title: Ситуация
  text: 'ТОО строит склад в Алматы: <b>40 млн ₸</b> сегодня, потом 6 лет аренды приносят 8–15 млн ₸ в год. Деньги на стройку
    стоят компании 15% в год. ЧПС отвечает «сколько проект добавит», а руководство спрашивает проще: «сколько процентов
    в год он приносит?». Это и есть <b>внутренняя ставка доходности</b> — ВСД.'
  actions:
  - wait: 3000
- title: '{fn:IRR}: ставка, при которой ЧПС = 0'
  text: 'В <code>B6</code>: <code>{f:=IRR(B4:H4)}</code>. {fn:IRR} подбирает ставку, при которой ЧПС всех потоков равна
    нулю. В отличие от {fn:NPV}, первый поток {fn:IRR} считает сегодняшним, поэтому передаём все потоки, вместе с −40 млн.
    Ответ — <b>20,96%</b>: вложенные деньги приносят 20,96% в год.'
  actions:
  - click: B6
  - type: =IRR(
  - dragRef: B4:H4
  - type: )
  - keys:
    - Enter
- title: ВСД и ЧПС говорят одно и то же
  text: 'В <code>B7</code> — ЧПС при стоимости капитала: <code>{f:=B4+NPV(B1,C4:H4)}</code> — <b>7,32</b> млн ₸, больше
    нуля. Так и должно быть: ВСД (20,96%) выше 15%, а при ставке ниже ВСД ЧПС такого проекта положительна. Ставка, равная
    ВСД, дала бы ровно ноль.'
  actions:
  - click: B7
  - type: '='
  - clickRef: B4
  - type: +NPV(
  - clickRef: B1
  - type: ','
  - dragRef: C4:H4
  - type: )
  - keys:
    - Enter
- title: 'Решение: ВСД больше стоимости капитала'
  text: '<code>{f:=IF(B6>B1,"берём","отказываемся")}</code> в <code>B8</code> — <b>берём</b>. Правило простое: проект увеличивает
    стоимость компании, если его ВСД выше ставки, под которую компания берёт деньги. Здесь 20,96% против 15%.'
  actions:
  - click: B8
  - type: =IF(B6>B1,"берём","отказываемся")
  - keys:
    - Enter
- title: 'Единственная ли ВСД: второй аргумент'
  text: '{fn:IRR} ищет ответ шагами, начиная с <b>предположения</b> — второго аргумента, по умолчанию 10%. Если ВСД у проекта
    несколько, от предположения зависит, какую найдёт Excel. Проверим: в <code>B11</code> <code>{f:=IRR($B$4:$H$4,A11)}</code>
    — потоки закреплены, предположение берётся из своей строки. Протяните до <code>B20</code>: от −90% до 90% ответ один
    — ВСД единственная.'
  actions:
  - click: B11
  - type: =IRR($B$4:$H$4,
  - clickRef: A11
  - type: )
  - keys:
    - Enter
  - click: B11
  - fill: B11:B20
- title: 'Частая ошибка: без сегодняшнего потока'
  text: 'Передать в {fn:IRR} только доходы, без −40 млн, «как в {fn:NPV}»: все потоки положительные, ЧПС не станет нулём
    ни при какой ставке, и {fn:IRR} вернёт <code>#ЧИСЛО!</code>. В {fn:IRR} — все потоки, начиная с сегодняшнего.'
  actions:
  - click: B6
  - showRefs: B6
  - wait: 2500
- title: Что запомнить
  text: <code>{f:=IRR(потоки)}</code> — ставка, при которой ЧПС = 0; первый поток — сегодняшний. ВСД выше стоимости капитала
    — проект выгоден. Предположение (второй аргумент) помогает проверить, одна ли ВСД. <b>На работе пригодится</b>, чтобы
    ответить «сколько процентов в год даёт проект».
  actions:
  - click: B6
