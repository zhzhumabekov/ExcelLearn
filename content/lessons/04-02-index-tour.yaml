steps:
- title: Ситуация
  text: 'Футбольная команда из Шымкента едет на выездную серию: Алматы, Караганда, Астана, Павлодар, Костанай —
    и домой. Сколько километров проедет автобус? Маршрут записан <b>номерами городов</b> в <code>C14:C20</code>.
    Таблице расстояний уже дано имя <code>расстояния</code>.'
  actions:
  - wait: 3000
- title: Названия по номерам
  text: '{fn:INDEX} работает и с одним столбцом: тогда нужен только номер строки. В <code>B14</code> введите <code>{f:=INDEX($B$4:$B$11,C14)}</code>
    — Excel подставит название города № 8, и протяните до <code>B20</code>.'
  actions:
  - click: B14
  - type: =INDEX($B$4:$B$11,
  - clickRef: C14
  - type: )
  - keys:
    - Enter
  - click: B14
  - fill: B14:B20
- title: Номера — из ячеек
  text: 'Расстояние первого переезда: строка — номер города, откуда едем (<code>C14</code>), столбец — номер следующего
    города (<code>C15</code>). В <code>D14</code>: <code>{f:=INDEX(расстояния,C14,C15)}</code> — <b>720 км</b>.'
  actions:
  - click: D14
  - type: =INDEX(расстояния,
  - clickRef: C14
  - type: ','
  - clickRef: C15
  - type: )
  - keys:
    - Enter
- title: Протяните на весь маршрут
  text: 'Протяните <code>D14</code> до <code>D19</code>: в каждой строке ссылки сдвигаются на один город, и формула
    берёт пару «этот город → следующий». Последняя строка — дорога из Костаная домой.'
  actions:
  - click: D14
  - fill: D14:D19
  - showRefs: D18
  - wait: 1200
- title: Итог
  text: 'В <code>D21</code> — <code>{f:=SUM(D14:D19)}</code>: за серию автобус проедет <b>5 000 км</b>. Поменяйте
    порядок городов в столбце C — итог пересчитается сам.'
  actions:
  - click: D21
  - type: =SUM(
  - dragRef: D14:D19
  - type: )
  - keys:
    - Enter
- title: Что запомнить
  text: 'Номера строки и столбца в {fn:INDEX} можно брать <b>из ячеек</b> — так одна формула обслуживает любой маршрут.
    Для одного столбца хватит номера строки: <code>{f:=INDEX(B4:B11,3)}</code>. <b>На работе пригодится</b> для
    маршрутов доставки, графиков командировок, расчёта пробега.'
  actions:
  - click: D21
