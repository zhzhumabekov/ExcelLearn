steps:
- title: Ситуация
  text: 'Футбольная команда из Шымкента едет на выездную серию: Алматы, Караганда, Астана, Павлодар, Костанай —
    и домой. Сколько километров проедет автобус? Маршрут записан <b>номерами городов</b> в <code>C20:C26</code>.
    Таблице расстояний уже дано имя <code>расстояния</code>.'
  say: Команда из Шымкента едет на выездную серию по пяти городам и возвращается домой. Посчитаем, сколько километров
    проедет автобус. Маршрут записан номерами городов.
  actions:
  - wait: 3000
- title: Названия по номерам
  text: '{fn:INDEX} работает и с одним столбцом: тогда нужен только номер строки. В <code>B20</code> введите <code>{f:=INDEX($B$10:$B$17,C20)}</code>
    — Excel подставит название города № 8, и протяните до <code>B26</code>.'
  say: '{fn:INDEX} работает и с одним столбцом — тогда нужен только номер строки. Подставляем названия городов по
    их номерам и протягиваем вниз.'
  actions:
  - click: B20
  - type: =INDEX($B$10:$B$17,
  - clickRef: C20
  - type: )
  - keys:
    - Enter
  - click: B20
  - fill: B20:B26
- title: Номера — из ячеек
  text: 'Расстояние первого переезда: строка — номер города, откуда едем (<code>C20</code>), столбец — номер следующего
    города (<code>C21</code>). В <code>D20</code>: <code>{f:=INDEX(расстояния,C20,C21)}</code> — <b>720 км</b>.'
  say: 'Расстояние переезда: номер строки — город, откуда едем, номер столбца — следующий город. Номера берём прямо
    из ячеек.'
  actions:
  - click: D20
  - type: =INDEX(расстояния,
  - clickRef: C20
  - type: ','
  - clickRef: C21
  - type: )
  - keys:
    - Enter
- title: Протяните на весь маршрут
  text: 'Протяните <code>D20</code> до <code>D25</code>: в каждой строке ссылки сдвигаются на один город, и формула
    берёт пару «этот город → следующий». Последняя строка — дорога из Костаная домой.'
  say: Протягиваем формулу на весь маршрут. В каждой строке берётся пара «этот город — следующий».
  actions:
  - click: D20
  - fill: D20:D25
  - showRefs: D24
  - wait: 1200
- title: Итог
  text: 'В <code>D27</code> — <code>{f:=SUM(D20:D25)}</code>: за серию автобус проедет <b>5 000 км</b>. Поменяйте
    порядок городов в столбце C — итог пересчитается сам.'
  say: Складываем переезды — пять тысяч километров. Если поменять порядок городов, итог пересчитается сам.
  actions:
  - click: D27
  - type: =SUM(
  - dragRef: D20:D25
  - type: )
  - keys:
    - Enter
- title: Что запомнить
  text: 'Номера строки и столбца в {fn:INDEX} можно брать <b>из ячеек</b> — так одна формула обслуживает любой маршрут.
    Для одного столбца хватит номера строки: <code>{f:=INDEX(B10:B17,3)}</code>. <b>На работе пригодится</b> для
    маршрутов доставки, графиков командировок, расчёта пробега.'
  say: Готово! Номера для {fn:INDEX} можно брать из ячеек — одна формула для любого маршрута. Пригодится для маршрутов
    доставки и командировок.
  actions:
  - click: D27
