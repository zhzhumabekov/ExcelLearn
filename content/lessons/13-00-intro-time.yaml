# Вводный урок главы. Собрано генератором gen_intros.py; ответы expect посчитаны независимо.
id: intro-time
chapter: ch13
order: 0
title: Время в Excel — доля суток
source: Свой пример (часы работы пекарни)
sheet:
  file: Доля_суток.xlsx
  name: Время
  columns:
    A: 130
    B: 150
  rows: 5
  cells:
    A1:
      v: Время
      style: head
    B1:
      v: Как число
      style: head
    B2:
      fmt: time
    B3:
      fmt: time
    B4:
      fmt: time
expect:
  A2: 0.125
  B2: 0.125
  B3: 0.5
  B4: 0.75
steps:
- title: Ситуация
  text: Пекарня в Таразе начинает выпечку в 3:00, открывается в 12:00 и закрывается в 18:00. Чтобы считать со временем —
    длительность смен, часы, оплату, — нужно знать, как Excel его хранит.
  actions:
  - wait: 3000
- title: Набираем время
  text: 'В <code>A2:A4</code> наберите 3:00, 12:00 и 18:00. Двоеточие подсказывает Excel, что это время: он сам ставит формат
    времени.'
  actions:
  - click: A2
  - type: '3:00'
  - keys:
    - Enter
  - click: A3
  - type: '12:00'
  - keys:
    - Enter
  - click: A4
  - type: '18:00'
  - keys:
    - Enter
- title: Ссылка — и тот же вид
  text: 'В <code>B2</code>: <code>{f:=A2}</code>, протяните до <code>B4</code>. Пока видно то же время: ячейки в формате
    времени. Но что за ним стоит?'
  actions:
  - click: B2
  - type: =A2
  - keys:
    - Enter
  - click: B2
  - fill: B2:B4
- title: Время — доля суток
  text: 'Выделите <code>B2:B4</code>, <b>Ctrl+1 → Общий → OK</b>. Появились числа: 3:00 — <b>0,125</b> (3 из 24 часов),
    12:00 — <b>0,5</b>, 18:00 — <b>0,75</b>. Время для Excel — доля суток от полуночи, поэтому его можно складывать, вычитать
    и умножать.'
  actions:
  - dragSelect: B2:B4
  - keys:
    - Ctrl
    - '1'
  - dialogPick: Общий
  - wait: 600
  - dialogButton: OK
- title: Что будет в главе
  text: '<b>13.1</b> — ввод времени, {fn:TIME}, {fn:TIMEVALUE}, {fn:HOUR}, {fn:MINUTE}, {fn:SECOND}<br><b>13.2</b> — разница
    во времени, формат Числовой и решётки ####<br><b>13.3</b> — {fn:NOW}, {fn:TODAY} и время значением (Ctrl+Shift+;)<br><b>13.4</b>
    — смена через полночь: {fn:IF} и умножение на 24<br><b>13.5</b> — сумма часов больше суток: формат [ч]:мм:сс<br><b>13.6</b>
    — автозаполнение: расписание с шагом 20 минут'
  actions:
  - wait: 4000
- title: Что запомнить
  text: 'Время — доля суток: 6:00 = 0,25, 12:00 = 0,5. Дата со временем — номер дня плюс эта доля: 01.01.2026 6:00 = 46023,25.
    Формат ячейки меняет только вид. <b>На работе пригодится</b> для табеля, графиков и расписаний.'
  actions:
  - click: B4
