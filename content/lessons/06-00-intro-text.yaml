# Вводный урок главы. Собрано генератором gen_intros.py; ответы expect посчитаны независимо.
id: intro-text
chapter: ch06
order: 0
title: 'Текст в Excel: разобрать и собрать'
source: Свой пример (бейджи сотрудников)
sheet:
  file: Бейджи_сотрудников.xlsx
  name: Сотрудники
  columns:
    A: 200
    B: 130
    C: 110
    D: 140
  rows: 7
  cells:
    A1:
      v: Сотрудник
      style: head
    B1:
      v: Фамилия
      style: head
    C1:
      v: Имя
      style: head
    D1:
      v: Бейдж
      style: head
    A2: Ахметова Айгерим
    A3: Ким Олег
    A4: Сапаров Даурен
    A5: Нурланова Сауле
expect:
  B2: Ахметова
  C2: Айгерим
  D2: Айгерим А.
  B3: Ким
  C3: Олег
  D3: Олег К.
  B4: Сапаров
  C4: Даурен
  D4: Даурен С.
  B5: Нурланова
  C5: Сауле
  D5: Сауле Н.
steps:
- title: Ситуация
  text: 'Отдел кадров выгрузил список сотрудников: фамилия и имя — в одной ячейке. Для бейджей на конференцию нужно «Имя
    + первая буква фамилии». Переписывать сотню имён вручную не будем: в Excel есть <b>текстовые функции</b> и <b>мгновенное
    заполнение</b>.'
  say: 'Отдел кадров выгрузил список: фамилия и имя в одной ячейке. Для бейджей нужно имя и первая буква фамилии. Вручную
    не будем — есть текстовые функции и мгновенное заполнение.'
  actions:
  - wait: 3000
- title: 'Разобрать: фамилия'
  text: 'Фамилия — всё до первого пробела. <code>{fn:FIND}</code> находит номер пробела, <code>{fn:LEFT}</code> берёт столько
    символов слева, на один меньше. В <code>B2</code>: <code>{f:=LEFT(A2,FIND(" ",A2)-1)}</code> → <b>Ахметова</b>. Протяните
    до <code>B5</code>.'
  say: Фамилия — всё до первого пробела. {fn:FIND} находит пробел, {fn:LEFT} берёт символы слева до него. Протягиваем на
    весь список.
  actions:
  - click: B2
  - type: =LEFT(
  - clickRef: A2
  - type: ',FIND(" ",'
  - clickRef: A2
  - type: )-1)
  - keys:
    - Enter
  - click: B2
  - fill: B2:B5
- title: 'Без формул: мгновенное заполнение'
  text: Имя возьмём без формулы. Напечатайте в <code>C2</code> пример — <b>Айгерим</b>, нажмите <kbd>Enter</kbd>, затем
    <kbd>Ctrl</kbd>+<kbd>E</kbd>. Excel понял закономерность и заполнил остальные имена сам.
  say: 'Имя возьмём без формулы: печатаем один пример, Enter и Control E. Excel понял закономерность и заполнил остальные
    имена.'
  actions:
  - click: C2
  - type: Айгерим
  - keys:
    - Enter
  - keys:
    - Ctrl
    - E
  - wait: 600
- title: 'Собрать: бейдж'
  text: 'Текст собирают знаком <code>&</code>. В <code>D2</code>: <code>{f:=C2&" "&LEFT(B2,1)&"."}</code> — имя, пробел,
    первая буква фамилии и точка: <b>Айгерим А.</b>. Протяните до <code>D5</code>.'
  say: 'Текст собирают знаком амперсанд: имя, пробел, первая буква фамилии и точка. Протягиваем на весь список.'
  actions:
  - click: D2
  - type: '='
  - clickRef: C2
  - type: '&" "&LEFT('
  - clickRef: B2
  - type: ',1)&"."'
  - keys:
    - Enter
  - click: D2
  - fill: D2:D5
- title: Что будет в главе
  text: '<b>6.1–6.3</b> — взять часть строки: {fn:LEFT}, {fn:RIGHT}, {fn:MID}, {fn:FIND}, {fn:TRIM}<br><b>6.2</b> — регистр,
    замены и склейка: {fn:UPPER}, {fn:SUBSTITUTE}, &<br><b>6.4</b> — «Найти и заменить» и мастер «Текст по столбцам»<br><b>6.5–6.6</b>
    — график из символов и невидимые символы из банковских выгрузок<br><b>6.7</b> — мгновенное заполнение подробно<br><b>6.8–6.10</b>
    — казахские буквы, {fn:TEXTJOIN} и {fn:TEXT} для дат и чисел'
  say: В этой главе — как брать часть строки, менять регистр и склеивать текст, чистить выгрузки от лишних и невидимых символов,
    мгновенное заполнение, казахские буквы и функция {fn:TEXT}.
  actions:
  - wait: 4000
- title: Что запомнить
  text: 'Текст разбирают функциями (<code>{fn:LEFT}</code>, <code>{fn:FIND}</code> и др.) и собирают знаком <code>&</code>;
    разовую задачу быстрее решить <kbd>Ctrl</kbd>+<kbd>E</kbd>. <b>На работе пригодится</b>: ФИО, адреса и артикулы из учётных
    программ, списки рассылки, подписи и бейджи.'
  say: 'Запомните: текст разбирают функциями и собирают амперсандом, а разовую задачу быстрее решить мгновенным заполнением.
    Пригодится для ФИО, адресов, артикулов и списков из учётных программ.'
  actions:
  - click: D5
