steps:
- title: Ситуация
  text: Логист транспортной компании держит таблицу расстояний между восемью городами Казахстана. Строка — город,
    откуда едем, столбец — куда. Нужна формула, которая достаёт число <b>на пересечении</b> строки и столбца. Это
    функция <code>{fn:INDEX}</code>.
  say: Логист держит таблицу расстояний между городами. Строка — откуда едем, столбец — куда. Число на пересечении
    достаёт функция {fn:INDEX}.
  actions:
  - wait: 3000
- title: Имя для таблицы
  text: Выделите числа <code>C10:J17</code> — без подписей — и назовите их <code>расстояния</code>. Номера городов
    слева и сверху (1–8) — это номера строк и столбцов внутри этого диапазона.
  say: Выделяем только числа и называем диапазон «расстояния». Номера городов — это номера строк и столбцов внутри
    него.
  actions:
  - dragSelect: C10:J17
  - nameBox: расстояния
- title: '{fn:INDEX}(массив; строка; столбец)'
  text: '<code>{fn:INDEX}</code> берёт диапазон, номер строки и номер столбца <b>внутри этого диапазона</b>. Алматы
    — город № 2, Астана — № 3: в <code>C19</code> введите <code>{f:=INDEX(расстояния,2,3)}</code> — <b>1170 км</b>.'
  say: '{fn:INDEX} берёт диапазон, номер строки и номер столбца внутри него. Алматы — второй город, Астана — третий.
    Получаем тысячу сто семьдесят километров.'
  actions:
  - click: C19
  - type: =INDEX(расстояния,2,3)
  - keys:
    - Enter
- title: Номера считаются от начала диапазона
  text: 'Номер строки — не номер строки листа! Строка 2 диапазона <code>C10:J17</code> — это строка 11 листа. Так,
    <code>{f:=INDEX(A1:D12,2,3)}</code> вернул бы ячейку <code>C2</code>: вторая строка и третий столбец от угла
    <code>A1</code>.'
  say: 'Важно: номера считаются от начала диапазона, а не листа. Вторая строка диапазона — это одиннадцатая строка
    листа.'
  actions:
  - showRefs: C19
  - wait: 1500
- title: Шымкент → Актобе
  text: 'Шымкент — № 8, Актобе — № 1: <code>{f:=INDEX(расстояния,8,1)}</code> — <b>1560 км</b>.'
  say: Шымкент — восьмой, Актобе — первый. Получаем тысячу пятьсот шестьдесят километров.
  actions:
  - click: C20
  - type: =INDEX(расстояния,8,1)
  - keys:
    - Enter
- title: Что запомнить
  text: '<code>{fn:INDEX}(массив; номер_строки; номер_столбца)</code> возвращает значение на пересечении. Номера
    — внутри массива, с 1. Номер больше размера — ошибка <code>#ССЫЛКА!</code>. <b>На работе пригодится</b> для
    таблиц «откуда × куда»: расстояния, тарифы доставки, курсы валют.'
  say: 'Готово! {fn:INDEX} возвращает значение на пересечении строки и столбца диапазона. Пригодится для таблиц
    «откуда — куда»: расстояний, тарифов, курсов.'
  actions:
  - click: C19
