steps:
- title: Ситуация
  text: 'Правило трейдеров: <b>покупай</b>, когда индекс поднялся выше своего среднего за 15 месяцев, <b>продавай</b>, когда
    опустился ниже. Проверим его на индексе KASE за 42 месяца и сравним с «купил и держу». Таблица длинная — её придётся
    прокручивать.'
  actions:
  - wait: 3000
- title: Вид → Закрепить области
  text: 'Чтобы заголовки и месяцы не уезжали при прокрутке, выделите <code>C9</code> и выберите <b>Вид → Закрепить области</b>.
    Закрепится всё выше и левее выделенной ячейки: строки 1–8 и столбцы A:B. Граница закрепления — тёмная линия.'
  actions:
  - click: C9
  - freezePanes: panes
  - wait: 1000
- title: Прокрутка
  text: 'Прокрутим колёсиком вниз до строки 24: данные уезжают вверх, а заголовки в строке 8 и столбец месяцев остаются
    на месте. Первые 15 месяцев нужны для первого среднего, поэтому расчёт начинается в строке 24.'
  actions:
  - scroll: 15
  - wait: 800
- title: Среднее за 15 месяцев
  text: 'В <code>C24</code>: <code>{f:=AVERAGE(B9:B23)}</code> — среднее 15 прошлых месяцев. Чтобы протянуть формулу на
    все месяцы, дважды щёлкните по маркеру заполнения: Excel скопирует её вниз до конца данных в соседнем столбце. Диапазон
    сдвигается вместе со строкой — это и есть <b>скользящее</b> среднее.'
  actions:
  - click: C24
  - type: =AVERAGE(B9:B23)
  - keys:
    - Enter
  - fillDown: C24
- title: Есть ли акции в начале месяца
  text: 'В первом месяце акций нет — в <code>D24</code> «Нет». Дальше: если в прошлом месяце купили — «Да», если продали
    — «Нет», иначе как было: <code>{f:=IF(E24="Да","Да",IF(F24="Да","Нет",D24))}</code> в <code>D25</code>. Текст в формуле
    пишут в кавычках. Двойной щелчок по маркеру — на все месяцы.'
  actions:
  - click: D25
  - type: =IF(E24="Да","Да",IF(F24="Да","Нет",D24))
  - keys:
    - Enter
  - fillDown: D25
- title: 'Покупаем: {fn:AND}'
  text: 'Покупаем, только если акций нет <b>и</b> индекс выше среднего: <code>{f:=IF(AND(D24="Нет",B24>C24),"Да","Нет")}</code>.
    {fn:AND} возвращает {fn:TRUE}, когда верны все условия сразу. Продаём — если акции есть и индекс ниже среднего: <code>{f:=IF(AND(D24="Да",B24<C24),"Да","Нет")}</code>.'
  actions:
  - click: E24
  - type: =IF(AND(D24="Нет",B24>C24),"Да","Нет")
  - keys:
    - Enter
  - fillDown: E24
  - click: F24
  - type: =IF(AND(D24="Да",B24<C24),"Да","Нет")
  - keys:
    - Enter
  - fillDown: F24
- title: Денежный поток
  text: 'Купили — деньги уходят (минус индекс), продали — приходят: <code>{f:=IF(E24="Да",-B24,IF(F24="Да",B24,0))}</code>.
    В последнем месяце продаём всё, что есть: прокрутим вниз и в <code>G50</code> напишем <code>{f:=IF(D50="Да",B50,0)}</code>.'
  actions:
  - click: G24
  - type: =IF(E24="Да",-B24,IF(F24="Да",B24,0))
  - keys:
    - Enter
  - fillDown: G24
  - scroll: 26
  - click: G50
  - type: =IF(D50="Да",B50,0)
  - keys:
    - Enter
- title: Итог
  text: 'Строки 6–7 закреплены и видны и сейчас. В <code>G6</code>: <code>{f:=SUM(G24:G50)}</code> — <b>479</b> пунктов;
    в <code>G7</code>: <code>{f:=B50-B24}</code> — <b>232</b>. Правило продало перед падением и вернулось на подъёме. Комиссии
    брокера здесь не учтены — на частых сделках они могут съесть выигрыш.'
  actions:
  - click: G6
  - type: =SUM(G24:G50)
  - keys:
    - Enter
  - click: G7
  - type: =B50-B24
  - keys:
    - Enter
- title: Что запомнить
  text: <b>Вид → Закрепить области</b> держит на экране строки выше и столбцы левее выделенной ячейки. {fn:AND} — «все условия
    сразу», внутри {fn:IF}. Двойной щелчок по маркеру протягивает формулу до конца данных. <b>На работе пригодится</b> для
    длинных отчётов и правил «если… и…».
  actions:
  - click: G6
