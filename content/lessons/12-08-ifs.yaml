steps:
- title: Ситуация
  text: 'Вложенные {fn:IF} работают, но их трудно читать: слово {fn:IF} повторяется, а скобки копятся в конце. В Excel 2019
    и Microsoft 365 есть {fn:IFS}: пары «условие — значение» подряд и одна закрывающая скобка. Перепишем ей цены на цемент
    и правила игры. Имена границ и цен уже есть в книге.'
  actions:
  - wait: 3000
- title: '{fn:IFS}: пары условие — значение'
  text: 'В <code>B9</code>: <code>{f:=IFS(A9<=опт1,цена1,A9<=опт2,цена2,A9<=опт3,цена3,TRUE,цена4)}</code>. Excel проверяет
    пары по очереди и возвращает значение первой верной. Последнее условие — {fn:TRUE}: оно верно всегда и работает как
    «иначе». Протяните до <code>B12</code>: 450 мешков — 3 000 ₸ за мешок, 2 600 — 2 000 ₸.'
  actions:
  - click: B9
  - type: =IFS(A9<=опт1,цена1,A9<=опт2,цена2,A9<=опт3,цена3,TRUE,цена4)
  - keys:
    - Enter
  - click: B9
  - fill: B9:B12
- title: '{fn:IFS} с {fn:OR}'
  text: 'Правила игры: <code>{f:=IFS(OR(D9=2,D9=3,D9=12),"проигрыш",OR(D9=7,D9=11),"выигрыш",TRUE,"продолжать")}</code>.
    Условия могут быть любыми, в том числе {fn:OR}. Сравните с вложенной {fn:IF} из урока 12.4: тот же ответ, одна функция
    и одна скобка.'
  actions:
  - click: E9
  - type: =IFS(OR(D9=2,D9=3,D9=12),"проигрыш",OR(D9=7,D9=11),"выигрыш",TRUE,"продолжать")
  - keys:
    - Enter
  - click: E9
  - fill: E9:E12
- title: 'Частая ошибка: забыть {fn:TRUE}'
  text: Без последней пары <code>ИСТИНА; цена4</code> заказ больше 2 000 мешков не пройдёт ни одну проверку, и {fn:IFS}
    вернёт <code>#Н/Д</code>. У {fn:IF} «иначе» есть всегда, у {fn:IFS} его нужно дописать самому.
  actions:
  - click: B12
  - showRefs: B12
  - wait: 2500
- title: Что запомнить
  text: <code>{f:=IFS(условие1,значение1,условие2,значение2,…,TRUE,иначе)}</code> — первая верная пара решает. Есть в Excel
    2019 и Microsoft 365; в старых версиях — вложенные {fn:IF}. <b>На работе пригодится</b> для шкал и правил с многими
    ступенями.
  actions:
  - click: B9
