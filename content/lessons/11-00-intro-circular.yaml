# Вводный урок главы. Собрано генератором gen_intros.py; ответы expect посчитаны независимо.
id: intro-circular
chapter: ch11
order: 0
title: 'Циклическая ссылка: формула зависит от себя'
source: Свой пример (премия от прибыли после премии)
sheet:
  file: Премия.xlsx
  name: Премия
  columns:
    A: 280
    B: 150
  rows: 5
  cells:
    A1:
      v: Прибыль до премии
      style: label
    B1:
      v: 2000000
      fmt: kzt
    A2: 'Премия: 5% от прибыли после премии'
    B2:
      fmt: kzt
    A3: Прибыль после премии
    B3:
      fmt: kzt
expect:
  B2: 0
  B3: 0
steps:
- title: Ситуация
  text: Отдел заработал <b>2 000 000 ₸</b>. Руководитель обещал премию — 5% от прибыли, которая останется <b>после</b> выплаты
    премии. Премия уменьшает прибыль, а от прибыли зависит премия. Посмотрим, что скажет Excel.
  actions:
  - wait: 3000
- title: Прибыль после премии
  text: 'В <code>B3</code>: <code>{f:=B1-B2}</code> — прибыль минус премия. Премии пока нет, поэтому 2 000 000 ₸.'
  actions:
  - click: B3
  - type: =B1-B2
  - keys:
    - Enter
- title: Премия — и петля
  text: 'В <code>B2</code>: <code>{f:=5%*B3}</code>. Теперь <code>B2</code> зависит от <code>B3</code>, а <code>B3</code>
    — от <code>B2</code>: формула через другую ячейку ссылается на саму себя. Это <b>циклическая ссылка</b>, и Excel сразу
    предупреждает о ней.'
  actions:
  - click: B2
  - type: =5%*B3
  - keys:
    - Enter
  - wait: 1500
- title: Что показывает Excel
  text: 'Нажмите OK. В ячейках петли — 0, а внизу окна, в строке состояния, — «Циклические ссылки: B2». Так Excel показывает,
    где петля. По умолчанию он такие формулы не считает: петля может быть и ошибкой, и задуманной зависимостью, как здесь.'
  actions:
  - dialogButton: OK
  - click: B2
  - showRefs: B2
  - wait: 1500
- title: Что будет в главе
  text: <b>11.1</b> — петля «благотворительность — налог — прибыль» и итеративные вычисления<br><b>11.2</b> — ссылка на
    весь столбец {f:=AVERAGE(B:B)} внутри своего столбца
  actions:
  - wait: 4000
- title: Что запомнить
  text: Циклическая ссылка — формула прямо или через другие ячейки зависит от самой себя. Excel предупреждает о ней и пишет
    адрес в строке состояния. Если петля задумана, её решают итеративные вычисления — в уроке 11.1. <b>На работе пригодится</b>
    для премий и отчислений «от чистой прибыли».
  actions:
  - click: B2
