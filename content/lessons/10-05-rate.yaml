# Глава 10 (финансовые функции). Собрано генератором; ответы expect посчитаны независимо.
id: rate
chapter: ch10
order: 5
title: 'СТАВКА: какую ставку я могу себе позволить'
source: Excelfinfunctions.xlsx, лист Rate (рис. 10.4)
sheet:
  file: Ставка.xlsx
  name: Ставка
  columns:
    A: 320
    B: 150
  rows: 11
  cells:
    A1:
      v: Сумма кредита
      style: label
    B1:
      v: 8000000
      fmt: kzt
    A2:
      v: Месяцев
      style: label
    B2: 120
    A3:
      v: Платёж в месяц (не больше)
      style: label
    B3:
      v: 100000
      fmt: kzt
    A5: Ставка в месяц
    B5:
      fmt: percent
    A6: Ставка в год
    B6:
      fmt: percent
    A7: 'Проверка: стоимость платежей'
    B7:
      fmt: kzt
    A9: 'С доплатой 1 000 000 ₸ в конце: в месяц'
    B9:
      fmt: percent
    A10: в год
    B10:
      fmt: percent
expect:
  B5: 0.0072
  B6: 0.0869
  B7: 8000000.0
  B9: 0.0082
  B10: 0.0982
steps:
- title: Ситуация
  text: Семья хочет взять <b>8 000 000 ₸</b> на 10 лет на жильё. Больше <b>100 000 ₸</b> в месяц платить не получится. Под
    какую самую высокую ставку можно соглашаться? Ставку по сумме, сроку и платежу находит {fn:RATE}.
  actions:
  - wait: 3000
- title: '{fn:RATE}: периоды, платёж, сумма'
  text: 'В <code>B5</code>: <code>{f:=RATE(B2,-B3,B1)}</code> — число месяцев, платёж с минусом (отдаём), сумма кредита
    с плюсом (получаем). {fn:RATE} подбирает ставку, при которой 120 платежей по 100 000 ₸ стоят сегодня ровно 8 000 000
    ₸: <b>0,7241%</b> в месяц.'
  actions:
  - click: B5
  - type: =RATE(
  - clickRef: B2
  - type: ',-'
  - clickRef: B3
  - type: ','
  - clickRef: B1
  - type: )
  - keys:
    - Enter
- title: В год и проверка
  text: 'Годовая ставка — <code>{f:=B5*12}</code>: <b>8,69%</b>. Банки называют ставку в год, а начисляют в месяц — так
    и считает Excel. Проверим: <code>{f:=PV(B5,B2,-B3)}</code> — стоимость 120 платежей при найденной ставке, <b>8 000 000
    ₸</b>, ровно сумма кредита.'
  actions:
  - click: B6
  - type: =B5*12
  - keys:
    - Enter
  - click: B7
  - type: =PV(B5,B2,-B3)
  - keys:
    - Enter
- title: С доплатой в конце
  text: 'Если в конце срока семья доплатит 1 000 000 ₸ одной суммой, можно позволить ставку выше: <code>{f:=RATE(B2,-B3,B1,-1000000)}</code>
    — <b>0,8185%</b> в месяц, <code>{f:=B9*12}</code> — <b>9,82%</b> в год.'
  actions:
  - click: B9
  - type: =RATE(B2,-B3,B1,-1000000)
  - keys:
    - Enter
  - click: B10
  - type: =B9*12
  - keys:
    - Enter
- title: 'Частая ошибка: одинаковые знаки'
  text: 'Написать платёж и сумму с одним знаком: <code>{f:=RATE(B2,B3,B1)}</code>. Тогда и кредит, и платежи «приходят»
    к вам — такой ставки не бывает, и Excel вернёт <code>#ЧИСЛО!</code>. Деньги, которые вы получили и отдаёте, всегда с
    разными знаками.'
  actions:
  - click: B5
  - showRefs: B5
  - wait: 2500
- title: Что запомнить
  text: <code>{f:=RATE(кпер,плт,пс)}</code> — ставка за период по сумме, сроку и платежу; для годовой умножьте месячную
    на 12. Знаки платежа и суммы — разные. <b>На работе пригодится</b>, чтобы найти реальную ставку рассрочки, лизинга или
    кредита, где банк назвал только платёж.
  actions:
  - click: B6
