# Глава 3. Свой пример по мотивам рис. 3.1 (налоговая ставка по доходу): премия менеджера по шкале продаж.
id: vlookup-scale
chapter: ch03
order: 1
title: "ВПР по шкале: премия от суммы продаж"
source: Свой пример (шкала премий отдела продаж)

sheet:
  file: Премии_менеджеров.xlsx
  name: Премии
  columns: {A: 16, B: 16, C: 160, D: 150, E: 130, F: 130}
  rows: 18
  cells:
    C4: {v: Шкала премий, style: label}
    D5: {v: "Продажи от, ₸", style: head}
    E5: {v: Премия, style: head}
    D6: {v: 0, fmt: kzt}
    E6: {v: 0, fmt: percent}
    D7: {v: 1000000, fmt: kzt}
    E7: {v: 0.03, fmt: percent}
    D8: {v: 3000000, fmt: kzt}
    E8: {v: 0.05, fmt: percent}
    D9: {v: 10000000, fmt: kzt}
    E9: {v: 0.07, fmt: percent}
    C12: {v: Менеджер, style: head}
    D12: {v: "Продажи за март, ₸", style: head}
    E12: {v: Премия (ИСТИНА), style: head}
    F12: {v: Премия (ЛОЖЬ), style: head}
    C13: Айдос Нурланов
    D13: {v: -50000, fmt: kzt}
    C14: Светлана Ли
    D14: {v: 3000000, fmt: kzt}
    C15: Арман Ибраев
    D15: {v: 2900000, fmt: kzt}
    C16: Динара Сеитова
    D16: {v: 9800000, fmt: kzt}
    C17: Канат Жумабаев
    D17: {v: 10400000, fmt: kzt}
    E13: {fmt: percent}
    F13: {fmt: percent}

expect:
  E14: 0.05
  E15: 0.03
  E16: 0.05
  E17: 0.07
  F14: 0.05

steps:
  - title: Ситуация
    text: >-
      Менеджеры получают премию в процентах от продаж за месяц: от 1 млн ₸ — 3%, от 3 млн ₸ — 5%, от 10 млн ₸
      — 7%. Шкала записана в <code>D6:E9</code>. Нужно, чтобы Excel сам находил процент для каждого менеджера.
      Для этого есть функция <code>{fn:VLOOKUP}</code> — <b>вертикальный просмотр</b>.
    say: >-
      Менеджеры получают премию по шкале: чем больше продажи, тем выше процент. Excel найдёт процент сам —
      функцией {fn:VLOOKUP}, вертикальным просмотром.
    actions:
      - wait: 3000

  - title: Имя для таблицы поиска
    text: >-
      Выделите шкалу <code>D6:E9</code> и назовите её <code>шкала</code> в поле «Имя». Книга советует:
      таблице поиска всегда давайте имя — формулу будет легче читать и копировать.
    say: >-
      Выделяем шкалу и даём ей имя «шкала». Таблице поиска всегда стоит давать имя — так формулу легче читать
      и копировать.
    actions:
      - dragSelect: D6:E9
      - nameBox: шкала

  - title: "{fn:VLOOKUP}: четыре аргумента"
    text: >-
      В <code>E13</code> наберите <code>{f:=VLOOKUP(D13,шкала,2,TRUE)}</code>. Подсказка под ячейкой
      показывает аргументы: <b>искомое_значение</b> (продажи <code>D13</code>), <b>таблица</b>
      (<code>шкала</code> — искать будем в её первом столбце), <b>номер_столбца</b> (2 — ответ берём из второго
      столбца) и <b>интервальный_просмотр</b> (<code>ИСТИНА</code> — приблизительный поиск).
    say: >-
      В Е тринадцать набираем {fn:VLOOKUP}. Аргументы: что ищем — продажи, где ищем — в первом столбце шкалы,
      из какого столбца взять ответ — из второго, и «истина» — приблизительный поиск.
    actions:
      - click: E13
      - type: =VLOOKUP(
      - clickRef: D13
      - type: ",шкала,2,TRUE)"
      - wait: 600
      - keys: [Enter]
      - click: E13
      - fill: E13:E17

  - title: "Приблизительный поиск: «не больше»"
    text: >-
      Продажи Армана — 2 900 000 ₸. Точно такого числа в шкале нет, поэтому {fn:VLOOKUP} берёт
      <b>наибольшее значение, не превышающее</b> искомое, — 1 000 000 ₸, премия <b>3%</b>. У Светланы ровно
      3 000 000 ₸ — точное совпадение, 5%. У Каната 10 400 000 ₸ — строка 10 000 000 ₸, 7%.
    say: >-
      У Армана два миллиона девятьсот тысяч. Такого числа в шкале нет, и Excel берёт наибольшее значение, не
      превышающее искомое, — миллион. Премия три процента. А у Светланы ровно три миллиона — пять процентов.
    actions:
      - showRefs: E15
      - wait: 1500
      - click: E14
      - wait: 1200

  - title: "#Н/Д: меньше первого значения"
    text: >-
      У Айдоса продажи отрицательные (возвраты больше продаж) — это меньше первого значения шкалы, 0. Искать
      «не больше» не из чего, и Excel показывает <code>#Н/Д</code> — «нет данных». Чтобы такой менеджер получил
      0%, первое значение шкалы делают заведомо меньше: например, −1 000 000 000.
    say: >-
      У Айдоса продажи отрицательные — меньше первого значения шкалы. Найти нечего, и Excel показывает «нет
      данных». Чтобы получить ноль процентов, шкалу начинают с очень маленького числа.
    actions:
      - click: E13
      - wait: 1800

  - title: "ЛОЖЬ: только точное совпадение"
    text: >-
      Скопируйте формулу в столбец F, заменив <code>ИСТИНА</code> на <code>ЛОЖЬ</code>:
      <code>{f:=VLOOKUP(D13,шкала,2,FALSE)}</code>. Теперь ответ есть только у Светланы — у неё продажи точно
      совпали со строкой шкалы. У остальных <code>#Н/Д</code>. Для шкал нужен <b>приблизительный</b> поиск.
    say: >-
      В соседнем столбце та же формула, но с «ложью» — точный поиск. Ответ есть только у Светланы, у остальных
      — «нет данных». Для шкал нужен приблизительный поиск.
    actions:
      - click: F13
      - type: =VLOOKUP(D13,шкала,2,FALSE)
      - keys: [Enter]
      - click: F13
      - fill: F13:F17

  - title: Что запомнить
    text: >-
      <code>{fn:VLOOKUP}(что; где; из какого столбца; ИСТИНА/ЛОЖЬ)</code>. <code>ИСТИНА</code> (или 1, или
      ничего) — приблизительный поиск по <b>отсортированному по возрастанию</b> первому столбцу: шкалы премий,
      скидок, налогов. <code>ЛОЖЬ</code> (или 0) — точный. Не нашлось — <code>#Н/Д</code>. <b>На работе
      пригодится</b> для бонусов, скидок за объём, тарифов по ступеням.
    say: >-
      Готово! Функция {fn:VLOOKUP} ищет значение в первом столбце таблицы и берёт ответ из нужного столбца.
      «Истина» — приблизительный поиск для шкал, «ложь» — точный.
    actions:
      - click: E15
