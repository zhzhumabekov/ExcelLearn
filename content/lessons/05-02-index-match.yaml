steps:
- title: Ситуация
  text: 'Кондитерская фабрика в Алматы ведёт продажи по товарам и месяцам. Менеджер вписывает товар в <code>A9</code>
    и месяц в <code>B9</code> — и хочет сразу видеть продажи. Хитрость: одна <code>{fn:MATCH}</code> находит <b>строку</b>
    товара, другая — <b>столбец</b> месяца, а <code>{fn:INDEX}</code> берёт число на пересечении.'
  actions:
  - wait: 3000
- title: Имя для чисел
  text: "Выделите <code>B3:G6</code> — только числа — и назовите их <code>продажи</code>. Подписи товаров и месяцев в диапазон не входят: {fn:INDEX} считает строки и столбцы от его угла, и 1-я строка должна быть первым товаром, а 1-й столбец — первым месяцем."
  actions:
  - dragSelect: B3:G6
  - nameBox: продажи
- title: Строка товара
  text: "В <code>C9</code>: <code>{f:=MATCH(A9,A3:A6,0)}</code>. {fn:MATCH} ищет товар из <code>A9</code> в списке товаров <code>A3:A6</code> и отвечает, на каком он месте: печенье — <b>3-е</b>. Тип <code>0</code> — точное совпадение. Список товаров стоит в тех же строках, что и числа <code>продажи</code>, поэтому место в списке = номер строки в таблице."
  actions:
  - click: C9
  - type: =MATCH(
  - clickRef: A9
  - type: ','
  - dragRef: A3:A6
  - type: ',0)'
  - keys:
    - Enter
- title: Столбец месяца
  text: 'В <code>D9</code>: <code>{f:=MATCH(B9,B2:G2,0)}</code> — июнь в <b>6-м</b> столбце. {fn:MATCH} работает
    и по строке: считает слева направо.'
  actions:
  - click: D9
  - type: =MATCH(
  - clickRef: B9
  - type: ','
  - dragRef: B2:G2
  - type: ',0)'
  - keys:
    - Enter
- title: Число на пересечении
  text: "В <code>E9</code>: <code>{f:=INDEX(продажи,C9,D9)}</code>. {fn:INDEX} берёт номер строки и номер столбца из ячеек, которые нашла {fn:MATCH}: 3-я строка (печенье), 6-й столбец (июнь) — <b>48</b> тыс. коробок. Впишите в <code>A9</code> или <code>B9</code> другое название — номера и ответ пересчитаются."
  actions:
  - click: E9
  - type: =INDEX(продажи,
  - clickRef: C9
  - type: ','
  - clickRef: D9
  - type: )
  - keys:
    - Enter
- title: Всё в одной формуле
  text: 'Вспомогательные ячейки можно убрать: <code>{f:=INDEX(продажи,MATCH(A9,A3:A6,0),MATCH("мар",B2:G2,0))}</code>
    — печенье в марте, <b>37</b>. Впишите в <code>A9</code> другой товар — всё пересчитается.'
  actions:
  - click: B11
  - type: =INDEX(продажи,MATCH(A9,A3:A6,0),MATCH("мар",B2:G2,0))
  - keys:
    - Enter
- title: Что запомнить
  text: <code>{fn:INDEX}(таблица; {fn:MATCH}(что; столбец заголовков; 0); {fn:MATCH}(что; строка заголовков; 0))</code>
    — двумерный поиск по названиям строки и столбца. <b>На работе пригодится</b> для отчётов «товар × месяц», «филиал
    × показатель», «сотрудник × неделя».
  actions:
  - click: E9
