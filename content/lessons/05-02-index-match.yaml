steps:
- title: Ситуация
  text: 'Кондитерская фабрика в Алматы ведёт продажи по товарам и месяцам. Менеджер вписывает товар в <code>A10</code>
    и месяц в <code>B10</code> — и хочет сразу видеть продажи. Хитрость: одна <code>{fn:MATCH}</code> находит <b>строку</b>
    товара, другая — <b>столбец</b> месяца, а <code>{fn:INDEX}</code> берёт число на пересечении.'
  say: Менеджер вписывает товар и месяц и хочет сразу видеть продажи. Одна функция {fn:MATCH} найдёт строку товара,
    другая — столбец месяца, а {fn:INDEX} возьмёт число на пересечении.
  actions:
  - wait: 3000
- title: Имя для чисел
  text: Выделите <code>B4:G7</code> — только числа — и назовите их <code>продажи</code>.
  say: Выделяем только числа и называем их «продажи».
  actions:
  - dragSelect: B4:G7
  - nameBox: продажи
- title: Строка товара
  text: 'В <code>C10</code>: <code>{f:=MATCH(A10,A4:A7,0)}</code> — печенье на <b>3-й</b> строке таблицы.'
  say: Ищем печенье среди товаров — третья строка.
  actions:
  - click: C10
  - type: =MATCH(
  - clickRef: A10
  - type: ','
  - dragRef: A4:A7
  - type: ',0)'
  - keys:
    - Enter
- title: Столбец месяца
  text: 'В <code>D10</code>: <code>{f:=MATCH(B10,B3:G3,0)}</code> — июнь в <b>6-м</b> столбце. {fn:MATCH} работает
    и по строке: считает слева направо.'
  say: Ищем июнь среди месяцев — шестой столбец. По строке {fn:MATCH} считает слева направо.
  actions:
  - click: D10
  - type: =MATCH(
  - clickRef: B10
  - type: ','
  - dragRef: B3:G3
  - type: ',0)'
  - keys:
    - Enter
- title: Число на пересечении
  text: 'В <code>E10</code>: <code>{f:=INDEX(продажи,C10,D10)}</code> — <b>48</b> тыс. коробок печенья в июне.'
  say: А {fn:INDEX} берёт число на пересечении третьей строки и шестого столбца — сорок восемь тысяч коробок.
  actions:
  - click: E10
  - type: =INDEX(продажи,
  - clickRef: C10
  - type: ','
  - clickRef: D10
  - type: )
  - keys:
    - Enter
- title: Всё в одной формуле
  text: 'Вспомогательные ячейки можно убрать: <code>{f:=INDEX(продажи,MATCH(A10,A4:A7,0),MATCH("мар",B3:G3,0))}</code>
    — печенье в марте, <b>37</b>. Впишите в <code>A10</code> другой товар — всё пересчитается.'
  say: 'Всё можно записать одной формулой: {fn:INDEX} с двумя {fn:MATCH} внутри. Печенье в марте — тридцать семь.'
  actions:
  - click: B12
  - type: =INDEX(продажи,MATCH(A10,A4:A7,0),MATCH("мар",B3:G3,0))
  - keys:
    - Enter
- title: Что запомнить
  text: <code>{fn:INDEX}(таблица; {fn:MATCH}(что; столбец заголовков; 0); {fn:MATCH}(что; строка заголовков; 0))</code>
    — двумерный поиск по названиям строки и столбца. <b>На работе пригодится</b> для отчётов «товар × месяц», «филиал
    × показатель», «сотрудник × неделя».
  say: Готово! {fn:INDEX} с двумя {fn:MATCH} ищет по названию строки и столбца — удобно для отчётов «товар на месяц».
  actions:
  - click: E10
