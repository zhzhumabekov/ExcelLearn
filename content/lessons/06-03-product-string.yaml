# Глава 6 (текстовые функции). Собрано генератором; ответы expect посчитаны независимо.
id: product-string
chapter: ch06
order: 3
title: 'Разбираем строку товара: артикул, цена, описание'
source: Свой пример (выгрузка интернет-магазина электроники)
sheet:
  file: Товары_выгрузка.xlsx
  name: Товары
  columns:
    A: 220
    B: 100
    C: 105
    D: 85
    E: 130
  rows: 8
  cells:
    A1:
      v: Строка из выгрузки
      style: head
    B1:
      v: Без пробелов
      style: head
    C1:
      v: Артикул
      style: head
    D1:
      v: Цена
      style: head
    E1:
      v: Описание
      style: head
    A2: 'НБ-00124-ЛЕН Ноутбук Lenovo IdeaPad 15 289990  '
    D2:
      fmt: kzt
    A3: 'МН-00311-SAM Монитор Samsung 27 дюймов 124500  '
    D3:
      fmt: kzt
    A4: 'КЛ-00052-LOG Клавиатура Logitech K120 007990  '
    D4:
      fmt: kzt
    A5: 'МШ-00208-RAZ Мышь Razer DeathAdder 021490  '
    D5:
      fmt: kzt
    A6: 'НШ-00140-JBL Наушники JBL Tune 510 018990  '
    D6:
      fmt: kzt
    A7: 'ПР-00977-HP1 Принтер HP LaserJet M111 064990  '
    D7:
      fmt: kzt
expect:
  B2: НБ-00124-ЛЕН Ноутбук Lenovo IdeaPad 15 289990
  C2: НБ-00124-ЛЕН
  D2: 289990
  E2: ' Ноутбук Lenovo IdeaPad 15 '
  B3: МН-00311-SAM Монитор Samsung 27 дюймов 124500
  C3: МН-00311-SAM
  D3: 124500
  E3: ' Монитор Samsung 27 дюймов '
  B4: КЛ-00052-LOG Клавиатура Logitech K120 007990
  C4: КЛ-00052-LOG
  D4: 7990
  E4: ' Клавиатура Logitech K120 '
  B5: МШ-00208-RAZ Мышь Razer DeathAdder 021490
  C5: МШ-00208-RAZ
  D5: 21490
  E5: ' Мышь Razer DeathAdder '
  B6: НШ-00140-JBL Наушники JBL Tune 510 018990
  C6: НШ-00140-JBL
  D6: 18990
  E6: ' Наушники JBL Tune 510 '
  B7: ПР-00977-HP1 Принтер HP LaserJet M111 064990
  C7: ПР-00977-HP1
  D7: 64990
  E7: ' Принтер HP LaserJet M111 '
steps:
- title: Ситуация
  text: 'Интернет-магазин выгрузил товары одной строкой: артикул, описание и цена. Артикул — <b>всегда 12 символов</b>,
    цена — <b>последние 6</b> (с нулями впереди). Разложим строки по столбцам.'
  actions:
  - wait: 3000
- title: Невидимые пробелы
  text: 'Щёлкните <code>A2</code> и нажмите <kbd>F2</kbd>: курсор встанет в конец строки, и видно, что после цены <b>два
    пробела</b>. Из-за них «последние 6 символов» — это не цена.'
  actions:
  - click: A2
  - keys:
    - F2
  - wait: 1800
  - keys:
    - Escape
- title: Сначала {fn:TRIM}
  text: 'Хорошее начало любой разборки — убрать лишние пробелы: <code>{f:=TRIM(A2)}</code>, протяните вниз. Строка стала
    на 2 символа короче.'
  actions:
  - click: B2
  - type: =TRIM(
  - clickRef: A2
  - type: )
  - keys:
    - Enter
  - click: B2
  - fill: B2:B7
- title: Артикул — {fn:LEFT}
  text: <code>{f:=LEFT(B2,12)}</code> — первые 12 символов. Протяните вниз.
  actions:
  - click: C2
  - type: =LEFT(
  - clickRef: B2
  - type: ',12)'
  - keys:
    - Enter
  - click: C2
  - fill: C2:C7
- title: Цена — {fn:RIGHT} и {fn:VALUE}
  text: '<code>{f:=VALUE(RIGHT(B2,6))}</code>: {fn:RIGHT} даёт текст «289990», {fn:VALUE} делает из него число — его можно
    складывать и умножать.'
  actions:
  - click: D2
  - type: =VALUE(RIGHT(
  - clickRef: B2
  - type: ',6))'
  - keys:
    - Enter
  - click: D2
  - fill: D2:D7
- title: Описание — {fn:MID} и {fn:LEN}
  text: 'Описание начинается с 13-го символа, а его длина — вся строка минус 12 символов артикула и минус 6 символов цены:
    <code>{f:=MID(B2,13,LEN(B2)-6-12)}</code>. Пробелы по краям описания уберёт {fn:TRIM}, если понадобится.'
  actions:
  - click: E2
  - type: =MID(
  - clickRef: B2
  - type: ',13,LEN('
  - clickRef: B2
  - type: )-6-12)
  - keys:
    - Enter
  - click: E2
  - fill: E2:E7
- title: Частая ошибка
  text: 'Взять цену без {fn:VALUE}: <code>{f:=RIGHT(B2,6)}</code> выглядит как число, но это текст — {fn:SUM} по таким ячейкам
    даст 0. И не начинайте без {fn:TRIM}: с хвостовыми пробелами {fn:RIGHT} вернёт «990  » вместо цены.'
  actions:
  - showRefs: D2
  - wait: 2500
- title: Что запомнить
  text: Сначала {fn:TRIM}, потом {fn:LEFT} / {fn:RIGHT} / {fn:MID}; числа из текста — через {fn:VALUE}. Если длина частей
    разная, позицию границы находит {fn:FIND}. <b>На работе пригодится</b> для выгрузок из маркетплейсов и складских программ.
  actions:
  - click: E2
