steps:
- title: Ситуация
  text: 'Финансовый год компании начинается в октябре: октябрь–декабрь — 1-й квартал, январь–март — 2-й и так далее. Нужно
    по номеру месяца найти квартал финансового года, а по номеру квартала — сумму его продаж. Обе задачи решает {fn:CHOOSE}.'
  actions:
  - wait: 3000
- title: '{fn:CHOOSE}: значение по номеру'
  text: 'В <code>B2</code>: <code>{f:=CHOOSE(A2,2,2,2,3,3,3,4,4,4,1,1,1)}</code>. Первый аргумент — номер, дальше — список:
    {fn:CHOOSE} возвращает элемент с этим номером. Январь (1) — первый элемент, 2-й квартал; октябрь (10) — десятый, 1-й
    квартал. Протяните до <code>B13</code>.'
  actions:
  - click: B2
  - type: =CHOOSE(A2,2,2,2,3,3,3,4,4,4,1,1,1)
  - keys:
    - Enter
  - click: B2
  - fill: B2:B13
- title: '{fn:CHOOSE} выбирает диапазон'
  text: 'Элементами могут быть диапазоны. В <code>B21</code>: <code>{f:=SUM(CHOOSE(B20,B16:B18,C16:C18,D16:D18,E16:E18))}</code>.
    В <code>B20</code> — 3, поэтому {fn:CHOOSE} отдаёт третий диапазон <code>D16:D18</code>, а {fn:SUM} его складывает:
    <b>120</b> млн ₸.'
  actions:
  - click: B21
  - type: =SUM(CHOOSE(B20,B16:B18,C16:C18,D16:D18,E16:E18))
  - keys:
    - Enter
- title: Другой квартал
  text: 'Впишите в <code>B20</code> 1 — итог сменится на 75: {fn:CHOOSE} отдал первый диапазон. Вернём 3. Формулу менять
    не нужно — меняется только номер.'
  actions:
  - click: B20
  - type: '1'
  - keys:
    - Enter
  - click: B21
  - wait: 1500
  - click: B20
  - type: '3'
  - keys:
    - Enter
  - click: B21
- title: Что запомнить
  text: <code>{f:=CHOOSE(номер,значение1,значение2,…)}</code> — элемент списка по номеру; элементом может быть и диапазон.
    <b>На работе пригодится</b> для финансового года, сценариев «1 — оптимистичный, 2 — базовый, 3 — пессимистичный» и отчётов
    по выбранному периоду.
  actions:
  - click: B21
