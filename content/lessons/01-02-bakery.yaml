steps:
  - title: Задача
    text: >-
      Пекарня покупает сахар, масло и муку у шести поставщиков, и у каждого своя <b>цена за фунт</b>
      (строки 5–10). Количество закупок — в строках 14–19. Нужно узнать, <b>сколько заплатить</b>
      каждому поставщику за каждый продукт, и общие суммы.
    say: >-
      Пекарня покупает сахар, масло и муку у шести поставщиков, и цены у всех разные. Посчитаем, сколько
      заплатить каждому поставщику за каждый продукт, и общие суммы.
    actions:
      - wait: 3000

  - title: Формула =E5*E14
    text: >-
      Supplier 1 за сахар: цена <code>E5</code> × количество <code>E14</code>. Выделите <code>E23</code>,
      введите <code>=</code>, щёлкните <code>E5</code>, введите <code>*</code>, щёлкните <code>E14</code>
      и нажмите <kbd>Enter</kbd>.
    say: >-
      Первый поставщик, сахар: цена из ячейки Е пять умножить на количество из Е четырнадцать.
      Нажимаем Enter — получаем 116 долларов 48 центов.
    actions:
      - click: E23
      - type: "="
      - clickRef: E5
      - type: "*"
      - clickRef: E14
      - keys: [Enter]

  - title: Копирование на всю таблицу
    text: >-
      Формула одна для всех поставщиков и продуктов. Скопируйте <code>E23</code> (<kbd>Ctrl</kbd>+<kbd>C</kbd>),
      выделите <code>E23:G28</code> и нажмите <kbd>Enter</kbd> — Excel вставит её во все 18 ячеек.
    say: >-
      Формула подходит всем. Копируем Е двадцать три, выделяем всю таблицу до Жэ двадцать восемь
      и нажимаем Enter — формула попадает во все восемнадцать ячеек.
    actions:
      - click: E23
      - keys: [Ctrl, C]
      - dragSelect: E23:G28
      - keys: [Enter]

  - title: Ссылки сдвинулись сами
    text: >-
      В <code>G28</code> записано <code>=G10*G19</code>: цена и количество муки у Supplier 6. При копировании
      обе ссылки сдвинулись на столько же строк и столбцов, сколько сама формула.
    say: >-
      Посмотрим на последнюю ячейку: здесь цена и количество муки у шестого поставщика. Обе ссылки
      сдвинулись вместе с формулой.
    actions:
      - showRefs: G28

  - title: "Итого по поставщику: {fn:SUM}"
    text: >-
      В <code>H23</code> складываем три продукта: <code>{f:=SUM(E23:G23)}</code>. Потом протягиваем
      формулу маркером заполнения до <code>H28</code>.
    say: >-
      В ячейке Аш двадцать три складываем три продукта функцией {fn:SUM}. Затем протягиваем формулу
      вниз до Аш двадцать восемь.
    actions:
      - click: H23
      - type: "=SUM("
      - dragRef: E23:G23
      - type: ")"
      - keys: [Enter]
      - click: H23
      - fill: H23:H28

  - title: "Быстрее: кнопка Σ Автосумма"
    text: >-
      Итоги по продуктам — ещё быстрее. Выделите <code>E29:G29</code> и нажмите <b>Σ Автосумма</b> на вкладке
      «Главная»: Excel сам впишет в каждую ячейку сумму столбца над ней. Можно выделить сразу и
      <code>H23:H28</code>, и (удерживая <kbd>Ctrl</kbd>) <code>E29:G29</code> — автосумма заполнит оба
      диапазона. Но проверяйте: диапазон она угадывает не всегда верно.
    say: >-
      Итоги по продуктам посчитаем быстрее. Выделяем ячейки итогов и нажимаем кнопку «Автосумма» на ленте.
      Excel сам подставляет сумму каждого столбца. Только проверяйте, какой диапазон он выбрал.
    actions:
      - dragSelect: E29:G29
      - clickRibbon: autosum

  - title: Готово!
    text: >-
      Вы скопировали одну формулу на целую таблицу, сложили строки функцией <code>{fn:SUM}</code> и столбцы —
      кнопкой <b>Σ Автосумма</b>. Больше всего пекарня платит за масло: <b>$2422,65</b>.
    say: >-
      Готово! Одна формула скопирована на всю таблицу, суммы посчитаны функцией и кнопкой «Автосумма».
      Больше всего пекарня тратит на масло.
    actions:
      - click: F29
