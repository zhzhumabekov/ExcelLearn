steps:
  - title: Ситуация
    text: >-
      Вы бухгалтер пекарни в Шымкенте. В конце месяца нужно рассчитаться с шестью поставщиками сахара,
      масла и муки. <b>Цены за килограмм</b> у всех разные (строки 5–10), <b>сколько закуплено</b> — в строках
      14–19. Посчитаем, <b>сколько перечислить</b> каждому поставщику и сколько ушло на каждый продукт.
    say: >-
      Вы бухгалтер пекарни в Шымкенте. В конце месяца нужно рассчитаться с шестью поставщиками. Цены у всех
      разные. Посчитаем, сколько перечислить каждому и сколько ушло на каждый продукт.
    actions:
      - wait: 3000

  - title: Формула =E5*E14
    text: >-
      «Береке», сахар: цена <code>E5</code> × килограммы <code>E14</code>. Выделите <code>E23</code>,
      введите <code>=</code>, щёлкните <code>E5</code>, введите <code>*</code>, щёлкните <code>E14</code>
      и нажмите <kbd>Enter</kbd>: <b>172 800 ₸</b>.
    say: >-
      «Береке», сахар: цена из ячейки Е пять умножить на килограммы из Е четырнадцать. Нажимаем Enter —
      сто семьдесят две тысячи восемьсот тенге.
    actions:
      - click: E23
      - type: "="
      - clickRef: E5
      - type: "*"
      - clickRef: E14
      - keys: [Enter]

  - title: Копирование на всю таблицу
    text: >-
      Таблицы цен и закупок устроены одинаково, поэтому формула одна на всех. Скопируйте <code>E23</code>
      (<kbd>Ctrl</kbd>+<kbd>C</kbd>), выделите <code>E23:G28</code> и нажмите <kbd>Enter</kbd> — Excel вставит
      её во все 18 ячеек.
    say: >-
      Таблицы цен и закупок устроены одинаково, поэтому формула подходит всем. Копируем Е двадцать три,
      выделяем всю таблицу до Жэ двадцать восемь и нажимаем Enter.
    actions:
      - click: E23
      - keys: [Ctrl, C]
      - dragSelect: E23:G28
      - keys: [Enter]

  - title: Ссылки сдвинулись сами
    text: >-
      В <code>G28</code> записано <code>=G10*G19</code>: цена и килограммы муки у «Ақ Бидай». При копировании
      обе ссылки сдвинулись на столько же строк и столбцов, сколько сама формула.
      <b>Важно:</b> так работает, только если поставщики и продукты в обеих таблицах идут <b>в одном
      порядке</b>.
    say: >-
      Посмотрим на последнюю ячейку: здесь цена и килограммы муки у последнего поставщика. Обе ссылки
      сдвинулись вместе с формулой. Это работает, только если в обеих таблицах одинаковый порядок строк
      и столбцов.
    actions:
      - showRefs: G28

  - title: "К оплате поставщику: {fn:SUM}"
    text: >-
      В <code>H23</code> складываем три продукта: <code>{f:=SUM(E23:G23)}</code>. Протягиваем маркером
      заполнения до <code>H28</code> — это суммы для платёжных поручений.
    say: >-
      В ячейке Аш двадцать три складываем три продукта функцией {fn:SUM} и протягиваем вниз. Это суммы для
      платёжных поручений.
    actions:
      - click: H23
      - type: "=SUM("
      - dragRef: E23:G23
      - type: ")"
      - keys: [Enter]
      - click: H23
      - fill: H23:H28

  - title: "Быстрее: кнопка Σ Автосумма"
    text: >-
      Расходы по продуктам — ещё быстрее. Выделите <code>E29:G29</code> и нажмите <b>Σ Автосумма</b> на вкладке
      «Главная»: Excel впишет в каждую ячейку сумму столбца над ней. Можно выделить сразу и
      <code>H23:H28</code>, и (удерживая <kbd>Ctrl</kbd>) <code>E29:G29</code>. Но проверяйте: диапазон
      автосумма угадывает не всегда верно.
    say: >-
      Расходы по продуктам посчитаем быстрее. Выделяем ячейки итогов и нажимаем кнопку «Автосумма» на ленте.
      Excel сам подставляет сумму каждого столбца. Только проверяйте, какой диапазон он выбрал.
    actions:
      - dragSelect: E29:G29
      - clickRibbon: autosum

  - title: Что запомнить
    text: >-
      Одна формула копируется на целую таблицу, если исходные таблицы устроены одинаково. Больше всего
      пекарня тратит на масло — <b>2 429 000 ₸</b>. <b>На работе пригодится</b> для сверки с поставщиками,
      расчёта закупок и себестоимости.
    say: >-
      Готово! Одна формула скопирована на всю таблицу, суммы посчитаны функцией и автосуммой. Больше всего
      пекарня тратит на масло — два миллиона четыреста двадцать девять тысяч тенге.
    actions:
      - click: F29
