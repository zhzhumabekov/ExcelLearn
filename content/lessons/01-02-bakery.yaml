steps:
  - title: Ситуация
    text: >-
      Вы бухгалтер пекарни в Шымкенте. В конце месяца нужно рассчитаться с шестью поставщиками сахара,
      масла и муки. <b>Цены за килограмм</b> у всех разные (строки 3–8), <b>сколько закуплено</b> — в строках
      12–17. Посчитаем, <b>сколько перечислить</b> каждому поставщику и сколько ушло на каждый продукт.
    say: >-
      Вы бухгалтер пекарни в Шымкенте. В конце месяца нужно рассчитаться с шестью поставщиками. Цены у всех
      разные. Посчитаем, сколько перечислить каждому и сколько ушло на каждый продукт.
    actions:
      - wait: 3000

  - title: Формула =B3*B12
    text: >-
      «Береке», сахар: цена <code>B3</code> × килограммы <code>B12</code>. Выделите <code>B21</code>,
      введите <code>=</code>, щёлкните <code>B3</code>, введите <code>*</code>, щёлкните <code>B12</code>
      и нажмите <kbd>Enter</kbd>: <b>172 800 ₸</b>.
    say: >-
      «Береке», сахар: цена из ячейки Бэ три умножить на килограммы из Бэ двенадцать. Нажимаем Enter —
      сто семьдесят две тысячи восемьсот тенге.
    actions:
      - click: B21
      - type: "="
      - clickRef: B3
      - type: "*"
      - clickRef: B12
      - keys: [Enter]

  - title: Копирование на всю таблицу
    text: >-
      Таблицы цен и закупок устроены одинаково, поэтому формула одна на всех. Скопируйте <code>B21</code>
      (<kbd>Ctrl</kbd>+<kbd>C</kbd>), выделите <code>B21:D26</code> и нажмите <kbd>Enter</kbd> — Excel вставит
      её во все 18 ячеек.
    say: >-
      Таблицы цен и закупок устроены одинаково, поэтому формула подходит всем. Копируем Бэ двадцать один,
      выделяем всю таблицу до Дэ двадцать шесть и нажимаем Enter.
    actions:
      - click: B21
      - keys: [Ctrl, C]
      - dragSelect: B21:D26
      - keys: [Enter]

  - title: Ссылки сдвинулись сами
    text: >-
      В <code>D26</code> записано <code>=D8*D17</code>: цена и килограммы муки у «Ақ Бидай». При копировании
      обе ссылки сдвинулись на столько же строк и столбцов, сколько сама формула.
      <b>Важно:</b> так работает, только если поставщики и продукты в обеих таблицах идут <b>в одном
      порядке</b>.
    say: >-
      Посмотрим на последнюю ячейку: здесь цена и килограммы муки у последнего поставщика. Обе ссылки
      сдвинулись вместе с формулой. Это работает, только если в обеих таблицах одинаковый порядок строк
      и столбцов.
    actions:
      - showRefs: D26

  - title: "К оплате поставщику: {fn:SUM}"
    text: >-
      В <code>E21</code> складываем три продукта: <code>{f:=SUM(B21:D21)}</code>. Протягиваем маркером
      заполнения до <code>E26</code> — это суммы для платёжных поручений.
    say: >-
      В ячейке Е двадцать один складываем три продукта функцией {fn:SUM} и протягиваем вниз. Это суммы для
      платёжных поручений.
    actions:
      - click: E21
      - type: "=SUM("
      - dragRef: B21:D21
      - type: ")"
      - keys: [Enter]
      - click: E21
      - fill: E21:E26

  - title: "Быстрее: кнопка Σ Автосумма"
    text: >-
      Расходы по продуктам — ещё быстрее. Выделите <code>B27:D27</code> и нажмите <b>Σ Автосумма</b> на вкладке
      «Главная»: Excel впишет в каждую ячейку сумму столбца над ней. Можно выделить сразу и
      <code>E21:E26</code>, и (удерживая <kbd>Ctrl</kbd>) <code>B27:D27</code>. Но проверяйте: диапазон
      автосумма угадывает не всегда верно.
    say: >-
      Расходы по продуктам посчитаем быстрее. Выделяем ячейки итогов и нажимаем кнопку «Автосумма» на ленте.
      Excel сам подставляет сумму каждого столбца. Только проверяйте, какой диапазон он выбрал.
    actions:
      - dragSelect: B27:D27
      - clickRibbon: autosum

  - title: Что запомнить
    text: >-
      Одна формула копируется на целую таблицу, если исходные таблицы устроены одинаково. Больше всего
      пекарня тратит на масло — <b>2 429 000 ₸</b>. <b>На работе пригодится</b> для сверки с поставщиками,
      расчёта закупок и себестоимости.
    say: >-
      Готово! Одна формула скопирована на всю таблицу, суммы посчитаны функцией и автосуммой. Больше всего
      пекарня тратит на масло — два миллиона четыреста двадцать девять тысяч тенге.
    actions:
      - click: C27
