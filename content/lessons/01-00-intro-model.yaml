# Вводный урок главы. Собрано генератором gen_intros.py; ответы expect посчитаны независимо.
id: intro-model
chapter: ch01
order: 0
title: 'Модель в Excel: входы, формулы, выходы'
source: Свой пример (автомойка в Караганде)
sheet:
  file: Автомойка_модель.xlsx
  name: Модель
  columns:
    A: 260
    B: 130
  rows: 9
  cells:
    A1:
      v: Показатель
      style: head
    B1:
      v: Значение
      style: head
    A2: Цена мойки, ₸
    B2:
      v: 3000
      fmt: kzt
    A3: Машин в день
    B3: 40
    A4: Расходники на одну мойку, ₸
    B4:
      v: 600
      fmt: kzt
    A5: Аренда и зарплата в день, ₸
    B5:
      v: 50000
      fmt: kzt
    A6: Выручка в день, ₸
    B6:
      fmt: kzt
    A7: Затраты в день, ₸
    B7:
      fmt: kzt
    A8:
      v: Прибыль в день, ₸
      style: total
    B8:
      fmt: kzt
      style: total
expect:
  B6: 119000
  B7: 70400
  B8: 48600
steps:
- title: Ситуация
  text: 'Вы с партнёром открываете автомойку в Караганде и решаете, сколько брать за мойку. Цифр много: цена, поток машин,
    расходники, аренда. В Excel их связывают в <b>модель</b> — таблицу, где итог пересчитывается сам, стоит поменять любую
    исходную цифру. С этого начинается вся книга.'
  actions:
  - wait: 3000
- title: Входы и выходы
  text: 'У любой модели две части. <b>Входы</b> (<code>B2:B5</code>) — то, что вы знаете или предполагаете: их вписывают
    числами. <b>Выходы</b> (<code>B6:B8</code>) — то, что хотите узнать: их считают <b>только формулами</b> со ссылками
    на входы.'
  actions:
  - dragSelect: B2:B5
  - wait: 1200
  - dragSelect: B6:B8
  - wait: 1200
- title: Выручка
  text: 'Выручка — цена, умноженная на число машин. Щёлкните по <code>B6</code> и наберите <code>=B2*B3</code>: адреса удобно
    не печатать, а щёлкать по ячейкам. Ответ — <b>120 000 ₸</b> в день.'
  actions:
  - click: B6
  - type: '='
  - clickRef: B2
  - type: '*'
  - clickRef: B3
  - keys:
    - Enter
- title: Затраты
  text: 'Затраты — расходники на каждую машину плюс аренда и зарплата: <code>=B4*B3+B5</code> = <b>74 000 ₸</b>.'
  actions:
  - click: B7
  - type: '='
  - clickRef: B4
  - type: '*'
  - clickRef: B3
  - type: +
  - clickRef: B5
  - keys:
    - Enter
- title: Прибыль
  text: 'Прибыль — выручка минус затраты: <code>=B6-B7</code> = <b>46 000 ₸</b> в день. Цветные рамки показывают, из каких
    ячеек она считается.'
  actions:
  - click: B8
  - type: =B6-B7
  - keys:
    - Enter
  - click: B8
  - showRefs: B8
- title: Что если?
  text: 'Теперь главное. Партнёр предлагает цену <b>3 500 ₸</b>, но тогда машин будет меньше — около <b>34</b>. Впишите
    новые входы в <code>B2</code> и <code>B3</code>: выручка, затраты и прибыль пересчитались сами. Прибыль — <b>48 600
    ₸</b>, на 2 600 ₸ больше. Это и есть анализ «что если».'
  actions:
  - click: B2
  - type: '3500'
  - keys:
    - Enter
  - click: B3
  - type: '34'
  - keys:
    - Enter
  - click: B8
- title: Частая ошибка
  text: 'Посчитать итог на калькуляторе и вписать в ячейку число. Таблица выглядит так же, но при новой цене итог останется
    старым — и никто этого не заметит. Проверка: щёлкните по выходу и посмотрите в строку формул — там должна быть формула,
    а не число.'
  actions:
  - click: B7
  - wait: 1500
- title: Что будет в главе
  text: '<b>1.1</b> — формула, копирование и маркер заполнения (ведомость зарплаты)<br><b>1.2</b> — формулы на целую таблицу
    строк и столбцов<br><b>1.3</b> — абсолютные ссылки: знак $ и клавиша <kbd>F4</kbd><br><b>1.4</b> — модель на 10 лет
    вперёд со смешанными ссылками<br><b>1.5</b> — порядок операций и скобки<br><b>1.6</b> — таблица «что если» сразу для
    многих цен'
  actions:
  - wait: 4000
- title: Что запомнить
  text: 'Модель = <b>входы</b> (числа) → <b>формулы</b> → <b>выходы</b>. Меняете вход — Excel пересчитывает всё сам. <b>На
    работе пригодится</b> везде, где нужно ответить «а что будет, если…»: цена, план продаж, бюджет отдела, расчёт кредита.'
  actions:
  - click: B8
