# Глава 6 (текстовые функции). Собрано генератором; ответы expect посчитаны независимо.
id: text-cut
chapter: ch06
order: 1
title: 'Текстовые функции: берём часть строки'
source: Свой пример (выгрузка из кадровой программы)
sheet:
  file: Текстовые_функции.xlsx
  name: Функции
  columns:
    A: 210
    B: 170
    C: 64
  rows: 13
  cells:
    A1:
      v: Строка из выгрузки
      style: head
    A2: Асель   Нурланова
    A3:
      v: Что считаем
      style: head
    B3:
      v: Результат
      style: head
    A4: Первые 4 символа
    A5: Последние 4 символа
    A6: 4 символа со 2-го
    A7: Без лишних пробелов
    A8: Длина строки
    A9: Длина без пробелов
    A10: Где первый пробел
    A11: НАЙТИ «а»
    A12: ПОИСК «а»
expect:
  B4: Асел
  B5: нова
  B6: сель
  B7: Асель Нурланова
  B8: 17
  B9: 15
  B10: 6
  B11: 13
  B12: 1
steps:
- title: Ситуация
  text: 'Кадровая программа выгрузила ФИО в одну ячейку, да ещё с лишними пробелами: <code>A2</code> — «Асель&nbsp;&nbsp;&nbsp;Нурланова».
    Чтобы разложить такие строки по столбцам, в Excel есть <b>текстовые функции</b>. Разберём главные на этой строке.'
  actions:
  - wait: 3000
- title: '{fn:LEFT} и {fn:RIGHT}'
  text: '<code>{f:=LEFT(A2,4)}</code> берёт символы <b>слева</b>: первые 4 — <b>Асел</b>. <code>{f:=RIGHT(A2,4)}</code>
    берёт <b>справа</b>: последние 4 — <b>нова</b>. Первый аргумент — откуда брать текст, второй — сколько символов. Пробел
    — тоже символ, и его считают наравне с буквами.'
  actions:
  - click: B4
  - type: =LEFT(
  - clickRef: A2
  - type: ',4)'
  - keys:
    - Enter
  - type: =RIGHT(
  - clickRef: A2
  - type: ',4)'
  - keys:
    - Enter
- title: '{fn:MID}: из середины'
  text: '<code>{f:=MID(A2,2,4)}</code> — 4 символа, начиная со 2-го: <b>сель</b>. Аргументы: текст, с какого символа, сколько
    символов.'
  actions:
  - type: =MID(
  - clickRef: A2
  - type: ',2,4)'
  - keys:
    - Enter
- title: '{fn:TRIM} и {fn:LEN}'
  text: '<code>{f:=TRIM(A2)}</code> убирает лишние пробелы: между словами остаётся один, по краям — ни одного. {fn:LEN}
    считает символы вместе с пробелами: в исходной строке <b>17</b>, после {fn:TRIM} — <b>15</b>. Так видно, что пробелы
    были лишние.'
  actions:
  - type: =TRIM(
  - clickRef: A2
  - type: )
  - keys:
    - Enter
  - type: =LEN(
  - clickRef: A2
  - type: )
  - keys:
    - Enter
  - type: =LEN(
  - clickRef: B7
  - type: )
  - keys:
    - Enter
- title: '{fn:FIND}: позиция символа'
  text: '<code>{f:=FIND(" ",A2)}</code> — где первый пробел: <b>6</b>. Позиция пробела — граница имени: имя — это {fn:LEFT}
    на позицию минус один. Так режут строки, где длина частей разная.'
  actions:
  - type: =FIND(" ",
  - clickRef: A2
  - type: )
  - keys:
    - Enter
- title: '{fn:FIND} и {fn:SEARCH}: регистр'
  text: '<code>{f:=FIND("а",A2)}</code> — <b>13</b>: {fn:FIND} учитывает регистр и пропускает заглавную «А». <code>{f:=SEARCH("а",A2)}</code>
    — <b>1</b>: {fn:SEARCH} регистр не различает. Ещё {fn:SEARCH} понимает <code>*</code> и <code>?</code>.'
  actions:
  - type: =FIND("а",
  - clickRef: A2
  - type: )
  - keys:
    - Enter
  - type: =SEARCH("а",
  - clickRef: A2
  - type: )
  - keys:
    - Enter
- title: Частая ошибка
  text: 'Если {fn:FIND} не нашла символ, она возвращает <code>#ЗНАЧ!</code> — например, <code>{f:=FIND("я",A2)}</code>.
    Это не сбой, а ответ «нет такого символа»: проверьте регистр или возьмите {fn:SEARCH}.'
  actions:
  - showRefs: B11
  - wait: 2500
- title: Что запомнить
  text: '{fn:LEFT}, {fn:RIGHT}, {fn:MID} вырезают куски, {fn:LEN} считает символы, {fn:TRIM} убирает лишние пробелы, {fn:FIND}
    и {fn:SEARCH} ищут позицию. <b>На работе пригодится</b>, когда выгрузка из 1С, банка или CRM пришла одной строкой.'
  actions:
  - click: B4
