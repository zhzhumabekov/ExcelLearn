# Глава 9 (ВСД). Собрано генератором; ответы expect посчитаны независимо.
id: irr-vs-npv
chapter: ch09
order: 3
title: 'ВСД или ЧПС: какой проект выбрать'
source: IRR.xlsx, лист Which Project (рис. 9.4)
sheet:
  file: Выбор_проекта.xlsx
  name: Выбор
  columns:
    A: 200
    B: 80
    C: 80
    D: 110
    E: 110
  rows: 8
  cells:
    A1:
      v: Стоимость капитала
      style: label
    B1:
      v: 0.15
      fmt: percent
    A3:
      v: Проект, млн ₸
      style: head
    B3:
      v: 0
      style: head
    C3:
      v: 1
      style: head
    D3:
      v: ВСД
      style: head
    E3:
      v: ЧПС
      style: head
    A4: Логистический центр
    B4: -100
    C4: 140
    A5: Кофейня
    B5: -10
    C5: 15
    A7: Выбираем
    D4:
      fmt: percent
    E4:
      fmt: number
    D5:
      fmt: percent
    E5:
      fmt: number
expect:
  D4: 0.4
  D5: 0.5
  E4: 21.7391
  E5: 3.0435
  B7: Логистический центр
steps:
- title: Ситуация
  text: 'Компания может взять только один проект. Логистический центр: <b>100 млн ₸</b> сегодня, <b>140 млн ₸</b> через
    год. Кофейня: <b>10 млн ₸</b> и <b>15 млн ₸</b>. Стоимость капитала — 15%. У обоих проектов знак меняется один раз,
    значит, ВСД у каждого одна.'
  actions:
  - wait: 3000
- title: ВСД обоих проектов
  text: 'В <code>D4</code>: <code>{f:=IRR(B4:C4)}</code>, протяните до <code>D5</code>. Логистический центр — <b>40,00%</b>,
    кофейня — <b>50,00%</b>. Оба выше 15%, оба выгодны. Хочется выбрать кофейню: у неё ВСД выше.'
  actions:
  - click: D4
  - type: =IRR(
  - dragRef: B4:C4
  - type: )
  - keys:
    - Enter
  - click: D4
  - fill: D4:D5
- title: ЧПС обоих проектов
  text: 'В <code>E4</code>: <code>{f:=B4+NPV($B$1,C4)}</code>, протяните до <code>E5</code>. Ставка закреплена знаками <code>$</code>.
    Логистический центр добавит компании <b>21,74</b> млн ₸, кофейня — <b>3,04</b> млн ₸. Каждый тенге в кофейне работает
    лучше, но тенге в ней в десять раз меньше.'
  actions:
  - click: E4
  - type: '='
  - clickRef: B4
  - type: +NPV($B$1,
  - clickRef: C4
  - type: )
  - keys:
    - Enter
  - click: E4
  - fill: E4:E5
- title: Выбираем по ЧПС
  text: 'В <code>B7</code>: <code>{f:=IF(E4>E5,A4,A5)}</code> — <b>Логистический центр</b>. {fn:IF} сравнивает ЧПС и возвращает
    название проекта из столбца A. ЧПС показывает, сколько денег проект добавит компании, — именно это нужно, когда выбрать
    можно только один.'
  actions:
  - click: B7
  - type: =IF(E4>E5,A4,A5)
  - keys:
    - Enter
- title: 'Частая ошибка: ранжировать по ВСД'
  text: 'ВСД не видит <b>масштаб</b> проекта: 50% от 10 млн — это 5 млн ₸, а 40% от 100 млн — 40 млн ₸. Выбрав проект с
    большей ВСД, компания заработает меньше. ВСД годится для вопроса «выгоден ли проект», а для выбора из нескольких — ЧПС.'
  actions:
  - click: E4
  - showRefs: E4
  - wait: 2500
- title: Что запомнить
  text: Проект выгоден, если ВСД выше стоимости капитала (и ЧПС больше нуля). Если выбрать можно только один — берите больший
    ЧПС, а не большую ВСД. <b>На работе пригодится</b> при распределении бюджета между проектами и филиалами.
  actions:
  - click: B7
