steps:
- title: Ситуация
  text: 'Карьер щебня: <b>20 млн ₸</b> на вскрышу сегодня, <b>82 млн ₸</b> от добычи через год, потом <b>60 млн ₸</b> на
    рекультивацию земли (это требует закон) и <b>2 млн ₸</b> от продажи техники. Знак потока меняется трижды: −, +, −, +.
    Посмотрим, что при этом происходит с ВСД.'
  actions:
  - wait: 3000
- title: Таблица предположений
  text: 'В <code>B6</code>: <code>{f:=IRR($B$2:$E$2,A6)}</code>, протяните до <code>B15</code>. Ответов <b>два</b>: при
    предположениях до 30% — <b>-9,59%</b>, от 50% — <b>216,09%</b>. Обе ставки верные: при каждой ЧПС карьера равна нулю.
    {fn:IRR} просто находит ту, что ближе к начальному предположению.'
  actions:
  - click: B6
  - type: =IRR($B$2:$E$2,
  - clickRef: A6
  - type: )
  - keys:
    - Enter
  - click: B6
  - fill: B6:B15
- title: Что значат две ВСД
  text: 'Сказать «карьер приносит -9,59% в год» или «216,09% в год» нельзя: обе фразы неверны. Когда ВСД несколько, у неё
    нет смысла «процентов в год». Решайте по ЧПС при стоимости капитала — она всегда одна.'
  actions:
  - click: B15
  - showRefs: B15
  - wait: 2500
- title: Проект без ВСД
  text: 'Предоплата: клиент платит <b>10 млн ₸</b> вперёд, мы тратим <b>30 млн ₸</b>, затем получаем <b>25 млн ₸</b>. В
    <code>C6</code>: <code>{f:=IRR($B$3:$D$3,A6)}</code>, протяните до <code>C15</code> — везде <code>#ЧИСЛО!</code>. ЧПС
    этого проекта положительна при любой ставке и нулём не становится, поэтому ставки, где ЧПС = 0, просто нет.'
  actions:
  - click: C6
  - type: =IRR($B$3:$D$3,
  - clickRef: A6
  - type: )
  - keys:
    - Enter
  - click: C6
  - fill: C6:C15
- title: Правило знаков
  text: 'Сколько раз знак потока меняется, столько ВСД может быть, но не больше. У карьера − + − + — три смены, у предоплаты
    + − + — две: одна ВСД не гарантирована. У обычного проекта сначала расход, потом только доходы: − + + + — одна смена,
    и ВСД ровно одна.'
  actions:
  - wait: 3000
- title: Что запомнить
  text: 'Знак потока меняется один раз — ВСД одна. Больше раз — ВСД может быть несколько или ни одной; проверьте таблицей
    предположений и решайте по ЧПС. <b>На работе пригодится</b> для проектов с большими расходами в конце: рекультивация,
    демонтаж, ремонт.'
  actions:
  - click: B6
