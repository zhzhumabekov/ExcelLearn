# Глава 11 (циклические ссылки). Собрано генератором; ответы expect посчитаны независимо.
id: circular-iterations
chapter: ch11
order: 1
title: Циклическая ссылка и итеративные вычисления
source: Circular.xlsx (рис. 11.2–11.4)
sheet:
  file: Благотворительность.xlsx
  name: Расчёт
  columns:
    A: 240
    B: 160
  rows: 8
  cells:
    A1: доход
    B1:
      v: 15000000
      fmt: kzt
    A2: налоговая_ставка
    B2:
      v: 0.2
      fmt: percent
    A3: издержки
    B3:
      v: 10000000
      fmt: kzt
    A4: благотворительность
    B4:
      fmt: kzt
    A5: до_уплаты_налогов
    B5:
      fmt: kzt
    A6: после_уплаты_налогов
    B6:
      fmt: kzt
expect:
  B4: 370370.3704
  B5: 4629629.6296
  B6: 3703703.7037
steps:
- title: Ситуация
  text: ТОО заработало <b>15 000 000 ₸</b>, издержки — <b>10 000 000 ₸</b>, корпоративный подоходный налог — 20%. Учредители
    решили отдавать на благотворительность <b>10% чистой прибыли</b>, то есть после налога. Но пожертвование уменьшает прибыль,
    а значит, и налог, и саму чистую прибыль. Сколько отдать?
  actions:
  - wait: 3000
- title: Имена из подписей
  text: 'Подписи в столбце A уже похожи на имена. Выделите <code>A1:B6</code> и нажмите <b>Формулы → Создать из выделенного</b>
    (глава 2): каждая ячейка столбца B получит имя по подписи слева. Формулы будут читаться как условие задачи.'
  actions:
  - dragSelect: A1:B6
  - clickRibbon: createFromSelection
  - wait: 800
  - dialogButton: OK
- title: Пожертвование
  text: 'В <code>B4</code>: <code>{f:=0.1*после_уплаты_налогов}</code> — 10% от чистой прибыли. Чистая прибыль в <code>B6</code>
    ещё не посчитана, ячейка пустая, поэтому пока <b>0 ₸</b>.'
  actions:
  - click: B4
  - type: =0.1*после_уплаты_налогов
  - keys:
    - Enter
- title: Прибыль до налога
  text: 'В <code>B5</code>: <code>{f:=доход-издержки-благотворительность}</code>. Пожертвование уменьшает прибыль, с которой
    платят налог: пока оно 0, получается 5 000 000 ₸.'
  actions:
  - click: B5
  - type: =доход-издержки-благотворительность
  - keys:
    - Enter
- title: Чистая прибыль — и петля замкнулась
  text: 'В <code>B6</code>: <code>{f:=(1-налоговая_ставка)*до_уплаты_налогов}</code>. После <kbd>Enter</kbd> Excel предупреждает
    о <b>циклической ссылке</b>: <code>B4</code> зависит от <code>B6</code>, <code>B6</code> — от <code>B5</code>, а <code>B5</code>
    — от <code>B4</code>. Цепочка формул вернулась в свою начальную ячейку.'
  actions:
  - click: B6
  - type: =(1-налоговая_ставка)*до_уплаты_налогов
  - keys:
    - Enter
  - wait: 1500
- title: Это не ошибка
  text: 'Нажмите <b>OK</b>. Ячейки петли показывают 0, а внизу окна — «Циклические ссылки: B6». Ошибки в логике нет: пожертвование
    и правда зависит от прибыли, а прибыль — от пожертвования. Просто по умолчанию Excel такие петли не считает: ему нужно
    разрешить.'
  actions:
  - dialogButton: OK
  - click: B6
  - showRefs: B6
  - wait: 1500
- title: Файл → Параметры → Формулы
  text: '<b>Файл → Параметры</b>, раздел <b>Формулы</b>, флажок <b>Включить итеративные вычисления</b>. Excel будет пересчитывать
    петлю по кругу: каждый раз берёт значения прошлого круга, пока они не перестанут меняться больше чем на <b>относительную
    погрешность</b>, но не больше 100 раз. Погрешность 0,001 уменьшим до 0,000001, чтобы ответ был точнее, и нажмём OK.'
  actions:
  - fileMenu: options
  - dialogPick: Формулы
  - dialogCheck: Включить итеративные вычисления
  - dialogType:
      field: Относительная погрешность
      text: 0,000001
  - dialogButton: OK
  - wait: 1200
- title: Проверка
  text: 'Пожертвование — <b>370 370 ₸</b>, чистая прибыль — <b>3 703 704 ₸</b>. Проверим: 10% от 3 703 704 ₸ = 370 370 ₸,
    всё сходится. Excel решил систему из трёх уравнений: каждая формула петли — одно уравнение, три ячейки — три неизвестных.'
  actions:
  - click: B4
  - showRefs: B4
  - wait: 2000
- title: 'Частая ошибка: итерации «на всякий случай»'
  text: 'Включить итерации заранее, во всех книгах. Тогда <b>случайная</b> петля — например, {fn:SUM}, захватившая собственную
    ячейку, — не вызовет предупреждения и тихо даст неверное число. Включайте итерации, только когда петля задумана, как
    здесь. И помните: точный ответ гарантирован для линейных зависимостей, как в этой задаче.'
  actions:
  - wait: 3000
- title: Что запомнить
  text: Циклическая ссылка — формула прямо или через другие ячейки зависит от самой себя. Если петля задумана (налоги, премии,
    проценты от результата), включите <b>Файл → Параметры → Формулы → Включить итеративные вычисления</b>. <b>На работе
    пригодится</b> для бонусов и отчислений от чистой прибыли.
  actions:
  - click: B6
