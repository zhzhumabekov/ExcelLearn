# Глава 13 (время). Собрано генератором; ответы expect посчитаны независимо.
id: now
chapter: ch13
order: 3
title: ТДАТА, СЕГОДНЯ и время, которое не меняется
source: Time.xlsx (рис. 13.4, 13.8)
sheet:
  file: Сейчас.xlsx
  name: Сейчас
  columns:
    A: 200
    B: 170
  rows: 6
  cells:
    A1:
      v: ТДАТА()
      style: label
    B1:
      fmt: datetime
    A2:
      v: Время сейчас
      style: label
    B2:
      fmt: time
    A3:
      v: Доля суток
      style: label
    B3:
      fmt: number
    A5:
      v: Накладная выписана
      style: label
today: '2026-10-13'
now: '14:12'
expect:
  B1: 46308.591666667
  B2: 0.591666667
  B3: 0.591666667
  B5: 0.591666667
steps:
- title: Ситуация
  text: 'Кладовщик выписывает накладную и хочет видеть в ней текущее время. В уроке «сейчас» — 13 октября 2026 г., 14:12.
    Есть два способа: формула, которая обновляется, и значение, которое остаётся.'
  actions:
  - wait: 3000
- title: '{fn:NOW}: дата и время'
  text: '<code>{f:=NOW()}</code> в <code>B1</code> — <b>13.10.2026 14:12</b>. Скобки пустые: аргументов нет. {fn:NOW} пересчитывается
    при каждом изменении книги и при открытии файла — завтра она покажет завтрашние дату и время.'
  actions:
  - click: B1
  - type: =NOW()
  - keys:
    - Enter
- title: 'Только время: {fn:NOW} − {fn:TODAY}'
  text: '{fn:TODAY} — дата без времени, целое число. <code>{f:=NOW()-TODAY()}</code> оставляет дробную часть — время <b>14:12</b>.
    В <code>B3</code> то же значение в формате Числовой: <b>0,59</b> — 14,2 ч ÷ 24, прошло 59% суток.'
  actions:
  - click: B2
  - type: =NOW()-TODAY()
  - keys:
    - Enter
  - click: B3
  - type: =NOW()-TODAY()
  - keys:
    - Enter
- title: Ctrl+Shift+; — время, которое не меняется
  text: 'В накладной время меняться не должно. Встаньте на <code>B5</code> и нажмите <b>Ctrl+Shift+;</b> — Excel впишет
    текущее время как набранное значение 14:12. Это не формула: завтра в ячейке останется 14:12. Ctrl+; так же вставляет
    сегодняшнюю дату.'
  actions:
  - click: B5
  - keys:
    - Ctrl
    - Shift
    - ;
  - wait: 800
  - keys:
    - Enter
- title: Что запомнить
  text: <code>{f:=NOW()}</code> — дата и время, обновляется; <code>{f:=NOW()-TODAY()}</code> — только время. <b>Ctrl+Shift+;</b>
    — время, <b>Ctrl+;</b> — дата значением, они не меняются. <b>На работе пригодится</b> для накладных, актов, журналов
    приёма.
  actions:
  - click: B5
