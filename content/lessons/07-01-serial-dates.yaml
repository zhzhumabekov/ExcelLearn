# Глава 7 (даты). Собрано генератором; ответы expect посчитаны независимо.
id: serial-dates
chapter: ch07
order: 1
title: 'Дата — это число: формат «Дата» и «Общий»'
source: Dates.xlsx, лист serial format (рис. 7.1–7.2)
sheet:
  file: Платежи_из_банка.xlsx
  name: Платежи
  columns:
    A: 200
    B: 170
  rows: 14
  cells:
    A1:
      v: Дата из выгрузки
      style: head
    B1:
      v: Как дата
      style: head
    A2: 46027
    B2:
      f: =A2
    A3: 46041
    B3:
      f: =A3
    A4: 46055
    B4:
      f: =A4
    A5: 46069
    B5:
      f: =A5
    A6: 46083
    B6:
      f: =A6
    A8:
      v: Набираем дату
      style: label
    A9: Год «29»
    A10: Год «30»
    A12:
      v: Дата текстом
      style: head
    B12:
      v: ДАТАЗНАЧ
      style: head
    A13: 15.01.2026
expect:
  B2: 46027
  B3: 46041
  B4: 46055
  B5: 46069
  B6: 46083
  B8: 37625
  B9: 47119
  B10: 10959
  B13: 46037
steps:
- title: Ситуация
  text: 'Банк-клиент выгрузил платежи, а вместо дат в столбце A — числа: <b>46027</b>, <b>46041</b>… Это не сбой. Так Excel
    хранит любую дату: как <b>номер дня</b>. Первый день — 01.01.1900, второй — 02.01.1900 и так далее.'
  actions:
  - wait: 3000
- title: Номер дня
  text: 'В <code>B2</code> то же число: <code>{f:=A2}</code>. 46027 — это 46027-й день, считая 1 января 1900 года первым.
    Чтобы увидеть дату, менять число не нужно: достаточно поменять <b>формат</b> ячейки.'
  actions:
  - click: B2
  - wait: 1500
- title: Формат ячеек → Дата
  text: Выделите <code>B2:B6</code>, щёлкните по выделению <b>правой кнопкой</b> и выберите <b>Формат ячеек…</b>. В списке
    «Числовые форматы» — <b>Дата</b>, тип <b>14.03.2012</b>, затем OK. В ячейках те же числа, только показаны как даты.
    Это же окно открывает <kbd>Ctrl</kbd>+<kbd>1</kbd>.
  actions:
  - select: B2:B6
  - contextMenu: formatCells
  - dialogPick: Дата
  - dialogPick: '*14.03.2012'
  - dialogButton: OK
- title: Длинный тип даты
  text: 'Ещё раз <kbd>Ctrl</kbd>+<kbd>1</kbd> → тип <b>14 марта 2012 г.</b> → OK: <b>5 января 2026 г.</b> Такой вид удобен
    в письмах и приказах. Типы со звёздочкой берутся из настроек Windows: в английском Excel тот же тип покажет «Monday,
    January 5, 2026».'
  actions:
  - select: B2:B6
  - keys:
    - Ctrl
    - '1'
  - dialogPick: '*14 марта 2012 г.'
  - dialogButton: OK
- title: Набираем дату
  text: 'Наберите в <code>B8</code> <b>04.01.2003</b> и нажмите Enter. Excel узнал дату и сам поставил формат «Дата». Теперь
    <kbd>Ctrl</kbd>+<kbd>1</kbd> → <b>Общий</b> → OK: в ячейке <b>37625</b>. Это номер 4 января 2003 года. Excel понимает
    и «4.1.2003», и «4 янв 2003».'
  actions:
  - click: B8
  - type: 04.01.2003
  - keys:
    - Enter
  - click: B8
  - keys:
    - Ctrl
    - '1'
  - dialogPick: Общий
  - dialogButton: OK
- title: Год двумя цифрами
  text: 'Если набрать год двумя цифрами, Excel решает век сам: от 00 до 29 — XXI век, от 30 до 99 — XX. <b>1.1.29</b> станет
    01.01.2029, а <b>1.1.30</b> — 01.01.1930. С датами рождения и договоров это опасно. Набирайте год четырьмя цифрами.'
  actions:
  - click: B9
  - type: 1.1.29
  - keys:
    - Enter
  - type: 1.1.30
  - keys:
    - Enter
- title: 'Частая ошибка: дата текстом'
  text: 'Числа и даты Excel прижимает к правому краю, текст — к левому. «15.01.2026» в <code>A13</code> прижата влево: это
    <b>текст</b>, и считать с ним нельзя. {fn:DATEVALUE} делает из текста дату: <code>{f:=DATEVALUE(A13)}</code> → <b>46037</b>.
    Осталось дать ячейке формат «Дата». Текст можно написать и прямо в формуле: <code>{f:=DATEVALUE("04.01.2003")}</code>.'
  actions:
  - click: B13
  - type: =DATEVALUE(
  - clickRef: A13
  - type: )
  - keys:
    - Enter
  - click: B13
  - keys:
    - Ctrl
    - '1'
  - dialogPick: Дата
  - dialogButton: OK
- title: Что запомнить
  text: Дата в Excel — номер дня, считая 01.01.1900 первым. Формат «Дата» показывает номер как дату, «Общий» — как число.
    Окно формата открывают правой кнопкой (<b>Формат ячеек…</b>) или <kbd>Ctrl</kbd>+<kbd>1</kbd>. <b>На работе пригодится</b>
    для выгрузок из банка и 1С, где даты приходят числами или текстом.
  actions:
  - click: B2
