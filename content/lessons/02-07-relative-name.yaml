# Глава 2. Свой пример по мотивам рис. 2.15–2.16 (Last year): относительное имя «предыдущий_год».
id: relative-name
chapter: ch02
order: 7
title: "Относительное имя: «предыдущий_год»"
source: Свой пример (прогноз выручки компании)

sheet:
  file: Прогноз_выручки.xlsx
  name: Выручка
  columns: { A: 120, B: 150, C: 24 }
  rows: 12
  cells:
    A1: {v: Прирост в год, style: label}
    B1: {v: 0.1, fmt: percent}
    A3: {v: Год, style: head}
    B3: {v: "Выручка, млн ₸", style: head}
    A4: 2019
    B4: {v: 300, fmt: number}
    A5: 2020
    A6: 2021
    A7: 2022
    A8: 2023
    A9: 2024
    A10: 2025
    A11: 2026
    B5: {fmt: number}

expect:
  B5: 330
  B8: 439.23
  B11: 584.6151

steps:
  - title: Ситуация
    text: >-
      Компания планирует расти на 10% в год: выручка каждого года = выручка прошлого года × (1 + прирост).
      Хочется, чтобы формула так и читалась: <code>=предыдущий_год*(1+прирост)</code>. Для этого нужно имя,
      которое <b>всегда указывает на ячейку строкой выше</b> — откуда бы его ни вызвали.
    say: >-
      Компания планирует расти на десять процентов в год. Хотим формулу «предыдущий год, умноженный на один
      плюс прирост». Для этого нужно имя, которое всегда указывает на ячейку строкой выше.
    actions:
      - wait: 3000

  - title: Имя «прирост»
    text: >-
      Выделите <code>B1</code> и в поле «Имя» наберите <code>прирост</code>. Это обычное имя: оно всегда
      указывает на <code>B1</code>.
    say: Выделяем ячейку с приростом и называем её «прирост».
    actions:
      - click: B1
      - nameBox: прирост

  - title: Встаньте в B5
    text: >-
      Теперь важная деталь: выделите <code>B5</code> — ячейку 2020 года. Относительное имя запоминает
      расстояние от <b>активной ячейки</b>, поэтому стоять нужно там, где будет формула.
    say: >-
      Важная деталь: выделяем Бэ пять — ячейку двадцатого года. Относительное имя запоминает расстояние от
      активной ячейки.
    actions:
      - click: B5
      - wait: 600

  - title: Относительная ссылка в имени
    text: >-
      <b>Формулы → Присвоить имя</b>. Имя — <code>предыдущий_год</code>, в поле <b>Диапазон</b> вместо
      <code>=Выручка!$B$5</code> введите <code>=Выручка!B4</code> — <b>без знаков $</b>. Так имя означает
      «ячейка на одну строку выше текущей».
    say: >-
      Нажимаем «Присвоить имя». Имя — «предыдущий год», а в поле «Диапазон» вводим ссылку на ячейку выше без
      знаков доллара. Так имя означает «ячейка на строку выше текущей».
    actions:
      - clickRibbon: defineName
      - dialogType: {field: Имя, text: предыдущий_год}
      - dialogType: {field: Диапазон, text: =Выручка!B4}
      - wait: 600
      - dialogButton: OK

  - title: Формула словами
    text: >-
      В <code>B5</code> введите <code>=предыдущий_год*(1+прирост)</code>: <b>330</b> млн ₸. Протяните формулу
      до <code>B11</code> — в каждой строке <code>предыдущий_год</code> берёт строку над собой.
    say: >-
      В Бэ пять вводим «предыдущий год, умноженный на один плюс прирост» — триста тридцать. Протягиваем до
      двадцать шестого года.
    actions:
      - type: =предыдущий_год*(1+прирост)
      - keys: [Enter]
      - click: B5
      - fill: B5:B11

  - title: Одна формула во всех строках
    text: >-
      Выделите <code>B8</code>: формула та же — <code>=предыдущий_год*(1+прирост)</code>, но считает от
      2022 года: <b>439,23</b>. К 2026 году выручка вырастет до <b>584,62</b> млн ₸.
    say: >-
      В любой строке формула та же самая, но считает от своего предыдущего года. К двадцать шестому году
      выручка вырастет почти до пятисот восьмидесяти пяти миллионов.
    actions:
      - click: B8
      - wait: 1500
      - click: B11
      - wait: 1200

  - title: "Частая ошибка: знак $ в имени"
    text: >-
      Если в поле «Диапазон» оставить <code>=Выручка!$B$4</code>, имя всегда будет указывать на 2019 год, и все
      годы получат одно и то же 330. Для «сдвигающегося» имени знаки <code>$</code> нужно убрать.
    say: >-
      Частая ошибка — оставить знаки доллара в ссылке имени. Тогда имя всегда указывает на один и тот же год, и
      все годы получат одинаковое значение.
    actions:
      - wait: 3500

  - title: Что запомнить
    text: >-
      Имя может указывать <b>относительно</b> активной ячейки: встаньте туда, где будет формула, и задайте
      ссылку без <code>$</code>. Тогда одна понятная формула работает во всех строках. <b>На работе
      пригодится</b> в прогнозах «от прошлого периода»: выручка, численность, остатки на складе.
    say: >-
      Готово! Имя может указывать относительно активной ячейки — для этого ссылку задают без знаков доллара.
      Пригодится в прогнозах «от прошлого периода».
    actions:
      - click: B11
