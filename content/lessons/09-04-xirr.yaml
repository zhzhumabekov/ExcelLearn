# Глава 9 (ВСД). Собрано генератором; ответы expect посчитаны независимо.
id: xirr
chapter: ch09
order: 4
title: 'ЧИСТВНДОХ: ВСД для потоков с датами'
source: IRR.xlsx, лист XIRR (рис. 9.5)
sheet:
  file: Заём_ИП.xlsx
  name: Заём
  columns:
    A: 220
    B: 150
  rows: 9
  cells:
    A1:
      v: Дата
      style: head
    B1:
      v: Поток
      style: head
    A7: ЧИСТВНДОХ
    B7:
      fmt: percent
    A8: ВСД (как будто через год)
    B8:
      fmt: percent
    A2:
      v: '2027-01-15'
      fmt: date
    B2:
      v: -2000000
      fmt: kzt
    A3:
      v: '2027-05-20'
      fmt: date
    B3:
      v: 600000
      fmt: kzt
    A4:
      v: '2027-11-10'
      fmt: date
    B4:
      v: 700000
      fmt: kzt
    A5:
      v: '2028-06-05'
      fmt: date
    B5:
      v: 900000
      fmt: kzt
expect:
  B7: 0.1101
  B8: 0.046
steps:
- title: Ситуация
  text: ТОО дало знакомому ИП заём <b>2 000 000 ₸</b> 15.01.2027, а он возвращает деньги частями — когда получается (строки
    3–5). Под какой процент в год фактически работали деньги? Даты неравные, поэтому нужна {fn:XIRR}.
  actions:
  - wait: 3000
- title: '{fn:XIRR}: потоки и даты'
  text: 'В <code>B7</code>: <code>{f:=XIRR(B2:B5,A2:A5)}</code> — потоки, затем их даты. {fn:XIRR} ищет ставку, при которой
    {fn:XNPV} этих потоков равна нулю: каждый поток дисконтируется на (дата − первая дата) / 365 лет. Ответ — <b>11,01%</b>
    годовых. Первая дата должна быть самой ранней.'
  actions:
  - click: B7
  - type: =XIRR(
  - dragRef: B2:B5
  - type: ','
  - dragRef: A2:A5
  - type: )
  - keys:
    - Enter
- title: 'Частая ошибка: {fn:IRR} для потоков с датами'
  text: 'В <code>B8</code>: <code>{f:=IRR(B2:B5)}</code>. {fn:IRR} не знает дат и считает, что потоки идут ровно через год:
    возврат растянулся бы на три года. Ответ — <b>4,60%</b>, намного меньше правды: на самом деле деньги вернулись за полтора
    года. Если даты неравные — только {fn:XIRR}.'
  actions:
  - click: B8
  - type: =IRR(
  - dragRef: B2:B5
  - type: )
  - keys:
    - Enter
- title: Что запомнить
  text: <code>{f:=XIRR(потоки,даты)}</code> — ВСД для потоков в любые даты, в процентах годовых. Третий аргумент — предположение,
    как у {fn:IRR}. <b>На работе пригодится</b> для займов, рассрочек и инвестиций с нерегулярными платежами.
  actions:
  - click: B7
