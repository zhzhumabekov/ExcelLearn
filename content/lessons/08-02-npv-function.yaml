# Глава 8 (ЧПС). Собрано генератором; ответы expect посчитаны независимо.
id: npv-function
chapter: ch08
order: 2
title: 'Функция ЧПС: первый поток — через год'
source: NPV.xlsx (рис. 8.1)
sheet:
  file: Функция_ЧПС.xlsx
  name: ЧПС
  columns:
    A: 230
    B: 140
    C: 140
    D: 140
  rows: 11
  cells:
    A1:
      v: Ставка
      style: label
    B1:
      v: 0.2
      fmt: percent
    A3:
      v: Год
      style: head
    A4: Проект 1
    A6: ЧПС всех потоков
    B6:
      fmt: kzt
    A7: Сегодня + ЧПС будущих
    B7:
      fmt: kzt
    A9: Год без денег
    A10: Сегодня + ЧПС будущих
    B10:
      fmt: kzt
    B9:
      v: -1000000
      fmt: kzt
    C9:
      fmt: kzt
    D9:
      v: 1500000
      fmt: kzt
    B3:
      v: 0
      style: head
    B4:
      v: -10000000
      fmt: kzt
    C3:
      v: 1
      style: head
    C4:
      v: 24000000
      fmt: kzt
    D3:
      v: 2
      style: head
