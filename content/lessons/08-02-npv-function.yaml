names:
- name: ставка
  ref: B1
expect:
  B6: 231481.4815
  B7: 277777.7778
  B10: 41666.6667
  C9: 0
steps:
- title: Ситуация
  text: 'В прошлом уроке ЧПС проекта 1 считали по годам: <b>277 778 ₸</b>. В Excel для этого есть функция <code>{fn:NPV}</code>.
    У неё есть особенность, на которой ошибаются чаще всего, — разберём её. Ячейка <code>B1</code> уже названа <code>ставка</code>.'
  actions:
  - wait: 3000
- title: '{fn:NPV}: ставка и потоки'
  text: 'В <code>B6</code> введите <code>{f:=NPV(ставка,B4:D4)}</code>: первый аргумент — ставка, дальше — потоки по порядку.
    Результат — <b>231 481 ₸</b>, а не 277 778 ₸! {fn:NPV} считает, что первый поток приходит <b>через год</b>: делит <code>B4</code>
    на 1,2, <code>C4</code> — на 1,2², <code>D4</code> — на 1,2³. А 10 млн ₸ мы платим сегодня.'
  actions:
  - click: B6
  - type: =NPV(ставка,
  - dragRef: B4:D4
  - type: )
  - keys:
    - Enter
- title: 'Частая ошибка: сегодняшний поток внутри {fn:NPV}'
  text: 'Если подать в {fn:NPV} и сегодняшний поток, все потоки сдвигаются на год позже, и ЧПС выходит в (1 + ставка) раз
    меньше: 277 778 ₸ ÷ 1,2 = 231 481 ₸. Ошибка тихая — число похоже на правду. Правило: в {fn:NPV} передают только будущие
    потоки, начиная с конца первого года.'
  actions:
  - click: B6
  - showRefs: B6
  - wait: 2500
- title: 'Правильно: сегодняшний поток — снаружи'
  text: 'В <code>B7</code>: <code>{f:=B4+NPV(ставка,C4:D4)}</code>. Сегодняшний поток <code>B4</code> уже в сегодняшних
    деньгах — прибавляем его как есть. {fn:NPV} дисконтирует остальные: 24 000 000 ÷ 1,2 и −14 000 000 ÷ 1,44. Итог — <b>277
    778 ₸</b>, как при расчёте по годам.'
  actions:
  - click: B7
  - type: '='
  - clickRef: B4
  - type: +NPV(ставка,
  - dragRef: C4:D4
  - type: )
  - keys:
    - Enter
- title: Пустая ячейка выпадает вместе с годом
  text: 'Строка 9: в первый год денег нет, и <code>C9</code> оставили пустой. <code>{f:=B9+NPV(ставка,C9:D9)}</code> даёт
    <b>250 000 ₸</b> — слишком много. {fn:NPV} пропускает пустую ячейку вместе с её годом: 1 500 000 ₸ считаются полученными
    через год, а не через два.'
  actions:
  - click: B10
  - type: '='
  - clickRef: B9
  - type: +NPV(ставка,
  - dragRef: C9:D9
  - type: )
  - keys:
    - Enter
- title: Ноль вместо пустоты
  text: 'Впишите в <code>C9</code> <b>0</b>. Теперь год на месте: 1 500 000 ÷ 1,44 − 1 000 000 = <b>41 667 ₸</b>. Если в
    каком-то году потока нет, пишите 0, а не оставляйте ячейку пустой.'
  actions:
  - click: C9
  - type: '0'
  - keys:
    - Enter
  - click: B10
  - wait: 1500
- title: Что запомнить
  text: '<code>{f:=NPV(ставка,потоки)}</code> дисконтирует первый поток на год. Сегодняшний поток — снаружи: сегодня + ЧПС(ставка;
    будущие потоки). Пустая ячейка выпадает вместе с годом — пишите 0. <b>На работе пригодится</b> для бизнес-планов, сравнения
    кредитов и инвестиций.'
  actions:
  - click: B7
