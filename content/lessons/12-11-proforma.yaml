steps:
- title: Ситуация
  text: 'Прогноз баланса ТОО на 4 года: продажи, затраты, прибыль, основные средства. Все строки уже посчитаны, кроме двух.
    Активы и пассивы должны сойтись, и кто-то должен закрыть разницу: если активов больше — компания <b>берёт долг</b>,
    если меньше — лишнее <b>лежит деньгами</b>. Это решает {fn:IF}.'
  actions:
  - wait: 3000
- title: Сначала итерации
  text: 'В модели есть петля: долг → проценты по долгу → прибыль → капитал → долг. Как в главе 11, включим <b>Файл → Параметры
    → Формулы → Включить итеративные вычисления</b>.'
  actions:
  - fileMenu: options
  - dialogPick: Формулы
  - dialogCheck: Включить итеративные вычисления
  - dialogButton: OK
- title: 'Долг: {fn:IF}'
  text: 'В <code>C17</code>: <code>{f:=IF(C15>C16+C18,C15-C16-C18,0)}</code> — если активов больше, чем текущих обязательств
    и капитала, разницу закрывает долг, иначе долга нет. Протяните до <code>F17</code>: долг нужен в годы 1, 2, 3 и уменьшается
    — компания зарабатывает и гасит его.'
  actions:
  - click: C17
  - type: =IF(C15>C16+C18,C15-C16-C18,0)
  - keys:
    - Enter
  - click: C17
  - fill: C17:F17
- title: 'Деньги: {fn:IF} и {fn:MAX}'
  text: 'В <code>C12</code>: <code>{f:=IF(C17>0,0,MAX(0,C19-C13-C14))}</code> — если есть долг, свободных денег нет; иначе
    деньги — то, что остаётся от пассивов после текущих активов и основных средств ({fn:MAX} не даёт уйти в минус). Протяните
    до <code>F12</code>: в год 4 долг погашен и появились деньги.'
  actions:
  - click: C12
  - type: =IF(C17>0,0,MAX(0,C19-C13-C14))
  - keys:
    - Enter
  - click: C12
  - fill: C12:F12
- title: Баланс сошёлся
  text: 'Строка 31 — активы минус пассивы — нули во всех годах: две {fn:IF} уравновесили баланс, а итерации досчитали петлю.
    Поменяйте рост продаж в <code>B1</code> — модель сама решит, где нужен долг, а где останутся деньги.'
  actions:
  - click: C31
  - wait: 1200
  - click: F31
  - wait: 1200
- title: Что запомнить
  text: 'В прогнозных моделях {fn:IF} выбирает балансирующую статью: долг, если не хватает, деньги, если лишнее. Вместе
    с итерациями главы 11 это даёт баланс, который сходится всегда. <b>На работе пригодится</b> для бизнес-планов и финансовых
    моделей.'
  actions:
  - click: F12
