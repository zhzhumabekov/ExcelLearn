# Глава 2. Свой пример по мотивам рис. 2.1–2.2 (east/west): выручка филиалов, имена ячеек через поле «Имя».
id: name-a-cell
chapter: ch02
order: 1
title: "Имя для ячейки: поле «Имя»"
source: Свой пример (выручка филиалов за март)

sheet:
  file: Выручка_филиалов.xlsx
  name: Март
  columns: {A: 24, B: 200, C: 130, D: 40}
  rows: 9
  cells:
    B2: {v: Филиал, style: head}
    C2: {v: "Выручка, тыс. ₸", style: head}
    B3: Алматы
    C3: 48200
    B4: Астана
    C4: 39500
    B5: Шымкент
    C5: 21400
    B7: {v: Алматы и Астана вместе, style: label}
    C7: {style: total}

expect:
  C7: 87700

steps:
  - title: Ситуация
    text: >-
      Директор спрашивает, сколько за март принесли два крупнейших филиала. Формула <code>=C3+C4</code> даст
      ответ, но через месяц никто не вспомнит, что в <code>C3</code> и <code>C4</code>. А формулу
      <code>=Алматы+Астана</code> поймёт любой. Для этого ячейкам дают <b>имена</b>.
    say: >-
      Директор спрашивает, сколько за март принесли два крупнейших филиала. Формулу Цэ три плюс Цэ четыре
      через месяц никто не поймёт. А формулу «Алматы плюс Астана» поймёт любой. Для этого ячейкам дают имена.
    actions:
      - wait: 3000

  - title: Поле «Имя»
    text: >-
      Выделите <code>C3</code> — выручку Алматы. Посмотрите на <b>поле «Имя»</b>: оно над столбцом A, слева
      от <i>fx</i>. Сейчас в нём адрес <code>C3</code>.
    say: >-
      Выделяем ячейку Цэ три — выручку Алматы. Поле «Имя» — над столбцом А, слева от строки формул. Сейчас в
      нём адрес ячейки.
    actions:
      - click: C3
      - wait: 800

  - title: Даём ячейке имя
    text: >-
      Щёлкните в поле «Имя», наберите <code>Алматы</code> и нажмите <kbd>Enter</kbd>. Теперь у ячейки
      <code>C3</code> есть имя — оно и показывается в поле вместо адреса.
    say: >-
      Щёлкаем в поле «Имя», набираем «Алматы» и нажимаем Enter. Теперь у ячейки есть имя, и поле показывает
      его вместо адреса.
    actions:
      - nameBox: Алматы

  - title: Второе имя
    text: >-
      Так же назовём <code>C4</code>: выделите её, в поле «Имя» наберите <code>Астана</code>, <kbd>Enter</kbd>.
    say: Так же называем ячейку Цэ четыре — «Астана».
    actions:
      - click: C4
      - nameBox: Астана

  - title: Формула с именами
    text: >-
      В <code>C7</code> введите <code>=Алматы+Астана</code> и нажмите <kbd>Enter</kbd>: <b>87 700</b> тыс. ₸.
      Формула читается как фраза, а считается так же, как <code>=C3+C4</code>. Регистр букв не важен:
      <code>=алматы+АСТАНА</code> — то же самое.
    say: >-
      В Цэ семь вводим «равно Алматы плюс Астана» и нажимаем Enter. Восемьдесят семь миллионов семьсот тысяч
      тенге. Формула читается как фраза.
    actions:
      - click: C7
      - type: =Алматы+Астана
      - keys: [Enter]

  - title: Переход по имени
    text: >-
      Щёлкните стрелку <b>▾</b> поля «Имя»: в списке все имена книги. Выберите <code>Астана</code> — Excel
      сам выделит её ячейку. Так легко проверить, на что указывает имя, даже в большой таблице.
    say: >-
      Нажимаем стрелку поля «Имя» — здесь все имена книги. Выбираем «Астана», и Excel сам выделяет её ячейку.
    actions:
      - nameList: Астана

  - title: "Частая ошибка: недопустимое имя"
    text: >-
      Назовём <code>C5</code> именем <code>1филиал</code> — Excel откажет: имя не может начинаться с цифры.
      Также нельзя пробелы, имена-адреса (<code>A4</code>, <code>CAT1</code>) и буквы <code>R</code> и
      <code>C</code> сами по себе. Из знаков можно только точку и подчёркивание: <code>филиал_3</code>.
    say: >-
      Попробуем назвать ячейку «один филиал» — Excel отказывает: имя не может начинаться с цифры. Нельзя и
      пробелы, и имена, похожие на адрес ячейки. Из знаков можно только точку и подчёркивание.
    actions:
      - click: C5
      - nameBox: 1филиал
      - wait: 600
      - dialogButton: OK
      - nameBox: Шымкент

  - title: Что запомнить
    text: >-
      Имя даётся в <b>поле «Имя»</b>: выделить ячейку → набрать имя → <kbd>Enter</kbd>. Формулы с именами
      понятны без расшифровки, а список ▾ поля «Имя» помогает найти любую именованную ячейку.
      <b>На работе пригодится</b> для ключевых чисел модели: курс доллара, ставка НДС, план продаж.
    say: >-
      Готово! Имя даём в поле «Имя»: выделили, набрали, Enter. Формулы с именами понятны без расшифровки. Это
      удобно для ключевых чисел: курса доллара, ставки налога, плана продаж.
    actions:
      - click: C7
