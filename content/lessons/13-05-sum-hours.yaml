# Глава 13 (время). Собрано генератором; ответы expect посчитаны независимо.
id: sum-hours
chapter: ch13
order: 5
title: 'Сумма часов больше суток: формат [ч]:мм:сс'
source: Time.xlsx (рис. 13.6)
sheet:
  file: Табель.xlsx
  name: Неделя
  columns:
    A: 220
    B: 150
  rows: 9
  cells:
    A1:
      v: День
      style: head
    B1:
      v: Отработано
      style: head
    A2: Пн
    B2:
      v: 0.322916667
      fmt: time
    A3: Вт
    B3:
      v: 0.340277778
      fmt: time
    A4: Ср
    B4:
      v: 0.3125
      fmt: time
    A5: Чт
    B5:
      v: 0.336805556
      fmt: time
    A6: Пт
    B6:
      v: 0.304166667
      fmt: time
    A7:
      v: За неделю
      style: label
    B7:
      fmt: time
    A8:
      v: Оплата, ₸ (2 500 в час)
      style: label
    B8:
      fmt: kzt
expect:
  B7: 1.616666667
  B8: 97000.0
steps:
- title: Ситуация
  text: Курьер в Астане отмечает, сколько часов и минут проработал за день. В пятницу бухгалтер складывает часы за неделю,
    чтобы начислить оплату — 2 500 ₸ в час.
  actions:
  - wait: 3000
- title: '{fn:SUM} показывает 14:48'
  text: '<code>{f:=SUM(B2:B6)}</code> в <code>B7</code> — <b>14:48</b>. За неделю курьер не мог проработать меньше, чем
    за два дня! Сумма верная — 1,6167 суток, но формат ч:мм показывает время суток и отбрасывает целые сутки: 38:48 − 24:00
    = 14:48.'
  actions:
  - click: B7
  - type: =SUM(B2:B6)
  - keys:
    - Enter
  - wait: 1500
- title: Формат [ч]:мм:сс
  text: '<b>Ctrl+1 → Время → 37:30:55</b>: в этом формате часы в квадратных скобках [ч] не обнуляются после 24. Теперь в
    <code>B7</code> — <b>38:48:00</b>, 38 часов 48 минут.'
  actions:
  - click: B7
  - keys:
    - Ctrl
    - '1'
  - dialogPick: Время
  - dialogPick: '37:30:55'
  - wait: 600
  - dialogButton: OK
- title: Оплата
  text: '<code>{f:=B7*24*2500}</code> в <code>B8</code>: 1 6167 суток × 24 = 38 8 часа  × 2 500 = <b>97 000 ₸</b>. Формат
    на расчёт не влияет: и при 14:48 оплата была бы та же — формат меняет только вид.'
  actions:
  - click: B8
  - type: =B7*24*2500
  - keys:
    - Enter
- title: Что запомнить
  text: Сумма часов больше суток — формат <b>[ч]:мм:сс</b> (в списке «Время» — 37:30:55). Для денег время × 24 — часы. <b>На
    работе пригодится</b> для табеля, оплаты почасовиков, учёта простоя техники.
  actions:
  - click: B7
