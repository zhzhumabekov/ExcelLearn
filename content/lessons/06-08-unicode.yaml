steps:
- title: Ситуация
  text: 'У каждого символа в Unicode есть номер: у казахских букв, знака тенге, греческих букв. Узнаем номера букв <b>Ә,
    Ғ, Қ, Ң, Ө, Ұ, Ү, Һ, І</b> и получим символы по номеру.'
  say: У каждого символа есть номер в Unicode. Узнаем номера казахских букв и получим символы по номеру.
  actions:
  - wait: 3000
- title: '{fn:UNICODE}: номер символа'
  text: '<code>{f:=UNICODE(A2)}</code> — номер буквы «Ә»: <b>1240</b>. Протяните вниз: казахские буквы лежат в кириллическом
    блоке Unicode, рядом с русскими.'
  say: '{fn:UNICODE} возвращает номер символа. Протягиваем вниз — номера всех казахских букв.'
  actions:
  - click: B2
  - type: =UNICODE(
  - clickRef: A2
  - type: )
  - keys:
    - Enter
  - click: B2
  - fill: B2:B10
- title: '{fn:UNICHAR}: символ по номеру'
  text: 'Обратная функция: <code>{f:=UNICHAR(D2)}</code>. 8376 — знак тенге <b>₸</b>, 956 — греческая <b>μ</b>, 8364 — знак
    евро <b>€</b>.'
  say: '{fn:UNICHAR} делает обратное: по номеру возвращает символ — знак тенге, греческую мю, евро.'
  actions:
  - click: E2
  - type: =UNICHAR(
  - clickRef: D2
  - type: )
  - keys:
    - Enter
  - click: E2
  - fill: E2:E4
- title: Частая ошибка
  text: 'Брать {fn:CHAR} вместо {fn:UNICHAR}: {fn:CHAR} знает только коды до 255 из кодовой страницы Windows, а в ней нет
    ни казахских букв, ни ₸. <code>{f:=CHAR(65)}</code> — «A», но <code>{f:=CHAR(8376)}</code> — ошибка.'
  say: '{fn:CHAR} знает только первые двести пятьдесят пять символов. Для казахских букв и знака тенге нужна {fn:UNICHAR}.'
  actions:
  - wait: 3000
- title: Что запомнить
  text: '{fn:UNICODE} — номер символа, {fn:UNICHAR} — символ по номеру; работают для любых языков. <b>На работе пригодится</b>,
    чтобы вставить ₸ или казахскую букву формулой и разобраться, какой «странный» символ прячется в данных.'
  say: Готово! {fn:UNICODE} и {fn:UNICHAR} работают с любыми символами, в том числе с казахскими буквами и знаком тенге.
  actions:
  - click: B2
