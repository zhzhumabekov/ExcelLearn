# Глава 13 (время). Собрано генератором; ответы expect посчитаны независимо.
id: night-shift
chapter: ch13
order: 4
title: 'Смена через полночь: ЕСЛИ и умножение на 24'
source: Time.xlsx (рис. 13.5)
sheet:
  file: Смены.xlsx
  name: Охрана
  columns:
    A: 140
    B: 100
    C: 100
    D: 100
  rows: 8
  cells:
    A1:
      v: Сторож
      style: head
    B1:
      v: Начало
      style: head
    C1:
      v: Конец
      style: head
    D1:
      v: Часов
      style: head
    A7:
      v: Всего часов
      style: label
    D7:
      fmt: number
    A2: Ержан
    B2:
      v: 0.916666667
      fmt: time
    C2:
      v: 0.291666667
      fmt: time
    D2:
      fmt: number
    A3: Галина
    B3:
      v: 0.333333333
      fmt: time
    C3:
      v: 0.6875
      fmt: time
    D3:
      fmt: number
    A4: Тимур
    B4:
      v: 0.833333333
      fmt: time
    C4:
      v: 0.270833333
      fmt: time
    D4:
      fmt: number
    A5: Айнур
    B5:
      v: 0.375
      fmt: time
    C5:
      v: 0.75
      fmt: time
    D5:
      fmt: number
expect:
  D2: 9.0
  D3: 8.5
  D4: 10.5
  D5: 9.0
  D7: 37.0
steps:
- title: Ситуация
  text: 'Сторожа склада в Караганде работают по графику, и ночные смены переходят через полночь: Ержан — с 22:00 до 7:00.
    Нужно посчитать, сколько часов отработал каждый, чтобы начислить оплату.'
  actions:
  - wait: 3000
- title: Простое вычитание не работает
  text: '<code>{f:=24*(C2-B2)}</code> в <code>D2</code>: 7:00 − 22:00 = (0,2917 − 0,9167) × 24 = <b>−15</b> часов. Excel
    не знает, что смена закончилась на следующий день: в ячейках только время, без даты.'
  actions:
  - click: D2
  - type: =24*(C2-B2)
  - keys:
    - Enter
  - wait: 1500
- title: '{fn:IF}: добавляем сутки'
  text: '<code>{f:=IF(C2>B2,24*(C2-B2),24+24*(C2-B2))}</code>. Если конец позже начала — смена в одних сутках, просто разница
    × 24. Иначе конец — уже завтра, и к отрицательной разнице добавляем 24 часа: 24 − 15 = <b>9</b>. Протяните до <code>D5</code>.'
  actions:
  - click: D2
  - type: =IF(C2>B2,24*(C2-B2),24+24*(C2-B2))
  - keys:
    - Enter
  - click: D2
  - fill: D2:D5
- title: Итого часов
  text: 'Галина отработала 8,5 часа, Тимур — 10,5. <code>{f:=SUM(D2:D5)}</code> в <code>D7</code> — <b>37,0</b> часа: часы
    уже числа, их можно складывать и умножать на ставку.'
  actions:
  - click: D7
  - type: =SUM(D2:D5)
  - keys:
    - Enter
- title: Что запомнить
  text: 'Если смена может перейти через полночь, а дата не записана, — {fn:IF}: «конец меньше начала — прибавить 24 часа».
    Другой способ — хранить дату и время в одной ячейке. <b>На работе пригодится</b> для табеля охраны, диспетчеров, медсестёр.'
  actions:
  - click: D2
