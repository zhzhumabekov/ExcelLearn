steps:
- title: Ситуация
  text: Автосалон с пробегом в Караганде даёт скидку на машины, которые долго стоят на площадке. Нужно знать, сколько <b>полных</b>
    месяцев каждая машина простояла от поступления до продажи.
  actions:
  - wait: 3000
- title: '{fn:DATEDIF}: полные годы'
  text: '<code>{f:=DATEDIF(B2,C2,"y")}</code>: начало, конец и единица в кавычках. "y" — полные годы. Excel <b>не подсказывает</b>
    эту функцию: её нет ни в списке при наборе, ни в мастере функций. Набирайте имя целиком.'
  actions:
  - click: D2
  - type: =DATEDIF(
  - clickRef: B2
  - type: ','
  - clickRef: C2
  - type: ',"y")'
  - keys:
    - Tab
- title: Месяцы и дни
  text: '"m" — полные месяцы, "d" — дни. Camry простояла <b>17</b> полных месяцев, или 542 дней. Lada — 364 дней, почти
    год, но полных лет <b>0</b>: до годовщины не хватило дня. Протяните формулы до 6-й строки.'
  actions:
  - type: =DATEDIF(
  - clickRef: B2
  - type: ','
  - clickRef: C2
  - type: ',"m")'
  - keys:
    - Tab
  - type: =DATEDIF(
  - clickRef: B2
  - type: ','
  - clickRef: C2
  - type: ',"d")'
  - keys:
    - Enter
  - click: D2
  - fill: D2:D6
  - click: E2
  - fill: E2:E6
  - click: F2
  - fill: F2:F6
- title: Годы и месяцы в одной ячейке
  text: '"ym" — месяцы сверх полных лет. Подпись «1 г. 5 мес.» собирают знаком &: <code>{f:=DATEDIF(B2,C2,"y")&" г. "&DATEDIF(B2,C2,"ym")&"
    мес."}</code>.'
  actions:
  - click: G2
  - type: =DATEDIF(B2,C2,"y")&" г. "&DATEDIF(B2,C2,"ym")&" мес."
  - keys:
    - Enter
  - click: G2
  - fill: G2:G6
- title: 'Частая ошибка: #ЧИСЛО!'
  text: У Chevrolet в 6-й строке дата продажи <b>раньше</b> даты поступления — при вводе перепутали. {fn:DATEDIF} тогда
    возвращает <code>#ЧИСЛО!</code>. Начальная дата всегда первая.
  actions:
  - click: D6
  - wait: 2500
- title: Что запомнить
  text: <code>{f:=DATEDIF(начало,конец,"m")}</code> — полные месяцы; "y" — годы, "d" — дни, "ym" — месяцы сверх лет. Функции
    нет в подсказках Excel, но она работает. <b>На работе пригодится</b> для стажа, возраста, сроков хранения и аренды.
  actions:
  - click: E2
