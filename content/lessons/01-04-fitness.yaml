# Свой пример по мотивам рис. 1.5: прогноз клиентов фитнес-клуба в Астане на 10 лет.
id: fitness-club-forecast
chapter: ch01
order: 4
title: Сколько клиентов будет у фитнес-клуба через 10 лет
source: Свой пример (фитнес-клуб в Астане, прогноз клиентов)

sheet:
  file: Прогноз_клиентов.xlsx
  name: Клиенты
  columns: { A: 110, B: 120, C: 80, D: 80, E: 120, F: 20 }
  rows: 17
  cells:
    A1: {v: На старте, style: label}
    B1: 400
    A2: {v: Новых в год, style: label}
    B2: 150
    A3: {v: Отток в год, style: label}
    B3: {v: 0.3, fmt: percent}
    A6: {v: Год, style: head}
    B6: {v: На начало года, style: head}
    C6: {v: Новые, style: head}
    D6: {v: Ушли, style: head}
    E6: {v: На конец года, style: head}
    A7: 1
    A8: 2
    A9: 3
    A10: 4
    A11: 5
    A12: 6
    A13: 7
    A14: 8
    A15: 9
    A16: 10

expect:
  B7: 400
  C7: 150
  D7: 120
  E7: 430
  B8: 430
  D8: 129
  E8: 451
  D9: 135.3
  C16: 150
  B16: 495.9646
  D16: 148.7894
  E16: 497.1752

steps:
  - title: Ситуация
    text: >-
      Владелец фитнес-клуба в Астане думает, брать ли помещение в аренду на 10 лет. Он хочет понять,
      <b>сколько клиентов будет у клуба</b>. Сейчас их 400, каждый год приходят около 150 новых, а 30%
      не продлевают абонемент. <b>Исходные данные</b> — в <code>B1:B3</code>. Их держим отдельно и
      никогда не вписываем в формулы: так легко проверить, что будет при других цифрах.
    actions:
      - wait: 3000

  - title: Начало первого года
    text: >-
      Клиенты на начало года 1 — это исходные данные: в <code>B7</code> вводим <code>=B1</code>.
    actions:
      - click: B7
      - type: "="
      - clickRef: B1
      - keys: [Enter]

  - title: Новые клиенты — =B$2
    text: >-
      Новых клиентов каждый год одинаково — <code>B2</code>. Вводим в <code>C7</code> ссылку и жмём
      <kbd>F4</kbd> дважды: <code>B$2</code>. Знак <code>$</code> перед 2 обязателен — иначе при копировании
      вниз ссылка «уедет» на <code>B3</code>, <code>B4</code>… Перед <code>C</code> он не нужен: в другой
      столбец формулу не копируем. Протягиваем до <code>C16</code>.
    actions:
      - click: C7
      - type: "="
      - clickRef: B2
      - keys: [F4]
      - keys: [F4]
      - keys: [Enter]
      - click: C7
      - fill: C7:C16

  - title: Ушедшие — =$B$3*B7
    text: >-
      Сколько ушло за год: клиенты на начало года × отток. В <code>D7</code> вводим <code>=$B$3*B7</code>
      (<kbd>F4</kbd> один раз — <code>$B$3</code>). Перед 7 знака <code>$</code> нет: при копировании
      7 должна меняться на 8, 9… Протягиваем до <code>D16</code>.
    actions:
      - click: D7
      - type: "="
      - clickRef: B3
      - keys: [F4]
      - type: "*"
      - clickRef: B7
      - keys: [Enter]
      - click: D7
      - fill: D7:D16

  - title: Конец года — =B7+C7-D7
    text: >-
      На конец года: начало + новые − ушедшие. В <code>E7</code> вводим <code>=B7+C7-D7</code> и
      протягиваем до <code>E16</code>.
    actions:
      - click: E7
      - type: "="
      - clickRef: B7
      - type: "+"
      - clickRef: C7
      - type: "-"
      - clickRef: D7
      - keys: [Enter]
      - click: E7
      - fill: E7:E16

  - title: Начало следующего года
    text: >-
      Начало года 2 — это конец года 1: в <code>B8</code> вводим <code>=E7</code> и протягиваем до
      <code>B16</code>. Теперь вся таблица считается сама.
    actions:
      - click: B8
      - type: "="
      - clickRef: E7
      - keys: [Enter]
      - click: B8
      - fill: B8:B16

  - title: Ответ и что запомнить
    text: >-
      Через 10 лет у клуба будет около <b>497</b> клиентов (<code>E16</code>; дробные числа — нормально,
      это модель). Рост замедляется: чем больше клиентов, тем больше уходит. Поменяйте исходные данные в
      <code>B1:B3</code> — например, отток 20% — и таблица пересчитается: это <b>анализ чувствительности</b>
      (глава 17). <b>На работе пригодится</b> для бизнес-плана, прогноза абонентов, подписчиков, клиентов.
    actions:
      - click: E16
