# Глава 1, рис. 1.5. Шаблона в книге нет — лист по Chapter1customers.xlsx (исходные данные и заголовки),
# формулы и expect — из того же файла. В книге «=C8+D8-F8» и «до E18» — опечатки (см. content/sources/ch01.md).
id: fitness-club-forecast
chapter: ch01
order: 4
title: Сколько посетителей будет у фитнес-клуба через 10 лет
source: Рис. 1.5, Chapter1customers.xlsx

sheet:
  file: Chapter1customers.xlsx
  name: Customers
  columns: {A: 30, B: 110, C: 130, D: 130, E: 100, F: 130, G: 64}
  rows: 18
  cells:
    B2: {v: Start, style: label}
    C2: 100
    B3: {v: New per year, style: label}
    C3: 20
    B4: {v: Churn rate, style: label}
    C4: {v: 0.15, fmt: percent}
    B7: {v: Year, style: head}
    C7: {v: Start customers, style: head}
    D7: {v: New customers, style: head}
    E7: {v: Quits, style: head}
    F7: {v: End customers, style: head}
    B8: 1
    B9: 2
    B10: 3
    B11: 4
    B12: 5
    B13: 6
    B14: 7
    B15: 8
    B16: 9
    B17: 10

expect:
  C8: 100
  D8: 20
  E8: 15
  F8: 105
  C9: 105
  E9: 15.75
  F9: 109.25
  E10: 16.3875
  D17: 20
  C17: 125.6128
  E17: 18.8419
  F17: 126.7709

steps:
  - title: Задача
    text: >-
      Модель с чистого листа: сколько посетителей будет у фитнес-клуба через 10 лет. <b>Исходные данные</b>
      — в <code>C2:C4</code>: 100 посетителей на старте, 20 новых в год и отток 15% в год. Их держим
      отдельно от расчётов и никогда не «зашиваем» в формулы — так легко проверить, что будет при других цифрах.
    say: >-
      Построим модель с чистого листа: сколько посетителей будет у фитнес-клуба через десять лет.
      Исходные данные — в отдельных ячейках: сто посетителей на старте, двадцать новых в год и отток
      пятнадцать процентов. В формулы эти числа не вписываем, а ссылаемся на ячейки.
    actions:
      - wait: 3000

  - title: Старт первого года
    text: >-
      Посетители на начало года 1 — это исходные данные: в <code>C8</code> вводим <code>=C2</code>.
    say: Посетители на начало первого года — это исходное число. В ячейке Цэ восемь пишем «равно Цэ два».
    actions:
      - click: C8
      - type: "="
      - clickRef: C2
      - keys: [Enter]

  - title: Новые посетители — =C$3
    text: >-
      Новых посетителей каждый год одинаково — <code>C3</code>. Вводим в <code>D8</code> ссылку и жмём
      <kbd>F4</kbd> дважды: <code>C$3</code>. Знак <code>$</code> перед 3 обязателен — иначе при копировании вниз
      ссылка «уедет» на <code>C4</code>, <code>C5</code>… Перед <code>C</code> он не нужен: в другой столбец
      формулу не копируем. Протягиваем до <code>D17</code>.
    say: >-
      Новых посетителей каждый год двадцать — ссылаемся на Цэ три и нажимаем F4 два раза, чтобы
      закрепить строку три. Иначе при копировании вниз ссылка уедет. Протягиваем до семнадцатой строки.
    actions:
      - click: D8
      - type: "="
      - clickRef: C3
      - keys: [F4]
      - keys: [F4]
      - keys: [Enter]
      - click: D8
      - fill: D8:D17

  - title: Ушедшие — =$C$4*C8
    text: >-
      Сколько ушло за год — посетители на начало года × отток: в <code>E8</code> вводим
      <code>=$C$4*C8</code> (<kbd>F4</kbd> один раз — <code>$C$4</code>). Перед 8 знака <code>$</code> нет:
      при копировании 8 должна меняться на 9, 10… Протягиваем до <code>E17</code>.
    say: >-
      Ушедшие за год — это посетители на начало года, умноженные на отток. Отток закрепляем полностью,
      клавишей F4, а ссылка на начало года должна сдвигаться. Протягиваем вниз.
    actions:
      - click: E8
      - type: "="
      - clickRef: C4
      - keys: [F4]
      - type: "*"
      - clickRef: C8
      - keys: [Enter]
      - click: E8
      - fill: E8:E17

  - title: Конец года — =C8+D8-E8
    text: >-
      На конец года: начало + новые − ушедшие. В <code>F8</code> вводим <code>=C8+D8-E8</code> и протягиваем
      до <code>F17</code>. (В книге здесь опечатка <code>=C8+D8-F8</code> — это была бы циклическая ссылка.)
    say: >-
      На конец года: посетители на начало плюс новые минус ушедшие. Вводим формулу в Эф восемь и
      протягиваем вниз.
    actions:
      - click: F8
      - type: "="
      - clickRef: C8
      - type: "+"
      - clickRef: D8
      - type: "-"
      - clickRef: E8
      - keys: [Enter]
      - click: F8
      - fill: F8:F17

  - title: Начало следующего года
    text: >-
      Начало года 2 — это конец года 1: в <code>C9</code> вводим <code>=F8</code> и протягиваем до
      <code>C17</code>. Теперь вся таблица считается сама.
    say: >-
      Начало второго года равно концу первого: в Цэ девять ссылаемся на Эф восемь и протягиваем вниз.
      Таблица заполнилась.
    actions:
      - click: C9
      - type: "="
      - clickRef: F8
      - keys: [Enter]
      - click: C9
      - fill: C9:C17

  - title: Ответ
    text: >-
      Через 10 лет у клуба будет около <b>127</b> посетителей (<code>F17</code>; дробные числа — нормально, это
      модель). Измените исходные данные в <code>C2:C4</code> — и вся таблица пересчитается: так проводят
      <b>анализ чувствительности</b> (подробнее — в главе 17).
    say: >-
      Ответ: через десять лет у клуба будет около ста двадцати семи посетителей. Если поменять исходные
      данные, вся таблица пересчитается сама — это и есть анализ чувствительности.
    actions:
      - click: F17
