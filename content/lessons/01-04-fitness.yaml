# Свой пример по мотивам рис. 1.5: прогноз клиентов фитнес-клуба в Астане на 10 лет.
id: fitness-club-forecast
chapter: ch01
order: 4
title: Сколько клиентов будет у фитнес-клуба через 10 лет
source: Свой пример (фитнес-клуб в Астане, прогноз клиентов)

sheet:
  file: Прогноз_клиентов.xlsx
  name: Клиенты
  columns: {A: 16, B: 110, C: 120, D: 80, E: 80, F: 120, G: 20}
  rows: 18
  cells:
    B2: {v: На старте, style: label}
    C2: 400
    B3: {v: Новых в год, style: label}
    C3: 150
    B4: {v: Отток в год, style: label}
    C4: {v: 0.3, fmt: percent}
    B7: {v: Год, style: head}
    C7: {v: На начало года, style: head}
    D7: {v: Новые, style: head}
    E7: {v: Ушли, style: head}
    F7: {v: На конец года, style: head}
    B8: 1
    B9: 2
    B10: 3
    B11: 4
    B12: 5
    B13: 6
    B14: 7
    B15: 8
    B16: 9
    B17: 10

expect:
  C8: 400
  D8: 150
  E8: 120
  F8: 430
  C9: 430
  E9: 129
  F9: 451
  E10: 135.3
  D17: 150
  C17: 495.9646
  E17: 148.7894
  F17: 497.1752

steps:
  - title: Ситуация
    text: >-
      Владелец фитнес-клуба в Астане думает, брать ли помещение в аренду на 10 лет. Он хочет понять,
      <b>сколько клиентов будет у клуба</b>. Сейчас их 400, каждый год приходят около 150 новых, а 30%
      не продлевают абонемент. <b>Исходные данные</b> — в <code>C2:C4</code>. Их держим отдельно и
      никогда не вписываем в формулы: так легко проверить, что будет при других цифрах.
    say: >-
      Владелец фитнес-клуба в Астане думает об аренде на десять лет и хочет понять, сколько у него будет
      клиентов. Сейчас их четыреста, каждый год приходят сто пятьдесят новых, а тридцать процентов уходят.
      Эти числа держим в отдельных ячейках и в формулы не вписываем.
    actions:
      - wait: 3000

  - title: Начало первого года
    text: >-
      Клиенты на начало года 1 — это исходные данные: в <code>C8</code> вводим <code>=C2</code>.
    say: Клиенты на начало первого года — это исходное число. В ячейке Цэ восемь пишем «равно Цэ два».
    actions:
      - click: C8
      - type: "="
      - clickRef: C2
      - keys: [Enter]

  - title: Новые клиенты — =C$3
    text: >-
      Новых клиентов каждый год одинаково — <code>C3</code>. Вводим в <code>D8</code> ссылку и жмём
      <kbd>F4</kbd> дважды: <code>C$3</code>. Знак <code>$</code> перед 3 обязателен — иначе при копировании
      вниз ссылка «уедет» на <code>C4</code>, <code>C5</code>… Перед <code>C</code> он не нужен: в другой
      столбец формулу не копируем. Протягиваем до <code>D17</code>.
    say: >-
      Новых клиентов каждый год сто пятьдесят — ссылаемся на Цэ три и нажимаем F4 два раза, чтобы закрепить
      строку три. Иначе при копировании вниз ссылка уедет. Протягиваем до семнадцатой строки.
    actions:
      - click: D8
      - type: "="
      - clickRef: C3
      - keys: [F4]
      - keys: [F4]
      - keys: [Enter]
      - click: D8
      - fill: D8:D17

  - title: Ушедшие — =$C$4*C8
    text: >-
      Сколько ушло за год: клиенты на начало года × отток. В <code>E8</code> вводим <code>=$C$4*C8</code>
      (<kbd>F4</kbd> один раз — <code>$C$4</code>). Перед 8 знака <code>$</code> нет: при копировании
      8 должна меняться на 9, 10… Протягиваем до <code>E17</code>.
    say: >-
      Ушедшие за год — это клиенты на начало года, умноженные на отток. Отток закрепляем полностью клавишей
      F4, а ссылка на начало года должна сдвигаться. Протягиваем вниз.
    actions:
      - click: E8
      - type: "="
      - clickRef: C4
      - keys: [F4]
      - type: "*"
      - clickRef: C8
      - keys: [Enter]
      - click: E8
      - fill: E8:E17

  - title: Конец года — =C8+D8-E8
    text: >-
      На конец года: начало + новые − ушедшие. В <code>F8</code> вводим <code>=C8+D8-E8</code> и
      протягиваем до <code>F17</code>.
    say: >-
      На конец года: клиенты на начало плюс новые минус ушедшие. Вводим формулу в Эф восемь и протягиваем
      вниз.
    actions:
      - click: F8
      - type: "="
      - clickRef: C8
      - type: "+"
      - clickRef: D8
      - type: "-"
      - clickRef: E8
      - keys: [Enter]
      - click: F8
      - fill: F8:F17

  - title: Начало следующего года
    text: >-
      Начало года 2 — это конец года 1: в <code>C9</code> вводим <code>=F8</code> и протягиваем до
      <code>C17</code>. Теперь вся таблица считается сама.
    say: >-
      Начало второго года равно концу первого: в Цэ девять ссылаемся на Эф восемь и протягиваем вниз.
      Таблица заполнилась.
    actions:
      - click: C9
      - type: "="
      - clickRef: F8
      - keys: [Enter]
      - click: C9
      - fill: C9:C17

  - title: Ответ и что запомнить
    text: >-
      Через 10 лет у клуба будет около <b>497</b> клиентов (<code>F17</code>; дробные числа — нормально,
      это модель). Рост замедляется: чем больше клиентов, тем больше уходит. Поменяйте исходные данные в
      <code>C2:C4</code> — например, отток 20% — и таблица пересчитается: это <b>анализ чувствительности</b>
      (глава 17). <b>На работе пригодится</b> для бизнес-плана, прогноза абонентов, подписчиков, клиентов.
    say: >-
      Через десять лет у клуба будет около четырёхсот девяноста семи клиентов. Если поменять исходные данные,
      вся таблица пересчитается сама — так можно проверить разные сценарии для бизнес-плана.
    actions:
      - click: F17
