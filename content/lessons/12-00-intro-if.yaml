steps:
- title: Ситуация
  text: 'Менеджеры получают премию 5% от продаж — но только если перевыполнили план 1 500 000 ₸. Для каждого нужно решить:
    платить премию или нет. Такой выбор «если… то… иначе…» делает функция {fn:IF}.'
  actions:
  - wait: 3000
- title: '{fn:IF}: условие, если да, если нет'
  text: 'В <code>C4</code>: <code>{f:=IF(B4>$B$1,5%*B4,0)}</code>. Первый аргумент — условие «продажи больше плана», второй
    — что вернуть, если оно верно, третий — если нет. У Айгерим 1 720 000 > 1 500 000, премия 5% × 1 720 000 = <b>86 000
    ₸</b>.'
  actions:
  - click: C4
  - type: =IF(B4>$B$1,5%*B4,0)
  - keys:
    - Enter
- title: Для всех менеджеров
  text: 'Протяните до <code>C7</code>. Данияр не выполнил план — 0. Ольга продала ровно 1 500 000: условие «больше» не выполнено,
    тоже 0 — если премия положена и за ровно план, пишут <code>&gt;=</code>. Ержан — 95 500 ₸.'
  actions:
  - click: C4
  - fill: C4:C7
- title: Что будет в главе
  text: '<b>12.1</b> — вложенные {fn:IF}: шкала оптовых цен<br><b>12.2–12.4</b> — {fn:IF} в моделях, «Закрепить области»,
    {fn:AND} и {fn:OR}<br><b>12.5–12.6</b> — {fn:IFERROR}, {fn:AGGREGATE} и коды ошибок<br><b>12.7</b> — {fn:ROW} и {fn:MOD}:
    итог в каждой четвёртой строке<br><b>12.8–12.10</b> — {fn:IFS}, {fn:CHOOSE} и {fn:SWITCH}<br><b>12.11</b> — прогнозный
    баланс: {fn:IF} выбирает долг или деньги'
  actions:
  - wait: 4000
- title: Что запомнить
  text: '<code>{f:=IF(условие,если_да,если_нет)}</code> — одна формула с двумя исходами. Условие — сравнение: <code>&gt;</code>,
    <code>&lt;</code>, <code>=</code>, <code>&gt;=</code>, <code>&lt;=</code>, <code>&lt;&gt;</code>. <b>На работе пригодится</b>
    для премий, скидок, статусов «выполнено/нет».'
  actions:
  - click: C5
