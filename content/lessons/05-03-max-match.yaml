steps:
- title: Ситуация
  text: 'У футбольного клуба 16 игроков (вымышленных), зарплаты не отсортированы. Директор спрашивает: <b>кто</b>
    получает больше всех? А кто на пятом месте? Найти само число легко, а вот имя — нужна связка из трёх функций.'
  say: Директор клуба спрашивает, кто получает больше всех, а кто на пятом месте. Найдём имя связкой из трёх функций.
  actions:
  - wait: 3000
- title: Имя для зарплат
  text: Выделите <code>C4:C19</code> и назовите <code>зарплаты</code>.
  say: Называем столбец зарплат.
  actions:
  - dragSelect: C4:C19
  - nameBox: зарплаты
- title: '1. Самое большое число: {fn:MAX}'
  text: 'В <code>F4</code>: <code>{f:=MAX(зарплаты)}</code> — <b>7 200 000 ₸</b>.'
  say: Сначала функция {fn:MAX} находит самую большую зарплату — семь миллионов двести тысяч.
  actions:
  - click: F4
  - type: =MAX(зарплаты)
  - keys:
    - Enter
- title: '2. На каком она месте: {fn:MATCH}'
  text: 'В <code>F5</code>: <code>{f:=MATCH(F4,зарплаты,0)}</code> — <b>4</b>. Зарплаты не отсортированы, поэтому
    тип <code>0</code>.'
  say: Потом {fn:MATCH} находит, на каком месте эта зарплата, — на четвёртом. Тип ноль, потому что список не отсортирован.
  actions:
  - click: F5
  - type: =MATCH(
  - clickRef: F4
  - type: ',зарплаты,0)'
  - keys:
    - Enter
- title: '3. Имя: {fn:INDEX}'
  text: 'В <code>F6</code>: <code>{f:=INDEX(B4:B19,F5)}</code> — <b>Гани Е.</b>. (Книга берёт имя через {fn:VLOOKUP}
    по номеру — результат тот же.)'
  say: И {fn:INDEX} достаёт имя из этой позиции — Гани.
  actions:
  - click: F6
  - type: =INDEX(
  - dragRef: B4:B19
  - type: ','
  - clickRef: F5
  - type: )
  - keys:
    - Enter
- title: 'Пятая по величине: {fn:LARGE}'
  text: '<code>{f:=LARGE(зарплаты,5)}</code> — пятое по величине число: <b>5 500 000 ₸</b>. Дальше те же шаги: место
    — <b>16</b>, имя — <b>Тимур Ш.</b>. Для пятой снизу есть <code>{fn:SMALL}</code>.'
  say: 'Для пятой по величине зарплаты есть функция {fn:LARGE}. Дальше — те же шаги: место и имя.'
  actions:
  - click: F8
  - type: =LARGE(зарплаты,5)
  - keys:
    - Enter
  - type: =MATCH(F8,зарплаты,0)
  - keys:
    - Enter
  - type: =INDEX(B4:B19,F9)
  - keys:
    - Enter
- title: Что запомнить
  text: 'Кто лучший: <code>{fn:INDEX}(имена; {fn:MATCH}({fn:MAX}(значения); значения; 0))</code>. <code>{fn:LARGE}(массив;
    k)</code> — k-е по величине, <code>{fn:SMALL}</code> — k-е снизу. <b>На работе пригодится</b>: лучший продавец
    месяца, самый дорогой заказ, филиал с минимальной выручкой.'
  say: Готово! Максимум, место максимума и имя — так находят лучшего продавца или самый дорогой заказ.
  actions:
  - click: F6
