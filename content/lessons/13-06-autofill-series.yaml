steps:
- title: Ситуация
  text: 'Врач поликлиники в Астане принимает с 9:00 до 13:00, на пациента — 20 минут. Нужен список времени приёма. Набирать
    13 строк вручную не нужно: Excel продолжит ряд сам.'
  actions:
  - wait: 3000
- title: Два первых значения
  text: 'В <code>A2</code> наберите 9:00, в <code>A3</code> — 9:20. По двум ячейкам Excel поймёт шаг: 9:20 − 9:00 = 20 минут.'
  actions:
  - click: A2
  - type: '9:00'
  - keys:
    - Enter
  - click: A3
  - type: '9:20'
  - keys:
    - Enter
- title: Тянем маркер
  text: 'Выделите <code>A2:A3</code> и тяните маркер заполнения вниз до <code>A14</code>. Excel прибавляет к каждому следующему
    значению те же 20 минут: 9:40, 10:00 … последний приём — <b>13:00</b>.'
  actions:
  - fillSeries: A2:A14
- title: Дни недели и даты
  text: 'Автозаполнение знает и списки: «Понедельник», «Вторник» продолжатся до «Воскресенья», а потом снова с понедельника.
    Даты 02.11.2026 и 03.11.2026 продолжатся по одному дню.'
  actions:
  - click: C2
  - type: Понедельник
  - keys:
    - Enter
  - click: C3
  - type: Вторник
  - keys:
    - Enter
  - fillSeries: C2:C8
  - click: E2
  - type: 02.11.2026
  - keys:
    - Enter
  - click: E3
  - type: 03.11.2026
  - keys:
    - Enter
  - fillSeries: E2:E8
- title: Что запомнить
  text: 'Две первые ячейки задают шаг, маркер заполнения продолжает ряд: время, даты, числа, дни недели, месяцы. <b>На работе
    пригодится</b> для расписаний, графиков дежурств, календарей.'
  actions:
  - click: A14
