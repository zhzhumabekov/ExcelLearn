steps:
  - title: Ситуация
    text: >-
      Финансовый консультант сравнивает, сколько в среднем приносили за 20 лет депозиты, облигации и акции
      (данные условные, учебные). Дадим каждому столбцу имя по его заголовку — и средние можно будет считать
      как <code>=СРЗНАЧ(Акции)</code>, не вспоминая, где лежат данные.
    say: >-
      Консультант сравнивает среднюю доходность депозитов, облигаций и акций за двадцать лет. Дадим каждому
      столбцу имя по заголовку.
    actions:
      - wait: 3000

  - title: "Имена из верхней строки"
    text: >-
      Выделите <code>B1:D21</code> вместе с заголовками и нажмите <b>Формулы → Создать из выделенного</b>.
      Теперь Excel поставил флажок <b>в строке выше</b>: заголовки сверху. <b>OK</b> — столбец B получил
      имя <code>Депозиты</code>, C — <code>Облигации</code>, D — <code>Акции</code>.
    say: >-
      Выделяем три столбца вместе с заголовками и нажимаем «Создать из выделенного». Теперь флажок стоит «в
      строке выше» — заголовки сверху. OK — у каждого столбца своё имя.
    actions:
      - dragSelect: B1:D21
      - clickRibbon: createFromSelection
      - wait: 1200
      - dialogButton: OK

  - title: "F3 — вставка имени"
    text: >-
      В <code>G2</code> наберите <code>={fn:AVERAGE}(</code> и нажмите <kbd>F3</kbd>: откроется окно
      <b>Вставка имени</b> со всеми именами книги. Выберите <code>Акции</code>, <b>OK</b>, закройте скобку —
      <b>12,40%</b> в год.
    say: >-
      В Гэ два набираем {fn:AVERAGE} и открывающую скобку, а потом нажимаем F3 — открывается окно со всеми
      именами. Выбираем «Акции», OK, закрываем скобку. Двенадцать и четыре десятых процента в год.
    actions:
      - click: G2
      - type: =AVERAGE(
      - keys: [F3]
      - wait: 800
      - dialogPick: Акции
      - dialogButton: OK
      - type: ")"
      - keys: [Enter]

  - title: Автозавершение
    text: >-
      Ещё быстрее: в <code>G3</code> наберите <code>={fn:AVERAGE}(Деп</code> — Excel сам предложит список
      имён и функций, начинающихся с этих букв. Дважды щёлкните <code>Депозиты</code>, закройте скобку:
      <b>10,88%</b>.
    say: >-
      Ещё быстрее: набираем первые буквы имени — Excel сам предлагает список. Дважды щёлкаем «Депозиты» и
      закрываем скобку. Десять и восемьдесят восемь сотых процента.
    actions:
      - click: G3
      - type: =AVERAGE(Деп
      - wait: 900
      - autocomplete: Депозиты
      - type: ")"
      - keys: [Enter]

  - title: "Целый столбец: C:C"
    text: >-
      Без всяких имён можно сослаться на <b>весь столбец</b>: <code>{f:=AVERAGE(C:C)}</code> — среднее всех
      чисел столбца C (текст заголовка пропускается): <b>9,53%</b>. Удобно, когда данные дописывают каждый
      месяц — формулу не надо менять.
    say: >-
      Можно сослаться и на весь столбец: среднее по столбцу Цэ. Заголовок-текст пропускается. Удобно, когда
      данные дописывают каждый месяц.
    actions:
      - click: G4
      - type: =AVERAGE(C:C)
      - keys: [Enter]

  - title: "Частая ошибка: формула в том же столбце"
    text: >-
      Не ставьте <code>{f:=AVERAGE(C:C)}</code> внутрь столбца C: формула будет ссылаться сама на себя —
      Excel сообщит о <b>циклической ссылке</b>. Поэтому результат стоит в столбце G. Так же
      <code>{f:=AVERAGE(1:1)}</code> — среднее всей первой строки.
    say: >-
      Важно: такую формулу нельзя ставить в тот же столбец — получится циклическая ссылка. Поэтому результат
      стоит в другом столбце.
    actions:
      - showRefs: G4

  - title: Что запомнить
    text: >-
      «Создать из выделенного» с флажком <b>в строке выше</b> даёт столбцам имена по заголовкам.
      <kbd>F3</kbd> вставляет имя из списка, а <b>автозавершение</b> дописывает его по первым буквам.
      <code>C:C</code> — весь столбец. <b>На работе пригодится</b> для отчётов, где данные растут каждый месяц.
    say: >-
      Готово! Имена столбцов создаются из заголовков, F3 вставляет имя из списка, автозавершение дописывает
      его по первым буквам, а «Цэ двоеточие Цэ» — это весь столбец.
    actions:
      - click: G2
