# Глава 12 (ЕСЛИ и логические функции). Собрано генератором; ответы expect посчитаны независимо.
id: if-or
chapter: ch12
order: 4
title: 'ИЛИ: правила настольной игры'
source: Ifstatement.xlsx, лист Craps (рис. 12.5)
sheet:
  file: Кости.xlsx
  name: Игра
  columns:
    A: 150
    B: 220
  rows: 7
  cells:
    A1:
      v: Сумма очков
      style: head
    B1:
      v: После первого броска
      style: head
    A2: 2
    A3: 7
    A4: 11
    A5: 5
    A6: 12
expect:
  B2: проигрыш
  B3: выигрыш
  B4: выигрыш
  B5: продолжать
  B6: проигрыш
steps:
- title: Ситуация
  text: 'В настольной игре бросают два кубика. Если сумма очков 2, 3 или 12 — проигрыш, 7 или 11 — выигрыш, иначе игра продолжается.
    Одно условие {fn:IF} здесь не подходит: проигрыш наступает при любом из трёх чисел.'
  actions:
  - wait: 3000
- title: '{fn:OR}: хотя бы одно условие'
  text: '<code>{f:=OR(A2=2,A2=3,A2=12)}</code> возвращает {fn:TRUE}, если верно <b>хотя бы одно</b> из условий. В <code>B2</code>:
    <code>{f:=IF(OR(A2=2,A2=3,A2=12),"проигрыш",IF(OR(A2=7,A2=11),"выигрыш","продолжать"))}</code> — сначала проверка проигрыша,
    в «иначе» — вторая {fn:IF} с проверкой выигрыша, и только потом «продолжать».'
  actions:
  - click: B2
  - type: =IF(OR(A2=2,A2=3,A2=12),"проигрыш",IF(OR(A2=7,A2=11),"выигрыш","продолжать"))
  - keys:
    - Enter
- title: Все броски
  text: 'Протяните до <code>B6</code>: 2 и 12 — проигрыш, 7 и 11 — выигрыш, 5 — продолжать. {fn:OR} — «хотя бы одно», {fn:AND}
    — «все сразу», и обе работают внутри {fn:IF}.'
  actions:
  - click: B2
  - fill: B2:B6
- title: Что запомнить
  text: '{fn:OR}(условие1; условие2; …) — {fn:TRUE}, если верно хоть одно; удобно вместо цепочки {fn:IF} для одинакового
    ответа. <b>На работе пригодится</b>: «скидка, если клиент VIP или заказ больше 1 млн», «проверка, если регион Алматы
    или Астана».'
  actions:
  - click: B6
