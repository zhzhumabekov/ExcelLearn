# Вводный урок главы. Собрано генератором gen_intros.py; ответы expect посчитаны независимо.
id: intro-names
chapter: ch02
order: 0
title: 'Зачем нужны имена: формула, которую можно прочитать'
source: Свой пример (оптовый заказ со скидкой)
sheet:
  file: Заказ_со_скидкой.xlsx
  name: Заказ
  columns:
    A: 230
    B: 130
  rows: 7
  cells:
    A1:
      v: Показатель
      style: head
    B1:
      v: Значение
      style: head
    A2: Количество, шт
    B2: 250
    A3: Цена за штуку, ₸
    B3:
      v: 4200
      fmt: kzt
    A4: Скидка
    B4:
      v: 0.08
      fmt: percent
    A5:
      v: Сумма (адреса), ₸
      style: total
    B5:
      fmt: kzt
      style: total
    A6:
      v: Сумма (имена), ₸
      style: total
    B6:
      fmt: kzt
      style: total
names:
- name: количество
  ref: B2
- name: цена
  ref: B3
- name: скидка
  ref: B4
expect:
  B5: 966000
  B6: 966000
steps:
- title: Ситуация
  text: 'Вы оформляете заказ оптовому клиенту ТОО «Береке»: 250 упаковок со скидкой. Формулу посчитать легко, но через месяц
    её откроет бухгалтер — и должен с первого взгляда понять, что она считает. В этом помогают <b>имена</b>.'
  say: Вы оформляете заказ оптовому клиенту со скидкой. Через месяц формулу откроет бухгалтер — и должен сразу понять, что
    она считает. В этом помогают имена.
  actions:
  - wait: 3000
- title: Формула с адресами
  text: 'Сначала — как обычно: в <code>B5</code> наберите <code>{f:=B2*B3*(1-B4)}</code>. Excel посчитал <b>966 000 ₸</b>.
    Верно, но что такое <code>B4</code>? Чтобы понять, придётся искать ячейку глазами.'
  say: Сначала как обычно — формула с адресами. Получилось 966 000 тенге. Верно, но что такое Бэ четыре? Придётся искать
    ячейку глазами.
  actions:
  - click: B5
  - type: =B2*B3*(1-B4)
  - keys:
    - Enter
  - click: B5
  - showRefs: B5
- title: Имя — подпись адреса
  text: 'В этой книге у ячеек уже есть имена. Щёлкните по <code>B4</code>: в поле <b>«Имя»</b> вместо адреса написано <b>скидка</b>.
    А стрелка ▾ поля «Имя» открывает список всех имён — выберите <b>цена</b>, и Excel сам выделит её ячейку.'
  say: 'У ячеек этой книги уже есть имена. Щёлкаем по ячейке со скидкой — в поле «Имя» вместо адреса написано «скидка».
    Стрелка поля «Имя» открывает список всех имён: выбираем «цена», и Excel выделяет её ячейку.'
  actions:
  - click: B4
  - wait: 1200
  - nameList: цена
- title: Формула с именами
  text: 'Теперь в <code>B6</code> наберите <code>{f:=количество*цена*(1-скидка)}</code>. Ответ тот же — <b>966 000 ₸</b>,
    но формулу можно прочитать вслух: «количество умножить на цену без скидки».'
  say: 'Теперь та же формула с именами: количество умножить на цену и на единицу минус скидка. Ответ тот же, но формулу
    можно прочитать вслух.'
  actions:
  - click: B6
  - type: =количество*цена*(1-скидка)
  - keys:
    - Enter
  - click: B6
- title: Что будет в главе
  text: '<b>2.1</b> — имя ячейки через поле «Имя» и какие имена недопустимы<br><b>2.2</b> — имя диапазона и несмежных ячеек<br><b>2.3</b>
    — двадцать имён за один щелчок: «Создать из выделенного»<br><b>2.4</b> — имена столбцов, клавиша <kbd>F3</kbd> и автозавершение<br><b>2.5</b>
    — область имени: вся книга или один лист<br><b>2.6</b> — имена в уже готовых формулах и список имён<br><b>2.7–2.8</b>
    — относительное имя и имена строк'
  say: В этой главе — как давать имена ячейкам и диапазонам, создавать их сразу пачкой, вставлять клавишей F3, подставлять
    в готовые формулы и ограничивать одним листом.
  actions:
  - wait: 4000
- title: Что запомнить
  text: 'Имя — понятная подпись вместо адреса: <code>скидка</code> вместо <code>$B$4</code>. Формулы с именами легче проверить
    и труднее сломать. <b>На работе пригодится</b> в моделях, которые читают другие: расчёт цены, бюджет, план продаж, отчёт
    для руководителя.'
  say: 'Запомните: имя — понятная подпись вместо адреса. Формулы с именами легче проверить и труднее сломать — особенно
    в моделях, которые читают коллеги и руководитель.'
  actions:
  - click: B6
