steps:
- title: Ситуация
  text: 'Для табеля и зарплаты бухгалтеру нужна норма рабочих дней по месяцам первого квартала. Праздники-будни этого периода
    выписаны в столбец G. Пересчитывать по календарю не будем: есть {fn:NETWORKDAYS}.'
  actions:
  - wait: 3000
- title: '{fn:NETWORKDAYS}: будни между датами'
  text: <code>{f:=NETWORKDAYS(B2,C2)}</code> — число рабочих дней от начала до конца периода, без суббот и воскресений.
    В январе 2027 года будних дней <b>21</b>, в квартале — <b>64</b>.
  actions:
  - click: D2
  - type: =NETWORKDAYS(
  - clickRef: B2
  - type: ','
  - clickRef: C2
  - type: )
  - keys:
    - Enter
  - click: D2
  - fill: D2:D6
- title: Минус праздники
  text: 'Третий аргумент — праздники: <code>{f:=NETWORKDAYS(B2,C2,$G$2:$G$6)}</code>. В январе остаётся <b>19</b> рабочих
    дней, в марте — <b>20</b>. Список праздников здесь — пример. Настоящий берите из производственного календаря на год,
    вместе с переносами выходных.'
  actions:
  - click: E2
  - type: =NETWORKDAYS(
  - clickRef: B2
  - type: ','
  - clickRef: C2
  - type: ','
  - dragRef: G2:G6
  - keys:
    - F4
  - type: )
  - keys:
    - Enter
  - click: E2
  - fill: E2:E6
- title: 'Частая ошибка: обе даты считаются'
  text: 'Командировка с понедельника 01.02 по пятницу 05.02 — <b>5</b> рабочих дней, а не 4. {fn:NETWORKDAYS} считает и
    первый, и последний день. Простое вычитание <code>C6-B6</code> дало бы 4: оно считает промежутки между датами, а не
    сами дни.'
  actions:
  - click: E6
  - wait: 2500
- title: Что запомнить
  text: '<code>{f:=NETWORKDAYS(начало,конец,праздники)}</code> — сколько рабочих дней в периоде, включая обе даты. {fn:WORKDAY}
    отвечает на обратный вопрос: какая дата будет через N рабочих дней. <b>На работе пригодится</b> для табеля, нормы часов,
    оплаты по рабочим дням.'
  actions:
  - click: E5
