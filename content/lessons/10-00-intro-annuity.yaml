steps:
- title: Ситуация
  text: 'ТОО покупает ноутбуки в кредит: <b>1 000 000 ₸</b> на 12 месяцев под 24% годовых. Каким будет платёж каждый месяц
    и сколько всего придётся отдать? Одинаковые платежи через равные периоды называют <b>аннуитетом</b>, и для них в Excel
    есть целая семья функций.'
  actions:
  - wait: 3000
- title: Ставка за месяц
  text: 'Платим раз в месяц, поэтому и ставка нужна за месяц: <code>{f:=B2/12}</code> в <code>B4</code> — 24% ÷ 12 = <b>2%</b>.
    Главное правило главы: ставка и число периодов — в одних единицах. Месячные платежи — месячная ставка и число месяцев.'
  actions:
  - click: B4
  - type: =B2/12
  - keys:
    - Enter
- title: '{fn:PMT}: платёж по кредиту'
  text: 'В <code>B5</code>: <code>{f:=-PMT(B4,B3,B1)}</code> — ставка за месяц, число месяцев и сумма кредита. Знаки в финансовых
    функциях: деньги, которые <b>получаем</b>, — плюс, которые <b>отдаём</b>, — минус. Кредит получили — плюс, платёж отдаём
    — {fn:PMT} вернёт его с минусом, поэтому перед ней минус: <b>94 560 ₸</b> в месяц.'
  actions:
  - type: =-PMT(
  - clickRef: B4
  - type: ','
  - clickRef: B3
  - type: ','
  - clickRef: B1
  - type: )
  - keys:
    - Enter
- title: Сколько всего и переплата
  text: 'Всего: <code>{f:=B5*B3}</code> — <b>1 134 715 ₸</b>. Переплата: <code>{f:=B6-B1}</code> — <b>134 715 ₸</b>. Это
    меньше 24% от миллиона: долг гасится каждый месяц, и проценты начисляются на всё меньший остаток.'
  actions:
  - type: =B5*B3
  - keys:
    - Enter
  - type: =B6-B1
  - keys:
    - Enter
- title: Что будет в главе
  text: '<b>10.1</b> — {fn:PV} — сколько сегодня стоят будущие платежи (рассрочка или сразу)<br><b>10.2</b> — {fn:FV} —
    сколько накопится<br><b>10.3</b> — {fn:PMT} — платёж по кредиту, платёж в начале месяца, доплата в конце<br><b>10.4</b>
    — график погашения: {fn:PPMT}, {fn:IPMT}, {fn:CUMIPMT}, {fn:CUMPRINC}<br><b>10.5–10.6</b> — {fn:RATE} — какая ставка,
    {fn:NPER} — сколько периодов<br><b>10.7</b> — амортизация: {fn:SLN}, {fn:SYD}, {fn:DDB}'
  actions:
  - wait: 4000
- title: Что запомнить
  text: Аннуитет — одинаковые платежи через равные периоды. Ставка и периоды — в одних единицах. Получаем — плюс, отдаём
    — минус. <b>На работе пригодится</b> для кредитов, лизинга, рассрочек и накоплений.
  actions:
  - click: B5
