# Глава 7 (даты). Собрано генератором; ответы expect посчитаны независимо.
id: today
chapter: ch07
order: 2
title: 'СЕГОДНЯ и Ctrl+;: дата, которая меняется, и дата, которая нет'
source: Dates.xlsx, лист date format (рис. 7.3), Staticdate.xls (рис. 7.6)
sheet:
  file: Счета_к_оплате.xlsx
  name: Счета
  columns:
    A: 150
    B: 130
    C: 140
  rows: 10
  cells:
    A1:
      v: Отчёт на дату
      style: label
    B1:
      fmt: date
    A2:
      v: Файл создан
      style: label
    A4:
      v: Счёт
      style: head
    B4:
      v: Срок оплаты
      style: head
    C4:
      v: Дней до срока
      style: head
    A5: № 101
    B5:
      v: '2026-10-20'
      fmt: date
    C5:
      fmt: date
    A6: № 102
    B6:
      v: '2026-10-05'
      fmt: date
    C6:
      fmt: date
    A7: № 103
    B7:
      v: '2026-10-12'
      fmt: date
    C7:
      fmt: date
    A8: № 104
    B8:
      v: '2026-11-02'
      fmt: date
    C8:
      fmt: date
    A9: № 105
    B9:
      v: '2026-09-30'
      fmt: date
    C9:
      fmt: date
today: '2026-10-12'
expect:
  B1: 46307
  B2: 46307
  C5: 8
  C6: -7
  C7: 0
  C8: 21
  C9: -12
steps:
- title: Ситуация
  text: Бухгалтер ТОО ведёт реестр счетов. Каждое утро нужно видеть, сколько дней осталось до оплаты. Дата отчёта должна
    обновляться сама, а дата создания файла — нет.
  actions:
  - wait: 3000
- title: '{fn:TODAY}: дата на сегодня'
  text: 'В <code>B1</code>: <code>{f:=TODAY()}</code>. Скобки пустые — у функции нет аргументов. В плеере «сегодня» — <b>12.10.2026</b>,
    в вашем Excel будет ваша дата. Excel пересчитывает {fn:TODAY} при каждом открытии файла, поэтому завтра в <code>B1</code>
    будет завтрашняя дата.'
  actions:
  - click: B1
  - type: =TODAY()
  - keys:
    - Enter
- title: Ctrl+; — дата, которая не меняется
  text: В <code>B2</code> нажмите <kbd>Ctrl</kbd>+<kbd>;</kbd> (в русской раскладке это клавиша «Ж») и Enter. Excel вписал
    сегодняшнюю дату как обычное значение, а не формулу. Через месяц там останется 12.10.2026 — день, когда создали файл.
  actions:
  - click: B2
  - keys:
    - Ctrl
    - ;
  - keys:
    - Enter
- title: Дней до срока
  text: 'Срок минус сегодня — число дней: <code>{f:=B5-$B$1}</code>. <kbd>F4</kbd> закрепляет <code>$B$1</code>, чтобы при
    протягивании все строки вычитали одну дату. Протяните до <code>C9</code>… Вместо чисел — даты и решётки!'
  actions:
  - click: C5
  - type: '='
  - clickRef: B5
  - type: '-'
  - clickRef: B1
  - keys:
    - F4
  - keys:
    - Enter
  - click: C5
  - fill: C5:C9
- title: 'Частая ошибка: дата вместо числа'
  text: 'У столбца C был формат даты, и разность Excel показал датой: 8 дней — «08.01.1900», 0 — «00.01.1900». Отрицательной
    даты не бывает, поэтому там решётки. Числа верные, неверен формат. Выделите <code>C5:C9</code> → правая кнопка → <b>Формат
    ячеек…</b> → <b>Общий</b>. Минус — счёт просрочен.'
  actions:
  - select: C5:C9
  - contextMenu: formatCells
  - dialogPick: Общий
  - dialogButton: OK
- title: Что запомнить
  text: '<code>{f:=TODAY()}</code> — дата, которая каждый день новая: для отчётов «на сегодня» и сроков. <kbd>Ctrl</kbd>+<kbd>;</kbd>
    — дата, которая уже не изменится: когда создан файл или принят документ. <b>На работе пригодится</b> для реестров счетов,
    договоров и задач со сроками.'
  actions:
  - click: C5
