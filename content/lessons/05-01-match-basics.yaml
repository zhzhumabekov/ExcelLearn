expect:
  B13: 3
  B14: 8
  E13: 4
  G13: 7
steps:
- title: Ситуация
  text: 'Иногда нужно не значение, а его <b>место</b> в списке: на какой строке город, в каком столбце месяц. Это
    делает <code>{fn:MATCH}</code>: <code>{fn:MATCH}(искомое_значение; просматриваемый_массив; тип_сопоставления)</code>.
    Ответ — номер позиции внутри массива, начиная с 1.'
  say: 'Иногда нужно не значение, а его место в списке. Это делает функция {fn:MATCH}: она возвращает номер позиции
    внутри массива.'
  actions:
  - wait: 3000
- title: 'Точное совпадение: тип 0'
  text: 'В <code>B13</code> введите <code>{f:=MATCH("Астана",B4:B11,0)}</code> — <b>3</b>: Астана третья в списке.
    Текст пишут в кавычках. Тип <code>0</code> — точное совпадение, порядок списка не важен.'
  say: 'Ищем Астану: третья позиция. Текст пишут в кавычках, а тип ноль — точное совпадение, порядок списка не важен.'
  actions:
  - click: B13
  - type: =MATCH("Астана",
  - dragRef: B4:B11
  - type: ',0)'
  - keys:
    - Enter
- title: Подстановочный знак *
  text: '<code>{f:=MATCH("Шым*",B4:B11,0)}</code> — <b>8</b>: звёздочка означает «любые символы», и Excel находит
    первый город, который начинается на «Шым». <code>?</code> — ровно один любой символ. Так же работает и {fn:VLOOKUP}
    с <code>ЛОЖЬ</code>.'
  say: 'Звёздочка означает «любые символы»: Excel находит первый город, начинающийся на «Шым», — восьмой.'
  actions:
  - type: =MATCH("Шым*",B4:B11,0)
  - keys:
    - Enter
- title: 'Нет в списке — #Н/Д'
  text: <code>{f:=MATCH("Тараз",B4:B11,0)}</code> — Тараза в списке нет, ответ <code>#Н/Д</code>.
  say: Тараза в списке нет — ответ «нет данных».
  actions:
  - type: =MATCH("Тараз",B4:B11,0)
  - keys:
    - Enter
- title: 'Тип 1: по возрастанию'
  text: 'Тип <code>1</code> (по умолчанию) — для списка <b>по возрастанию</b>: позиция последнего значения, <b>не
    большего</b> искомого. <code>{f:=MATCH(0,E4:E11,1)}</code> — <b>4</b>: последнее число, не большее 0, — сам
    ноль на 4-м месте.'
  say: 'Тип один — для списка по возрастанию: позиция последнего значения, не большего искомого. Ноль — на четвёртом
    месте.'
  actions:
  - click: E13
  - type: =MATCH(0,
  - dragRef: E4:E11
  - type: ',1)'
  - keys:
    - Enter
- title: 'Тип −1: по убыванию'
  text: 'Тип <code>-1</code> — для списка <b>по убыванию</b>: позиция последнего значения, <b>не меньшего</b> искомого.
    <code>{f:=MATCH(-4,G4:G11,-1)}</code> — <b>7</b>: −4 стоит седьмым.'
  say: 'Тип минус один — для списка по убыванию: позиция последнего значения, не меньшего искомого. Седьмая.'
  actions:
  - click: G13
  - type: =MATCH(-4,
  - dragRef: G4:G11
  - type: ',-1)'
  - keys:
    - Enter
- title: Что запомнить
  text: <code>{fn:MATCH}</code> возвращает <b>место</b>, а не значение. Тип <code>0</code> — точно, в любом порядке
    (самый частый случай); <code>1</code> или пропущен — список по возрастанию; <code>-1</code> — по убыванию. <b>На
    работе пригодится</b> вместе с {fn:INDEX} и {fn:VLOOKUP} — дальше покажем как.
  say: Готово! {fn:MATCH} возвращает место значения. Чаще всего пишут тип ноль — точное совпадение.
  actions:
  - click: B13
