id: match-basics
chapter: ch05
order: 1
title: 'ПОИСКПОЗ: на каком месте значение'
source: Свой пример (города и числа)
sheet:
  file: ПОИСКПОЗ.xlsx
  name: Примеры
  columns:
    A: 150
    B: 110
    C: 16
