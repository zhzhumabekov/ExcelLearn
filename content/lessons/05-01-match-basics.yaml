    F: 60
    G: 110
  rows: 16
  cells:
    B3:
      v: Город
      style: head
    E3:
      v: По возрастанию
      style: head
    G3:
      v: По убыванию
      style: head
    B4: Актобе
    E4: -10
    G4: 10
    B5: Алматы
    E5: -6
    G5: 6
    B6: Астана
    E6: -3
    G6: 3
    B7: Атырау
    E7: 0
    G7: 1
    B8: Караганда
    E8: 2
    G8: -2
    B9: Костанай
    E9: 5
    G9: -3
    B10: Павлодар
    E10: 8
    G10: -4
