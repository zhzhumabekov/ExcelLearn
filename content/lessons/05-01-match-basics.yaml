# Глава 5 (ПОИСКПОЗ). Собрано генератором; ответы expect посчитаны независимо.
id: match-basics
chapter: ch05
order: 1
title: 'ПОИСКПОЗ: на каком месте значение'
source: Свой пример (города и числа)
sheet:
  file: ПОИСКПОЗ.xlsx
  name: Примеры
  columns:
    A: 150
    B: 110
    C: 16
    D: 60
    E: 110
    F: 60
    G: 110
  rows: 14
  cells:
    B1:
      v: Город
      style: head
    E1:
      v: По возрастанию
      style: head
    G1:
      v: По убыванию
      style: head
    B2: Актобе
    E2: -10
    G2: 10
    B3: Алматы
    E3: -6
    G3: 6
    B4: Астана
    E4: -3
    G4: 3
    B5: Атырау
    E5: 0
    G5: 1
    B6: Караганда
    E6: 2
    G6: -2
    B7: Костанай
    E7: 5
    G7: -3
    B8: Павлодар
    E8: 8
    G8: -4
    B9: Шымкент
    E9: 12
    G9: -9
    A11:
      v: Точно «Астана»
      style: label
    A12:
      v: По шаблону «Шым*»
      style: label
    A13:
      v: Нет в списке
      style: label
