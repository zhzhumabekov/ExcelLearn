# Глава 2. Свой пример по мотивам рис. 2.5–2.7 и 2.10 (States): продажи по областям и городам Казахстана.
id: create-from-selection
chapter: ch02
order: 3
title: "Двадцать имён за один щелчок: «Создать из выделенного»"
source: Свой пример (продажи дистрибьютора по регионам Казахстана)

sheet:
  file: Продажи_по_регионам.xlsx
  name: Регионы
  columns: {A: 232, B: 110, C: 16, D: 170, E: 110}
  rows: 24
  cells:
    A3: {v: Регион, style: head}
    B3: {v: "Март, тыс. ₸", style: head}
    A4: Абайская область
    B4: 1840
    A5: Акмолинская область
    B5: 2310
    A6: Актюбинская область
    B6: 2950
    A7: Алматинская область
    B7: 3720
    A8: Атырауская область
    B8: 3180
    A9: Восточно-Казахстанская область
    B9: 2640
    A10: Жамбылская область
    B10: 1960
    A11: Жетысуская область
    B11: 1420
    A12: Западно-Казахстанская область
    B12: 1890
    A13: Карагандинская область
    B13: 3410
    A14: Костанайская область
    B14: 2270
    A15: Кызылординская область
    B15: 1530
    A16: Мангистауская область
    B16: 2480
    A17: Павлодарская область
    B17: 2590
    A18: Северо-Казахстанская область
    B18: 1380
    A19: Туркестанская область
    B19: 2860
    A20: Улытауская область
    B20: 760
    A21: Алматы
    B21: 9850
    A22: Астана
    B22: 7420
    A23: Шымкент
    B23: 3960
    D4: {v: Три города вместе, style: label}
    D5: {v: Вся страна, style: label}

expect:
  E4: 21230
  E5: 60420

steps:
  - title: Ситуация
    text: >-
      Дистрибьютор продаёт по всему Казахстану: 17 областей и 3 города республиканского значения. Аналитику
      нужно сложить продажи Алматы, Астаны и Шымкента. Вводить 20 имён через поле «Имя» — долго. Excel умеет
      <b>создать их сам из подписей</b>.
    say: >-
      Дистрибьютор продаёт по всему Казахстану: семнадцать областей и три города. Вводить двадцать имён
      вручную долго — Excel создаст их сам из подписей.
    actions:
      - wait: 3000

  - title: Выделите подписи и числа
    text: >-
      Выделите <code>A4:B23</code> — названия регионов вместе с продажами. Названия станут именами, а числа —
      ячейками, на которые эти имена указывают.
    say: >-
      Выделяем названия регионов вместе с продажами. Названия станут именами, а числа — ячейками этих имён.
    actions:
      - dragSelect: A4:B23

  - title: "Формулы → Создать из выделенного"
    text: >-
      На вкладке <b>Формулы</b> в группе «Определённые имена» нажмите <b>Создать из выделенного</b>. Excel
      сам поставил флажок <b>в столбце слева</b> — подписи именно там. Нажмите <b>OK</b>.
    say: >-
      На вкладке «Формулы» нажимаем «Создать из выделенного». Excel сам поставил флажок «в столбце слева» —
      подписи именно там. Нажимаем OK.
    actions:
      - ribbonTab: formulas
      - clickRibbon: createFromSelection
      - wait: 1200
      - dialogButton: OK

  - title: Двадцать имён готовы
    text: >-
      Откройте список ▾ поля «Имя»: все 20 имён на месте. Обратите внимание: пробелы и дефисы Excel заменил
      подчёркиванием — <code>Северо_Казахстанская_область</code>. Выберите <code>Шымкент</code>.
    say: >-
      Открываем список поля «Имя»: все двадцать имён на месте. Пробелы и дефисы Excel заменил подчёркиванием.
      Выбираем «Шымкент».
    actions:
      - nameList: Шымкент

  - title: "=Алматы+Астана+Шымкент"
    text: >-
      В <code>E4</code> введите <code>=Алматы+Астана+Шымкент</code>: <b>21 230</b> тыс. ₸. Сравните с
      формулой по адресам <code>=B21+B22+B23</code> — какая понятнее? Для всей страны в <code>E5</code> —
      <code>{f:=SUM(B4:B23)}</code>.
    say: >-
      В Е четыре вводим «Алматы плюс Астана плюс Шымкент» — двадцать один миллион двести тридцать тысяч тенге.
      А в Е пять — сумма по всей стране.
    actions:
      - click: E4
      - type: =Алматы+Астана+Шымкент
      - keys: [Enter]
      - type: "=SUM("
      - dragRef: B4:B23
      - type: ")"
      - keys: [Enter]

  - title: Диспетчер имён
    text: >-
      Все имена книги — в окне <b>Диспетчер имён</b> (вкладка «Формулы»). Для каждого видно значение, диапазон
      и область действия. Длинное имя можно сократить: выберите <code>Северо_Казахстанская_область</code>,
      нажмите <b>Изменить…</b> и введите привычное <code>СКО</code>.
    say: >-
      Все имена книги собраны в диспетчере имён. Длинное имя можно сократить: выбираем Северо-Казахстанскую
      область, нажимаем «Изменить» и вводим привычное «эс-ка-о».
    actions:
      - clickRibbon: nameManager
      - wait: 1200
      - dialogPick: Северо_Казахстанская_область
      - dialogButton: Изменить…
      - dialogType: {field: Имя, text: СКО}
      - dialogButton: OK

  - title: "Удалить лишние: Ctrl"
    text: >-
      Если имена не нужны, их удаляют. Выберите <code>Абайская_область</code>, с нажатой <kbd>Ctrl</kbd>
      добавьте <code>Улытауская_область</code> и нажмите <b>Удалить</b> → <b>OK</b>. С <kbd>Shift</kbd>
      выбираются сразу все имена подряд от первого до последнего.
    say: >-
      Лишние имена удаляют. Выбираем одно, с нажатым Control добавляем второе и нажимаем «Удалить». С Shift
      выбираются все имена подряд.
    actions:
      - dialogPick: Абайская_область
      - dialogPick: {item: Улытауская_область, add: ctrl}
      - dialogButton: Удалить
      - dialogButton: OK
      - wait: 800
      - dialogButton: Закрыть

  - title: Что запомнить
    text: >-
      <b>Создать из выделенного</b> превращает подписи в имена за один щелчок: слева, сверху, снизу или
      справа от чисел. <b>Диспетчер имён</b> показывает все имена, позволяет их переименовать и удалить.
      <b>На работе пригодится</b> для справочников: регионы, филиалы, статьи бюджета.
    say: >-
      Готово! «Создать из выделенного» превращает подписи в имена за один щелчок, а диспетчер имён помогает
      их переименовать и удалить. Удобно для справочников: регионов, филиалов, статей бюджета.
    actions:
      - click: E4
