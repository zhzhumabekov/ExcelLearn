# Глава 10 (финансовые функции). Собрано генератором; ответы expect посчитаны независимо.
id: fv
chapter: ch10
order: 2
title: 'БС: сколько накопится к пенсии'
source: Excelfinfunctions.xlsx, лист FV (рис. 10.2)
sheet:
  file: Накопления.xlsx
  name: Накопления
  columns:
    A: 290
    B: 170
  rows: 9
  cells:
    A1:
      v: Доходность в год
      style: label
    B1:
      v: 0.08
      fmt: percent
    A2:
      v: Лет
      style: label
    B2: 40
    A3:
      v: Взнос в год
      style: label
    B3:
      v: 200000
      fmt: kzt
    A4:
      v: Уже на счёте
      style: label
    B4:
      v: 3000000
      fmt: kzt
    A6: Взносы в конце года
    B6:
      fmt: kzt
    A7: Взносы в начале года
    B7:
      fmt: kzt
    A8: Взносы + то, что уже на счёте
    B8:
      fmt: kzt
expect:
  B6: 51811303.742
  B7: 55956208.0414
  B8: 116984868.2324
steps:
- title: Ситуация
  text: Дархану 25 лет. Он хочет 40 лет откладывать <b>200 000 ₸</b> в год на пенсионный счёт, который приносит 8% в год.
    Сколько накопится к 65 годам? Это вопрос не о сегодняшней стоимости, а о <b>будущей</b> — функция {fn:FV}.
  actions:
  - wait: 3000
- title: '{fn:FV}: будущая сумма взносов'
  text: 'В <code>B6</code>: <code>{f:=FV(B1,B2,-B3)}</code> — ставка, число лет и взнос с минусом (деньги уходят на счёт).
    Первый взнос растёт 39 лет, последний — ни одного: {fn:FV} складывает 200 000 × 1,08³⁹ + … + 200 000. Итог — <b>51 811
    304 ₸</b>, хотя внесено всего 8 000 000 ₸.'
  actions:
  - click: B6
  - type: =FV(
  - clickRef: B1
  - type: ','
  - clickRef: B2
  - type: ',-'
  - clickRef: B3
  - type: )
  - keys:
    - Enter
- title: 'Взносы в начале года: тип 1'
  text: 'Если вносить деньги в начале года, каждый взнос работает на год дольше: <code>{f:=FV(B1,B2,-B3,0,1)}</code> — <b>55
    956 208 ₸</b>, ровно в 1,08 раза больше. Пятый аргумент тип = 1 сдвигает все платежи в начало периода.'
  actions:
  - click: B7
  - type: =FV(B1,B2,-B3,0,1)
  - keys:
    - Enter
- title: 'То, что уже на счёте: пс'
  text: 'Четвёртый аргумент — <b>пс</b>, сумма на счёте сегодня. Она тоже уходит на счёт, поэтому с минусом: <code>{f:=FV(B1,B2,-B3,-B4)}</code>
    — <b>116 984 868 ₸</b>. Одни только 3 000 000 ₸ за 40 лет превращаются в 65 173 564 ₸ — больше, чем все взносы вместе:
    ранний вклад работает дольше всех.'
  actions:
  - click: B8
  - type: =FV(B1,B2,-B3,-B4)
  - keys:
    - Enter
- title: 'Частая ошибка: годовая ставка при ежемесячных взносах'
  text: 'Если взносы ежемесячные, все аргументы — в месяцах: ставка 8%/12, периодов 40 × 12 = 480. Годовая ставка с месячными
    периодами даст сказочную сумму: Excel решит, что 8% начисляются каждый месяц.'
  actions:
  - click: B6
  - showRefs: B6
  - wait: 2500
- title: Что запомнить
  text: <code>{f:=FV(ставка,кпер,плт,пс,тип)}</code> — будущая сумма одинаковых взносов и начального вклада. Взносы и вклад
    — с минусом. Ставка и периоды — в одних единицах. <b>На работе пригодится</b> для накоплений, фонда на замену оборудования,
    депозитов с пополнением.
  actions:
  - click: B8
