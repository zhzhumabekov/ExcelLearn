# Глава 11 (циклические ссылки). Собрано генератором; ответы expect посчитаны независимо.
id: whole-column
chapter: ch11
order: 2
title: 'СРЗНАЧ(B:B): весь столбец и циклическая ссылка'
source: 'Глава 11 книги: =СРЗНАЧ(B:B) внутри столбца B'
sheet:
  file: Продажи_по_месяцам.xlsx
  name: Продажи
  columns:
    A: 200
    B: 150
    C: 30
    D: 160
  rows: 11
  cells:
    A1:
      v: Месяц
      style: head
    B1:
      v: Продажи, тыс. ₸
      style: head
    D1:
      v: Средние продажи
      style: head
    A2: Январь
    B2: 4200
    A3: Февраль
    B3: 3900
    A4: Март
    B4: 4600
    A5: Апрель
    B5: 5100
    A6: Май
    B6: 4800
    A7: Июнь
    B7: 5300
    D2:
      fmt: number
    A10:
      v: Среднее в столбце B
      style: label
    B10:
      fmt: number
expect:
  D2: 4771.4286
  B8: 5500
  B10: 4771.4286
steps:
- title: Ситуация
  text: 'Отдел продаж каждый месяц дописывает новую строку в столбец B. Хочется, чтобы среднее считалось само, без правки
    формулы. Для этого ссылаются на <b>весь столбец</b>: <code>B:B</code> — все ячейки столбца B, сколько бы строк ни добавили.'
  actions:
  - wait: 3000
- title: Среднее всего столбца
  text: 'В <code>D2</code>: <code>{f:=AVERAGE(B:B)}</code> — <b>4 650,00</b> тыс. ₸. {fn:AVERAGE} пропускает заголовок и
    пустые ячейки и делит сумму чисел столбца на их количество — шесть месяцев.'
  actions:
  - click: D2
  - type: =AVERAGE(B:B)
  - keys:
    - Enter
- title: Новый месяц — формула та же
  text: 'Допишите июль: в <code>A8</code> — «Июль», в <code>B8</code> — 5500. Среднее в <code>D2</code> пересчиталось само
    — <b>4 771,43</b>: формула ссылается на весь столбец, и новая строка уже внутри него.'
  actions:
  - click: A8
  - type: Июль
  - keys:
    - Tab
  - type: '5500'
  - keys:
    - Enter
  - click: D2
  - wait: 1200
- title: 'Частая ошибка: формула внутри своего столбца'
  text: 'Поставим такую же формулу <b>в столбец B</b>: в <code>B10</code> <code>{f:=AVERAGE(B:B)}</code>. Столбец B включает
    и саму <code>B10</code> — формула ссылается на себя, и Excel предупреждает о циклической ссылке. Нажмите OK: в ячейке
    0, внизу — «Циклические ссылки: B10».'
  actions:
  - click: B10
  - type: =AVERAGE(B:B)
  - keys:
    - Enter
  - wait: 1500
  - dialogButton: OK
  - wait: 1200
- title: Итерации решают и эту петлю
  text: '<b>Файл → Параметры → Формулы → Включить итеративные вычисления</b>. Теперь <code>B10</code> — <b>4 771,43</b>:
    при каждом круге Excel усредняет месяцы вместе с прошлым значением <code>B10</code>, и оно быстро сходится к среднему
    остальных чисел.'
  actions:
  - fileMenu: options
  - dialogPick: Формулы
  - dialogCheck: Включить итеративные вычисления
  - dialogButton: OK
  - click: B10
  - wait: 1500
- title: Что запомнить
  text: <code>{f:=AVERAGE(B:B)}</code> — среднее всего столбца, удобно для данных, которые дописывают. Ставьте такую формулу
    <b>вне</b> этого столбца — тогда петли нет и итерации не нужны. <b>На работе пригодится</b> для ежемесячных отчётов,
    где строки добавляются.
  actions:
  - click: D2
