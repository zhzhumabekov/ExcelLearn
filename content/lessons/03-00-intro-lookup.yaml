steps:
- title: Ситуация
  text: 'Вы менеджер магазина канцтоваров. Клиент присылает артикулы, а цены — в прайсе (у нас 6 строк, в жизни — тысячи).
    Искать каждую цену глазами долго и легко ошибиться строкой. Пусть ищет Excel: для этого есть <b>функции поиска</b>.'
  say: Клиент присылает артикулы, а цены — в прайсе на тысячи строк. Искать глазами долго и легко ошибиться. Пусть ищет
    Excel — для этого есть функции поиска.
  actions:
  - wait: 3000
- title: Как ищет человек
  text: 'Смотрите, что мы делаем сами: берём артикул из заказа, ведём глазами по первому столбцу прайса, находим строку
    и смотрим в столбец цены. Ровно так работает <code>{fn:VLOOKUP}</code> — <b>вертикальный просмотр</b>.'
  say: 'Что делаем сами: берём артикул, ведём глазами по первому столбцу прайса, находим строку и смотрим цену. Ровно так
    работает {fn:VLOOKUP} — вертикальный просмотр.'
  actions:
  - click: E2
  - dragSelect: A2:A7
  - click: A5
  - click: C5
- title: Функция ВПР
  text: 'В <code>F2</code> наберите <code>{f:=VLOOKUP(E2,$A$2:$C$7,3,FALSE)}</code>: <b>что</b> ищем (артикул), <b>где</b>
    (прайс, первый столбец — артикулы), <b>какой столбец</b> вернуть (третий — цена) и <b>{fn:FALSE}</b> — нужно точное
    совпадение. Ответ — <b>990 ₸</b>.'
  say: 'Набираем {fn:VLOOKUP}: что ищем — артикул, где — прайс, какой столбец вернуть — третий, с ценой, и {fn:FALSE} —
    нужно точное совпадение.'
  actions:
  - click: F2
  - type: =VLOOKUP(
  - clickRef: E2
  - type: ',$A$2:$C$7,3,FALSE)'
  - keys:
    - Enter
- title: Весь заказ
  text: Протяните формулу маркером заполнения до <code>F4</code>. Прайс в формуле закреплён знаками <code>$</code>, поэтому
    сдвигается только артикул.
  say: Протягиваем формулу на весь заказ. Прайс закреплён знаками доллара, поэтому сдвигается только артикул.
  actions:
  - click: F2
  - fill: F2:F4
- title: Клиент передумал
  text: 'Клиент меняет бумагу на степлер: впишите <b>K-205</b> в <code>E3</code>. Цена сменилась сама — <b>1 450 ₸</b>.
    Формула не знает цены заранее: она каждый раз ищет их в прайсе.'
  say: 'Клиент меняет бумагу на степлер. Вписываем новый артикул — и цена меняется сама: формула каждый раз ищет её в прайсе.'
  actions:
  - click: E3
  - type: K-205
  - keys:
    - Enter
  - click: F3
- title: Что будет в главе
  text: '<b>3.1</b> — {fn:VLOOKUP} по шкале: процент премии от суммы продаж<br><b>3.2</b> — {fn:VLOOKUP} по артикулу и почему
    без {fn:FALSE} приходит чужая цена<br><b>3.3</b> — {fn:HLOOKUP}: поиск по строке, цена на дату'
  say: В этой главе — {fn:VLOOKUP} по шкале и по точному совпадению, и {fn:HLOOKUP}, который ищет не по столбцу, а по строке.
  actions:
  - wait: 4000
- title: Что запомнить
  text: 'Функции поиска находят значение в таблице по ключу: артикулу, фамилии, дате. Сама таблица закрепляется знаками
    <code>$</code>. <b>На работе пригодится</b>: цены по прайсу, ставки по шкале, данные сотрудника по табельному номеру,
    сверка двух выгрузок.'
  say: 'Запомните: функции поиска находят значение в таблице по ключу — артикулу, фамилии или дате. Так подставляют цены
    из прайса, ставки по шкале и данные сотрудника по табельному номеру.'
  actions:
  - click: F4
