steps:
- title: Ситуация
  text: Офис работает пять дней в неделю, магазин стройматериалов — шесть, ресторан отдыхает в воскресенье и понедельник.
    Срок «100 рабочих дней» у каждого свой. {fn:WORKDAY} знает только выходные в субботу и воскресенье, а {fn:WORKDAY.INTL}
    — любые.
  actions:
  - wait: 3000
- title: Код выходных
  text: '<code>{f:=WORKDAY.INTL($B$1,100,B4)}</code>: третий аргумент — код выходных. 1 — сб и вс, 2 — вс и пн, 3 — пн и
    вт, …, 7 — пт и сб; 11 — только вс, 12 — только пн, …, 17 — только сб. У шестидневки сотый рабочий день — <b>30.04.2027</b>,
    на 3 недели раньше, чем у офиса.'
  actions:
  - click: C4
  - type: =WORKDAY.INTL(
  - clickRef: B1
  - keys:
    - F4
  - type: ',100,'
  - clickRef: B4
  - type: )
  - keys:
    - Enter
  - click: C4
  - fill: C4:C8
- title: Выходные строкой
  text: 'Вместо кода можно задать строку из семи знаков. Знаки — дни с понедельника по воскресенье: 1 — выходной, 0 — рабочий.
    «0000001» — только воскресенье, ответ тот же, что у кода 11 (сравните <code>C5</code> и <code>C7</code>). Строкой задают
    любой график, даже три выходных.'
  actions:
  - click: C7
  - showRefs: C7
  - wait: 2500
- title: '{fn:NETWORKDAYS.INTL}'
  text: 'Сколько рабочих дней в году при каждом графике: <code>{f:=NETWORKDAYS.INTL(DATE(2027,1,1),DATE(2027,12,31),B4)}</code>.
    Коды и строки те же. Пятидневка — <b>261</b> дней, шестидневка — <b>313</b> (без учёта праздников; их добавляют четвёртым
    аргументом).'
  actions:
  - click: D4
  - type: =NETWORKDAYS.INTL(DATE(2027,1,1),DATE(2027,12,31),
  - clickRef: B4
  - type: )
  - keys:
    - Enter
  - click: D4
  - fill: D4:D8
- title: 'Частая ошибка: строка стала числом'
  text: 'Строку выходных набирают с апострофом (<b>''0000001</b>) или прямо в формуле в кавычках: <code>{f:=WORKDAY.INTL($B$1,100,"0000001")}</code>.
    Без апострофа Excel превратит 0000001 в число 1, и выходными станут суббота и воскресенье. В <code>B7</code> строка
    прижата влево — это текст, значит, всё верно.'
  actions:
  - click: B7
  - wait: 2500
- title: Что запомнить
  text: '{fn:WORKDAY.INTL} и {fn:NETWORKDAYS.INTL} — то же, что {fn:WORKDAY} и {fn:NETWORKDAYS}, но выходные задаются кодом
    (1–7, 11–17) или строкой «0000011». <b>На работе пригодится</b> для магазинов, ресторанов, сменных графиков и партнёров
    из стран с другими выходными.'
  actions:
  - click: C4
