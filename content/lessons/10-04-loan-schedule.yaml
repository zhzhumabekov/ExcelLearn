steps:
- title: Ситуация
  text: 'Тот же кредит: 1 000 000 ₸ на 10 месяцев, 1,5% в месяц, платёж 108 434 ₸ уже в <code>B4</code>. Бухгалтеру нужно
    разделить каждый платёж на <b>основной долг</b> и <b>проценты</b>: проценты идут в расходы, а основной долг уменьшает
    кредит. Построим график погашения.'
  actions:
  - wait: 3000
- title: 'Основной долг: {fn:PPMT}'
  text: 'В <code>C7</code>: <code>{f:=-PPMT($B$2,A7,$B$3,$B$1)}</code>. Аргументы как у {fn:PMT}, но второй — <b>номер периода</b>
    из столбца A. Параметры кредита закреплены знаками <code>$</code>. Протяните до <code>C16</code>: в 1-й месяц в погашение
    долга идёт всего <b>93 434 ₸</b>, к концу — почти весь платёж.'
  actions:
  - click: C7
  - type: =-PPMT($B$2,
  - clickRef: A7
  - type: ',$B$3,$B$1)'
  - keys:
    - Enter
  - click: C7
  - fill: C7:C16
- title: 'Проценты: {fn:IPMT}'
  text: 'В <code>D7</code>: <code>{f:=-IPMT($B$2,A7,$B$3,$B$1)}</code> — проценты за месяц. В 1-й месяц: 1 000 000 × 1,5%
    = <b>15 000 ₸</b>. Протяните до <code>D16</code>: проценты считаются от оставшегося долга и с каждым месяцем уменьшаются.
    В каждой строке основной долг + проценты = 108 434 ₸.'
  actions:
  - click: D7
  - type: =-IPMT($B$2,
  - clickRef: A7
  - type: ',$B$3,$B$1)'
  - keys:
    - Enter
  - click: D7
  - fill: D7:D16
- title: Остаток долга
  text: 'Долг в начале 1-го месяца — сумма кредита: <code>{f:=B1}</code> в <code>B7</code>. Долг в конце — долг в начале
    минус погашенный основной долг: <code>{f:=B7-C7}</code> в <code>E7</code>. Долг в начале следующего месяца — долг в
    конце прошлого: <code>{f:=E7}</code> в <code>B8</code>. После протягивания долг в конце 10-го месяца — <b>0 ₸</b>: кредит
    погашен.'
  actions:
  - click: B7
  - type: =B1
  - keys:
    - Enter
  - click: E7
  - type: =B7-C7
  - keys:
    - Enter
  - click: E7
  - fill: E7:E16
  - click: B8
  - type: =E7
  - keys:
    - Enter
  - click: B8
  - fill: B8:B16
- title: 'За несколько месяцев: {fn:CUMIPMT} и {fn:CUMPRINC}'
  text: 'Сколько процентов уплачено со 2-го по 4-й месяц? <code>{f:=-CUMIPMT(B2,B3,B1,2,4,0)}</code> — <b>36 507 ₸</b>:
    ставка, периоды, сумма, первый и последний месяц, тип. <code>{f:=-CUMPRINC(B2,B3,B1,2,4,0)}</code> — основной долг за
    те же месяцы: <b>288 796 ₸</b>. Это суммы столбцов D и C за строки 8–10.'
  actions:
  - click: B18
  - type: =-CUMIPMT(B2,B3,B1,2,4,0)
  - keys:
    - Enter
  - click: B19
  - type: =-CUMPRINC(B2,B3,B1,2,4,0)
  - keys:
    - Enter
- title: Что запомнить
  text: '{fn:PPMT} — основной долг в платеже за период, {fn:IPMT} — проценты; вместе — {fn:PMT}. {fn:CUMIPMT} и {fn:CUMPRINC}
    — то же за несколько периодов сразу (последний аргумент — тип — обязателен). <b>На работе пригодится</b> для учёта кредитов
    и проверки графика банка.'
  actions:
  - click: E16
