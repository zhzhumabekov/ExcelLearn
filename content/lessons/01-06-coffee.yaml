# Глава 1, рис. 1.7. Шаблона в книге нет — лист по coffee.xlsx (без формул прибыли), expect — из него же.
# В книге «=($F$5-$F$4*F$9)…» — опечатка: параметры спроса в B4:B5 (см. content/sources/ch01.md).
id: coffee-price-cost
chapter: ch01
order: 6
title: Прибыль кофейни при разных цене и себестоимости
source: Рис. 1.7, coffee.xlsx

sheet:
  file: coffee.xlsx
  name: coffee
  columns: {A: 130, B: 50, C: 50, D: 30, E: 70, F: 72, G: 72, H: 72, I: 72, J: 72, K: 72, L: 72, M: 40}
  rows: 15
  cells:
    A4: {v: Demand slope, style: label}
    B4: 15
    A5: {v: Demand intercept, style: label}
    B5: 100
    D2: Demand = 100 − 15 × Price
    F4: Profit = (price − unit cost) × demand
    G8: {v: Price, style: head}
    F9: {v: 2, fmt: usd, style: head}
    G9: {v: 2.5, fmt: usd, style: head}
    H9: {v: 3, fmt: usd, style: head}
    I9: {v: 3.5, fmt: usd, style: head}
    J9: {v: 4, fmt: usd, style: head}
    K9: {v: 4.5, fmt: usd, style: head}
    L9: {v: 5, fmt: usd, style: head}
    C12: {v: Cost, style: label}
    E10: {v: 0.5, fmt: usd, style: head}
    E11: {v: 1, fmt: usd, style: head}
    E12: {v: 1.5, fmt: usd, style: head}
    E13: {v: 2, fmt: usd, style: head}

expect:
  F10: 105
  I10: 142.5
  L10: 112.5
  J11: 120
  J12: 100
  F13: 0
  K13: 81.25
  L13: 75

steps:
  - title: Задача
    text: >-
      Спрос на кофе: <code>100 − 15 × цена</code> чашек в день (параметры — в <code>B4:B5</code>). Прибыль =
      (цена − себестоимость) × спрос. Посчитаем прибыль для всех сочетаний: цены $2–$5 в строке 9,
      себестоимость $0,50–$2 в столбце E.
    say: >-
      Спрос на кофе — сто минус пятнадцать, умноженное на цену. Прибыль — цена минус себестоимость,
      умноженная на спрос. Посчитаем прибыль для всех цен и всех вариантов себестоимости одной формулой.
    actions:
      - wait: 3000

  - title: "Спрос: $B$5 − $B$4 × F$9"
    text: >-
      В <code>F10</code> начинаем со спроса: <code>=($B$5-$B$4*F$9)</code>. Параметры спроса <code>B5</code> и
      <code>B4</code> одни на всю таблицу — закрепляем полностью (<kbd>F4</kbd> один раз). Цена всегда в
      строке 9 — закрепляем строку: <code>F$9</code> (<kbd>F4</kbd> дважды).
    say: >-
      Начинаем со спроса. Параметры спроса одни на всю таблицу — закрепляем их полностью клавишей F4.
      Цена всегда в девятой строке — закрепляем только строку, нажав F4 два раза.
    actions:
      - click: F10
      - type: "=("
      - clickRef: B5
      - keys: [F4]
      - type: "-"
      - clickRef: B4
      - keys: [F4]
      - type: "*"
      - clickRef: F9
      - keys: [F4]
      - keys: [F4]
      - type: ")"

  - title: "Маржа: F$9 − $E10"
    text: >-
      Умножаем на маржу <code>(F$9-$E10)</code>. Себестоимость всегда в столбце E — закрепляем столбец:
      <code>$E10</code> (<kbd>F4</kbd> трижды). <kbd>Enter</kbd> — прибыль при цене $2 и себестоимости
      $0,50: <b>$105</b>.
    say: >-
      Умножаем на маржу: цена минус себестоимость. Себестоимость всегда в столбце Е — закрепляем столбец,
      нажав F4 три раза. Получаем сто пять долларов.
    actions:
      - type: "*("
      - clickRef: F9
      - keys: [F4]
      - keys: [F4]
      - type: "-"
      - clickRef: E10
      - keys: [F4]
      - keys: [F4]
      - keys: [F4]
      - type: ")"
      - keys: [Enter]

  - title: Одна формула — вся таблица
    text: >-
      Копируем <code>F10</code> на <code>F10:L13</code>. Благодаря знакам <code>$</code> каждая ячейка берёт
      цену из своего столбца строки 9 и себестоимость из своей строки столбца E.
    say: >-
      Копируем формулу на всю таблицу. Благодаря знакам доллара каждая ячейка берёт цену из своего столбца
      и себестоимость из своей строки.
    actions:
      - click: F10
      - keys: [Ctrl, C]
      - dragSelect: F10:L13
      - keys: [Enter]

  - title: Проверим пример книги
    text: >-
      Себестоимость $1,50, цена $4,00: <code>J12</code> = (100 − 15 × 4) × (4 − 1,5) = <b>$100</b>.
      Ссылки подсвечены: цена из <code>J9</code>, себестоимость из <code>E12</code>.
    say: >-
      Проверим: себестоимость полтора доллара, цена четыре доллара — прибыль сто долларов. Цена взята из
      своего столбца, себестоимость — из своей строки.
    actions:
      - showRefs: J12

  - title: Готово!
    text: >-
      Смешанные ссылки (<code>F$9</code>, <code>$E10</code>) позволяют одной формулой заполнить двумерную
      таблицу. Лучшую цену для каждой себестоимости можно подсветить условным форматированием — глава 24.
    say: >-
      Готово! Смешанные ссылки позволяют заполнить всю таблицу одной формулой. А подсвечивать лучшие цены
      мы научимся в главе об условном форматировании.
    actions:
      - click: J12
