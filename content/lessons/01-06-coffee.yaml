# Свой пример по мотивам рис. 1.7: кофейня в Алматы выбирает цену капучино при разной себестоимости.
id: coffee-price-cost
chapter: ch01
order: 6
title: Прибыль кофейни при разных цене и себестоимости
source: Свой пример (кофейня в Алматы, цена капучино)

sheet:
  file: Цена_капучино.xlsx
  name: Прибыль
  columns: { A: 110, B: 64, C: 76, D: 76, E: 76, F: 76, G: 76, H: 76 }
  rows: 13
  cells:
    A1: {v: Базовый спрос, style: label}
    B1: 200
    A2: {v: Минус за 1 ₸, style: label}
    B2: 0.1
    A4: Продажи в день = 200 − 0,1 × цена
    A5: Прибыль в день = (цена − себестоимость) × продажи
    C7: {v: "Цена чашки, ₸", style: head}
    C8: {v: 900, fmt: kzt, style: head}
    D8: {v: 1000, fmt: kzt, style: head}
    E8: {v: 1100, fmt: kzt, style: head}
    F8: {v: 1200, fmt: kzt, style: head}
    G8: {v: 1300, fmt: kzt, style: head}
    H8: {v: 1400, fmt: kzt, style: head}
    A10: {v: Себестоимость, style: label}
    B9: {v: 300, fmt: kzt, style: head}
    B10: {v: 400, fmt: kzt, style: head}
    B11: {v: 500, fmt: kzt, style: head}
    B12: {v: 600, fmt: kzt, style: head}
    C9: {fmt: kzt}

expect:
  C9: 66000
  E9: 72000
  H9: 66000
  F10: 64000
  F11: 56000
  C12: 33000
  G12: 49000
  H12: 48000

steps:
  - title: Ситуация
    text: >-
      Владелица кофейни в Алматы выбирает цену капучино. Подняли цену — чашек продаётся меньше: по наблюдениям,
      <code>200 − 0,1 × цена</code> в день (параметры — в <code>B1:B2</code>). Себестоимость чашки зависит
      от цен на зерно и молоко и может быть от 300 до 600 ₸, цена — от 900 до 1 400 ₸. Прибыль = (цена − себестоимость) × продажи.
      Посчитаем прибыль <b>для всех сочетаний</b> цены (строка 8) и себестоимости (столбец B).
    actions:
      - wait: 3000

  - title: "Продажи: $B$1 − $B$2 × C$8"
    text: >-
      В <code>C9</code> начинаем с продаж — сколько чашек купят за день при этой цене: <code>=($B$1-$B$2*C$8)</code>,
      то есть 200 − 0,1 × 900 = 110. Параметры <code>B1</code> и <code>B2</code> одни на всю таблицу — закрепляем их
      полностью (<kbd>F4</kbd> один раз). Цена всегда в строке 8 — закрепляем только строку: <code>C$8</code>
      (<kbd>F4</kbd> дважды).
    actions:
      - click: C9
      - type: "=("
      - clickRef: B1
      - keys: [F4]
      - type: "-"
      - clickRef: B2
      - keys: [F4]
      - type: "*"
      - clickRef: C8
      - keys: [F4]
      - keys: [F4]
      - type: ")"

  - title: "Доход с чашки: C$8 − $B9"
    text: >-
      Умножаем на доход с чашки <code>(C$8-$B9)</code>. Себестоимость всегда в столбце B — закрепляем
      столбец: <code>$B9</code> (<kbd>F4</kbd> трижды). <kbd>Enter</kbd> — при цене 900 ₸ и себестоимости
      300 ₸ прибыль <b>66 000 ₸</b> в день.
    actions:
      - type: "*("
      - clickRef: C8
      - keys: [F4]
      - keys: [F4]
      - type: "-"
      - clickRef: B9
      - keys: [F4]
      - keys: [F4]
      - keys: [F4]
      - type: ")"
      - keys: [Enter]

  - title: Одна формула — вся таблица
    text: >-
      Копируем <code>C9</code> на <code>C9:H12</code> — 24 ячейки. Формула везде одна, а знаки <code>$</code> решают,
      что сдвигается. <code>C$8</code>: столбец меняется, строка 8 — нет, поэтому цена берётся из заголовка <b>своего
      столбца</b>. <code>$B9</code>: строка меняется, столбец B — нет, поэтому себестоимость — из заголовка <b>своей
      строки</b>. <code>$B$1</code> и <code>$B$2</code> не меняются совсем.
    actions:
      - click: C9
      - keys: [Ctrl, C]
      - dragSelect: C9:H12
      - keys: [Enter]

  - title: Проверим одну ячейку
    text: >-
      Себестоимость 500 ₸, цена 1 200 ₸: <code>F11</code> = (200 − 0,1 × 1 200) × (1 200 − 500) =
      80 × 700 = <b>56 000 ₸</b>. Ссылки подсвечены: цена из <code>F8</code>, себестоимость из
      <code>B11</code>.
    actions:
      - showRefs: F11

  - title: Что запомнить
    text: >-
      Смешанные ссылки (<code>C$8</code>, <code>$B9</code>) позволяют одной формулой заполнить двумерную
      таблицу. Вывод для кофейни: при себестоимости 300 ₸ выгоднее всего 1 100–1 200 ₸, а если зерно
      подорожает до 600 ₸ — уже 1 300 ₸. <b>На работе пригодится</b> для таблиц «цена × объём», «ставка ×
      срок», «курс × сумма». Подсвечивать лучшие значения научимся в главе об условном форматировании.
    actions:
      - click: F11
