# Свой пример по мотивам рис. 1.7: кофейня в Алматы выбирает цену капучино при разной себестоимости.
id: coffee-price-cost
chapter: ch01
order: 6
title: Прибыль кофейни при разных цене и себестоимости
source: Свой пример (кофейня в Алматы, цена капучино)

sheet:
  file: Цена_капучино.xlsx
  name: Прибыль
  columns: {A: 110, B: 64, C: 76, D: 76, E: 76, F: 76, G: 76, H: 76}
  rows: 14
  cells:
    A2: {v: Базовый спрос, style: label}
    B2: 200
    A3: {v: Минус за 1 ₸, style: label}
    B3: 0.1
    A5: Продажи в день = 200 − 0,1 × цена
    A6: Прибыль в день = (цена − себестоимость) × продажи
    C8: {v: "Цена чашки, ₸", style: head}
    C9: {v: 900, fmt: kzt, style: head}
    D9: {v: 1000, fmt: kzt, style: head}
    E9: {v: 1100, fmt: kzt, style: head}
    F9: {v: 1200, fmt: kzt, style: head}
    G9: {v: 1300, fmt: kzt, style: head}
    H9: {v: 1400, fmt: kzt, style: head}
    A11: {v: Себестоимость, style: label}
    B10: {v: 300, fmt: kzt, style: head}
    B11: {v: 400, fmt: kzt, style: head}
    B12: {v: 500, fmt: kzt, style: head}
    B13: {v: 600, fmt: kzt, style: head}
    C10: {fmt: kzt}

expect:
  C10: 66000
  E10: 72000
  H10: 66000
  F11: 64000
  F12: 56000
  C13: 33000
  G13: 49000
  H13: 48000

steps:
  - title: Ситуация
    text: >-
      Владелица кофейни в Алматы выбирает цену капучино. Подняли цену — чашек продаётся меньше: по наблюдениям,
      <code>200 − 0,1 × цена</code> в день (параметры — в <code>B2:B3</code>). Себестоимость чашки зависит
      от цен на зерно и молоко и может быть от 300 до 600 ₸, цена — от 900 до 1 400 ₸. Прибыль = (цена − себестоимость) × продажи.
      Посчитаем прибыль <b>для всех сочетаний</b> цены (строка 9) и себестоимости (столбец B).
    say: >-
      Владелица кофейни в Алматы выбирает цену капучино. Чем выше цена, тем меньше продаётся чашек, а
      себестоимость зависит от цен на зерно и молоко. Посчитаем прибыль для всех сочетаний цены и
      себестоимости одной формулой.
    actions:
      - wait: 3000

  - title: "Продажи: $B$2 − $B$3 × C$9"
    text: >-
      В <code>C10</code> начинаем с продаж: <code>=($B$2-$B$3*C$9)</code>. Параметры <code>B2</code> и
      <code>B3</code> одни на всю таблицу — закрепляем полностью (<kbd>F4</kbd> один раз). Цена всегда в
      строке 9 — закрепляем строку: <code>C$9</code> (<kbd>F4</kbd> дважды).
    say: >-
      Начинаем с продаж. Параметры спроса одни на всю таблицу — закрепляем их полностью клавишей F4. Цена
      всегда в девятой строке — закрепляем только строку, нажав F4 два раза.
    actions:
      - click: C10
      - type: "=("
      - clickRef: B2
      - keys: [F4]
      - type: "-"
      - clickRef: B3
      - keys: [F4]
      - type: "*"
      - clickRef: C9
      - keys: [F4]
      - keys: [F4]
      - type: ")"

  - title: "Доход с чашки: C$9 − $B10"
    text: >-
      Умножаем на доход с чашки <code>(C$9-$B10)</code>. Себестоимость всегда в столбце B — закрепляем
      столбец: <code>$B10</code> (<kbd>F4</kbd> трижды). <kbd>Enter</kbd> — при цене 900 ₸ и себестоимости
      300 ₸ прибыль <b>66 000 ₸</b> в день.
    say: >-
      Умножаем на доход с одной чашки: цена минус себестоимость. Себестоимость всегда в столбце Бэ —
      закрепляем столбец, нажав F4 три раза. Получаем шестьдесят шесть тысяч тенге в день.
    actions:
      - type: "*("
      - clickRef: C9
      - keys: [F4]
      - keys: [F4]
      - type: "-"
      - clickRef: B10
      - keys: [F4]
      - keys: [F4]
      - keys: [F4]
      - type: ")"
      - keys: [Enter]

  - title: Одна формула — вся таблица
    text: >-
      Копируем <code>C10</code> на <code>C10:H13</code>. Благодаря знакам <code>$</code> каждая ячейка берёт
      цену из своего столбца строки 9 и себестоимость из своей строки столбца B.
    say: >-
      Копируем формулу на всю таблицу. Благодаря знакам доллара каждая ячейка берёт цену из своего столбца
      и себестоимость из своей строки.
    actions:
      - click: C10
      - keys: [Ctrl, C]
      - dragSelect: C10:H13
      - keys: [Enter]

  - title: Проверим одну ячейку
    text: >-
      Себестоимость 500 ₸, цена 1 200 ₸: <code>F12</code> = (200 − 0,1 × 1 200) × (1 200 − 500) =
      80 × 700 = <b>56 000 ₸</b>. Ссылки подсвечены: цена из <code>F9</code>, себестоимость из
      <code>B12</code>.
    say: >-
      Проверим: себестоимость пятьсот тенге, цена тысяча двести — восемьдесят чашек по семьсот тенге дохода,
      пятьдесят шесть тысяч в день. Цена взята из своего столбца, себестоимость — из своей строки.
    actions:
      - showRefs: F12

  - title: Что запомнить
    text: >-
      Смешанные ссылки (<code>C$9</code>, <code>$B10</code>) позволяют одной формулой заполнить двумерную
      таблицу. Вывод для кофейни: при себестоимости 300 ₸ выгоднее всего 1 100–1 200 ₸, а если зерно
      подорожает до 600 ₸ — уже 1 300 ₸. <b>На работе пригодится</b> для таблиц «цена × объём», «ставка ×
      срок», «курс × сумма». Подсвечивать лучшие значения научимся в главе об условном форматировании.
    say: >-
      Готово! Смешанные ссылки позволяют заполнить всю таблицу одной формулой. Видно, что при дорогом зерне
      цену капучино выгодно поднять. Такие таблицы пригодятся для любых расчётов «цена на объём» или «ставка
      на срок».
    actions:
      - click: F12
