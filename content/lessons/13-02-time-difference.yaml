expect:
  B4: 0.5
  B5: 12
  B6: -0.5
  D9: 29.180555556
  D10: 28.96875
steps:
- title: Ситуация
  text: Смена оператора на заводе в Павлодаре — с 8:30 до 20:30. Сколько она длится? Время вычитается, как обычные числа,
    но то, что мы увидим, зависит от формата ячейки.
  actions:
  - wait: 3000
- title: Вычитаем время
  text: 'В <code>B4</code>: <code>{f:=B2-B1}</code>. Ячейка в формате времени показывает <b>12:00</b> — как будто полдень.
    На самом деле это 0,5 суток: 0,8542 − 0,3542 = 0,5. Чтобы увидеть число, поменяем формат: <b>Ctrl+1 → Числовой</b>.'
  actions:
  - click: B4
  - type: =B2-B1
  - keys:
    - Enter
  - wait: 1000
  - click: B4
  - keys:
    - Ctrl
    - '1'
  - dialogPick: Числовой
  - wait: 600
  - dialogButton: OK
- title: В часах — умножить на 24
  text: 'Доля суток × 24 = часы: <code>{f:=24*(B2-B1)}</code> в <code>B5</code> — 0,5 × 24 = <b>12</b> часов. Так же × 1
    440 — минуты, × 86 400 — секунды.'
  actions:
  - click: B5
  - type: =24*(B2-B1)
  - keys:
    - Enter
- title: 'Решётки: отрицательное время'
  text: '<code>{f:=B1-B2}</code> в <code>B6</code> — раннее минус позднее. Отрицательного времени Excel не показывает и
    заполняет ячейку решётками ####. Это не ошибка расчёта: в формате <b>Числовой</b> видно <b>−0,50</b>.'
  actions:
  - click: B6
  - type: =B1-B2
  - keys:
    - Enter
  - wait: 1500
  - click: B6
  - keys:
    - Ctrl
    - '1'
  - dialogPick: Числовой
  - wait: 600
  - dialogButton: OK
- title: Сколько дней шёл проект
  text: 'Начало и конец проектов — дата со временем. <code>{f:=C9-B9}</code> — разница в днях с долями: монтаж шёл <b>29,18</b>
    дня, пусконаладка — <b>28,97</b>. Целая часть — дни, дробная — часы и минуты.'
  actions:
  - click: D9
  - type: =C9-B9
  - keys:
    - Enter
  - click: D9
  - fill: D9:D10
- title: Что запомнить
  text: 'Разница двух времён — доля суток: ×24 — часы. Формат времени покажет её как время суток (12:00), <b>Числовой</b>
    — числом (0,5). Решётки #### в ячейке времени — отрицательное значение. <b>На работе пригодится</b> для учёта смен,
    простоев, сроков проектов.'
  actions:
  - click: B5
