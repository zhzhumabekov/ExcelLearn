steps:
- title: Ситуация
  text: 'Проект ТОО: вложить <b>10 млн ₸</b> сегодня и три года получать 4–5 млн ₸. В главе 8 ЧПС считали при заданной ставке,
    и ответ от неё зависел. Есть ставка, при которой проект ровно «в ноль», — <b>внутренняя ставка доходности</b>, ВСД.
    Найдём её.'
  actions:
  - wait: 3000
- title: ЧПС при разных ставках
  text: 'В <code>B5</code>: <code>{f:=$B$2+NPV(A5,$C$2:$E$2)}</code> — сегодняшний поток плюс ЧПС будущих. Потоки закреплены
    знаками <code>$</code>, а ставка <code>A5</code> берётся из своей строки. Протяните до <code>B9</code>: при 0% ЧПС —
    3 500 000 ₸ (просто сумма), при 15% — 168 489 ₸, при 20% — <b>−648 148 ₸</b>. Где-то между 15% и 20% ЧПС проходит через
    ноль.'
  actions:
  - click: B5
  - type: =$B$2+NPV(
  - clickRef: A5
  - type: ',$C$2:$E$2)'
  - keys:
    - Enter
  - click: B5
  - fill: B5:B9
- title: '{fn:IRR}: ставка, где ЧПС = 0'
  text: 'В <code>B11</code>: <code>{f:=IRR(B2:E2)}</code>. {fn:IRR} подбирает ставку, при которой ЧПС равна нулю. В отличие
    от {fn:NPV}, первый поток она считает сегодняшним, поэтому передаём все потоки. Ответ — <b>15,98%</b>: вложенные деньги
    приносят 15,98% в год.'
  actions:
  - click: B11
  - type: =IRR(
  - dragRef: B2:E2
  - type: )
  - keys:
    - Enter
- title: Что говорит ВСД
  text: 'Если компания берёт деньги под 15%, проект выгоден: он приносит 15,98%, больше. Под 20% — невыгоден. Так ВСД отвечает
    на вопрос руководителя «сколько процентов даёт проект» одним числом, без выбора ставки.'
  actions:
  - click: B8
  - wait: 1500
  - click: B9
  - wait: 1500
- title: Что будет в главе
  text: '<b>9.1</b> — {fn:IRR}, решение «ВСД больше стоимости капитала», проверка предположениями<br><b>9.2</b> — две ВСД
    и ни одной: правило смены знаков<br><b>9.3</b> — ВСД или ЧПС — какой проект выбрать<br><b>9.4</b> — потоки с датами:
    {fn:XIRR}<br><b>9.5</b> — разные ставки займа и вклада: {fn:MIRR}'
  actions:
  - wait: 4000
- title: Что запомнить
  text: ВСД — ставка, при которой ЧПС проекта равна нулю. ВСД выше стоимости капитала — проект выгоден. <b>На работе пригодится</b>,
    чтобы сравнить проект с депозитом, кредитом или требованием инвестора «не меньше 20% годовых».
  actions:
  - click: B11
