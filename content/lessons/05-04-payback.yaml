steps:
- title: Ситуация
  text: 'Инвестор строит торговый центр в Шымкенте: вложения 1 000 млн ₸, в первый год центр принесёт 140 млн ₸,
    дальше поток растёт на 10% в год. Через сколько лет вложения <b>окупятся</b> — накопленный денежный поток станет
    положительным? Это <b>срок окупаемости</b>.'
  actions:
  - wait: 3000
- title: Имена из подписей
  text: "Выделите <code>A1:B3</code> и создайте имена <b>из столбца слева</b>: <code>инвестиции</code>, <code>первый_год</code>, <code>прирост</code>. Это три исходных числа модели. С именами формулы денежного потока будут читаться словами, и их легко проверить."
  actions:
  - dragSelect: A1:B3
  - clickRibbon: createFromSelection
  - wait: 800
  - dialogButton: OK
- title: Денежный поток по годам
  text: "Год 0: <code>=-инвестиции</code> — деньги уходят, поэтому со знаком минус. Год 1: <code>=первый_год</code>. Год 2: <code>=B6*(1+прирост)</code> — поток прошлого года, увеличенный на 10%: 140 × 1,1 = 154. Протяните до 15-го года: каждая строка берёт строку над собой, и поток растёт на 10% ежегодно."
  actions:
  - click: B5
  - type: =-инвестиции
  - keys:
    - Enter
  - type: =первый_год
  - keys:
    - Enter
  - type: =B6*(1+прирост)
  - keys:
    - Enter
  - click: B7
  - fill: B7:B20
- title: Накопленный поток
  text: "<code>C5</code> = <code>=B5</code>: в год 0 накоплены только вложения. Дальше «накоплено к прошлому году + поток этого года»: <code>=C5+B6</code>, протяните вниз. Столбец показывает, сколько денег проект вернул к концу каждого года: −1 000, −860, −706… Пока число отрицательное, вложения не вернулись."
  actions:
  - click: C5
  - type: =B5
  - keys:
    - Enter
  - type: =C5+B6
  - keys:
    - Enter
  - click: C6
  - fill: C6:C20
- title: '{fn:MATCH} с типом 1'
  text: 'Накопленный поток отсортирован по возрастанию — значит, работает тип <code>1</code>: <code>{f:=MATCH(0,C5:C20,1)}</code>
    находит позицию <b>последнего отрицательного</b> года. Годы считаются с нуля, поэтому позиция и есть ответ:
    окупится на <b>6-й</b> год.'
  actions:
  - click: E2
  - type: =MATCH(0,
  - dragRef: C5:C20
  - type: ',1)'
  - keys:
    - Enter
  - showRefs: C11
  - wait: 1200
- title: Частая ошибка
  text: Если в каком-то году поток отрицательный (ремонт, кризис), накопленные значения уже не идут по возрастанию,
    и тип <code>1</code> ошибётся. Срок окупаемости к тому же не учитывает стоимость денег во времени — об этом
    глава 8.
  actions:
  - wait: 3000
- title: Что запомнить
  text: 'Тип <code>1</code> в {fn:MATCH} — для отсортированного по возрастанию списка: позиция последнего значения,
    не большего искомого. Для окупаемости ищут 0 в накопленном потоке. <b>На работе пригодится</b> для бизнес-планов
    и сравнения проектов.'
  actions:
  - click: E2
