# Глава 2. Свой пример по мотивам рис. 2.14 (Applynames): модель прибыли, имена в уже готовых формулах,
# список имён на лист (F3 → «Все имена»).
id: apply-names
chapter: ch02
order: 6
title: Имена в готовых формулах и список имён
source: Свой пример (модель прибыли интернет-магазина)

sheet:
  file: Модель_прибыли.xlsx
  name: Модель
  columns: {A: 24, B: 24, C: 24, D: 24, E: 140, F: 130, G: 24, H: 130, I: 190}
  rows: 10
  cells:
    E2: {v: Модель прибыли, style: label}
    E3: цена
    F3: {v: 4000, fmt: kzt}
    E4: спрос
    F4: "=12000-2*F3"
    E5: себестоимость
    F5: {v: 2500, fmt: kzt}
    E6: затраты
    F6: {v: 3000000, fmt: kzt}
    E7: прибыль
    F7: {f: "=F4*(F3-F5)-F6", fmt: kzt}

expect:
  F4: 4000
  F7: 3000000
  H3: затраты
  H7: цена

steps:
  - title: Ситуация
    text: >-
      Интернет-магазин построил модель прибыли: спрос зависит от цены (<code>=12000-2*F3</code>), прибыль —
      <code>=F4*(F3-F5)-F6</code>. Модель работает, но формулы непонятны. Дадим ячейкам имена, а Excel сам
      <b>перепишет готовые формулы</b> с именами.
    say: >-
      Интернет-магазин построил модель прибыли. Формулы работают, но их трудно читать. Дадим ячейкам имена, а
      Excel сам перепишет готовые формулы.
    actions:
      - showRefs: F7
      - wait: 1500

  - title: Имена из подписей
    text: >-
      Выделите <code>E3:F7</code> и нажмите <b>Формулы → Создать из выделенного</b> — флажок
      <b>в столбце слева</b> уже стоит. <b>OK</b>: пять имён — <code>цена</code>, <code>спрос</code>,
      <code>себестоимость</code>, <code>затраты</code>, <code>прибыль</code>.
    say: >-
      Выделяем подписи вместе с числами и нажимаем «Создать из выделенного». Флажок «в столбце слева» уже
      стоит. OK — пять имён готовы.
    actions:
      - dragSelect: E3:F7
      - clickRibbon: createFromSelection
      - wait: 1000
      - dialogButton: OK

  - title: Формулы ещё со старыми адресами
    text: >-
      Посмотрите на <code>F7</code>: в формуле по-прежнему <code>=F4*(F3-F5)-F6</code>. Новые имена сами в
      старые формулы не попадают.
    say: Но в формулах по-прежнему адреса — новые имена сами туда не попадают.
    actions:
      - click: F7
      - wait: 1500

  - title: Применить имена
    text: >-
      Выделите <code>F4:F7</code>, нажмите стрелку <b>Присвоить имя ▾</b> и выберите <b>Применить имена…</b>.
      Все имена в окне уже выбраны — <b>OK</b>.
    say: >-
      Выделяем формулы, нажимаем стрелку у кнопки «Присвоить имя» и выбираем «Применить имена». Все имена уже
      выбраны — нажимаем OK.
    actions:
      - dragSelect: F4:F7
      - clickRibbon: applyNames
      - wait: 1000
      - dialogButton: OK

  - title: Формулы читаются как фразы
    text: >-
      Теперь в <code>F4</code> — <code>=12000-2*цена</code>, а в <code>F7</code> —
      <code>=спрос*(цена-себестоимость)-затраты</code>. Значения те же: прибыль <b>3 000 000 ₸</b>. Чтобы
      применить имена ко всему листу, выделите его кнопкой <b>Выделить всё</b> в углу таблицы.
    say: >-
      Теперь формулы читаются как фразы: спрос, умноженный на цену минус себестоимость, минус затраты. Значения
      не изменились.
    actions:
      - click: F4
      - wait: 1500
      - click: F7
      - wait: 1800

  - title: "Список имён на лист: F3 → Все имена"
    text: >-
      Щёлкните <code>H3</code>, нажмите <kbd>F3</kbd> и кнопку <b>Все имена</b>: Excel выпишет все имена книги
      и их диапазоны, начиная с текущей ячейки. Удобно, чтобы задокументировать модель для коллег.
    say: >-
      Щёлкаем свободную ячейку, нажимаем F3 и кнопку «Все имена» — Excel выписывает все имена и их диапазоны.
      Удобно, чтобы описать модель для коллег.
    actions:
      - click: H3
      - keys: [F3]
      - wait: 800
      - dialogButton: Все имена

  - title: Что запомнить
    text: >-
      <b>Применить имена</b> (меню «Присвоить имя ▾») заменяет в готовых формулах адреса на имена. <kbd>F3</kbd>
      → <b>Все имена</b> выписывает список имён на лист. <b>На работе пригодится</b>, когда вы получили чужую
      модель и хотите сделать её понятной.
    say: >-
      Готово! «Применить имена» заменяет адреса в готовых формулах на имена, а «Все имена» выписывает их список.
      Пригодится, когда разбираете чужую модель.
    actions:
      - click: F7
