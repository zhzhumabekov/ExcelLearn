# Глава 2. Свой пример по мотивам рис. 2.14 (Applynames): модель прибыли, имена в уже готовых формулах,
# список имён на лист (F3 → «Все имена»).
id: apply-names
chapter: ch02
order: 6
title: Имена в готовых формулах и список имён
source: Свой пример (модель прибыли интернет-магазина)

sheet:
  file: Модель_прибыли.xlsx
  name: Модель
  columns: { A: 140, B: 130, C: 24, D: 130, E: 190 }
  rows: 9
  cells:
    A1: {v: Модель прибыли, style: label}
    A2: цена
    B2: {v: 4000, fmt: kzt}
    A3: спрос
    B3: "=12000-2*B2"
    A4: себестоимость
    B4: {v: 2500, fmt: kzt}
    A5: затраты
    B5: {v: 3000000, fmt: kzt}
    A6: прибыль
    B6: {f: "=B3*(B2-B4)-B5", fmt: kzt}

expect:
  B3: 4000
  B6: 3000000
  D2: затраты
  D6: цена

steps:
  - title: Ситуация
    text: >-
      Интернет-магазин построил модель прибыли: спрос зависит от цены (<code>=12000-2*B2</code>), прибыль —
      <code>=B3*(B2-B4)-B5</code>. Модель работает, но формулы непонятны. Дадим ячейкам имена, а Excel сам
      <b>перепишет готовые формулы</b> с именами.
    actions:
      - showRefs: B6
      - wait: 1500

  - title: Имена из подписей
    text: >-
      Выделите <code>A2:B6</code> и нажмите <b>Формулы → Создать из выделенного</b> — флажок
      <b>в столбце слева</b> уже стоит. <b>OK</b>: пять имён — <code>цена</code>, <code>спрос</code>,
      <code>себестоимость</code>, <code>затраты</code>, <code>прибыль</code>.
    actions:
      - dragSelect: A2:B6
      - clickRibbon: createFromSelection
      - wait: 1000
      - dialogButton: OK

  - title: Формулы ещё со старыми адресами
    text: >-
      Посмотрите на <code>B6</code>: в формуле по-прежнему <code>=B3*(B2-B4)-B5</code>. Новые имена сами в
      старые формулы не попадают.
    actions:
      - click: B6
      - wait: 1500

  - title: Применить имена
    text: >-
      Выделите <code>B3:B6</code>, нажмите стрелку <b>Присвоить имя ▾</b> и выберите <b>Применить имена…</b>.
      Все имена в окне уже выбраны — <b>OK</b>.
    actions:
      - dragSelect: B3:B6
      - clickRibbon: applyNames
      - wait: 1000
      - dialogButton: OK

  - title: Формулы читаются как фразы
    text: >-
      Теперь в <code>B3</code> — <code>=12000-2*цена</code>, а в <code>B6</code> —
      <code>=спрос*(цена-себестоимость)-затраты</code>. Значения те же: прибыль <b>3 000 000 ₸</b>. Чтобы
      применить имена ко всему листу, выделите его кнопкой <b>Выделить всё</b> в углу таблицы.
    actions:
      - click: B3
      - wait: 1500
      - click: B6
      - wait: 1800

  - title: "Список имён на лист: F3 → Все имена"
    text: >-
      Щёлкните <code>D2</code>, нажмите <kbd>F3</kbd> и кнопку <b>Все имена</b>: Excel выпишет все имена книги
      и их диапазоны, начиная с текущей ячейки. Удобно, чтобы задокументировать модель для коллег.
    actions:
      - click: D2
      - keys: [F3]
      - wait: 800
      - dialogButton: Все имена

  - title: Что запомнить
    text: >-
      <b>Применить имена</b> (меню «Присвоить имя ▾») заменяет в готовых формулах адреса на имена. <kbd>F3</kbd>
      → <b>Все имена</b> выписывает список имён на лист. <b>На работе пригодится</b>, когда вы получили чужую
      модель и хотите сделать её понятной.
    actions:
      - click: B6
