steps:
- title: Ситуация
  text: Нужно знать, сколько всего километров от Шымкента до всех остальных городов, — например, чтобы сравнить
    города по удалённости. Это сумма всей строки 8 таблицы расстояний.
  say: Посчитаем, сколько всего километров от Шымкента до всех остальных городов. Это сумма восьмой строки таблицы.
  actions:
  - wait: 3000
- title: Ноль вместо номера столбца
  text: 'Если вместо номера столбца поставить <b>0</b>  {fn:INDEX} вернёт <b>всю строку</b>. В <code>C19</code>:
    <code>{f:=SUM(INDEX(расстояния 8 0))}</code> — сумма строки Шымкента: <b>9 340 км</b>.'
  say: Если вместо номера столбца поставить ноль, {fn:INDEX} вернёт всю строку. Складываем её — девять тысяч триста
    сорок километров.
  actions:
  - click: C19
  - type: =SUM(INDEX(расстояния,8,0))
  - keys:
    - Enter
- title: Ноль вместо номера строки
  text: 'И наоборот: 0 вместо номера строки — <b>весь столбец</b>. <code>{f:=SUM(INDEX(расстояния,0,8))}</code>
    складывает столбец 8 — расстояния <b>до</b> Шымкента. Таблица симметрична, поэтому ответ тот же.'
  say: А ноль вместо номера строки — весь столбец. Расстояния до Шымкента те же, поэтому и сумма та же.
  actions:
  - click: C20
  - type: =SUM(INDEX(расстояния,0,8))
  - keys:
    - Enter
- title: Что запомнить
  text: <code>{fn:INDEX}(массив; n; 0)</code> — строка n целиком, <code>{fn:INDEX}(массив; 0; n)</code> — столбец
    n целиком. Внутри {fn:SUM}, {fn:AVERAGE}, {fn:MAX} это даёт итог по любой строке или столбцу одной формулой.
    <b>На работе пригодится</b> для итогов по выбранному месяцу или товару.
  say: Готово! Ноль вместо номера столбца — вся строка, ноль вместо номера строки — весь столбец. Так считают итог
    по выбранному месяцу или товару.
  actions:
  - click: C19
