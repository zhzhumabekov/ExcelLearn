steps:
- title: Ситуация
  text: Предприниматель взял <b>120 млн ₸</b> в банке под 10% и 5 лет получает от бизнеса 21–46 млн ₸ в год. Свободные деньги
    он сразу кладёт на депозит под 12%. Какая у проекта доходность? ВСД неявно считает, что и занимают, и вкладывают под
    одну ставку — саму ВСД. Здесь ставки разные.
  actions:
  - wait: 3000
- title: ВСД
  text: 'В <code>B8</code>: <code>{f:=IRR(B5:G5)}</code> — <b>13,07%</b>. Но в этом ответе заложено, что каждый полученный
    миллион снова приносит 13,07% в год. А депозит даёт только 12%.'
  actions:
  - click: B8
  - type: =IRR(
  - dragRef: B5:G5
  - type: )
  - keys:
    - Enter
- title: '{fn:MIRR}: ставка займа и реинвестирования'
  text: 'В <code>B9</code>: <code>{f:=MIRR(B5:G5,B1,B2)}</code> — потоки, ставка, под которую берут деньги, и ставка, под
    которую вкладывают доходы. <b>12,61%</b> — ниже ВСД: доходы растут только под 12%. У {fn:MIRR} ответ всегда один, сколько
    бы раз ни менялся знак потока.'
  actions:
  - click: B9
  - type: =MIRR(
  - dragRef: B5:G5
  - type: ',B1,B2)'
  - keys:
    - Enter
- title: 'Как считает МВСД: доходы к последнему году'
  text: 'Повторим расчёт вручную (рис. 9.7). Каждый доход кладём на депозит до 5-го года: в <code>C6</code> <code>{f:=C5*(1+$B$2)^($G$4-C4)}</code>
    — доход 1-го года растёт 4 года под 12%. Протяните до <code>G6</code>. Вместе к 5-му году набирается <b>217,30</b> млн
    ₸ (<code>B12</code>), а сегодня потрачено 120 млн ₸ (<code>B11</code>).'
  actions:
  - click: C6
  - type: '='
  - clickRef: C5
  - type: '*(1+$B$2)^($G$4-'
  - clickRef: C4
  - type: )
  - keys:
    - Enter
  - click: C6
  - fill: C6:G6
  - click: B11
  - type: =-B5
  - keys:
    - Enter
  - type: =SUM(C6:G6)
  - keys:
    - Enter
- title: 'Простая доходность: (итог / вложено)^(1/лет) − 1'
  text: 'Теперь проект простой: 120 млн сегодня → 217,30 млн через 5 лет. Доходность такого вложения — <code>{f:=(B12/B11)^(1/5)-1}</code>:
    во сколько раз выросли деньги, корень пятой степени — рост за год. <b>12,61%</b> — ровно МВСД. Если бы расходы были
    и позже, их сначала привели бы к сегодняшнему дню по ставке займа.'
  actions:
  - click: B13
  - type: =(B12/B11)^(1/5)-1
  - keys:
    - Enter
- title: Что запомнить
  text: '<code>{f:=MIRR(потоки,ставка_займа,ставка_реинвестирования)}</code> — доходность с реальными ставками: расходы
    дисконтируются под ставку займа, доходы растут под ставку депозита. Ответ всегда один. <b>На работе пригодится</b>,
    когда кредит и депозит в банке под разные проценты.'
  actions:
  - click: B9
