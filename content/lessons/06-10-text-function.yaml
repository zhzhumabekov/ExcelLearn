# Глава 6 (текстовые функции). Собрано генератором; ответы expect посчитаны независимо.
id: text-function
chapter: ch06
order: 10
title: 'Функция ТЕКСТ: дата и число во фразе'
source: Свой пример (поздравления сотрудников)
sheet:
  file: Дни_рождения.xlsx
  name: Сотрудники
  columns:
    A: 100
    B: 120
    C: 280
    D: 90
    E: 110
  rows: 6
  cells:
    A1:
      v: Сотрудник
      style: head
    B1:
      v: Дата рождения
      style: head
    C1:
      v: Фраза
      style: head
    D1:
      v: Месяц
      style: head
    E1:
      v: День недели
      style: head
    A2: Айгерим
    B2:
      v: '1990-03-14'
      fmt: date
    A3: Данияр
    B3:
      v: '1985-11-02'
      fmt: date
    A4: Ольга
    B4:
      v: '1993-07-27'
      fmt: date
expect:
  C2: 'Айгерим, дата рождения: 14.03.1990'
  D2: Март
  E2: среда
  C3: 'Данияр, дата рождения: 02.11.1985'
  D3: Ноябрь
  E3: суббота
  C4: 'Ольга, дата рождения: 27.07.1993'
  D4: Июль
  E4: вторник
steps:
- title: Ситуация
  text: 'Отдел кадров готовит поздравления: нужна фраза «Айгерим, дата рождения: 14.03.1990». Дата в ячейке выглядит как
    дата, но внутри это число — и при склейке оно вылезет наружу.'
  say: Нужна фраза с датой рождения. Но дата в Excel — это число, и при склейке оно вылезет наружу.
  actions:
  - wait: 3000
- title: Склейка без формата
  text: '<code>{f:=A2&", дата рождения: "&B2}</code> даёт «Айгерим, дата рождения: 32946» — номер дня с 1 января 1900 года.
    При склейке Excel теряет формат даты.'
  say: 'Склеиваем имя и дату — и получаем номер дня вместо даты: формат потерялся.'
  actions:
  - click: C2
  - type: '='
  - clickRef: A2
  - type: '&", дата рождения: "&'
  - clickRef: B2
  - keys:
    - Enter
  - wait: 1500
- title: 'Код формата: Ctrl+1'
  text: 'Какой формат у даты? Выделите <code>B2</code>, нажмите <kbd>Ctrl</kbd>+<kbd>1</kbd>, выберите <b>(все форматы)</b>:
    в поле «Тип» — код <code>ДД.ММ.ГГГГ</code>. Его и подставим в {fn:TEXT}.'
  say: Control один открывает «Формат ячеек». В разделе «все форматы» виден код формата даты.
  actions:
  - click: B2
  - keys:
    - Ctrl
    - '1'
  - dialogPick: (все форматы)
  - wait: 1800
  - dialogButton: OK
- title: '{fn:TEXT}'
  text: '<code>{f:=A2&", дата рождения: "&TEXT(B2,"dd.mm.yyyy")}</code> — дата в нужном виде. {fn:TEXT}(значение; "код формата")
    превращает число в текст по коду. Протяните вниз.'
  say: '{fn:TEXT} превращает дату в текст по коду формата. Исправляем формулу и протягиваем вниз.'
  actions:
  - click: C2
  - type: '='
  - clickRef: A2
  - type: '&", дата рождения: "&TEXT('
  - clickRef: B2
  - type: ',"dd.mm.yyyy")'
  - keys:
    - Enter
  - click: C2
  - fill: C2:C4
- title: Месяц и день недели
  text: 'Коды дат дают и слова: <code>{f:=TEXT(B2,"mmmm")}</code> — название месяца, <code>{f:=TEXT(B2,"dddd")}</code> —
    день недели. <code>ммм</code> и <code>ддд</code> — сокращения.'
  say: Код из четырёх букв «М» даёт название месяца, из четырёх «Д» — день недели.
  actions:
  - click: D2
  - type: =TEXT(
  - clickRef: B2
  - type: ',"mmmm")'
  - keys:
    - Tab
  - type: =TEXT(
  - clickRef: B2
  - type: ',"dddd")'
  - keys:
    - Enter
  - fill: D2:D4
  - fill: E2:E4
- title: Частая ошибка
  text: 'Коды формата зависят от языка Excel: в русском — <code>ДД.ММ.ГГГГ</code>, в английском — <code>dd.mm.yyyy</code>.
    Файл с {fn:TEXT}, открытый в Excel на другом языке, покажет ерунду вместо даты. Если файл уходит коллегам с другим Excel,
    лучше оставить дату датой.'
  say: Коды формата зависят от языка Excel. В Excel на другом языке такая формула покажет ерунду.
  actions:
  - wait: 3000
- title: Что запомнить
  text: При склейке даты и числа теряют формат — {fn:TEXT}(значение; "код") возвращает его. Код подскажет <kbd>Ctrl</kbd>+<kbd>1</kbd>
    → (все форматы). <b>На работе пригодится</b> для писем, поздравлений, подписей к отчётам.
  say: Готово! {fn:TEXT} сохраняет вид даты и числа внутри фразы.
  actions:
  - click: C2
