# Глава 10 (финансовые функции). Собрано генератором; ответы expect посчитаны независимо.
id: pmt
chapter: ch10
order: 3
title: 'ПЛТ: ежемесячный платёж по кредиту'
source: Excelfinfunctions.xlsx, лист PMT (рис. 10.3)
sheet:
  file: Кредит.xlsx
  name: Кредит
  columns:
    A: 300
    B: 150
  rows: 8
  cells:
    A1:
      v: Сумма кредита
      style: label
    B1:
      v: 1000000
      fmt: kzt
    A2:
      v: Ставка в год
      style: label
    B2:
      v: 0.18
      fmt: percent
    A3:
      v: Месяцев
      style: label
    B3: 10
    A5: Платёж в конце месяца
    B5:
      fmt: kzt
    A6: Платёж в начале месяца
    B6:
      fmt: kzt
    A7: С доплатой 100 000 ₸ в конце
    B7:
      fmt: kzt
expect:
  B5: 108434.1779
  B6: 106831.7023
  B7: 99090.7601
steps:
- title: Ситуация
  text: ТОО берёт кредит <b>1 000 000 ₸</b> на 10 месяцев под 18% годовых на оборотные средства. Каким будет ежемесячный
    платёж? Платежи равные — это аннуитет, и платёж по нему считает {fn:PMT}.
  actions:
  - wait: 3000
- title: '{fn:PMT}: ставка за месяц'
  text: 'В <code>B5</code>: <code>{f:=-PMT(B2/12,B3,B1)}</code>. Платим каждый месяц, значит, и ставка нужна за месяц: 18%
    ÷ 12 = 1,5%. Число периодов — 10 месяцев, <b>пс</b> — сумма кредита с плюсом: её мы получили. {fn:PMT} вернёт платёж
    с минусом (мы отдаём), поэтому перед ней минус: <b>108 434 ₸</b> в месяц.'
  actions:
  - click: B5
  - type: =-PMT(
  - clickRef: B2
  - type: /12,
  - clickRef: B3
  - type: ','
  - clickRef: B1
  - type: )
  - keys:
    - Enter
- title: Платёж в начале месяца
  text: 'Если платить в начале месяца, банк получает деньги раньше — платёж меньше: <code>{f:=-PMT(B2/12,B3,B1,0,1)}</code>
    — <b>106 832 ₸</b>. Пятый аргумент тип = 1, четвёртый — остаток после последнего платежа, здесь 0.'
  actions:
  - click: B6
  - type: =-PMT(B2/12,B3,B1,0,1)
  - keys:
    - Enter
- title: «Шаровой» платёж в конце
  text: 'Если договориться доплатить в конце срока 100 000 ₸ одной суммой, эти деньги не нужно гасить ежемесячно. Четвёртый
    аргумент бс = −100 000 (отдаём): <code>{f:=-PMT(B2/12,B3,B1,-100000)}</code> — <b>99 091 ₸</b> в месяц.'
  actions:
  - click: B7
  - type: =-PMT(B2/12,B3,B1,-100000)
  - keys:
    - Enter
- title: 'Частая ошибка: годовая ставка'
  text: 'Забыть <code>/12</code>: <code>{f:=-PMT(B2,B3,B1)}</code> посчитает 10 <b>лет</b> под 18% в год — платёж 222 515
    ₸, «в месяц» он будет неверным. Ставка и число периодов всегда в одних единицах: месяцы — месячная ставка.'
  actions:
  - click: B5
  - showRefs: B5
  - wait: 2500
- title: Что запомнить
  text: <code>{f:=-PMT(ставка_за_период,периодов,сумма)}</code> — платёж по кредиту. Минус перед функцией делает платёж
    положительным числом. Тип 1 — платёж в начале периода, бс — доплата в конце. <b>На работе пригодится</b> для кредитов,
    лизинга, рассрочки.
  actions:
  - click: B5
