steps:
- title: Ситуация
  text: 'ТОО вложит <b>900 000 ₸</b> в оборудование 08.04.2027, а клиент вернёт деньги частями в разные даты — не раз в
    год (строки 5–9). {fn:NPV} так не умеет: она считает, что потоки идут через равные периоды. Для потоков с датами есть
    {fn:XNPV}. Ставка — 10% в год.'
  actions:
  - wait: 3000
- title: Сколько лет от первой даты
  text: 'Сначала посмотрим, что {fn:XNPV} делает внутри. Дата — номер дня, поэтому разность дат — число дней. В <code>C5</code>:
    <code>{f:=(A5-$A$5)/365}</code> — сколько лет прошло от первого потока (<code>$A$5</code> закреплён). Протянем до <code>C9</code>:
    15.08.2027 — это <b>0,35</b> года после 08.04.2027.'
  actions:
  - click: C5
  - type: =(
  - clickRef: A5
  - type: '-'
  - clickRef: A5
  - keys:
    - F4
  - type: )/365
  - keys:
    - Enter
  - click: C5
  - fill: C5:C9
- title: Поток — на первую дату
  text: 'Каждый поток делим на (1 + ставка) в степени этих лет — дробная степень работает так же, как целая: <code>{f:=B5/(1+ставка)^C5}</code>.
    Протянем до <code>D9</code>: 300 000 ₸ через 0,35 года стоят на 08.04.2027 <b>290 063 ₸</b>.'
  actions:
  - click: D5
  - type: '='
  - clickRef: B5
  - type: /(1+ставка)^
  - clickRef: C5
  - keys:
    - Enter
  - click: D5
  - fill: D5:D9
- title: '{fn:XNPV}: одной формулой'
  text: 'Всё это {fn:XNPV} делает сразу: <code>{f:=XNPV(ставка,B5:B9,A5:A9)}</code> — ставка, потоки, даты. Результат —
    <b>28 639 ₸</b>, ровно сумма столбца D. Деньги приводятся к первой дате — 08.04.2027. Даты могут идти не по порядку,
    но первой должна стоять самая ранняя.'
  actions:
  - click: B12
  - type: =XNPV(ставка,B5:B9,A5:A9)
  - keys:
    - Enter
- title: ЧПС на сегодня
  text: 'А сколько это в деньгах сегодняшнего дня, 12.10.2026? В строке 4 — сегодняшняя дата и поток 0. Включим её в диапазон:
    <code>{f:=XNPV(ставка,B4:B9,A4:A9)}</code>. Теперь первая дата — сегодня, и все потоки дисконтируются до неё: <b>27
    339 ₸</b>. Нулевой поток ничего не добавляет, он только задаёт дату отсчёта.'
  actions:
  - click: B13
  - type: =XNPV(ставка,B4:B9,A4:A9)
  - keys:
    - Enter
- title: 'Частая ошибка: пустая строка в диапазоне'
  text: 'Захватить лишнюю пустую строку: <code>{f:=XNPV(ставка,B4:B10,A4:A10)}</code> даёт <code>#ЧИСЛО!</code>. {fn:XNPV},
    в отличие от {fn:NPV}, пустые ячейки не пропускает. Та же ошибка бывает, если какая-то дата раньше первой: дата отсчёта
    всегда должна быть самой ранней.'
  actions:
  - click: B14
  - type: =XNPV(ставка,B4:B10,A4:A10)
  - keys:
    - Enter
- title: Что запомнить
  text: <code>{f:=XNPV(ставка,потоки,даты)}</code> — ЧПС потоков в любые даты, в деньгах первой даты. Год — 365 дней. Чтобы
    получить ЧПС на сегодня, добавьте первой строкой сегодняшнюю дату и поток 0. <b>На работе пригодится</b> для графиков
    платежей по договорам, рассрочек и возврата займов.
  actions:
  - click: B13
