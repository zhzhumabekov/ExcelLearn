# Вводный урок главы. Собрано генератором gen_intros.py; ответы expect посчитаны независимо.
id: intro-npv
chapter: ch08
order: 0
title: 'Деньги сегодня и через год: дисконтирование'
source: Свой пример (отсрочка платежа)
sheet:
  file: Деньги_во_времени.xlsx
  name: Деньги
  columns:
    A: 260
    B: 150
  rows: 10
  cells:
    A1:
      v: Ставка депозита
      style: label
    B1:
      v: 0.15
      fmt: percent
    A2: Кладём сегодня
    B2:
      v: 1000000
      fmt: kzt
    A3: Через год на счёте
    B3:
      fmt: kzt
    A5: Клиент заплатит через год
    B5:
      v: 1150000
      fmt: kzt
    A6: Это сегодняшними деньгами
    B6:
      fmt: kzt
    A8: Клиент заплатит через 2 года
    B8:
      v: 1000000
      fmt: kzt
    A9: Это сегодняшними деньгами
    B9:
      fmt: kzt
expect:
  B3: 1150000.0
  B6: 1000000.0
  B9: 756143.6673
steps:
- title: Ситуация
  text: 'Клиент ТОО просит отсрочку: вместо <b>1 000 000 ₸</b> сегодня он заплатит <b>1 150 000 ₸</b> через год. Выгодно
    ли это? Сравнивать суммы «в лоб» нельзя: деньги сегодня и деньги через год — разные деньги. Сегодняшние можно положить
    на депозит, и они вырастут.'
  actions:
  - wait: 3000
- title: 'Деньги растут: × (1 + ставка)'
  text: 'В <code>B3</code>: <code>{f:=B2*(1+B1)}</code>. Депозит под 15% за год добавляет к сумме 15%: 1 000 000 ₸ × 1,15
    = <b>1 150 000 ₸</b>. Множитель 1 + ставка показывает, во сколько раз деньги вырастают за год.'
  actions:
  - click: B3
  - type: '='
  - clickRef: B2
  - type: '*(1+'
  - clickRef: B1
  - type: )
  - keys:
    - Enter
- title: 'Обратно: ÷ (1 + ставка)'
  text: 'Значит, 1 150 000 ₸ через год стоят сегодня столько, сколько нужно положить на депозит, чтобы через год получить
    эту сумму. В <code>B6</code>: <code>{f:=B5/(1+B1)}</code> — <b>1 000 000 ₸</b>. Отсрочка клиенту ничего не стоит, но
    и ничего не приносит. Деление будущей суммы на (1 + ставка) называется <b>дисконтированием</b>.'
  actions:
  - click: B6
  - type: '='
  - clickRef: B5
  - type: /(1+
  - clickRef: B1
  - type: )
  - keys:
    - Enter
- title: 'Два года: степень'
  text: 'За два года деньги растут дважды: × 1,15 и ещё × 1,15, то есть × 1,15². Поэтому сумму через два года делим на (1
    + ставка) во второй степени: <code>{f:=B8/(1+B1)^2}</code> — <b>756 144 ₸</b>. Обещанный через два года миллион сегодня
    стоит на 243 856 ₸ меньше.'
  actions:
  - click: B9
  - type: '='
  - clickRef: B8
  - type: /(1+
  - clickRef: B1
  - type: )^2
  - keys:
    - Enter
- title: Что будет в главе
  text: '<b>8.1</b> — ЧПС вручную: каждый поток — в сегодняшние деньги, затем сумма<br><b>8.2</b> — функция {fn:NPV} и её
    особенность: первый поток — через год<br><b>8.3</b> — деньги в начале и в середине года: множитель и {fn:SQRT}<br><b>8.4</b>
    — потоки в разные даты: {fn:XNPV}'
  actions:
  - wait: 4000
- title: Что запомнить
  text: Деньги через n лет делят на (1 + ставка) в степени n, чтобы получить их стоимость сегодня. Сумма таких сегодняшних
    стоимостей всех потоков проекта — <b>чистая приведённая стоимость</b> (ЧПС). <b>На работе пригодится</b> для отсрочек,
    рассрочек, выбора проекта и сравнения предложений банков.
  actions:
  - click: B9
