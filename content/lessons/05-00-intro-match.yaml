# Вводный урок главы. Собрано генератором gen_intros.py; ответы expect посчитаны независимо.
id: intro-match
chapter: ch05
order: 0
title: 'ПОИСКПОЗ: на каком месте значение'
source: Свой пример (продажи менеджеров)
sheet:
  file: Продажи_менеджеров.xlsx
  name: Продажи
  columns:
    A: 120
    B: 140
    C: 30
    D: 110
    E: 130
    F: 100
  rows: 8
  cells:
    A1:
      v: Сотрудник
      style: head
    B1:
      v: Продажи, тыс. ₸
      style: head
    A2: Айгерим
    B2: 3420
    A3: Бауыржан
    B3: 2870
    A4: Ольга
    B4: 4105
    A5: Ерлан
    B5: 1990
    A6: Сауле
    B6: 3650
    A7: Тимур
    B7: 2515
    D1:
      v: Кого ищем
      style: head
    E1:
      v: Место в списке
      style: head
    F1:
      v: Продажи
      style: head
    D2: Ерлан
expect:
  E2: 5
  F2: 3650
steps:
- title: Ситуация
  text: 'Руководитель отдела продаж спрашивает: «Сколько продал Ерлан?» <code>{fn:INDEX}</code> из главы 4 достаёт число
    по номеру строки — но номер строки Ерлана мы не знаем. Найти его поможет <code>{fn:MATCH}</code>: она отвечает на вопрос
    <b>«на каком месте?»</b>.'
  actions:
  - wait: 3000
- title: ПОИСКПОЗ
  text: 'В <code>E2</code> наберите <code>{f:=MATCH(D2,A2:A7,0)}</code>: <b>что</b> ищем, <b>где</b> (список имён) и <b>0</b>
    — точное совпадение. Ответ — <b>4</b>: Ерлан четвёртый в списке.'
  actions:
  - click: E2
  - type: =MATCH(
  - clickRef: D2
  - type: ','
  - dragRef: A2:A7
  - type: ',0)'
  - keys:
    - Enter
- title: ИНДЕКС берёт номер
  text: 'Теперь номер есть. В <code>F2</code> наберите <code>{f:=INDEX(B2:B7,E2)}</code>: из столбца продаж взять 4-е число
    — <b>1990</b> тыс. ₸.'
  actions:
  - click: F2
  - type: =INDEX(
  - dragRef: B2:B7
  - type: ','
  - clickRef: E2
  - type: )
  - keys:
    - Enter
- title: Другой сотрудник
  text: 'Впишите в <code>D2</code> <b>Сауле</b>: место — <b>5</b>, продажи — <b>3650</b> тыс. ₸. Ни одну формулу менять
    не пришлось.'
  actions:
  - click: D2
  - type: Сауле
  - keys:
    - Enter
  - click: F2
  - showRefs: F2
- title: Что будет в главе
  text: '<b>5.1</b> — {fn:MATCH} с типом 0, 1 и −1 и поиск по началу слова<br><b>5.2</b> — {fn:INDEX} + {fn:MATCH}: продажи
    товара за месяц<br><b>5.3</b> — кто получает больше всех: {fn:MAX} и {fn:MATCH}<br><b>5.4</b> — срок окупаемости проекта'
  actions:
  - wait: 4000
- title: Что запомнить
  text: '<code>{fn:MATCH}</code> возвращает <b>место</b> значения в списке, а не само значение. Вместе с <code>{fn:INDEX}</code>
    она находит что угодно по имени. <b>На работе пригодится</b>: показатели сотрудника, товара или филиала по названию,
    поиск в таблицах, где ключ стоит не в первом столбце.'
  actions:
  - click: E2
