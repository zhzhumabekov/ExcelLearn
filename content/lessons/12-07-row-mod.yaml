steps:
- title: Ситуация
  text: Выручка телеком-компании — по кварталам за 4 года. Итог за год нужен в строке первого квартала каждого года, а в
    остальных строках — пусто. Можно вписать {fn:SUM} в четыре ячейки вручную, но лучше одна формула на весь столбец.
  actions:
  - wait: 3000
- title: '{fn:ROW} и {fn:MOD}'
  text: '<code>{f:=ROW()}</code> — номер строки, в которой стоит формула. <code>{f:=MOD(число,делитель)}</code> — остаток
    от деления: <code>{f:=MOD(6,4)}</code> = 2. Первые кварталы — в строках 2, 6, 10, 14: у всех остаток от деления на 4
    равен 2. Это и будет условие.'
  actions:
  - click: B2
  - wait: 1500
  - click: B6
  - wait: 1500
- title: Одна формула на столбец
  text: 'В <code>D2</code>: <code>{f:=IF(MOD(ROW(),4)=2,SUM(C2:C5),"")}</code> — если строка первого квартала, сложить четыре
    квартала начиная с неё, иначе пустая строка <code>""</code>. Протяните до <code>D17</code>: итоги появились только в
    строках 2, 6, 10 и 14. В 2022 году — <b>182,6</b> млн ₸.'
  actions:
  - click: D2
  - type: =IF(MOD(ROW(),4)=2,SUM(C2:C5),"")
  - keys:
    - Enter
  - click: D2
  - fill: D2:D17
- title: Что запомнить
  text: '{fn:ROW}() — номер строки формулы, {fn:MOD}(число; делитель) — остаток. Вместе с {fn:IF} они выбирают «каждую четвёртую
    строку», «каждую вторую», «каждую 12-ю». <b>На работе пригодится</b> для итогов в длинных выгрузках по кварталам и месяцам.'
  actions:
  - click: D6
