# Свой пример: выручка сети аптек по городам Казахстана. Прототип плеера: prototypes/lesson-01-sum.html
id: sum-and-autofill
chapter: ch00
order: 1
title: Функция СУММ и автозаполнение
source: Свой пример (выручка аптек по городам)

sheet:
  file: Выручка_аптек_Q1.xlsx
  name: Выручка
  columns: { A: 118, B: 92, C: 92, D: 92, E: 92, F: 92 }
  rows: 7
  cells:
    A1: { v: Город, style: head }
    B1: { v: Январь, style: head }
    C1: { v: Февраль, style: head }
    D1: { v: Март, style: head }
    E1: { v: Итого, style: head }
    A2: Алматы
    B2: 4820
    C2: 5130
    D2: 5460
    A3: Астана
    B3: 3950
    C3: 4210
    D3: 4380
    A4: Шымкент
    B4: 2640
    C4: 2590
    D4: 2870
    A5: Караганда
    B5: 1780
    C5: 1850
    D5: 1990
    A6: { v: Всего, style: total }
    B6: { style: total }
    C6: { style: total }
    D6: { style: total }
    E6: { style: total }

expect:
  E2: 15410
  E3: 12540
  E4: 8100
  E5: 5620
  B6: 13190
  C6: 13780
  D6: 14700
  E6: 41670

steps:
  - title: Ситуация
    text: >-
      Вы работаете в офисе сети аптек. Руководитель просит к обеду свести <b>выручку за первый квартал
      по городам</b> (в тысячах тенге). Считать на калькуляторе долго, и легко ошибиться. В Excel для этого
      есть функция <code>{fn:SUM}</code>.
    say: >-
      Вы работаете в офисе сети аптек. Руководитель просит к обеду свести выручку за квартал по городам.
      На калькуляторе это долго, а в Excel для этого есть функция {fn:SUM}.
    actions:
      - wait: 3000

  - title: Выберите ячейку
    text: >-
      Начнём с Алматы. Щёлкните по ячейке <code>E2</code>: сюда попадёт итог. Её адрес появился
      в поле <b>«Имя»</b> — это поле со стрелкой ▾ над столбцом A, слева от <i>fx</i>. По нему всегда видно,
      какая ячейка сейчас выбрана.
    say: >-
      Начнём с Алматы. Щёлкаем по ячейке Е два — сюда попадёт итог. Её адрес появился в поле «Имя» — это
      поле над столбцом А, слева от строки формул.
    actions:
      - click: E2

  - title: Начните формулу
    text: >-
      Любая формула начинается со знака <code>=</code>. Наберите <code>={fn:SUM}(</code>,
      и Excel сразу подскажет, какие аргументы ждёт функция.
    say: >-
      Любая формула начинается со знака «равно». Набираем «равно», {fn:SUM} и открывающую скобку —
      Excel сразу подсказывает, какие аргументы ждёт функция.
    actions:
      - type: "=SUM("

  - title: Выделите диапазон
    text: >-
      Протяните мышью от <code>B2</code> до <code>D2</code> — январь, февраль и март. Запись
      <code>B2:D2</code> означает «все ячейки от B2 до D2». Диапазон подсвечен тем же цветом, что и ссылка
      в формуле.
    say: >-
      Протягиваем мышью от Бэ два до Дэ два — январь, февраль и март. Двоеточие в записи означает «от и
      до».
    actions:
      - dragRef: B2:D2

  - title: Нажмите Enter
    text: >-
      Закройте скобку и нажмите <kbd>Enter</kbd>. Excel посчитает: 4820 + 5130 + 5460 = <b>15 410</b>
      тысяч тенге за квартал.
    say: >-
      Закрываем скобку и нажимаем Enter. Выручка Алматы за квартал — пятнадцать миллионов четыреста десять
      тысяч тенге.
    actions:
      - type: ")"
      - keys: [Enter]

  - title: Маркер заполнения
    text: >-
      Остальные города — без новых формул. Выделите <code>E2</code> и потяните за <b>маркер заполнения</b>
      (маленький квадрат в правом нижнем углу) вниз до <code>E5</code>.
    say: >-
      Для остальных городов новые формулы не нужны. Выделяем Е два и тянем за маркер заполнения —
      маленький квадрат в правом нижнем углу — вниз до Е пять.
    actions:
      - click: E2
      - fill: E2:E5

  - title: Относительные ссылки
    text: >-
      Посмотрите на строку формул: в <code>E3</code> записано <code>{f:=SUM(B3:D3)}</code> — Астана,
      а в <code>E5</code> — <code>{f:=SUM(B5:D5)}</code> — Караганда. При копировании ссылки сдвигаются вместе
      с формулой. Это <b>относительные ссылки</b>.
    say: >-
      Посмотрите на строку формул: в Е три формула складывает строку Астаны, а в Е пять — строку Караганды.
      Ссылки сдвинулись вместе с формулой. Это относительные ссылки.
    actions:
      - click: E3
      - showRefs: E3
      - click: E5
      - showRefs: E5

  - title: "Автосумма: Alt + ="
    text: >-
      Итоги по месяцам — ещё быстрее. Выделите <code>B6</code> и нажмите <kbd>Alt</kbd> + <kbd>=</kbd>
      (или кнопку <b>Σ Автосумма</b>): Excel сам подберёт диапазон над ячейкой. Затем протяните формулу
      вправо.
    say: >-
      Итоги по месяцам посчитаем ещё быстрее. Выделяем Бэ шесть и нажимаем Alt и знак «равно». Excel сам
      подбирает диапазон. Нажимаем Enter и протягиваем формулу вправо.
    actions:
      - click: B6
      - keys: [Alt, "="]
      - keys: [Enter]
      - click: B6
      - fill: B6:E6

  - title: Что запомнить
    text: >-
      Выручка сети за квартал — <b>41 670</b> тысяч тенге. Запомните: <code>{fn:SUM}</code> и диапазон
      через двоеточие, маркер заполнения и <kbd>Alt</kbd> + <kbd>=</kbd>.
      <b>На работе пригодится</b> в любом своде: продажи по филиалам, расходы по статьям, часы по
      сотрудникам.
    say: >-
      Готово! Выручка сети за квартал — сорок один миллион шестьсот семьдесят тысяч тенге. Функция {fn:SUM},
      маркер заполнения и автосумма пригодятся в любом своде: по филиалам, статьям расходов или сотрудникам.
    actions:
      - click: E6
