steps:
  - title: Ситуация
    text: >-
      Вы работаете в офисе сети аптек. Руководитель просит к обеду свести <b>выручку за первый квартал
      по городам</b> (в тысячах тенге). Считать на калькуляторе долго, и легко ошибиться. В Excel для этого
      есть функция <code>{fn:SUM}</code>.
    actions:
      - wait: 3000

  - title: Выберите ячейку
    text: >-
      Начнём с Алматы. Щёлкните по <code>E2</code> — сюда Excel запишет итог за квартал. Адрес ячейки — это буква
      столбца и номер строки: <code>E2</code> значит «столбец E, строка 2». Он появился в поле <b>«Имя»</b> слева от
      <i>fx</i> — по нему всегда видно, с какой ячейкой вы работаете. Формулу пишут в ту ячейку, где нужен результат.
    actions:
      - click: E2

  - title: Начните формулу
    text: >-
      Знак <code>=</code> говорит Excel: «дальше не текст, а расчёт» — без него запись осталась бы простой надписью.
      Наберите <code>={fn:SUM}(</code>: <code>{fn:SUM}</code> — функция сложения, а в скобках ей передают
      <b>аргументы</b> — что складывать. Подсказка под ячейкой показывает, какие аргументы функция ждёт.
    actions:
      - type: "=SUM("

  - title: Выделите диапазон
    text: >-
      Протяните мышью от <code>B2</code> до <code>D2</code> — январь, февраль и март. В формуле появится
      <code>B2:D2</code>: двоеточие означает «все ячейки от B2 до D2 включительно», это <b>диапазон</b>. Вместо
      <code>=B2+C2+D2</code> пишут один диапазон — и неважно, три в нём ячейки или триста. Диапазон на листе подсвечен
      тем же цветом, что и ссылка в формуле.
    actions:
      - dragRef: B2:D2

  - title: Нажмите Enter
    text: >-
      Закройте скобку и нажмите <kbd>Enter</kbd>. В ячейке — <b>15 410</b>: Excel сложил 4 820 + 5 130 + 5 460. Но
      хранит ячейка не число, а формулу <code>{f:=SUM(B2:D2)}</code> — её видно в строке формул. Поэтому, если
      исправить выручку за январь, итог пересчитается сам.
    actions:
      - type: ")"
      - keys: [Enter]

  - title: Маркер заполнения
    text: >-
      Для остальных городов формулу не набирают заново, а копируют. Выделите <code>E2</code> и потяните за <b>маркер
      заполнения</b> — квадратик в правом нижнем углу рамки — вниз до <code>E5</code>. Excel скопирует формулу в
      каждую строку и сам поправит в ней адреса: каждый город получит сумму своей строки.
    actions:
      - click: E2
      - fill: E2:E5

  - title: Относительные ссылки
    text: >-
      Как Excel понял, что для Астаны нужна строка 3? В <code>E3</code> теперь <code>{f:=SUM(B3:D3)}</code>, а в
      <code>E5</code> — <code>{f:=SUM(B5:D5)}</code>. Excel запоминает ссылку не как «ячейка B2», а как «три ячейки
      левее, в той же строке». Копируем формулу на строку ниже — ссылка сдвигается на строку вниз. Такие ссылки
      называются <b>относительными</b>, они действуют по умолчанию.
    actions:
      - click: E3
      - showRefs: E3
      - click: E5
      - showRefs: E5

  - title: "Автосумма: Alt + ="
    text: >-
      Итоги по месяцам — ещё быстрее. Выделите <code>B6</code> и нажмите <kbd>Alt</kbd> + <kbd>=</kbd> (или кнопку
      <b>Σ Автосумма</b>). Excel сам вставит <code>{fn:SUM}</code> и подберёт диапазон — числа подряд <b>над</b>
      ячейкой, <code>B2:B5</code>. Перед <kbd>Enter</kbd> проверьте подсвеченный диапазон: если в столбце есть пустая
      строка, автосумма остановится на ней. Затем протяните формулу вправо до <code>E6</code>.
    actions:
      - click: B6
      - keys: [Alt, "="]
      - keys: [Enter]
      - click: B6
      - fill: B6:E6

  - title: Что запомнить
    text: >-
      Выручка сети за квартал — <b>41 670</b> тысяч тенге. Запомните: <code>{fn:SUM}</code> и диапазон
      через двоеточие, маркер заполнения и <kbd>Alt</kbd> + <kbd>=</kbd>.
      <b>На работе пригодится</b> в любом своде: продажи по филиалам, расходы по статьям, часы по
      сотрудникам.
    actions:
      - click: E6
