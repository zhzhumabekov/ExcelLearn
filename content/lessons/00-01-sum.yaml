# Свой пример: выручка сети аптек по городам Казахстана. Прототип плеера: prototypes/lesson-01-sum.html
id: sum-and-autofill
chapter: ch00
order: 1
title: Функция СУММ и автозаполнение
source: Свой пример (выручка аптек по городам)

sheet:
  file: Выручка_аптек_Q1.xlsx
  name: Выручка
  columns: { A: 118, B: 92, C: 92, D: 92, E: 92, F: 92 }
  rows: 7
  cells:
    A1: { v: Город, style: head }
    B1: { v: Январь, style: head }
    C1: { v: Февраль, style: head }
    D1: { v: Март, style: head }
    E1: { v: Итого, style: head }
    A2: Алматы
    B2: 4820
    C2: 5130
    D2: 5460
    A3: Астана
    B3: 3950
    C3: 4210
    D3: 4380
    A4: Шымкент
    B4: 2640
    C4: 2590
    D4: 2870
    A5: Караганда
    B5: 1780
    C5: 1850
    D5: 1990
