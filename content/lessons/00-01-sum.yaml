# Прототип: prototypes/lesson-01-sum.html
id: sum-and-autofill
chapter: ch00
order: 1
title: Функция СУММ и автозаполнение
source: Демо-урок (не из книги)

sheet:
  file: Продажи_Q1.xlsx
  name: Продажи
  columns: { A: 118, B: 92, C: 92, D: 92, E: 92, F: 92 }
  rows: 7
  cells:
    A1: { v: Товар, style: head }
    B1: { v: Январь, style: head }
    C1: { v: Февраль, style: head }
    D1: { v: Март, style: head }
    E1: { v: Итого, style: head }
    A2: Яблоки
    B2: 120
    C2: 150
    D2: 130
    A3: Груши
    B3: 80
    C3: 95
    D3: 110
    A4: Сливы
    B4: 60
    C4: 70
    D4: 85
    A5: Вишня
    B5: 140
    C5: 120
    D5: 160
    A6: { v: Всего, style: total }
    B6: { style: total }
    C6: { style: total }
    D6: { style: total }
    E6: { style: total }

expect:
  E2: 400
  E3: 285
  E4: 215
  E5: 420
  B6: 400
  C6: 435
  D6: 485
  E6: 1320

steps:
  - title: Задача
    text: >-
      Перед нами продажи фруктов за квартал. Нужно посчитать <b>итог по каждому товару</b>.
      Для этого в Excel есть функция <code>{fn:SUM}</code>.
    actions:
      - wait: 3000

  - title: Выберите ячейку
    text: >-
      Щёлкните по ячейке <code>E2</code>: сюда попадёт результат. Адрес активной ячейки виден
      в поле <b>«Имя»</b> слева от строки формул.
    actions:
      - click: E2

  - title: Начните формулу
    text: >-
      Любая формула начинается со знака <code>=</code>. Наберите <code>={fn:SUM}(</code>,
      и Excel сразу подскажет, какие аргументы ждёт функция.
    actions:
      - type: "=SUM("

  - title: Выделите диапазон
    text: >-
      Протяните мышью от <code>B2</code> до <code>D2</code>. Запись <code>B2:D2</code> означает
      «все ячейки от B2 до D2». Диапазон подсвечен тем же цветом, что и ссылка в формуле.
    actions:
      - dragRef: B2:D2

  - title: Нажмите Enter
    text: >-
      Закройте скобку и нажмите <kbd>Enter</kbd>. Excel посчитает: 120 + 150 + 130 = <b>400</b>.
    actions:
      - type: ")"
      - keys: [Enter]

  - title: Маркер заполнения
    text: >-
      Выделите <code>E2</code> и потяните за <b>маркер заполнения</b> (маленький квадрат в правом
      нижнем углу) вниз до <code>E5</code>. Формула скопируется в каждую строку.
    actions:
      - click: E2
      - fill: E2:E5

  - title: Относительные ссылки
    text: >-
      Посмотрите на строку формул: в <code>E3</code> записано <code>{f:=SUM(B3:D3)}</code>, а в
      <code>E5</code> — <code>{f:=SUM(B5:D5)}</code>. При копировании ссылки сдвигаются вместе
      с формулой. Это <b>относительные ссылки</b>.
    actions:
      - click: E3
      - showRefs: E3
      - click: E5
      - showRefs: E5

  - title: "Автосумма: Alt + ="
    text: >-
      Быстрый способ: выделите <code>B6</code> и нажмите <kbd>Alt</kbd> + <kbd>=</kbd> (или кнопку
      <b>Σ Автосумма</b>). Excel сам подберёт диапазон над ячейкой. Затем протяните формулу вправо.
    actions:
      - click: B6
      - keys: [Alt, "="]
      - keys: [Enter]
      - click: B6
      - fill: B6:E6

  - title: Готово!
    text: >-
      Теперь вы умеете вводить формулу <code>{fn:SUM}</code>, выделять диапазон, протягивать формулу
      маркером заполнения и пользоваться автосуммой <kbd>Alt</kbd> + <kbd>=</kbd>. Общий итог за
      квартал: <b>1320</b>.
    actions:
      - click: E6
