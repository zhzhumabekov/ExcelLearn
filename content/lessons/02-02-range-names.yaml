# Глава 2. Свой пример по мотивам рис. 2.3–2.4 (data, noncontig): выручка магазина по дням, дни акций.
id: name-a-range
chapter: ch02
order: 2
title: Имя для диапазона и для несмежных ячеек
source: Свой пример (выручка магазина в Караганде, дни акций)

sheet:
  file: Выручка_по_дням.xlsx
  name: Март
  columns: {A: 80, B: 62, C: 62, D: 62, E: 62, F: 62, G: 62, H: 62}
  rows: 9
  cells:
    A1: {v: "Выручка магазина, тыс. ₸", style: label}
    A2: {v: Неделя, style: head}
    B2: {v: Пн, style: head}
    C2: {v: Вт, style: head}
    D2: {v: Ср, style: head}
    E2: {v: Чт, style: head}
    F2: {v: Пт, style: head}
    G2: {v: Сб, style: head}
    H2: {v: Вс, style: head}
    A3: 1-я
    B3: 410
    C3: 380
    D3: 395
    E3: 420
    F3: 640
    G3: 710
    H3: 690
    A4: 2-я
    B4: 610
    C4: 585
    D4: 400
    E4: 415
    F4: 470
    G4: 520
    H4: 505
    A5: 3-я
    B5: 390
    C5: 405
    D5: 620
    E5: 650
    F5: 480
    G5: 530
    H5: 515
    A7: {v: Средняя за день, style: label}
    F7: {fmt: number}
    A8: {v: Средняя в дни акций, style: label}
    F8: {fmt: number}

expect:
  F7: 511.4286
  F8: 643.5714

steps:
  - title: Ситуация
    text: >-
      Магазин в Караганде за три недели марта трижды проводил акции. Маркетолог хочет сравнить
      <b>среднюю выручку за день</b> со <b>средней выручкой в дни акций</b>. Дадим имена диапазонам — и формулы
      станут понятными: <code>=СРЗНАЧ(выручка)</code> и <code>=СРЗНАЧ(дни_акций)</code>.
    actions:
      - wait: 3000

  - title: Имя для всей таблицы
    text: >-
      Выделите все дни — <code>B3:H5</code>, в поле «Имя» наберите <code>выручка</code> и нажмите <kbd>Enter</kbd>.
      Имя можно дать не только ячейке, но и диапазону: теперь <code>выручка</code> означает все 21 ячейку сразу — три
      недели по семь дней. В формуле его используют так же, как <code>B3:H5</code>.
    actions:
      - dragSelect: B3:H5
      - nameBox: выручка

  - title: "=СРЗНАЧ(выручка)"
    text: >-
      В <code>F7</code> введите <code>{f:=AVERAGE(выручка)}</code>. {fn:AVERAGE} складывает выручку всех 21 дня и
      делит сумму на 21: в среднем <b>511,43</b> тыс. ₸ в день. Формула читается без расшифровки — через месяц вы
      откроете файл и сразу поймёте, что здесь посчитано.
    actions:
      - click: F7
      - type: =AVERAGE(выручка)
      - keys: [Enter]

  - title: "Несмежные ячейки: Ctrl"
    text: >-
      Дни акций разбросаны по таблице: пятница–воскресенье первой недели, понедельник–вторник второй и
      среда–четверг третьей. Выделите <code>F3:H3</code>, затем, <b>удерживая <kbd>Ctrl</kbd></b>, протяните
      по <code>B4:C4</code> и <code>D5:E5</code>. Все три куска выделены вместе.
    actions:
      - dragSelect: F3:H3
      - addSelect: B4:C4
      - addSelect: D5:E5

  - title: Имя для несмежного диапазона
    text: >-
      Пока три куска выделены, наберите в поле «Имя» <code>дни_акций</code> и нажмите <kbd>Enter</kbd>.
      Пробел в имени нельзя, поэтому слова соединены подчёркиванием.
    actions:
      - nameBox: дни_акций

  - title: "=СРЗНАЧ(дни_акций)"
    text: >-
      В <code>F8</code> введите <code>{f:=AVERAGE(дни_акций)}</code>: <b>643,57</b> тыс. ₸ — в дни акций
      выручка на четверть выше обычной. Одно имя заменило три диапазона.
    actions:
      - click: F8
      - type: =AVERAGE(дни_акций)
      - keys: [Enter]

  - title: Проверим имя
    text: >-
      Выберите <code>дни_акций</code> в списке ▾ поля «Имя»: Excel выделит все три куска. Так удобно
      убедиться, что в имя попали нужные ячейки.
    actions:
      - nameList: дни_акций
      - wait: 1200

  - title: Что запомнить
    text: >-
      Имя можно дать ячейке, диапазону и даже <b>нескольким несмежным диапазонам</b> — их выделяют с
      <kbd>Ctrl</kbd>. В формуле имя работает так же, как адрес. <b>На работе пригодится</b> для сравнения
      периодов: акций, праздников, сезонов.
    actions:
      - click: F8
