# Глава 10 (финансовые функции). Собрано генератором; ответы expect посчитаны независимо.
id: pv
chapter: ch10
order: 1
title: 'ПС: сколько сегодня стоит рассрочка'
source: Excelfinfunctions.xlsx, лист PV (рис. 10.1)
sheet:
  file: Копир.xlsx
  name: Копир
  columns:
    A: 300
    B: 160
  rows: 9
  cells:
    A1:
      v: Стоимость капитала
      style: label
    B1:
      v: 0.12
      fmt: percent
    A2:
      v: Лет
      style: label
    B2: 5
    A3:
      v: Платёж в год
      style: label
    B3:
      v: 300000
      fmt: kzt
    A4:
      v: Цена сразу
      style: label
    B4:
      v: 1100000
      fmt: kzt
    A6: Платежи в конце года
    B6:
      fmt: kzt
    A7: Платежи в начале года
    B7:
      fmt: kzt
    A8: В конце года + 50 000 ₸ в конце срока
    B8:
      fmt: kzt
expect:
  B6: 1081432.8607
  B7: 1211204.804
  B8: 1109804.2035
steps:
- title: Ситуация
  text: 'ТОО покупает копировальный аппарат: <b>1 100 000 ₸</b> сразу или по <b>300 000 ₸</b> в год пять лет. Стоимость
    капитала — 12%. Пять одинаковых платежей через равные периоды — это <b>аннуитет</b>. Чтобы сравнить его с ценой сразу,
    нужна его стоимость сегодня — функция {fn:PV}.'
  actions:
  - wait: 3000
- title: '{fn:PV}: ставка, периоды, платёж'
  text: 'В <code>B6</code>: <code>{f:=PV(B1,B2,-B3)}</code>. Аргументы: ставка за период, число периодов и платёж. Платёж
    — с минусом: эти деньги мы <b>отдаём</b>. {fn:PV} складывает 300 000 ÷ 1,12 + 300 000 ÷ 1,12² + … + 300 000 ÷ 1,12⁵
    = <b>1 081 433 ₸</b>. Это меньше 1 100 000 ₸ — рассрочка выгоднее.'
  actions:
  - click: B6
  - type: =PV(
  - clickRef: B1
  - type: ','
  - clickRef: B2
  - type: ',-'
  - clickRef: B3
  - type: )
  - keys:
    - Enter
- title: 'Платежи в начале года: тип 1'
  text: 'Если платить в начале каждого года, пятый аргумент <b>тип</b> = 1: <code>{f:=PV(B1,B2,-B3,0,1)}</code>. Четвёртый
    аргумент — 0, о нём следующий шаг. Каждый платёж уходит на год раньше, поэтому стоимость в 1,12 раза выше: <b>1 211
    205 ₸</b>. Теперь выгоднее заплатить сразу.'
  actions:
  - click: B7
  - type: =PV(B1,B2,-B3,0,1)
  - keys:
    - Enter
- title: 'Доплата в конце: бс'
  text: 'Четвёртый аргумент — <b>бс</b>, будущая сумма после последнего платежа. Если в конце срока нужно доплатить 50 000
    ₸, бс = −50 000 (снова минус — платим): <code>{f:=PV(B1,B2,-B3,-50000)}</code> — <b>1 109 804 ₸</b>. Доплата через 5
    лет стоит сегодня 50 000 ÷ 1,12⁵ ≈ 28 371 ₸, и рассрочка снова дороже, чем сразу.'
  actions:
  - click: B8
  - type: =PV(B1,B2,-B3,-50000)
  - keys:
    - Enter
- title: 'Частая ошибка: знак платежа'
  text: 'Написать <code>{f:=PV(B1,B2,B3)}</code> — платёж с плюсом. Ответ выйдет с минусом: для Excel платежи тогда <b>приходят</b>
    к вам, и сегодня за них нужно заплатить. Правило знаков во всех функциях главы: получаем — плюс, отдаём — минус.'
  actions:
  - click: B6
  - showRefs: B6
  - wait: 2500
- title: Что запомнить
  text: <code>{f:=PV(ставка,кпер,плт,бс,тип)}</code> — стоимость сегодня одинаковых платежей. Тип 0 (или пропущен) — в конце
    периода, 1 — в начале. Получаем — плюс, отдаём — минус. <b>На работе пригодится</b>, чтобы сравнить рассрочку, лизинг
    и аренду с оплатой сразу.
  actions:
  - click: B6
