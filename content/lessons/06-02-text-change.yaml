# Глава 6 (текстовые функции). Собрано генератором; ответы expect посчитаны независимо.
id: text-change
chapter: ch06
order: 2
title: 'Меняем текст: регистр, ПОДСТАВИТЬ, СЦЕПИТЬ и ЗНАЧЕН'
source: Свой пример
sheet:
  file: Меняем_текст.xlsx
  name: Текст
  columns:
    A: 180
    B: 220
    C: 64
    D: 64
  rows: 11
  cells:
    A1:
      v: Что делаем
      style: head
    B1:
      v: Результат
      style: head
    A2: Исходная строка
    B2: асель нурланова
    A3: ПРОПИСН
    A4: ПРОПНАЧ
    C1:
      v: Имя
      style: head
    D1:
      v: Фамилия
      style: head
    C2: Асель
    D2: Нурланова
    A5:
      v: Строка для замен
      style: label
    A6: Я ЛЮБЛЮ EXCEL И ЧАЙ!
    A7: Сцепить знаком &
    A8: СЦЕПИТЬ
    A9: Число из текста
    C9: '31'
    A10: ЗАМЕНИТЬ имя
expect:
  B3: АСЕЛЬ НУРЛАНОВА
  B4: Асель Нурланова
  B5: Я*ЛЮБЛЮ*EXCEL*И*ЧАЙ!
  B6: Я ЛЮБЛЮ EXCEL*И ЧАЙ!
  B7: Асель Нурланова
  B8: Асель Нурланова
  B9: 31
  B10: Сауле нурланова
steps:
- title: Ситуация
  text: Данные пришли строчными буквами, слова надо соединить, а «31» записано как текст и не складывается. Разберём функции,
    которые <b>меняют</b> текст.
  say: 'Разберём функции, которые меняют текст: регистр, замену символов, соединение строк и превращение текста в число.'
  actions:
  - wait: 3000
- title: '{fn:UPPER} и {fn:PROPER}'
  text: '<code>{f:=UPPER(B2)}</code> — все буквы заглавные: <b>АСЕЛЬ НУРЛАНОВА</b>. <code>{f:=PROPER(B3)}</code> — каждое
    слово с заглавной: <b>Асель Нурланова</b>. Есть и {fn:LOWER} — все строчные.'
  say: '{fn:UPPER} делает все буквы заглавными, {fn:PROPER} — каждое слово с заглавной буквы.'
  actions:
  - click: B3
  - type: =UPPER(
  - clickRef: B2
  - type: )
  - keys:
    - Enter
  - type: =PROPER(
  - clickRef: B3
  - type: )
  - keys:
    - Enter
- title: '{fn:SUBSTITUTE}: замена по тексту'
  text: '<code>{f:=SUBSTITUTE(A6," ","*")}</code> заменяет <b>все</b> пробелы звёздочками. С четвёртым аргументом — только
    нужное вхождение: <code>{f:=SUBSTITUTE(A6," ","*",3)}</code> меняет третий пробел.'
  say: '{fn:SUBSTITUTE} меняет один текст на другой. Без четвёртого аргумента — все вхождения, с ним — только указанное.'
  actions:
  - click: B5
  - type: =SUBSTITUTE(
  - clickRef: A6
  - type: '," ","*")'
  - keys:
    - Enter
  - type: =SUBSTITUTE(
  - clickRef: A6
  - type: '," ","*",3)'
  - keys:
    - Enter
- title: 'Соединяем: & и {fn:CONCATENATE}'
  text: <code>{f:=C2&" "&D2}</code> — имя, пробел и фамилия в одной ячейке. То же делает <code>{f:=CONCATENATE(C2," ",D2)}</code>.
    Пробел между кавычками — это вставленный пробел.
  say: Знак амперсанд соединяет строки. То же делает {fn:CONCATENATE}. Пробел в кавычках — вставленный пробел.
  actions:
  - type: '='
  - clickRef: C2
  - type: '&" "&'
  - clickRef: D2
  - keys:
    - Enter
  - type: =CONCATENATE(
  - clickRef: C2
  - type: '," ",'
  - clickRef: D2
  - type: )
  - keys:
    - Enter
- title: '{fn:VALUE}: текст → число'
  text: В <code>C9</code> «31» прижато к <b>левому</b> краю — это текст, его не сложить. <code>{f:=VALUE(C9)}</code> превращает
    его в число 31 — оно прижато к <b>правому</b> краю.
  say: Тридцать один в соседней ячейке прижато к левому краю — это текст. {fn:VALUE} превращает его в число, и оно встаёт
    к правому краю.
  actions:
  - type: =VALUE(
  - clickRef: C9
  - type: )
  - keys:
    - Enter
- title: '{fn:REPLACE}: замена по позиции'
  text: <code>{f:=REPLACE(B2,1,5,"Сауле")}</code> заменяет 5 символов с 1-го — «асель» — на «Сауле». {fn:REPLACE} знает
    <b>где</b> менять, {fn:SUBSTITUTE} — <b>что</b> менять.
  say: '{fn:REPLACE} меняет символы по позиции, {fn:SUBSTITUTE} — по тексту.'
  actions:
  - type: =REPLACE(
  - clickRef: B2
  - type: ',1,5,"Сауле")'
  - keys:
    - Enter
- title: Частая ошибка
  text: '{fn:PROPER} делает заглавной первую букву <b>каждого</b> слова: «ТОО береке опт» станет «Тоо Береке Опт». Если
    нужна заглавная только в начале фразы — <code>{f:=UPPER(LEFT(A6,1))&LOWER(MID(A6,2,100))}</code>.'
  say: '{fn:PROPER} делает заглавной каждую первую букву слова. Для заглавной только в начале фразы нужна другая формула.'
  actions:
  - showRefs: B4
  - wait: 2500
- title: Что запомнить
  text: '{fn:UPPER}, {fn:LOWER}, {fn:PROPER} — регистр; {fn:SUBSTITUTE} — замена по тексту, {fn:REPLACE} — по позиции; <code>&</code>
    и {fn:CONCATENATE} соединяют; {fn:VALUE} делает из текста число. <b>На работе пригодится</b> для чистки справочников
    клиентов и товаров.'
  say: Готово! Регистр, замены, соединение и превращение текста в число — основа чистки данных.
  actions:
  - click: B3
