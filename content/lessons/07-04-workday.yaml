steps:
- title: Ситуация
  text: Поставщик обещает привезти оборудование «через N рабочих дней после подписания договора». Считать по календарю долго,
    и легко забыть про выходные и праздники. Дату поставки посчитает {fn:WORKDAY}.
  actions:
  - wait: 3000
- title: '{fn:WORKDAY}: дата через N рабочих дней'
  text: '<code>{f:=WORKDAY(B2,C2)}</code>: начальная дата и сколько рабочих дней отсчитать. Суббота и воскресенье пропускаются,
    сам день подписания не считается. Столбец D заранее в формате «Дата».'
  actions:
  - click: D2
  - type: =WORKDAY(
  - clickRef: B2
  - type: ','
  - clickRef: C2
  - type: )
  - keys:
    - Enter
  - click: D2
  - fill: D2:D5
- title: Праздники — третьим аргументом
  text: 'Третий аргумент — диапазон с праздниками: <code>{f:=WORKDAY(B2,C2,$G$2:$G$5)}</code>. <kbd>F4</kbd> закрепляет
    диапазон, иначе при протягивании он съедет вниз. У договоров № 17, № 18, № 19, № 20 срок проходит через 16 декабря и
    Новый год, и поставка сдвинулась.'
  actions:
  - click: E2
  - type: =WORKDAY(
  - clickRef: B2
  - type: ','
  - clickRef: C2
  - type: ','
  - dragRef: G2:G5
  - keys:
    - F4
  - type: )
  - keys:
    - Enter
  - click: E2
  - fill: E2:E5
- title: 'Частая ошибка: праздник в выходной'
  text: '02.01.2027 — суббота: {fn:WORKDAY} её и так пропускает, на ответ она не влияет. Если по закону выходной переносится
    на рабочий день, впишите в список <b>перенесённый</b> день. Иначе функция посчитает его рабочим. Праздники и переносы
    на год берите из производственного календаря.'
  actions:
  - click: G4
  - wait: 2500
- title: Что запомнить
  text: '<code>{f:=WORKDAY(начало,дней,праздники)}</code> — дата через N рабочих дней. С минусом отсчитывает назад: <code>{f:=WORKDAY(B2,-5)}</code>
    — за 5 рабочих дней до. <b>На работе пригодится</b> для сроков поставок, ответов на письма и госзакупок.'
  actions:
  - click: E2
