# Глава 10 (финансовые функции). Собрано генератором; ответы expect посчитаны независимо.
id: nper
chapter: ch10
order: 6
title: 'КПЕР: за сколько лет выплачу кредит'
source: Excelfinfunctions.xlsx, лист Nper (рис. 10.5)
sheet:
  file: Срок_кредита.xlsx
  name: Срок
  columns:
    A: 320
    B: 150
  rows: 10
  cells:
    A1:
      v: Сумма кредита
      style: label
    B1:
      v: 10000000
      fmt: kzt
    A2:
      v: Ставка в год
      style: label
    B2:
      v: 0.08
      fmt: percent
    A3:
      v: Платёж в год
      style: label
    B3:
      v: 1000000
      fmt: kzt
    A5: Лет до погашения
    B5:
      fmt: number
    A6: Платежи за 20 лет стоят сегодня
    B6:
      fmt: kzt
    A7: Платежи за 21 год стоят сегодня
    B7:
      fmt: kzt
    A9: С доплатой 4 000 000 ₸ в конце, лет
    B9:
      fmt: number
expect:
  B5: 20.9124
  B6: 9818147.4074
  B7: 10016803.155
  B9: 15.9012
steps:
- title: Ситуация
  text: Фермер берёт <b>10 000 000 ₸</b> под 8% годовых на технику и может отдавать по <b>1 000 000 ₸</b> после каждого
    урожая, раз в год. Сколько лет займёт погашение? Число периодов находит {fn:NPER}.
  actions:
  - wait: 3000
- title: '{fn:NPER}: ставка, платёж, сумма'
  text: 'В <code>B5</code>: <code>{f:=NPER(B2,-B3,B1)}</code> — ставка за период, платёж с минусом, сумма кредита с плюсом.
    Ответ — <b>20,91</b> года. Дробное число значит: 20 лет не хватит, а за 21 год выйдет небольшая переплата — последний
    платёж будет меньше остальных.'
  actions:
  - click: B5
  - type: =NPER(
  - clickRef: B2
  - type: ',-'
  - clickRef: B3
  - type: ','
  - clickRef: B1
  - type: )
  - keys:
    - Enter
- title: Проверка через {fn:PV}
  text: 'Сколько стоят сегодня 20 платежей: <code>{f:=PV(B2,20,-B3)}</code> — <b>9 818 147 ₸</b>, меньше кредита. А 21:
    <code>{f:=PV(B2,21,-B3)}</code> — <b>10 016 803 ₸</b>, уже больше. Значит, ответ 20,91 верный: между 20 и 21 годами.'
  actions:
  - click: B6
  - type: =PV(B2,20,-B3)
  - keys:
    - Enter
  - click: B7
  - type: =PV(B2,21,-B3)
  - keys:
    - Enter
- title: С доплатой в конце
  text: 'Если в последний год фермер доплатит 4 000 000 ₸ сверх обычного платежа, срок сократится: <code>{f:=NPER(B2,-B3,B1,-4000000)}</code>
    — <b>15,90</b> года.'
  actions:
  - click: B9
  - type: =NPER(B2,-B3,B1,-4000000)
  - keys:
    - Enter
- title: 'Частая ошибка: платёж меньше процентов'
  text: 'Если платить в год меньше, чем набегает процентов (здесь меньше 800 000 ₸ = 10 000 000 × 8%), долг не уменьшается
    никогда, и {fn:NPER} вернёт <code>#ЧИСЛО!</code>. Это не сбой — так Excel говорит: «с таким платежом кредит не погасить».'
  actions:
  - click: B5
  - showRefs: B5
  - wait: 2500
- title: Что запомнить
  text: <code>{f:=NPER(ставка,плт,пс)}</code> — сколько периодов нужно, чтобы погасить кредит или накопить сумму. Дробный
    ответ — последний платёж неполный. <b>На работе пригодится</b> для планов погашения долгов и накоплений «к нужной сумме».
  actions:
  - click: B5
