# Глава 6 (текстовые функции). Собрано генератором; ответы expect посчитаны независимо.
id: invisible-chars
chapter: ch06
order: 6
title: 'Невидимые символы: ПЕЧСИМВ, СИМВОЛ(160) и ПОДСТАВИТЬ'
source: Свой пример (выгрузка платежей из банка)
sheet:
  file: Платежи_банк.xlsx
  name: Выгрузка
  columns:
    A: 190
    B: 150
    C: 170
  rows: 9
  cells:
    A1:
      v: Шаг
      style: head
    B1:
      v: Перевод строки
      style: head
    C1:
      v: Неразрывный пробел
      style: head
    A2: Сумма из банка
    B2: '

      12500'
    C2:  18400
    A3: ЗНАЧЕН
    A4: ПЕЧСИМВ
    A5: ЗНАЧЕН от ПЕЧСИМВ
    A6: Где СИМВОЛ(160)
    A7: ПОДСТАВИТЬ
    A8: ЗНАЧЕН
expect:
  B3: '#VALUE!'
  C3: '#VALUE!'
  B4: '12500'
  C4:  18400
  B5: 12500
  C5: '#VALUE!'
  C6: 1
  C7: ' 18400'
  C8: 18400
steps:
- title: Ситуация
  text: 'Бухгалтер скачал платежи из банка. Суммы выглядят как числа, но прижаты к <b>левому</b> краю, и {fn:SUM} их не
    видит. Перед числами спрятаны невидимые символы: в <code>B2</code> — перевод строки <code>СИМВОЛ(10)</code>, в <code>C2</code>
    — неразрывный пробел <code>СИМВОЛ(160)</code>.'
  actions:
  - wait: 3000
- title: '{fn:VALUE} не справляется'
  text: '<code>{f:=VALUE(B2)}</code> и <code>{f:=VALUE(C2)}</code> — ошибка <code>#ЗНАЧ!</code>. {fn:VALUE} переводит в
    число только текст, который целиком состоит из цифр, знаков и обычных пробелов. Невидимый символ в начале мешает: для
    Excel это уже не «12500», а «что-то и 12500». Сначала символ нужно убрать.'
  actions:
  - click: B3
  - type: =VALUE(
  - clickRef: B2
  - type: )
  - keys:
    - Tab
  - type: =VALUE(
  - clickRef: C2
  - type: )
  - keys:
    - Enter
- title: '{fn:CLEAN}'
  text: '{fn:CLEAN} убирает непечатаемые символы с кодами 0–31: <code>{f:=CLEAN(B2)}</code>, и <code>{f:=VALUE(B4)}</code>
    даёт <b>12 500</b>. Но в столбце C ошибка осталась: неразрывный пробел (код 160) {fn:CLEAN} не трогает.'
  actions:
  - click: B4
  - type: =CLEAN(
  - clickRef: B2
  - type: )
  - keys:
    - Tab
  - type: =CLEAN(
  - clickRef: C2
  - type: )
  - keys:
    - Enter
  - click: B5
  - type: =VALUE(
  - clickRef: B4
  - type: )
  - keys:
    - Tab
  - type: =VALUE(
  - clickRef: C4
  - type: )
  - keys:
    - Enter
- title: Находим {fn:CHAR}(160)
  text: '<code>{f:=FIND(CHAR(160),C2)}</code> — <b>1</b>: неразрывный пробел стоит первым. Если бы его не было, {fn:FIND}
    вернула бы <code>#ЗНАЧ!</code>.'
  actions:
  - click: C6
  - type: =FIND(CHAR(160),
  - clickRef: C2
  - type: )
  - keys:
    - Enter
- title: '{fn:SUBSTITUTE} и {fn:VALUE}'
  text: <code>{f:=SUBSTITUTE(C2,CHAR(160)," ")}</code> меняет неразрывный пробел на обычный, а <code>{f:=VALUE(C7)}</code>
    обычные пробелы по краям пропускает — <b>18 400</b>, число.
  actions:
  - type: =SUBSTITUTE(
  - clickRef: C2
  - type: ',CHAR(160)," ")'
  - keys:
    - Enter
  - type: =VALUE(
  - clickRef: C7
  - type: )
  - keys:
    - Enter
- title: Частая ошибка
  text: '{fn:TRIM} тоже не убирает <code>СИМВОЛ(160)</code> — только обычные пробелы. Если «число» прижато влево и не складывается,
    ищите невидимый символ: {fn:LEN} покажет лишние символы, {fn:FIND} с {fn:CHAR} — какой именно.'
  actions:
  - wait: 3000
- title: Что запомнить
  text: '{fn:CLEAN} — для кодов 0–31 (перевод строки, табуляция); <code>СИМВОЛ(160)</code> убирают {fn:SUBSTITUTE}; потом
    {fn:VALUE}. <b>На работе пригодится</b> для выгрузок из банков, сайтов и 1С, где числа «не считаются».'
  actions:
  - click: C8
