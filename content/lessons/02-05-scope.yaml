# Глава 2. Свой пример по мотивам рис. 2.13 (Sheetnames): одно имя на разных листах — область «книга» и «лист».
id: name-scope
chapter: ch02
order: 5
title: "Область имени: «книга» и «лист»"
source: Свой пример (листы филиалов и свод)

sheet:
  file: Филиалы.xlsx
  name: Алматы
  columns: { A: 230, B: 100, C: 24, D: 100 }
  rows: 9
  cells:
    D1: {v: "Магазины, млн ₸", style: head}
    D2: 4
    D3: 5
    D4: 6
    A6: {v: План компании (имя книги), style: label}
    A7: {v: Магазины этого листа, style: label}
sheets:
  - name: Астана
    columns: { A: 230, B: 100, C: 24, D: 100 }
    rows: 9
    cells:
      D1: {v: "Магазины, млн ₸", style: head}
      D2: 3
      D3: 4
      D4: 5
      A7: {v: Магазины этого листа, style: label}
  - name: Свод
    columns: { A: 230, B: 100, C: 24, D: 100 }
    rows: 9
    cells:
      D1: {v: "План, млн ₸", style: head}
      D2: 10
      D3: 12
      D4: 15
      A7: {v: Магазины (без листа), style: label}
      A8: {v: Магазины Астаны, style: label}

expect:
  Алматы!B6: 37
  Алматы!B7: 15
  Астана!B7: 12
  Свод!B8: 12

steps:
  - title: Ситуация
    text: >-
      В книге три листа: <b>Алматы</b>, <b>Астана</b> и <b>Свод</b>. На каждом листе филиала магазины в
      ячейках <code>D2:D4</code>. Удобно, чтобы на каждом листе было одно и то же имя <code>магазины</code>,
      но указывало на <b>свои</b> ячейки. Для этого у имени есть <b>область действия</b>: вся книга или один
      лист.
    actions:
      - wait: 3000

  - title: Имя для всей книги
    text: >-
      Перейдите на лист <b>Свод</b>, выделите план <code>D2:D4</code> и назовите его в поле «Имя» <code>план</code>.
      Имя из поля «Имя» всегда получает область <b>Книга</b>: оно запоминает и лист, и ячейки —
      <code>Свод!$D$2:$D$4</code>, — поэтому работает с любого листа.
    actions:
      - sheetTab: Свод
      - dragSelect: D2:D4
      - nameBox: план

  - title: Имя книги видно с любого листа
    text: >-
      Вернитесь на лист <b>Алматы</b> и в <code>B6</code> введите <code>{f:=SUM(план)}</code>. Хотя формула на листе
      Алматы, имя <code>план</code> указывает на ячейки листа Свод: {fn:SUM} складывает их и даёт <b>37</b>. Писать
      название листа не нужно — оно уже внутри имени.
    actions:
      - sheetTab: Алматы
      - click: B6
      - type: =SUM(план)
      - keys: [Enter]

  - title: Имя только для листа
    text: >-
      Выделите <code>D2:D4</code> и нажмите <b>Формулы → Присвоить имя</b>. Это окно — полная версия поля «Имя»: в нём
      можно выбрать <b>Область</b>. Имя — <code>магазины</code>, область — <code>Алматы</code>. Теперь это имя знают
      только формулы этого листа, а на других листах можно завести своё <code>магазины</code>.
    actions:
      - dragSelect: D2:D4
      - clickRibbon: defineName
      - dialogType: {field: Имя, text: магазины}
      - dialogChoose: {field: Область, option: Алматы}
      - dialogButton: OK
      - click: B7
      - type: =SUM(магазины)
      - keys: [Enter]

  - title: То же имя — на листе Астана
    text: >-
      На листе <b>Астана</b> создайте такое же имя <code>магазины</code> для <code>D2:D4</code> с областью
      <code>Астана</code>. Формула <code>{f:=SUM(магазины)}</code> на каждом листе считает свои ячейки:
      15 в Алматы и <b>12</b> в Астане.
    actions:
      - sheetTab: Астана
      - dragSelect: D2:D4
      - clickRibbon: defineName
      - dialogType: {field: Имя, text: магазины}
      - dialogChoose: {field: Область, option: Астана}
      - dialogButton: OK
      - click: B7
      - type: =SUM(магазины)
      - keys: [Enter]

  - title: "На своде — #ИМЯ?"
    text: >-
      На листе <b>Свод</b> своего имени <code>магазины</code> нет, а имена листов Алматы и Астана отсюда не видны.
      Поэтому <code>{f:=SUM(магазины)}</code> даёт ошибку <code>#ИМЯ?</code> — так Excel говорит: «такого имени я не
      знаю». Та же ошибка бывает при опечатке в имени или в названии функции.
    actions:
      - sheetTab: Свод
      - click: B7
      - type: =SUM(магазины)
      - keys: [Enter]

  - title: "Лист!имя"
    text: >-
      Чтобы взять имя чужого листа, впишите лист перед именем через восклицательный знак:
      <code>{f:=SUM(Астана!магазины)}</code> — <b>12</b>.
    actions:
      - click: B8
      - type: =SUM(Астана!магазины)
      - keys: [Enter]

  - title: Области в диспетчере имён
    text: >-
      Откройте <b>Диспетчер имён</b>: у <code>план</code> область «Книга», а два имени <code>магазины</code>
      отличаются областью — «Алматы» и «Астана».
    actions:
      - clickRibbon: nameManager
      - wait: 2500
      - dialogButton: Закрыть

  - title: Что запомнить
    text: >-
      Имя с областью <b>Книга</b> видно со всех листов. Имя с областью <b>листа</b> — только на этом листе,
      поэтому на разных листах можно завести одинаковые имена. С другого листа к нему обращаются так:
      <code>Астана!магазины</code>. <b>На работе пригодится</b> в книгах с одинаковыми листами филиалов.
    actions:
      - click: B8
