# Глава 2. Свой пример по мотивам рис. 2.13 (Sheetnames): одно имя на разных листах — область «книга» и «лист».
id: name-scope
chapter: ch02
order: 5
title: "Область имени: «книга» и «лист»"
source: Свой пример (листы филиалов и свод)

sheet:
  file: Филиалы.xlsx
  name: Алматы
  columns: {A: 24, B: 230, C: 100, D: 24, E: 100}
  rows: 11
  cells:
    E3: {v: "Магазины, млн ₸", style: head}
    E4: 4
    E5: 5
    E6: 6
    B8: {v: План компании (имя книги), style: label}
    B9: {v: Магазины этого листа, style: label}
sheets:
  - name: Астана
    columns: {A: 24, B: 230, C: 100, D: 24, E: 100}
    rows: 11
    cells:
      E3: {v: "Магазины, млн ₸", style: head}
      E4: 3
      E5: 4
      E6: 5
      B9: {v: Магазины этого листа, style: label}
  - name: Свод
    columns: {A: 24, B: 230, C: 100, D: 24, E: 100}
    rows: 11
    cells:
      E3: {v: "План, млн ₸", style: head}
      E4: 10
      E5: 12
      E6: 15
      B9: {v: Магазины (без листа), style: label}
      B10: {v: Магазины Астаны, style: label}

expect:
  Алматы!C8: 37
  Алматы!C9: 15
  Астана!C9: 12
  Свод!C10: 12

steps:
  - title: Ситуация
    text: >-
      В книге три листа: <b>Алматы</b>, <b>Астана</b> и <b>Свод</b>. На каждом листе филиала магазины в
      ячейках <code>E4:E6</code>. Удобно, чтобы на каждом листе было одно и то же имя <code>магазины</code>,
      но указывало на <b>свои</b> ячейки. Для этого у имени есть <b>область действия</b>: вся книга или один
      лист.
    say: >-
      В книге три листа: Алматы, Астана и свод. Хотим, чтобы на каждом листе имя «магазины» указывало на
      свои ячейки. Для этого у имени есть область действия: вся книга или один лист.
    actions:
      - wait: 3000

  - title: Имя для всей книги
    text: >-
      Перейдите на лист <b>Свод</b>, выделите план <code>E4:E6</code> и назовите его в поле «Имя»
      <code>план</code>. Имя из поля «Имя» всегда получает область <b>Книга</b>.
    say: >-
      Переходим на лист «Свод», выделяем план и называем его в поле «Имя». Такое имя действует во всей книге.
    actions:
      - sheetTab: Свод
      - dragSelect: E4:E6
      - nameBox: план

  - title: Имя книги видно с любого листа
    text: >-
      Вернитесь на лист <b>Алматы</b> и в <code>C8</code> введите <code>{f:=SUM(план)}</code>: <b>37</b> —
      Excel нашёл диапазон на другом листе по имени.
    say: Возвращаемся на лист «Алматы» и складываем план по имени — тридцать семь. Excel нашёл его на другом листе.
    actions:
      - sheetTab: Алматы
      - click: C8
      - type: =SUM(план)
      - keys: [Enter]

  - title: Имя только для листа
    text: >-
      Выделите <code>E4:E6</code> и нажмите <b>Формулы → Присвоить имя</b>. Имя — <code>магазины</code>, а в
      списке <b>Область</b> выберите <code>Алматы</code>. Теперь это имя действует только на этом листе.
    say: >-
      Выделяем магазины и нажимаем «Присвоить имя». Имя — «магазины», а в списке «Область» выбираем лист
      «Алматы». Это имя действует только на этом листе.
    actions:
      - dragSelect: E4:E6
      - clickRibbon: defineName
      - dialogType: {field: Имя, text: магазины}
      - dialogChoose: {field: Область, option: Алматы}
      - dialogButton: OK
      - click: C9
      - type: =SUM(магазины)
      - keys: [Enter]

  - title: То же имя — на листе Астана
    text: >-
      На листе <b>Астана</b> создайте такое же имя <code>магазины</code> для <code>E4:E6</code> с областью
      <code>Астана</code>. Формула <code>{f:=SUM(магазины)}</code> на каждом листе считает свои ячейки:
      15 в Алматы и <b>12</b> в Астане.
    say: >-
      На листе «Астана» создаём такое же имя с областью «Астана». Одна и та же формула на каждом листе считает
      свои магазины: пятнадцать в Алматы и двенадцать в Астане.
    actions:
      - sheetTab: Астана
      - dragSelect: E4:E6
      - clickRibbon: defineName
      - dialogType: {field: Имя, text: магазины}
      - dialogChoose: {field: Область, option: Астана}
      - dialogButton: OK
      - click: C9
      - type: =SUM(магазины)
      - keys: [Enter]

  - title: "На своде — #ИМЯ?"
    text: >-
      На листе <b>Свод</b> своего имени <code>магазины</code> нет, а имена листов Алматы и Астана отсюда не
      видны: <code>{f:=SUM(магазины)}</code> даёт ошибку <code>#ИМЯ?</code>.
    say: На своде такого имени нет, а имена других листов отсюда не видны — получаем ошибку «имя».
    actions:
      - sheetTab: Свод
      - click: C9
      - type: =SUM(магазины)
      - keys: [Enter]

  - title: "Лист!имя"
    text: >-
      Чтобы взять имя чужого листа, впишите лист перед именем через восклицательный знак:
      <code>{f:=SUM(Астана!магазины)}</code> — <b>12</b>.
    say: Чтобы взять имя другого листа, пишем название листа, восклицательный знак и имя. Получаем двенадцать.
    actions:
      - click: C10
      - type: =SUM(Астана!магазины)
      - keys: [Enter]

  - title: Области в диспетчере имён
    text: >-
      Откройте <b>Диспетчер имён</b>: у <code>план</code> область «Книга», а два имени <code>магазины</code>
      отличаются областью — «Алматы» и «Астана».
    say: В диспетчере имён видно, что у плана область «книга», а два имени «магазины» — у каждого свой лист.
    actions:
      - clickRibbon: nameManager
      - wait: 2500
      - dialogButton: Закрыть

  - title: Что запомнить
    text: >-
      Имя с областью <b>Книга</b> видно со всех листов. Имя с областью <b>листа</b> — только на этом листе,
      поэтому на разных листах можно завести одинаковые имена. С другого листа к нему обращаются так:
      <code>Астана!магазины</code>. <b>На работе пригодится</b> в книгах с одинаковыми листами филиалов.
    say: >-
      Готово! Имя книги видно везде, имя листа — только на своём листе. Так на одинаковых листах филиалов
      можно завести одинаковые имена.
    actions:
      - click: C10
