steps:
- title: Ситуация
  text: 'Каждый день из учётной программы приходит лист, где продажи записаны <b>формулой</b>: <code>=120+340+95</code>
    — Север, Центр и Юг, тыс. ₸. В ячейке видна только сумма. Достанем продажи каждого региона.'
  say: 'Продажи пришли формулой: север плюс центр плюс юг. В ячейке видна только сумма. Достанем каждое число.'
  actions:
  - click: A2
  - wait: 2500
- title: 'Формулы → текст: «Найти и заменить»'
  text: Выделите <code>A2:A5</code>, <b>Главная → Найти и выделить → Заменить…</b> В поле «Найти» — <code>=</code>, поле
    «Заменить на» оставьте пустым, <b>Заменить все</b>. Без знака «равно» формула стала текстом, который можно резать.
  say: Убираем знак равно через «Найти и заменить». Формула превращается в текст, который можно резать.
  actions:
  - dragSelect: A2:A5
  - clickRibbon: findReplace
  - dialogType:
      field: Найти
      text: '='
  - dialogButton: Заменить все
  - wait: 900
  - dialogButton: OK
  - dialogButton: Закрыть
- title: 'Где плюсы: {fn:FIND}'
  text: 'Первый плюс: <code>{f:=FIND("+",A2)}</code>. Второй ищем <b>после первого</b>: <code>{f:=FIND("+",A2,B2+1)}</code>
    — третий аргумент говорит, с какого символа начать. Длина строки — <code>{f:=LEN(A2)}</code>.'
  say: '{fn:FIND} находит первый плюс. Второй ищем, начиная со следующего символа. И считаем длину строки.'
  actions:
  - click: B2
  - type: =FIND("+",
  - clickRef: A2
  - type: )
  - keys:
    - Tab
  - type: =FIND("+",
  - clickRef: A2
  - type: ','
  - clickRef: B2
  - type: +1)
  - keys:
    - Tab
  - type: =LEN(
  - clickRef: A2
  - type: )
  - keys:
    - Enter
  - fill: B2:B5
  - fill: C2:C5
  - fill: D2:D5
- title: Север, Центр, Юг
  text: 'Север — всё <b>до</b> первого плюса: <code>{f:=VALUE(LEFT(A2,B2-1))}</code>. Центр — <b>между</b> плюсами: <code>{f:=VALUE(MID(A2,B2+1,C2-B2-1))}</code>
    (без «−1» в результат попадёт второй плюс). Юг — <b>после</b> второго: <code>{f:=VALUE(RIGHT(A2,D2-C2))}</code>.'
  say: Север — до первого плюса, центр — между плюсами, юг — после второго. {fn:VALUE} делает из кусков числа.
  actions:
  - click: E2
  - type: =VALUE(LEFT(
  - clickRef: A2
  - type: ','
  - clickRef: B2
  - type: -1))
  - keys:
    - Tab
  - type: =VALUE(MID(
  - clickRef: A2
  - type: ','
  - clickRef: B2
  - type: +1,
  - clickRef: C2
  - type: '-'
  - clickRef: B2
  - type: -1))
  - keys:
    - Tab
  - type: =VALUE(RIGHT(
  - clickRef: A2
  - type: ','
  - clickRef: D2
  - type: '-'
  - clickRef: C2
  - type: ))
  - keys:
    - Enter
  - fill: E2:E5
  - fill: F2:F5
  - fill: G2:G5
- title: 'Без формул: «Текст по столбцам»'
  text: 'То же делает мастер. Выделите <code>A2:A5</code>, <b>Данные → Текст по столбцам</b>: «с разделителями» → <b>Далее</b>,
    отметьте «другой» и впишите <code>+</code> → <b>Далее</b>, «Поместить в» — <code>$A$8</code> → <b>Готово</b>.'
  say: 'То же самое без формул делает мастер «Текст по столбцам»: разделитель — плюс, результат — ниже.'
  actions:
  - dragSelect: A2:A5
  - clickRibbon: textToColumns
  - dialogCheck: с разделителями
  - dialogButton: Далее >
  - dialogType:
      field: другой
      text: +
  - wait: 900
  - dialogButton: Далее >
  - dialogType:
      field: Поместить в
      text: $A$8
  - dialogButton: Готово
- title: Частая ошибка
  text: 'Мастер — это разовая операция: завтра придёт новый лист, и всё придётся повторить. Формулы с {fn:FIND} пересчитаются
    сами, если вставить новые данные в столбец A. И не забудьте «Поместить в» — иначе мастер запишет результат поверх исходных
    данных.'
  say: Мастер — разовая операция, а формулы пересчитаются сами для новых данных. И укажите, куда поместить результат.
  actions:
  - wait: 3000
- title: Что запомнить
  text: 'Позиции разделителей находит {fn:FIND} (третий аргумент — откуда искать), куски режут {fn:LEFT}, {fn:MID}, {fn:RIGHT}.
    Быстрый способ без формул — <b>Данные → Текст по столбцам</b>. <b>На работе пригодится</b> для любых строк с разделителями:
    «;», «,», «/», «+».'
  say: Готово! Строку с разделителями режут формулами с {fn:FIND} или мастером «Текст по столбцам».
  actions:
  - click: E2
