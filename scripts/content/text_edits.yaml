# Правки текстов из админки для уроков, которые собирают генераторы (см. text_edits.py).
intro-model:
  steps.0.text:
    original: 'Вы с партнёром открываете автомойку в Караганде и решаете, сколько брать за мойку. Цифр много: цена, поток
      машин, расходники, аренда. В Excel их связывают в <b>модель</b> — таблицу, где итог пересчитывается сам, стоит поменять
      любую исходную цифру. С этого начинается вся книга.'
    text: 'Вы и ваш партнёр открываете автомойку и задумываетесь, сколько брать за мойку. Цифр много: цена, поток машин,
      расходники, аренда. В Excel их объединяют в <b>модель</b> — таблицу, где итог автоматически пересчитывается, стоит
      только изменить любую исходную цифру.'
  steps.1.text:
    original: 'У любой модели две части. <b>Входы</b> (<code>B2:B5</code>) — то, что вы знаете или предполагаете: их вписывают
      числами. <b>Выходы</b> (<code>B6:B8</code>) — то, что хотите узнать: их считают <b>только формулами</b> со ссылками
      на входы.'
    text: 'У любой модели есть две части. <br>

      1) <b>Входы</b> (<code>B2:B5</code>) — это то, что вы знаете или предполагаете: сюда вводятся числа.<br>

      2) <b>Выходы</b> (<code>B6:B8</code>) — это то, что вы хотите узнать: они рассчитываются <b>только формулами</b>,
      которые берут данные из входов.'
