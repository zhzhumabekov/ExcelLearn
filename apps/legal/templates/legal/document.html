{% extends "base.html" %}

{% block title %}{{ document.title }} — ExcelLearn{% endblock %}

{% block content %}
  <article class="mx-auto max-w-3xl rounded-2xl border border-slate-200 bg-white p-6 leading-relaxed sm:p-10
                  [&_h2]:mt-8 [&_h2]:mb-3 [&_h2]:text-lg [&_h2]:font-semibold [&_p]:my-3
                  [&_ol]:my-3 [&_ol]:list-decimal [&_ol]:pl-6 [&_ul]:my-3 [&_ul]:list-disc [&_ul]:pl-6 [&_li]:my-1 [&_hr]:my-8 [&_hr]:border-slate-200">
    <h1 class="text-2xl font-bold">{{ document.title }}</h1>
    <p class="text-sm text-slate-500">Версия {{ document.version }}</p>
    {{ document.html }}
  </article>
{% endblock %}
