{# Каркас страниц аккаунта: заголовок, подзаголовок и карточка. Используется через {% extends %}. #}
{% extends "base.html" %}

{% block content %}
  <div class="mx-auto max-w-md">
    <h1 class="text-2xl font-bold">{% block heading %}{% endblock %}</h1>
    <p class="mt-1 text-sm text-stone-500 dark:text-stone-400">{% block subheading %}{% endblock %}</p>
    <div class="mt-6 space-y-4 rounded-2xl border border-stone-200 bg-white p-6 dark:border-stone-800 dark:bg-stone-900
                [&_a]:text-brand-700 [&_a]:underline dark:[&_a]:text-brand-100">
      {% block card %}{% endblock %}
    </div>
    {% block after %}{% endblock %}
  </div>
{% endblock %}
