{% comment %}
Линейная иконка в мягком стиле сайта; цвет — от текста (currentColor), размер — классы cls.
Пример: include "_icon.html" with name="check" cls="size-6". Имена: cursor, play, globe, check, sheet,
pencil, bulb, download, book, sigma.
{% endcomment %}
<svg viewBox="0 0 24 24" class="{{ cls|default:'size-6' }}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">{% if name == "cursor" %}<path d="M5.5 3.5 19 10l-6 1.8-2 6.2z"/><path d="m13 11.8 5 5"/>{% elif name == "play" %}<circle cx="12" cy="12" r="9"/><path d="M10.2 8.6v6.8l5.3-3.4z"/>{% elif name == "globe" %}<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a13.5 13.5 0 0 1 0 18"/><path d="M12 3a13.5 13.5 0 0 0 0 18"/>{% elif name == "check" %}<circle cx="12" cy="12" r="9"/><path d="m8.2 12.4 2.6 2.6 5-5.4"/>{% elif name == "sheet" %}<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M8.5 12.5h7"/><path d="M8.5 16.5h7"/><path d="M12 10.5v8"/>{% elif name == "pencil" %}<path d="M4 20h4L18.5 9.5a2.8 2.8 0 0 0-4-4L4 16z"/><path d="m13.5 6.5 4 4"/>{% elif name == "bulb" %}<path d="M9.5 18h5"/><path d="M10.5 21h3"/><path d="M12 3a6 6 0 0 0-3.7 10.7c.7.6 1.2 1.4 1.2 2.3h5c0-.9.5-1.7 1.2-2.3A6 6 0 0 0 12 3z"/>{% elif name == "download" %}<path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/>{% elif name == "book" %}<path d="M12 6.5C10.5 5 8 4.5 4 4.5v14c4 0 6.5.5 8 2 1.5-1.5 4-2 8-2v-14c-4 0-6.5.5-8 2z"/><path d="M12 6.5v14"/>{% elif name == "sigma" %}<path d="M17.5 5.5h-11l6 6.5-6 6.5h11"/>{% elif name == "lock" %}<rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>{% endif %}</svg>
